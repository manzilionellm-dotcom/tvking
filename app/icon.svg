      <stop offset="0" stop-color="#e3b96b" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#e3b96b" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="#121212"/>
  <rect width="512" height="512" fill="url(#glow)"/>
