# =========================================================
#  verify-app-link.yml — Vérifie les liens du domaine app.7themotion.com
# =========================================================
#  1) Liens de téléchargement masqués (proxy Cloudflare, GitHub caché) :
#     /test (TV cinema-test) · /fone (téléphone phone-test)
#     /tv (TV prod) · /app (mobile prod)
#     Chaque lien doit répondre 200 et servir un vrai APK (magic bytes ZIP).
#  2) API du worker (heartbeat) — sanity check que le bon worker répond.
# =========================================================

name: Verify app link

on:
  workflow_dispatch: {}
  push:
    branches: ['claude/**']
    paths: ['.github/workflows/verify-app-link.yml']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BASE: 'https://app.7themotion.com'
      MAC: 'MK:0A:0A:0A:0A:0A'
    steps:
      - name: Liens de téléchargement (domaine, GitHub masqué)
        run: |
          fail=0
          for slug in test fone tv app; do
            echo "== $BASE/$slug =="
            # Range 0-3 : on ne télécharge que les 4 premiers octets ("PK\3\4"
            # = APK/ZIP) — assez pour prouver que le lien sert le fichier.
            # -L : certains slugs (ex. /app) répondent 302 → on suit et on
            # note la destination pour vérifier ce que voit l'utilisateur.
            out=$(curl -sL -m 30 -r 0-3 -D /tmp/h -o /tmp/b \
              -w '%{http_code} %{url_effective}' "$BASE/$slug" || echo 'ERR')
            code=${out%% *}; final=${out#* }
            magic=$(head -c 2 /tmp/b || true)
            echo "HTTP $code — magic: $magic"
            echo "URL finale : $final"
            case "$final" in
              *github.com*) echo "⚠️ $slug: redirection VISIBLE vers GitHub (identité exposée si collé dans un navigateur)";;
            esac
            grep -i -E 'content-(type|disposition|length|range)' /tmp/h | tail -3 || true
            case "$code" in
              200|206) [ "$magic" = "PK" ] || { echo "❌ $slug: pas un APK"; fail=1; } ;;
              *) echo "❌ $slug: HTTP $code"; fail=1 ;;
            esac
            echo ""
          done
          exit $fail

      - name: Heartbeat + status (sanity worker)
        run: |
          echo "== 1) Heartbeat (simule l'app) =="
          curl -s -m 20 -X POST "$BASE/api/heartbeat" \
            -H "Content-Type: application/json" \
            -d "{\"mac\":\"$MAC\"}" -w "\n__HTTP__%{http_code}\n"
          echo ""
          echo "== 2) Status de cette MAC =="
          curl -s -m 20 "$BASE/api/status/$MAC" -w "\n__HTTP__%{http_code}\n"
          echo ""
          echo "== 3) Auth API (doit etre no_auth = bon worker) =="
          curl -s -m 20 "$BASE/api/v1/auth/me" -w "\n__HTTP__%{http_code}\n"
