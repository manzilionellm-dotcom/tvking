# ============================================================================
#  publish-cinema-test.yml — Publie l'APK TV d'un run build-tv comme release
#  « cinema-test » à LIEN DIRECT (téléchargeable sans compte GitHub, ex. via
#  l'app Downloader sur la box).
#
#  POURQUOI : les artefacts Actions exigent d'être connecté à GitHub — pas
#  pratique pour installer un APK de test sur une box. Une release publique
#  donne une URL stable :
#    https://github.com/<repo>/releases/download/cinema-test/defew-tv-cinema-test.apk
#
#  GARDE-FOUS :
#    - PRÉRELEASE → ne devient JAMAIS la release « latest » (le Worker /dl
#      et les codes vanity continuent de pointer sur l'APK mobile officiel) ;
#    - AUCUN version.json uploadé → l'updater in-app des box (qui lit son
#      propre tag tv-prod/tv-latest) ne voit pas cette release ;
#    - déclenchement MANUEL uniquement (workflow_dispatch), tag écrasé à
#      chaque publication → une seule release de test à la fois.
# ============================================================================
name: Publish Cinéma test APK

on:
  workflow_dispatch:
    inputs:
      confirme:
        description: PUBLIER_APP après dégel autorisé
        required: true
        type: string
      run_id:
        description: 'ID du run build-tv dont on publie l''APK (Actions → run → URL)'
        required: true
        type: string

permissions:
  contents: read
  actions: read     # télécharger l'artefact du run build-tv

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' && github.actor == github.repository_owner && github.triggering_actor == github.repository_owner && github.repository == 'manzilionellm-dotcom/tvking'
    environment: zuno-app-production
    permissions:
      contents: write
    name: Release cinema-test (lien direct)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Lire les protections
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Refuser une publication clients non revue
        env:
          APP_OPERATION: client
        run: node .github/app-release-guard.mjs
      - name: Télécharger l'APK du run build-tv
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: defew-tv-apk-*
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          merge-multiple: true

      - name: Publier la release cinema-test (écrase la précédente)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          ls -la
          mv app-release.apk defew-tv-cinema-test.apk
          # Tag recréé à chaque publication : UNE seule release de test.
          gh release delete cinema-test -R "$GITHUB_REPOSITORY" -y --cleanup-tag || true
          gh release create cinema-test -R "$GITHUB_REPOSITORY" \
            --prerelease \
            --title "Seven Cinéma — APK de test (ne pas diffuser)" \
            --notes "APK TV de test de la branche Seven Cinéma (run ${{ inputs.run_id }}). Signé avec la clé maîtresse : s'installe PAR-DESSUS l'app en place. Lien direct : https://github.com/$GITHUB_REPOSITORY/releases/download/cinema-test/defew-tv-cinema-test.apk" \
            defew-tv-cinema-test.apk
          echo "✓ https://github.com/$GITHUB_REPOSITORY/releases/download/cinema-test/defew-tv-cinema-test.apk"

