name: NovaTube - pilote des trois lecteurs sur Android TV
on:
  push:
    branches: ['qa/novatube-comparatif-pilote-20261127']
permissions:
  contents: read
  actions: read
jobs:
  lecteur:
    runs-on: ubuntu-24.04
    timeout-minutes: 32
    strategy:
      fail-fast: false
      matrix:
        app: [tivimate, televizo, novatube]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
      - name: Code Atlas pour le test NovaTube
        if: matrix.app == 'novatube'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/novatube-activation-status-20261114
          path: atlas
          persist-credentials: false
          sparse-checkout: android-app/cloudflare
      - name: Node 22 pour le Worker local
        if: matrix.app == 'novatube'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - name: Télécharger NovaTube QA contrôlé
        if: matrix.app == 'novatube'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          github-token: ${{ github.token }}
          run-id: 45998775045
          name: novatube-emulateur-apk-b53eb8f56de3515987aae7d99f3e50735167c121
          path: qa-apks
      - name: Installer et comparer sur la mire
        env:
          APP: ${{ matrix.app }}
        run: bash android-app/ci/novatube_tv/official_pilot.sh
      - name: Conserver les observations du pilote
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: pilote-${{ matrix.app }}-${{ github.run_id }}
          path: pilot-results
          retention-days: 10
