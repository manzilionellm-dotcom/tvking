name: NovaTube · mesure du coût de dessin du chargement
on:
  push:
    branches: ['qa/novatube-animation-zap-ordre-ba-20261127']
permissions:
  contents: read
  actions: read
env:
  CI: 'true'
  FLUTTER_SUPPRESS_ANALYTICS: 'true'
  NOVATUBE_TV_APP_ID: com.sevenmotion.novatube.tv
  NOVATUBE_TV_VERSION: '1.0.0'
jobs:
  lecteur:
    name: 50 zaps par version (${{ matrix.order }})
    runs-on: ubuntu-24.04
    timeout-minutes: 115
    strategy:
      fail-fast: false
      matrix:
        order: [candidat-temoin]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
      - name: Code Atlas pour le test NovaTube
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 77ce78f49b65f674e8493e8573a6dcc7b62eae6d
          path: atlas
          persist-credentials: false
          sparse-checkout: android-app/cloudflare
      - name: Node 22 pour le Worker local
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - name: Relire l'APK temoin de la campagne initiale
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          github-token: ${{ github.token }}
          run-id: 46045175781
          name: apk-candidat
          path: qa-apks/apk-temoin
      - name: Relire l'APK candidat de la campagne initiale
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          github-token: ${{ github.token }}
          run-id: 46045807927
          name: apk-candidat
          path: qa-apks/apk-candidat
      - name: Tester les deux versions sur le même émulateur
        env:
          ORDER: ${{ matrix.order }}
          EXPECTED_TEMOIN: 1fb894399d943fd8ab900c709e0ea4ab08aa1d58
          EXPECTED_CANDIDAT: a6a5ba5ad3c5fa326b3226f7d4f13f78ba675f90
        run: bash android-app/ci/novatube_tv/official_pilot.sh
      - name: Conserver les traces et les 50 observations de chaque version
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: zaps-${{ matrix.order }}
          path: pilot-results
          retention-days: 14
          if-no-files-found: warn
