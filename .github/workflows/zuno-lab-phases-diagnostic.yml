name: ZUNO LAB — diagnostic des temps Flutter, décodeur, source et écran
on:
  push:
    branches: ['lab/zuno-119-qualification-20261128']
    paths: ['.github/workflows/zuno-lab-phases-diagnostic.yml','android-app/ci/zuno_lab/phase_diag/**']
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: false
          pub-cache: false
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
      - name: Préparer ZUNO 119 adaptatif avec l'identité LAB
        run: |
          python3 -m venv "$RUNNER_TEMP/zuno-tools"
          "$RUNNER_TEMP/zuno-tools/bin/pip" install --only-binary=:all: Pillow==12.1.1 PyYAML==6.0.3
          "$RUNNER_TEMP/zuno-tools/bin/python" ci/zuno_lab/prepare_lab.py
          flutter pub get
          "$RUNNER_TEMP/zuno-tools/bin/python" ci/zuno_lab/prepare_lab.py --after-pub
          flutter gen-l10n
          dart run flutter_launcher_icons -f flutter_launcher_icons_zuno_tv.yaml
          "$RUNNER_TEMP/zuno-tools/bin/python" ci/play_editions/branding/apply.py
      - name: Préparer les points de mesure de ce diagnostic jetable
        run: python3 ci/zuno_lab/phase_diag/prepare.py
      - name: Compiler et signer uniquement le diagnostic
        run: |
          set -euo pipefail
          umask 077
          pw=$(openssl rand -hex 24)
          keytool -genkeypair -keystore android/app/lab.p12 -storetype PKCS12 -alias zuno-lab -keyalg RSA -keysize 3072 -validity 365 -storepass "$pw" -keypass "$pw" -dname 'CN=ZUNO LAB, O=Qualification'
          printf 'storeFile=lab.p12\nstorePassword=%s\nkeyAlias=zuno-lab\nkeyPassword=%s\n' "$pw" "$pw" > android/key.properties
          mkdir -p "$HOME/.gradle/init.d"
          cp ci/zuno_lab/android_catalog_cycles/mirror.gradle "$HOME/.gradle/init.d/lab-central.gradle"
          compile() {
          flutter build apk --target-platform=android-x64 --release --no-tree-shake-icons --android-skip-build-dependency-validation \
            --build-number=1794559152 --build-name=119-trace --obfuscate --split-debug-info=build/symbols-lab \
            --dart-define=PLAY_BUILD=true --dart-define=ZUNO_FREE_PLAYER=true --dart-define=ZUNO_EDITION=auto \
            --dart-define=BACKEND_URL=http://127.0.0.1:18789 --dart-define=ZUNO_PLAYER_PROBE_URL=http://127.0.0.1:18471/A/index.m3u8 --dart-define=GIT_SHA="$GITHUB_SHA" \
            --dart-define=APP_BUILD_TS="$(date +%s)" --target=lib/main_tv.dart
          }
          if ! compile >"$RUNNER_TEMP/build-lab.log" 2>&1; then
            tail -100 "$RUNNER_TEMP/build-lab.log"
            grep -Eq '429|Too Many Requests|timed out|unable to resolve host' "$RUNNER_TEMP/build-lab.log"
            sleep 40
            compile
          fi
          mkdir -p build/lab
          cp build/app/outputs/flutter-apk/app-release.apk build/lab/ZUNO-TRACE.apk
          bash ci/mobile/verify_work_database.sh build/lab/ZUNO-TRACE.apk
          cd build/lab
          bt=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$bt/apksigner" verify --verbose --print-certs ZUNO-TRACE.apk > signature.txt
          "$bt/aapt" dump badging ZUNO-TRACE.apk > badging.txt
          grep -F "package: name='com.sevenmotion.tv.seven_tv.lab.tracediag' versionCode='1794559152' versionName='119-trace'" badging.txt
          grep -F "application-label:'ZUNO LAB'" badging.txt
          grep -F "sdkVersion:'24'" badging.txt
          sha256sum ZUNO-TRACE.apk > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: trace-seul-${{ github.run_id }}
          path: android-app/build/lab/
          if-no-files-found: error
          retention-days: 14

  optics:
    needs: build
    env:
      BENCH_PACKAGE: com.sevenmotion.tv.seven_tv.lab.tracediag
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          github-token: ${{ github.token }}
          name: trace-seul-${{ github.run_id }}
          path: apk
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 43b00811fb03ef4b7ec482c53a46269008dd214a
          path: optics-tools
          persist-credentials: false
          sparse-checkout: android-app/ci/novatube_tv
      - name: Encoder deux mires pour le pilote tactile et la télécommande
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg tesseract-ocr python3-pil
          python3 optics-tools/android-app/ci/novatube_tv/pilot_live_source.py prepare "$RUNNER_TEMP/fixtures"
      - name: Ouvrir l'application, ajouter la liste par l'écran et observer les compteurs
        run: |
          set -euo pipefail
          export OMP_THREAD_LIMIT=1
          export PYTHONPATH="$PWD/optics-tools/android-app/ci/novatube_tv"
          out="$PWD/zuno-optics"
          mkdir -p "$out/source"
          python3 android-app/ci/zuno_lab/path_trace/source.py "$PYTHONPATH/pilot_live_source.py" "$RUNNER_TEMP/fixtures" "$out/source" >"$RUNNER_TEMP/fixture.log" 2>&1 &
          (cd apk && sha256sum -c SHA256SUMS)
          out="$PWD/zuno-optics"
          source android-app/ci/zuno_lab/boot_lab.sh 'system-images;android-36;android-tv;x86_64' "$out"
          # Une fenêtre de bienvenue du lanceur peut intercepter HOME sur un AVD
          # neuf. Le parcours vidéo possède ses propres preuves et n'impose pas
          # la réussite d'une campagne HOME distincte avant le premier appui.
          adb shell input keyevent KEYCODE_BACK
          adb install apk/ZUNO-TRACE.apk
          installed="$(adb shell pm path "$BENCH_PACKAGE" | tr -d '\r' | sed -n 's/^package://p')"
          test -n "$installed"
          adb shell sha256sum "$installed" | awk '{print $1}' > "$out/installed-before.sha256"
          test "$(cat "$out/installed-before.sha256")" = "$(sha256sum apk/ZUNO-TRACE.apk | awk '{print $1}')"
          component="$BENCH_PACKAGE/com.example.tv_king.MainActivity"
          adb reverse tcp:18471 tcp:18471
          adb logcat -c
          python3 android-app/ci/zuno_lab/phase_diag/observe.py "$out/phases-runtime.jsonl" & tracer=$!
          adb shell am start -n "$component"
          sleep 10
          adb reverse tcp:18471 tcp:18471
          curl -fsS --retry 5 http://127.0.0.1:18471/A/index.m3u8 >/dev/null
          status=0
          ZUNO_DIAG_FULL_SCREEN=yes python3 android-app/ci/zuno_lab/optical_witness.py "$out/optical" --count 12 || status=$?
          kill "$tracer" 2>/dev/null || true
          python3 android-app/ci/zuno_lab/path_trace/summarize.py "$out"
          adb shell sha256sum "$installed" | awk '{print $1}' > "$out/installed-after.sha256"
          cmp "$out/installed-before.sha256" "$out/installed-after.sha256"
          exit "$status"
      - name: Conserver uniquement les résultats expurgés
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: diagnostic-119-source-decodeur-image
          path: zuno-optics/
          retention-days: 14
          if-no-files-found: error
