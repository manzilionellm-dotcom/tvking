name: 7 MOTION — mesurer la première image au swipe
on:
  push:
    branches: ['test/7motion-feed-proof-20261125']
permissions:
  contents: read
  actions: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
      - name: Préparer un téléphone Android 17 et la liste M3U locale
        run: |
          mkdir -p diagnostic "$RUNNER_TEMP/scroll-apks"
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0660"' | sudo tee /etc/udev/rules.d/99-7motion-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
          sudo setfacl -m "u:$(id -un):rw" /dev/kvm
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg python3-pil
          /usr/bin/python3 .github/scripts/7motion-feed-proof.py generate
          image='system-images;android-37.0;google_apis_ps16k;x86_64'
          sdkmanager emulator "$image" > diagnostic/sdk.txt
          avdmanager create avd --force --name scroll --package "$image" --device pixel_2 <<< no
          nohup "$ANDROID_HOME/emulator/emulator" -avd scroll -no-window -no-audio -no-boot-anim -no-snapshot -no-metrics -gpu swiftshader -accel on -cores 2 -memory 3072 -partition-size 3072 >diagnostic/emulator.log 2>&1 < /dev/null &
          for ((i=0;i<120;i++)); do
            if [[ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" == 1 ]]; then break; fi
            sleep 3
          done
          adb shell getprop sys.boot_completed | grep 1
          adb shell wm size 720x1440
          adb shell wm density 280
          adb shell svc power stayon true
          adb shell input keyevent KEYCODE_WAKEUP
          adb shell wm dismiss-keyguard
          adb shell settings put system screen_off_timeout 1800000
          adb shell svc wifi disable
          adb shell svc data disable
          adb reverse tcp:18089 tcp:18089
          nohup /usr/bin/python3 .github/scripts/7motion-feed-proof.py serve > diagnostic/fixture.log 2>&1 < /dev/null &
      - name: Parcourir la version précédente
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 45625369954 -n 7motion-scroll-qa -D "$RUNNER_TEMP/scroll-apks"
          apk="$RUNNER_TEMP/scroll-apks/7motion-scroll-qa.apk"
          echo "cafa3496b12f87d8a66438cc1a6b95a080a8b9626b894d26f9bbe2e29c97c6e5  $apk" | sha256sum -c
          /usr/bin/python3 .github/scripts/7motion-feed-proof.py bench "$apk" scroll
        continue-on-error: true
      - name: Parcourir le nouvel APK de test
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for ((i=0;i<90;i++)); do
            check=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/45647953286/artifacts?name=7motion-swipe-qa" --jq '.artifacts[0].id // empty')
            if [[ -n "$check" ]]; then break; fi
            sleep 15
          done
          test -n "$check"
          gh run download 45647953286 -n 7motion-swipe-qa -D "$RUNNER_TEMP/scroll-apks"
          /usr/bin/python3 .github/scripts/7motion-feed-proof.py bench "$RUNNER_TEMP/scroll-apks/7motion-swipe-qa.apk" swipe
      - name: Conserver les mesures et les écrans effectivement visités
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: 7motion-swipe-evidence
          path: diagnostic/
          retention-days: 7
