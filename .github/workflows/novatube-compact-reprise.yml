name: NovaTube fe134dd4 · reprise autonome après coupure média directe
on:
  push:
    branches: ['qa/novatube-compact-reprise-directe-*']
permissions:
  contents: read
  actions: read
jobs:
  coupure:
    name: Coupure HTTP 503 de ${{ matrix.seconds }} s
    runs-on: ubuntu-24.04
    timeout-minutes: 34
    strategy:
      fail-fast: false
      matrix:
        seconds: [5, 15, 60]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 77ce78f49b65f674e8493e8573a6dcc7b62eae6d
          path: atlas
          persist-credentials: false
          sparse-checkout: android-app/cloudflare
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - name: APK compact de référence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          github-token: ${{ github.token }}
          run-id: 46052117945
          name: apk-candidat
          path: qa-apks
      - name: Mesurer les images et la livraison HLS pendant la coupure
        env:
          APP: novatube
          CUT_SECONDS: ${{ matrix.seconds }}
        run: bash android-app/ci/novatube_tv/cut_runner.sh
      - name: Conserver les captures et témoins
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: reprise-directe-${{ matrix.seconds }}s
          path: pilot-results
          retention-days: 14
