name: ZUNO LAB — remise des octets déjà ouverts sur TV et téléphone
on:
  push:
    branches: ['lab/zuno-119-qualification-20261128']
    paths: ['.github/workflows/zuno-lab-remise-verifiee.yml']
permissions:
  actions: read
  contents: write
jobs:
  remettre:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
      LAB_BUILD: '46091822042'
      LAB_SOURCE: 926377d224daf77b14b775981adfe1590e5d113a
      LAB_CHECK: '46091865468'
      LAB_RIGHTS: '46091822040'
      LAB_TAG: zuno-lab-119-926377d224da-46091822042
      LAB_DIGEST: 24f0e56b3fcc09a788acb367c97ef482c6e011a4ff507462d0a9e865506e75d9
    steps:
      - name: Attester les constructeurs, droits, appareils et SHA indépendamment
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = manzilionellm-dotcom/tvking
          test "$GITHUB_REF" = refs/heads/lab/zuno-119-qualification-20261128
          for run in "$LAB_BUILD" "$LAB_RIGHTS"; do
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" | jq -e --arg s "$LAB_SOURCE" '.head_sha==$s and .conclusion=="success"'
          done
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$LAB_CHECK" | jq -e '.path==".github/workflows/zuno-lab-delivery.yml" and .head_branch=="lab/zuno-119-qualification-20261128"'
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$LAB_CHECK/jobs" > jobs.json
          jq -e '[.jobs[]|select(.name=="exact" or (.name|startswith("launch (")))] | (length==3 and all(.conclusion=="success"))' jobs.json
          for kind in tv phone; do
            gh run download "$LAB_CHECK" -R "$GITHUB_REPOSITORY" -n "zuno-lab-$kind-preuves" -D "$kind"
            test "$(cat "$kind/installed.before")" = "$LAB_DIGEST"
            cmp "$kind/installed.before" "$kind/installed.after"
          done
          gh run download "$LAB_BUILD" -R "$GITHUB_REPOSITORY" -n "zuno-lab-$LAB_SOURCE" -D APK
          (cd APK && sha256sum -c SHA256SUMS)
          echo "$LAB_DIGEST  APK/ZUNO-LAB.apk" | sha256sum -c -
      - name: Publier uniquement la préversion de test et vérifier le téléchargement sans connexion
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          # Ce tag suit le reçu de qualification. La source des octets figure dans le nom et le reçu.
          if ! gh api "repos/$repo/git/ref/tags/$LAB_TAG" > tag.json 2>/dev/null; then
            gh api --method POST "repos/$repo/git/refs" -f ref="refs/tags/$LAB_TAG" -f sha="$GITHUB_SHA" > tag.json
          fi
          jq -e --arg ref "refs/tags/$LAB_TAG" '.ref==$ref and .object.type=="commit"' tag.json
          tag_sha=$(jq -r '.object.sha' tag.json)
          gh api "repos/$repo/compare/$LAB_SOURCE...$tag_sha" | jq -e '.status=="ahead" or .status=="identical"'
          if ! gh release view "$LAB_TAG" -R "$repo" >/dev/null 2>&1; then
            gh release create "$LAB_TAG" --verify-tag --prerelease --latest=false -R "$repo" --title "ZUNO LAB 119 — essai téléphone et TV" --notes "Préversion d’essai uniquement. Source de l’APK $LAB_SOURCE, constructeur $LAB_BUILD, paquet com.sevenmotion.tv.seven_tv.lab. Clé LAB propre à cette compilation. Le panel intégré utilise la boucle locale du banc. Installation personnelle des listes disponible."
          fi
          gh api "repos/$repo/releases/tags/$LAB_TAG" > release.json
          jq -e --arg tag "$LAB_TAG" '.tag_name==$tag and .prerelease and (.draft|not)' release.json
          for asset in ZUNO-LAB.apk SHA256SUMS signature.txt; do
            if ! jq -e --arg n "$asset" 'any(.assets[];.name==$n)' release.json >/dev/null; then
              gh release upload "$LAB_TAG" -R "$repo" "APK/$asset"
            fi
          done
          url="https://github.com/$repo/releases/download/$LAB_TAG/ZUNO-LAB.apk"
          curl -fLsS --retry 5 --retry-all-errors "$url" -o "$RUNNER_TEMP/relu.apk"
          echo "$LAB_DIGEST  $RUNNER_TEMP/relu.apk" | sha256sum -c -
          echo "APK LAB servi et conforme aux deux appareils. SHA-256 $LAB_DIGEST" >> "$GITHUB_STEP_SUMMARY"
