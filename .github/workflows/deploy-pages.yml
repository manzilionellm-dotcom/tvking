# ============================================================================
#  deploy-pages.yml — Publie l'application web sur GitHub Pages à chaque push
#  sur main (ou à la demande).
#
#  LE LIEN DE L'APPLICATION (stable, public, sans compte GitHub) :
#    https://manzilionellm-dotcom.github.io/tvking/
#
#  Sur téléphone : ouvrir le lien → menu du navigateur → « Ajouter à l'écran
#  d'accueil » → TV King s'installe comme une application (manifeste PWA,
#  plein écran, icône couronne).
#
#  Build : `GITHUB_PAGES=true next build` → export statique dans out/ avec
#  basePath /tvking (voir next.config.ts).
# ============================================================================
name: Deploy web (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build export statique
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx next build
        env:
          GITHUB_PAGES: "true"
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    name: Déploiement Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
