# ============================================================================
#  deploy-pages.yml — Publie l'application web sur GitHub Pages à chaque push
#  sur main (ou à la demande).
#
#  LE LIEN DE L'APPLICATION (stable, public, sans compte GitHub) :
#    https://manzilionellm-dotcom.github.io/tvking/
#
#  Sur téléphone : ouvrir le lien → menu du navigateur → « Ajouter à l'écran
#  d'accueil » → TV King s'installe comme une application (manifeste PWA,
#  plein écran, icône couronne).
#
#  MÉTHODE : export statique (`GITHUB_PAGES=true next build` → out/ avec
#  basePath /tvking, voir next.config.ts) poussé sur la branche `gh-pages`.
#  GitHub sert automatiquement cette branche comme site Pages — aucune
#  activation manuelle ni permission spéciale requise (contrairement à
#  actions/configure-pages, refusé au GITHUB_TOKEN : « Resource not
#  accessible by integration », cf. run 30594163846).
# ============================================================================
name: Deploy web (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # push de la branche gh-pages

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Build + push gh-pages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx next build
        env:
          GITHUB_PAGES: "true"
      - name: Publier out/ sur gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          # .nojekyll : sans lui, Pages (Jekyll) ignore les dossiers _next/.
          touch out/.nojekyll
          cd out
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy ${GITHUB_SHA::9}"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
          echo "✓ https://manzilionellm-dotcom.github.io/tvking/"
