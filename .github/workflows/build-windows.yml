# ============================================================================
#  build-windows.yml — Compile The Few pour WINDOWS (PC) et publie un .zip
#  téléchargeable sur la release "windows-latest".
#
#  App SŒUR du mobile et de la TV : MÊME projet Flutter, MÊME backend/panel.
#  On régénère windows/ via `flutter create` (comme android/ pour les autres
#  builds : le CI ne versionne PAS le dossier natif, il le recrée à chaque
#  build), puis on compile le TARGET lib/main_windows.dart.
#
#  SORTIE : build/windows/x64/runner/Release/ contient tv_king.exe + ses .dll
#  (dont libmpv pour la lecture, fournie par media_kit_libs_windows_video).
#  On zippe TOUT ce dossier (l'.exe ne marche PAS seul, il lui faut ses .dll
#  voisines) → un seul .zip à décompresser et lancer sur n'importe quel PC.
#
#  ⚠️ ÉTAPE 1 (ce build) = COMPILATION + UI navigable au clavier + cache des
#  chaînes (SQLite FFI). La LECTURE vidéo desktop (media_kit/libmpv) est câblée
#  à l'étape 2 et doit être validée sur une VRAIE machine Windows (le CI ne fait
#  que compiler, il ne lance pas l'app).
# ============================================================================
name: Build The Few (Windows)

on:
  push:
    branches: ['main', 'claude/**', 'feature/**']
    paths:
      - 'lib/main_windows.dart'
      - 'lib/features/tv/**'
      - 'lib/features/device/**'
      - 'lib/features/subscription/**'
      - 'lib/features/channels/**'
      - 'lib/features/playlists/**'
      - 'lib/features/epg/**'
      - 'lib/core/**'
      - 'packages/**'
      - 'pubspec.yaml'
      - 'assets/branding/**'
      - 'lib/l10n/**'
      - '.github/workflows/build-windows.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build The Few (Windows .zip)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          # cache DÉSACTIVÉ : un cache PUB_CACHE restauré partiellement laissait
          # sqflite_common_ffi sans son fichier de lib (« cannot find the file
          # specified ») → on force un téléchargement propre à chaque build.
          cache: false

      # Le moteur desktop Flutter doit être activé pour que `flutter create`
      # génère le dossier windows/ et que `flutter build windows` fonctionne.
      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      # Régénère le dossier natif windows/ (non versionné, comme android/).
      # Même org/nom de projet que les autres cibles → cohérence du package.
      - name: Generate native Windows folder
        run: flutter create . --platforms=windows --org com.manzilionellm.tvking --project-name tv_king

      # EXCLURE FIREBASE DU BUILD PC. POURQUOI : firebase_core télécharge un SDK
      # C++ (firebase_cpp_sdk) dont le CMakeLists exige `cmake_minimum_required`
      # < 3.5 ; or le CMake fourni par Visual Studio (utilisé par Flutter, PAS
      # celui du PATH) est en 4.x et a SUPPRIMÉ cette compat → « Compatibility
      # with CMake < 3.5 has been removed » qui casse la génération. Firebase
      # Crashlytics est de toute façon ANDROID-ONLY et se désactive tout seul sur
      # PC (fail-open) → il n'apporte RIEN ici. On le retire donc du build PC
      # comme le build TV retire media_kit : modification du checkout CI
      # UNIQUEMENT (non commité → Android garde Firebase intact).
      #   1) on enlève firebase_core / firebase_crashlytics du pubspec ;
      #   2) on remplace le SEUL fichier qui importe Firebase par un stub no-op
      #      (même API attachCrashlytics()) pour que la compilation passe.
      - name: Exclure Firebase (inutile sur PC)
        shell: bash
        run: |
          set -e
          python3 - <<'PYEOF'
          import re
          f = "pubspec.yaml"
          out = []
          for line in open(f, encoding="utf-8").read().splitlines(keepends=True):
              if re.match(r'\s*(firebase_core|firebase_crashlytics)\s*:', line):
                  print("retiré:", line.strip())
                  continue
              out.append(line)
          open(f, "w", encoding="utf-8").write("".join(out))
          PYEOF
          cat > lib/core/crash/crash_reporting_firebase.dart <<'DARTEOF'
          // STUB CI WINDOWS — Firebase est exclu du build PC (cf. build-windows.yml).
          // Même signature que la version Android : ne fait RIEN (fail-open).
          Future<bool> attachCrashlytics() async => false;
          DARTEOF
          echo "✓ Firebase retiré du build PC (pubspec + stub)."

      - name: Flutter pub get
        run: flutter pub get

      # DIAGNOSTIC + auto-réparation : on vérifie que le fichier de lib de
      # sqflite_common_ffi est bien présent ; sinon on répare le cache pub et on
      # relance pub get (filet contre une extraction incomplète).
      - name: Vérifier sqflite_common_ffi (auto-réparation si besoin)
        shell: pwsh
        run: |
          $pkg = Get-ChildItem -Path "$env:PUB_CACHE\hosted\pub.dev" -Directory -Filter "sqflite_common_ffi-*" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($null -eq $pkg) { Write-Host "::warning::package sqflite_common_ffi absent du cache"; }
          else {
            $lib = Join-Path $pkg.FullName "lib\sqflite_common_ffi.dart"
            Write-Host "Cherche: $lib"
            if (-not (Test-Path $lib)) {
              Write-Host "::warning::fichier manquant -> flutter pub cache repair"
              flutter pub cache repair
              flutter pub get
            } else {
              Write-Host "✓ sqflite_common_ffi.dart present"
            }
            Get-ChildItem (Join-Path $pkg.FullName "lib") | Format-Table Name
          }

      - name: Generate AppLocalizations from .arb files
        run: flutter gen-l10n
        continue-on-error: true

      # Compilation RELEASE du point d'entrée Windows.
      - name: Build The Few (Windows release, target main_windows)
        run: flutter build windows --release --target=lib/main_windows.dart

      # Empaquetage : on zippe TOUT le dossier Release (l'.exe a besoin de ses
      # .dll voisines, dont libmpv). Compress-Archive est natif à PowerShell.
      - name: Package Release folder into .zip
        shell: pwsh
        run: |
          $rel = "build/windows/x64/runner/Release"
          if (!(Test-Path $rel)) { throw "Dossier Release introuvable : $rel" }
          Get-ChildItem $rel | Format-Table Name, Length
          Compress-Archive -Path "$rel/*" -DestinationPath "TheFew-Windows.zip" -Force
          Get-Item "TheFew-Windows.zip" | Format-Table Name, Length

      # Artefact CI (téléchargeable depuis l'onglet Actions, même sans release).
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: TheFew-Windows
          path: TheFew-Windows.zip
          retention-days: 14

      # Publication sur la release "windows-latest" (lien stable de partage).
      - name: Publish "windows-latest" release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -e
          REPO="${{ github.repository }}"
          OUT="TheFew-Windows.zip"
          NOTES="The Few — build Windows (PC) de prévisualisation.

          Décompresse le .zip et lance tv_king.exe (garde TOUS les fichiers du
          dossier ensemble : l'.exe a besoin de ses .dll voisines). Clavier :
          flèches = navigation, Entrée = OK, Échap = Retour. Même backend/panel
          que le mobile et la TV.

          Étape 1 : interface + cache des chaînes. La lecture vidéo desktop
          est en cours de finalisation (étape 2).

          Commit : ${{ github.sha }}"
          if gh release view windows-latest --repo "$REPO" >/dev/null 2>&1; then
            gh release edit windows-latest --repo "$REPO" --notes "$NOTES"
            gh release upload windows-latest --repo "$REPO" --clobber "$OUT"
          else
            gh release create windows-latest --repo "$REPO" \
              --title "The Few — Windows (dernier build)" \
              --notes "$NOTES" --prerelease "$OUT"
          fi
          gh release view windows-latest --repo "$REPO"
