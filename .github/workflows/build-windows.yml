# ============================================================================
#  build-windows.yml — Compile The Few pour WINDOWS (PC) et publie un .zip
#  téléchargeable sur la release "windows-latest".
#
#  App SŒUR du mobile et de la TV : MÊME projet Flutter, MÊME backend/panel.
#  On régénère windows/ via `flutter create` (comme android/ pour les autres
#  builds : le CI ne versionne PAS le dossier natif, il le recrée à chaque
#  build), puis on compile le TARGET lib/main_windows.dart.
#
#  SORTIE : build/windows/x64/runner/Release/ contient tv_king.exe + ses .dll
#  (dont libmpv pour la lecture, fournie par media_kit_libs_windows_video).
#  On zippe TOUT ce dossier (l'.exe ne marche PAS seul, il lui faut ses .dll
#  voisines) → un seul .zip à décompresser et lancer sur n'importe quel PC.
#
#  ⚠️ ÉTAPE 1 (ce build) = COMPILATION + UI navigable au clavier + cache des
#  chaînes (SQLite FFI). La LECTURE vidéo desktop (media_kit/libmpv) est câblée
#  à l'étape 2 et doit être validée sur une VRAIE machine Windows (le CI ne fait
#  que compiler, il ne lance pas l'app).
# ============================================================================
name: Build The Few (Windows)

on:
  push:
    branches: ['main', 'claude/**', 'feature/**']
    paths:
      - 'lib/main_windows.dart'
      - 'lib/features/tv/**'
      - 'lib/features/device/**'
      - 'lib/features/subscription/**'
      - 'lib/features/channels/**'
      - 'lib/features/playlists/**'
      - 'lib/features/epg/**'
      - 'lib/core/**'
      - 'packages/**'
      - 'pubspec.yaml'
      - 'assets/branding/**'
      - 'lib/l10n/**'
      - '.github/workflows/build-windows.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build The Few (Windows .zip)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # Le moteur desktop Flutter doit être activé pour que `flutter create`
      # génère le dossier windows/ et que `flutter build windows` fonctionne.
      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      # Régénère le dossier natif windows/ (non versionné, comme android/).
      # Même org/nom de projet que les autres cibles → cohérence du package.
      - name: Generate native Windows folder
        run: flutter create . --platforms=windows --org com.manzilionellm.tvking --project-name tv_king

      # EXCLURE FIREBASE DU BUILD PC. POURQUOI : firebase_core télécharge un SDK
      # C++ (firebase_cpp_sdk) dont le CMakeLists exige `cmake_minimum_required`
      # < 3.5 ; or le CMake fourni par Visual Studio (utilisé par Flutter, PAS
      # celui du PATH) est en 4.x et a SUPPRIMÉ cette compat → « Compatibility
      # with CMake < 3.5 has been removed » qui casse la génération. Firebase
      # Crashlytics est de toute façon ANDROID-ONLY et se désactive tout seul sur
      # PC (fail-open) → il n'apporte RIEN ici. On le retire donc du build PC
      # comme le build TV retire media_kit : modification du checkout CI
      # UNIQUEMENT (non commité → Android garde Firebase intact).
      #   1) on enlève firebase_core / firebase_crashlytics du pubspec ;
      #   2) on remplace le SEUL fichier qui importe Firebase par un stub no-op
      #      (même API attachCrashlytics()) pour que la compilation passe.
      # =========================================================
      #  IDENTITÉ DU BINAIRE (Runner.rc) — ajouté le 23/08/2026
      # =========================================================
      #  Le rapport de certification du Microsoft Store a rendu TROIS
      #  indéterminations :
      #     « We could not identify the app name and the publisher name
      #       that your app has added in the add or remove programs »
      #  (silent install check, entry in add/remove programs, bundleware).
      #
      #  CAUSE, mesurée dans le binaire publié : le modèle Flutter écrit
      #  l'identifiant de paquet et le nom interne du projet à la place
      #  du vrai éditeur et du vrai produit.
      #        CompanyName     = com.manzilionellm.tvking
      #        ProductName     = tv_king
      #        FileDescription = tv_king
      #  Le robot Microsoft cherche « 7 MOTION » dans ces champs et
      #  trouve « tv_king » : il ne peut donc PAS corréler l'entrée
      #  « Applications installées » avec la fiche du Store. Il ne
      #  conclut pas à un échec, il ne conclut PAS DU TOUT — et la
      #  charge retombe sur le relecteur humain.
      #
      #  On réécrit donc ces champs APRÈS `flutter create` (le dossier
      #  natif est régénéré à chaque build, ce fichier ne peut pas
      #  vivre dans le dépôt).
      - name: Identité du binaire (CompanyName / ProductName)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $rc = 'windows/runner/Runner.rc'
          if (!(Test-Path $rc)) { throw "Runner.rc introuvable : $rc" }
          $t = Get-Content $rc -Raw -Encoding UTF8

          # Chaque VALUE est réécrite individuellement : un remplacement
          # global du mot « tv_king » casserait OriginalFilename, qui doit
          # rester le VRAI nom du fichier (tv_king.exe).
          $t = $t -replace '(VALUE\s+"CompanyName",\s*)"[^"]*"',      '$1"7 MOTION"'
          $t = $t -replace '(VALUE\s+"ProductName",\s*)"[^"]*"',      '$1"7 MOTION"'
          $t = $t -replace '(VALUE\s+"FileDescription",\s*)"[^"]*"',  '$1"7 MOTION"'
          $t = $t -replace '(VALUE\s+"LegalCopyright",\s*)"[^"]*"',   '$1"Copyright (C) 2026 7 MOTION. All rights reserved."'
          Set-Content $rc -Value $t -Encoding UTF8

          Write-Host "--- VALUE apres reecriture ---"
          Select-String -Path $rc -Pattern 'VALUE\s+"(CompanyName|ProductName|FileDescription|OriginalFilename|LegalCopyright)"'

          # GARDE-FOU : si le modèle Flutter change de forme un jour, le
          # remplacement échouerait EN SILENCE et on repartirait pour un
          # cycle de certification avec les mêmes indéterminations.
          foreach ($k in 'CompanyName','ProductName','FileDescription') {
            if (-not (Select-String -Path $rc -Pattern "VALUE\s+`"$k`",\s*`"7 MOTION`"" -Quiet)) {
              throw "$k n'a PAS ete reecrit — le modele Flutter a change de forme."
            }
          }

      - name: Exclure Firebase (inutile sur PC)
        shell: bash
        run: |
          set -e
          python3 - <<'PYEOF'
          import re
          f = "pubspec.yaml"
          out = []
          for line in open(f, encoding="utf-8").read().splitlines(keepends=True):
              if re.match(r'\s*(firebase_core|firebase_crashlytics)\s*:', line):
                  print("retiré:", line.strip())
                  continue
              out.append(line)
          open(f, "w", encoding="utf-8").write("".join(out))
          PYEOF
          cat > lib/core/crash/crash_reporting_firebase.dart <<'DARTEOF'
          // STUB CI WINDOWS — Firebase est exclu du build PC (cf. build-windows.yml).
          // Même signature que la version Android : ne fait RIEN (fail-open).
          Future<bool> attachCrashlytics() async => false;
          DARTEOF
          echo "✓ Firebase retiré du build PC (pubspec + stub)."

      - name: Flutter pub get
        run: flutter pub get

      - name: Generate AppLocalizations from .arb files
        run: flutter gen-l10n
        continue-on-error: true

      # Compilation RELEASE du point d'entrée Windows.
      # CL : on injecte _SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS pour
      # TOUTES les compilations C++. POURQUOI : le plugin local_auth_windows
      # inclut encore <experimental/coroutine>, que le MSVC récent transforme en
      # ERREUR (STL1011) sauf si cette macro est définie. La variable
      # d'environnement CL est lue par cl.exe et propage le define partout, sans
      # patcher le plugin. Sans effet sur le code de l'app.
      - name: Build The Few (Windows release, target main_windows)
        env:
          CL: /D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS
        run: flutter build windows --release --target=lib/main_windows.dart

      # Empaquetage : on zippe TOUT le dossier Release (l'.exe a besoin de ses
      # .dll voisines, dont libmpv). Compress-Archive est natif à PowerShell.
      - name: Package Release folder into .zip
        shell: pwsh
        run: |
          $rel = "build/windows/x64/runner/Release"
          if (!(Test-Path $rel)) { throw "Dossier Release introuvable : $rel" }
          Get-ChildItem $rel | Format-Table Name, Length
          Compress-Archive -Path "$rel/*" -DestinationPath "TheFew-Windows.zip" -Force
          Get-Item "TheFew-Windows.zip" | Format-Table Name, Length

      # =========================================================
      #  INSTALLEUR (Inno Setup) — ajouté le 23/08/2026
      # =========================================================
      #  Avant, cette chaîne ne produisait qu'un .zip. Le
      #  « 7MOTION-Setup.exe » servi par /win avait été fabriqué À LA
      #  MAIN le 7 août et RIEN ne le régénérait : l'application
      #  avançait, l'installeur restait figé, et publier une mise à jour
      #  Windows était devenu impossible sans casser soit la
      #  distribution directe, soit la soumission au Microsoft Store.
      #
      #  Le nom du fichier PORTE la version. C'est ce qui permet des URL
      #  immuables — exigence explicite du Store : « The binary
      #  associated with that URL must not change after submission ».
      #  Un lien versionné se fige pour toujours ; l'alias /win, lui,
      #  peut continuer d'évoluer sans mentir à personne.
      - name: Installer (Inno Setup, nom versionné)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Version = celle de pubspec.yaml + le numéro de run. Deux
          # builds ne peuvent donc JAMAIS porter le même numéro, et le
          # numéro avance toujours (Windows refuse une mise à jour dont
          # la version recule).
          $vn = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([0-9.]+)' `
                 | Select-Object -First 1).Matches[0].Groups[1].Value
          $ver = "$vn.${{ github.run_number }}"
          Write-Host ">>> version de l'installeur : $ver"
          "APP_VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          # Inno Setup est préinstallé sur certaines images ; sinon on
          # l'installe. On ne suppose ni l'un ni l'autre.
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) {
            Write-Host ">>> Inno Setup absent, installation via choco"
            choco install innosetup --no-progress -y
          }
          if (!(Test-Path $iscc)) { throw "ISCC.exe introuvable après installation" }

          & $iscc "/DAppVersion=$ver" "/O." "windows\installer\7motion.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup a échoué ($LASTEXITCODE)" }

          $exe = "7MOTION-Setup-$ver.exe"
          if (!(Test-Path $exe)) { throw "Installeur introuvable : $exe" }
          Get-Item $exe | Format-Table Name, Length
          (Get-FileHash $exe -Algorithm SHA256).Hash

          # CONTRÔLE DE SIGNATURE — informatif, jamais bloquant. Tant
          # qu'aucun certificat n'existe, l'installeur sort non signé et
          # Windows affichera « Windows a protégé votre PC ». Le jour où
          # un certificat sera posé, cette ligne passera à Valid et la
          # seule chose à changer sera la directive SignTool du .iss.
          $sig = (Get-AuthenticodeSignature $exe).Status
          Write-Host ">>> signature Authenticode : $sig"
          if ($sig -ne 'Valid') {
            Write-Host "::warning title=Installeur non signé::SmartScreen affichera un avertissement au client. Voir la directive SignTool dans windows/installer/7motion.iss."
          }

      # Artefact CI (téléchargeable depuis l'onglet Actions, même sans release).
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: TheFew-Windows
          path: |
            TheFew-Windows.zip
            7MOTION-Setup-*.exe
          retention-days: 14

      # Publication sur la release "windows-latest" (lien stable de partage).
      - name: Publish "windows-latest" release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -e
          REPO="${{ github.repository }}"
          OUT="TheFew-Windows.zip"
          NOTES="The Few — build Windows (PC) de prévisualisation.

          Décompresse le .zip et lance tv_king.exe (garde TOUS les fichiers du
          dossier ensemble : l'.exe a besoin de ses .dll voisines). Clavier :
          flèches = navigation, Entrée = OK, Échap = Retour. Même backend/panel
          que le mobile et la TV.

          Étape 1 : interface + cache des chaînes. La lecture vidéo desktop
          est en cours de finalisation (étape 2).

          Commit : ${{ github.sha }}"
          # L'INSTALLEUR est publié SOUS SON NOM VERSIONNÉ, jamais sous un
          # nom fixe. Une fois en ligne, ce fichier ne bougera plus JAMAIS :
          # c'est ce qui rend son URL immuable, comme le Store l'exige.
          # Le fichier « 7MOTION-Setup.exe » sans version, lui, n'est plus
          # écrasé — il reste tel quel tant qu'une soumission Store le cite.
          SETUP="$(ls 7MOTION-Setup-*.exe 2>/dev/null | head -1 || true)"
          if [ -n "$SETUP" ]; then
            echo ">>> installeur versionné : $SETUP"
            sha256sum "$SETUP"
          else
            echo "::warning::Aucun installeur produit — seul le .zip sera publié."
          fi

          if gh release view windows-latest --repo "$REPO" >/dev/null 2>&1; then
            gh release edit windows-latest --repo "$REPO" --notes "$NOTES"
            gh release upload windows-latest --repo "$REPO" --clobber "$OUT"
            # `if` explicite, PAS `[ -n ... ] && ...` : avec `set -e`, un
            # test qui echoue en DERNIERE commande d'un bloc fait echouer
            # tout le job. Le build entier serait tombe juste parce qu'il
            # n'y avait pas d'installeur a publier.
            if [ -n "$SETUP" ]; then
              gh release upload windows-latest --repo "$REPO" --clobber "$SETUP"
            fi
          else
            if [ -n "$SETUP" ]; then
              gh release create windows-latest --repo "$REPO" \
                --title "The Few — Windows (dernier build)" \
                --notes "$NOTES" --prerelease "$OUT" "$SETUP"
            else
              gh release create windows-latest --repo "$REPO" \
                --title "The Few — Windows (dernier build)" \
                --notes "$NOTES" --prerelease "$OUT"
            fi
          fi
          gh release view windows-latest --repo "$REPO"
