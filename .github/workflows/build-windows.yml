# ============================================================================
#  build-windows.yml — Compile The Few pour WINDOWS (PC) et publie un .zip
#  téléchargeable sur la release "windows-latest".
#
#  App SŒUR du mobile et de la TV : MÊME projet Flutter, MÊME backend/panel.
#  On régénère windows/ via `flutter create` (comme android/ pour les autres
#  builds : le CI ne versionne PAS le dossier natif, il le recrée à chaque
#  build), puis on compile le TARGET lib/main_windows.dart.
#
#  SORTIE : build/windows/x64/runner/Release/ contient tv_king.exe + ses .dll
#  (dont libmpv pour la lecture, fournie par media_kit_libs_windows_video).
#  On zippe TOUT ce dossier (l'.exe ne marche PAS seul, il lui faut ses .dll
#  voisines) → un seul .zip à décompresser et lancer sur n'importe quel PC.
#
#  ⚠️ ÉTAPE 1 (ce build) = COMPILATION + UI navigable au clavier + cache des
#  chaînes (SQLite FFI). La LECTURE vidéo desktop (media_kit/libmpv) est câblée
#  à l'étape 2 et doit être validée sur une VRAIE machine Windows (le CI ne fait
#  que compiler, il ne lance pas l'app).
# ============================================================================
name: Build The Few (Windows)

on:
  push:
    branches: ['main', 'claude/**', 'feature/**']
    paths:
      - 'lib/main_windows.dart'
      - 'lib/features/tv/**'
      - 'lib/features/device/**'
      - 'lib/features/subscription/**'
      - 'lib/features/channels/**'
      - 'lib/features/playlists/**'
      - 'lib/features/epg/**'
      - 'lib/core/**'
      - 'packages/**'
      - 'pubspec.yaml'
      - 'assets/branding/**'
      - 'lib/l10n/**'
      - '.github/workflows/build-windows.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build The Few (Windows .zip)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # Épingle CMake à 3.31. POURQUOI : firebase_core embarque un SDK C++
      # (firebase_cpp_sdk) dont le CMakeLists déclare `cmake_minimum_required`
      # < 3.5 ; or CMake 4.x (installé par défaut sur windows-latest) a SUPPRIMÉ
      # cette compat → erreur « Compatibility with CMake < 3.5 has been removed »
      # qui casse la génération. CMake 3.31 est la dernière série qui l'accepte
      # encore (avec un simple avertissement). Firebase ne sert de toute façon à
      # RIEN sur PC (Crashlytics est Android-only et se désactive tout seul,
      # fail-open) — on garde juste le build qui passe sans toucher au code.
      - name: Pin CMake 3.31 (compat firebase_cpp_sdk)
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: '3.31.6'

      # Le moteur desktop Flutter doit être activé pour que `flutter create`
      # génère le dossier windows/ et que `flutter build windows` fonctionne.
      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      # Régénère le dossier natif windows/ (non versionné, comme android/).
      # Même org/nom de projet que les autres cibles → cohérence du package.
      - name: Generate native Windows folder
        run: flutter create . --platforms=windows --org com.manzilionellm.tvking --project-name tv_king

      - name: Flutter pub get
        run: flutter pub get

      - name: Generate AppLocalizations from .arb files
        run: flutter gen-l10n
        continue-on-error: true

      # Compilation RELEASE du point d'entrée Windows.
      - name: Build The Few (Windows release, target main_windows)
        run: flutter build windows --release --target=lib/main_windows.dart

      # Empaquetage : on zippe TOUT le dossier Release (l'.exe a besoin de ses
      # .dll voisines, dont libmpv). Compress-Archive est natif à PowerShell.
      - name: Package Release folder into .zip
        shell: pwsh
        run: |
          $rel = "build/windows/x64/runner/Release"
          if (!(Test-Path $rel)) { throw "Dossier Release introuvable : $rel" }
          Get-ChildItem $rel | Format-Table Name, Length
          Compress-Archive -Path "$rel/*" -DestinationPath "TheFew-Windows.zip" -Force
          Get-Item "TheFew-Windows.zip" | Format-Table Name, Length

      # Artefact CI (téléchargeable depuis l'onglet Actions, même sans release).
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: TheFew-Windows
          path: TheFew-Windows.zip
          retention-days: 14

      # Publication sur la release "windows-latest" (lien stable de partage).
      - name: Publish "windows-latest" release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -e
          REPO="${{ github.repository }}"
          OUT="TheFew-Windows.zip"
          NOTES="The Few — build Windows (PC) de prévisualisation.

          Décompresse le .zip et lance tv_king.exe (garde TOUS les fichiers du
          dossier ensemble : l'.exe a besoin de ses .dll voisines). Clavier :
          flèches = navigation, Entrée = OK, Échap = Retour. Même backend/panel
          que le mobile et la TV.

          Étape 1 : interface + cache des chaînes. La lecture vidéo desktop
          est en cours de finalisation (étape 2).

          Commit : ${{ github.sha }}"
          if gh release view windows-latest --repo "$REPO" >/dev/null 2>&1; then
            gh release edit windows-latest --repo "$REPO" --notes "$NOTES"
            gh release upload windows-latest --repo "$REPO" --clobber "$OUT"
          else
            gh release create windows-latest --repo "$REPO" \
              --title "The Few — Windows (dernier build)" \
              --notes "$NOTES" --prerelease "$OUT"
          fi
          gh release view windows-latest --repo "$REPO"
