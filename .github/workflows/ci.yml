# ============================================================================
#  ci.yml — Gate qualité de l'app web (version TV). S'exécute sur chaque PR et
#  sur les pushes de branches de travail. Indépendant des workflows de
#  publication APK (déclenchés manuellement via workflow_dispatch).
#
#  Étapes (toutes doivent être vertes = exit 0) :
#    lint · typecheck · tests + couverture · build · budget de taille client JS.
# ============================================================================
name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "claude/**"
      - "usine/**"

# Un seul run par ref : un nouveau push annule le précédent.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint · Types · Tests · Build · Budget
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install (lockfile strict)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests + couverture (seuils dans vitest.config.ts)
        run: npm run test:coverage

      - name: Build de production
        run: npm run build

      - name: Budget de taille (client JS ≤ baseline +10%)
        run: node scripts/size-budget.mjs
