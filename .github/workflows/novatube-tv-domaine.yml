# =========================================================
#  NovaTube TV — relier https://novatube.zuno8k.com/novatube.apk
# =========================================================
#  Demande explicite du propriétaire (16/11/2026) : l'adresse Downloader
#  novatube.zuno8k.com/novatube.apk doit donner NovaTube TV.
#
#  1. Copie l'APK de test VÉRIFIÉ (SOURCE_TAG, publié par
#     novatube-tv-test.yml après émulateur) dans la pré-version FIXE
#     `novatube-tv-download`, sous un nom stable : NovaTube-TV.apk.
#  2. Met en ligne le Worker `novatube-downloads` (.github/novatube-tv/) :
#     /novatube.apk → NovaTube TV ; NovaTube mobile conservé sur /mobile.apk.
#     Sauvegarde, vérification en ligne (SHA-256) et retour arrière auto.
#
#  Pour servir un autre build : changer SOURCE_TAG ci-dessous et pousser.
#  Ne touche ni aux releases Zuno/7 MOTION, ni au Worker Atlas, ni au panel.
# =========================================================
name: NovaTube TV — relier le domaine de téléchargement

on:
  push:
    branches: ['ccr-b67ba221-20h8wo-novatube-tv']
    paths:
      - '.github/workflows/novatube-tv-domaine.yml'
      - '.github/novatube-tv/**'

permissions:
  contents: write

concurrency:
  group: novatube-tv-domaine
  cancel-in-progress: false

env:
  SOURCE_TAG: novatube-tv-test-6e1e9b9a
  FIXED_TAG: novatube-tv-download

jobs:
  relier:
    name: APK fixe + Worker novatube-downloads
    if: github.repository == 'manzilionellm-dotcom/tvking'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Tests du Worker (aucun réseau)
        run: node --test .github/novatube-tv/download-worker.test.mjs

      - name: Copier l'APK vérifié dans la pré-version fixe
        id: fixe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p src out
          gh release download "$SOURCE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern 'NovaTube-TV-test-*.apk' --pattern 'SHA256SUMS.txt' --dir src
          (cd src && sha256sum -c SHA256SUMS.txt)
          cp src/NovaTube-TV-test-*.apk out/NovaTube-TV.apk
          sha="$(sha256sum out/NovaTube-TV.apk | awk '{print $1}')"
          echo "$sha  NovaTube-TV.apk" > out/SHA256SUMS.txt
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          if ! gh release view "$FIXED_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            printf '%s\n' \
              "**NovaTube TV — APK de TEST à adresse fixe** (pour Downloader : https://novatube.zuno8k.com/novatube.apk)." \
              "" \
              "Copie exacte du dernier APK de test vérifié par la CI (pré-version \`$SOURCE_TAG\`)." \
              "Clé de TEST : ne met pas à jour NovaTube 334.2.6 ; désinstaller une version de test précédente." > notes.md
            gh release create "$FIXED_TAG" --repo "$GITHUB_REPOSITORY" --prerelease \
              --target "$GITHUB_SHA" --title "NovaTube TV — téléchargement fixe (TEST)" --notes-file notes.md
          fi
          gh release upload "$FIXED_TAG" out/NovaTube-TV.apk out/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --clobber
          curl -fsSL "https://github.com/$GITHUB_REPOSITORY/releases/download/$FIXED_TAG/NovaTube-TV.apk" -o pub.apk
          test "$(sha256sum pub.apk | awk '{print $1}')" = "$sha"
          echo "✓ APK fixe publié et vérifié (SHA-256 $sha) depuis $SOURCE_TAG"

      - name: Mettre en ligne le Worker (sauvegarde, vérification, retour arrière)
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EXPECTED_SHA256: ${{ steps.fixe.outputs.sha }}
        run: python3 .github/novatube-tv/deploy_download_worker.py

      - name: Conserver l'ancien script (retour manuel possible)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: novatube-downloads-ancien-${{ github.sha }}
          path: ancien-worker.mjs
          if-no-files-found: ignore
          retention-days: 30
