name: NovaTube audit Android 11 (mires uniquement)

on:
  push:
    branches: ['qa/novatube-zaps-heure-20261127']

permissions:
  contents: read

concurrency:
  group: novatube-tv-test-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  FLUTTER_SUPPRESS_ANALYTICS: 'true'
  NOVATUBE_TV_APP_ID: com.sevenmotion.novatube.tv
  NOVATUBE_TV_VERSION: '1.0.0'

jobs:
  emulator:
    name: Ouvrir l'APK sur Android 11 (émulateur TV 1080p, hors réseau)
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout (script de contrôle du même commit)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Télécharger l'APK signé et vérifié
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: '46005227751'
          name: novatube-tv-apk-ec95c2390e531dedcb557e7024f61e9a3fee232d
          path: artifacts/apk

      - name: Télécharger la variante d'émulateur de la même compilation
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: '46005227751'
          name: novatube-emulateur-apk-ec95c2390e531dedcb557e7024f61e9a3fee232d
          path: artifacts/variante

      - name: Relire l’empreinte et l’identité du binaire sélectionné
        id: binaire
        working-directory: artifacts/apk
        env:
          SOURCE: ec95c2390e531dedcb557e7024f61e9a3fee232d
        run: |
          set -euo pipefail
          sha256sum -c SHA256SUMS.txt
          nom="NovaTube-TV-test-${NOVATUBE_TV_VERSION}-${SOURCE:0:8}.apk"
          test -s "$nom"
          sha=$(sha256sum "$nom" | awk '{print $1}')
          cert=$(awk '/certificate SHA-256 digest:/ {print $NF; exit}' signature.txt)
          version=$(sed -n "s/^package: .*versionCode='\\([0-9]*\\)'.*/\\1/p" badging.txt)
          [[ "$cert" =~ ^[0-9a-f]{64}$ && "$version" =~ ^[0-9]+$ ]]
          signature=cle-novatube-tv
          if grep -Fq 'CN=NovaTube TV test build' signature.txt; then signature=cle-de-test-jetable; fi
          printf 'nom=%s\nsha=%s\ncert=%s\nversion=%s\nsignature=%s\n' "$nom" "$sha" "$cert" "$version" "$signature" >> "$GITHUB_OUTPUT"

      - name: Code serveur Atlas NovaTube (lecture seule, routes /api/novatube4k)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feature/novatube-activation-status-20261114
          path: atlas
          persist-credentials: false
          sparse-checkout: android-app/cloudflare

      - name: Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Lancer l'Atlas local (vrai code serveur, base vide, aucun réseau sortant)
        run: |
          set -euo pipefail
          (cd atlas/android-app/cloudflare && npm ci --no-audit --no-fund)
          ATLAS_PORT=8788 nohup node android-app/ci/novatube_tv/atlas_local_server.mjs \
            atlas/android-app/cloudflare "$RUNNER_TEMP/atlas.json" > "$RUNNER_TEMP/atlas.log" 2>&1 &
          for i in $(seq 1 90); do grep -q 'PRÊT' "$RUNNER_TEMP/atlas.log" && break; sleep 1; done
          grep 'PRÊT' "$RUNNER_TEMP/atlas.log"

      - name: Java 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      - name: SDK Android
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Bibliothèques Linux de l'émulateur et accélération KVM
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libpulse0 ffmpeg tesseract-ocr python3-pil
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm

      - name: Fabriquer la liste M3U de test (mires générées, aucun fournisseur)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/novatube-media"
          python3 android-app/ci/novatube_tv/pilot_live_source.py prepare "$RUNNER_TEMP/novatube-encoded"
          cat > "$RUNNER_TEMP/novatube-media/novatube-test.m3u" <<'M3U'
          #EXTM3U
          #EXTINF:-1 group-title="Test NovaTube",Mire de test 1080p
          http://127.0.0.1:18471/A/index.m3u8
          #EXTINF:-1 group-title="Test NovaTube",Barres HD de test
          http://127.0.0.1:18471/B/index.m3u8
          M3U

      - name: Installer, ouvrir, naviguer, importer, lire, rouvrir (captures)
        run: |
          set -euo pipefail
          apk="$(ls artifacts/apk/*.apk | head -1)"
          echo "$(sha256sum "$apk" | awk '{print $1}')" > expected.txt
          test "$(cat expected.txt)" = "${{ steps.binaire.outputs.sha }}"
          NOVATUBE_EMULATOR_APK=artifacts/variante/NovaTube-TV-emulateur.apk \
          NOVATUBE_TEST_MEDIA="$RUNNER_TEMP/novatube-media" \
            bash android-app/ci/novatube_tv/emulator_smoke.sh "$apk" artifacts/emulateur

      - name: Conserver captures et journaux (même en cas d'échec)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: novatube-zaps-heure-${{ github.sha }}
          path: artifacts/emulateur/
          if-no-files-found: warn
          retention-days: 14
