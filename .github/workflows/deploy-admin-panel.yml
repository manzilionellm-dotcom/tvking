# =========================================================
#  deploy-admin-panel.yml — Build + deploie le panel admin sur
#  Cloudflare Pages (sans toucher au dashboard)
# =========================================================
#  Le panel React (admin-panel/) est builde puis publie sur
#  Cloudflare Pages via wrangler. L'URL de prod sera du type
#  https://tvking-admin.pages.dev
#
#  Le panel parle a l'API du Worker (CORS = *), donc on injecte
#  VITE_API_BASE = https://99999.7themotion.com au build pour
#  qu'il tape le bon backend depuis le domaine Pages.
#
#  Utilise les memes secrets que deploy-worker.yml. Le token doit
#  avoir la permission "Cloudflare Pages: Edit" (en plus de Workers).
#  Si le deploy echoue en permission, ajouter ce scope au token.
# =========================================================

name: Deploy Admin Panel

on:
  workflow_dispatch: {}
  push:
    branches:
      - main
      - 'claude/**'
    paths:
      - 'admin-panel/**'
      - '.github/workflows/deploy-admin-panel.yml'

# `contents: write` : le garde-fou grave un tag `deployed/<canal>`
# après chaque publication réussie (cf. ci/guard_no_rollback.sh).
permissions:
  contents: write

jobs:
  deploy:
    name: Build + deploy admin-panel → Cloudflare Pages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Le garde-fou compare des ancêtres : historique complet requis.
          fetch-depth: 0

      # ---------------------------------------------------------
      #  NE JAMAIS FAIRE RECULER LA PRODUCTION (16/09/2026)
      # ---------------------------------------------------------
      #  Ce workflow part sur TOUTE branche `claude/**`. Deux branches
      #  vivantes = la dernière poussée écrase l'autre, en silence et
      #  avec un ✅ vert. C'est arrivé : 7 commits déjà en ligne ont
      #  disparu sans que rien ne s'allume. Le garde-fou refuse de
      #  publier un commit qui n'a pas la production pour ancêtre.
      #  Explication complète : ci/guard_no_rollback.sh
      # ---------------------------------------------------------
      - name: Refuser un déploiement qui ferait reculer la production
        run: ci/guard_no_rollback.sh check admin-panel "$GITHUB_SHA"


      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ---------------------------------------------------------
      #  LE BOUTON « DÉTAILS » DOIT RÉPONDRE (18/09/2026)
      # ---------------------------------------------------------
      #  Avant de mettre EN LIGNE, pas seulement avant de builder : le
      #  17/09, un panel parfaitement vert a été publié avec son bouton
      #  « Détails » muet. Une seule implémentation, deux appelants
      #  (ce workflow et build-admin-panel.yml) — même raison que
      #  ci/build_label.sh : une copie qui dérive dit « c'est bon »
      #  pendant que l'autre dit non.
      # ---------------------------------------------------------
      - name: La fiche appareil est-elle branchée au bon niveau ?
        run: node ci/check_panel_sheet_context.mjs

      - name: Install deps
        working-directory: admin-panel
        run: npm ci

      - name: Build (point le panel vers le Worker prod)
        working-directory: admin-panel
        env:
          # Le Worker (API revendeurs + base D1) est joignable de façon
          # FIABLE sur son Custom Domain `app.7themotion.com` (DNS + SSL
          # gérés par Cloudflare, prouvé : /vip télécharge l'APK). On NE
          # passe PAS par le sous-domaine workers.dev (injoignable depuis
          # le navigateur → "Connexion impossible"). Le worker route par
          # chemin : app.7themotion.com/api/v1/* → API.
          VITE_API_BASE: 'https://app.7themotion.com'
        run: npm run build

      # Idempotent : le projet existe déjà en prod. wrangler-action
      # annotait ##[error] (npx exit 1) malgré continue-on-error —
      # run 34763453699 était Success mais Lionel voyait un faux rouge.
      - name: Ensure Pages project exists
        working-directory: admin-panel
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          out=$(npx --yes wrangler@3.90.0 pages project create tvking-admin --production-branch=main 2>&1)
          code=$?
          echo "$out"
          if [ "$code" -eq 0 ]; then
            echo "✓ projet Pages créé"
            exit 0
          fi
          if echo "$out" | grep -qi "already exists"; then
            echo "✓ projet Pages déjà présent"
            exit 0
          fi
          echo "❌ create Pages a échoué"
          exit 1

      - name: Deploy to Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: 'admin-panel'
          command: pages deploy dist --project-name=tvking-admin --branch=main

      # Le registre ne bouge QU'APRÈS un déploiement réussi : un build
      # qui échoue ne doit pas laisser croire qu'il est en ligne.
      - name: Graver ce qui est désormais en ligne
        run: ci/guard_no_rollback.sh mark admin-panel "$GITHUB_SHA"
