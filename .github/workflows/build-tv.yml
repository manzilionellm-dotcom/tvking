# ============================================================================
#  build-tv.yml — Compile DeFew TV (entrée lib/main_tv.dart) en APK
#  sideloadable et le publie sur la release "tv-latest".
#
#  App SŒUR du mobile : MÊME projet Flutter, MÊME backend/panel. Seule
#  l'UI (10-foot, D-pad) diffère. On régénère android/ via `flutter create`
#  (comme le build mobile), on patche le manifest (réseau cleartext + TV
#  leanback + label DeFew TV), puis on build le TARGET main_tv.
#
#  Build RELEASE signé avec un KEYSTORE FIXE (ci/defew-debug.keystore) :
#  toutes les versions partagent la même clé → les mises à jour s'installent
#  PAR-DESSUS l'ancienne (pas de « désinstaller d'abord »). Bannière Android TV
#  de marque attachée pour la home Leanback.
# ============================================================================
name: Build DeFew TV (APK)

on:
  push:
    branches: ['main', 'claude/**', 'feature/**']
    paths:
      - 'lib/main_tv.dart'
      - 'lib/features/tv/**'
      - 'packages/**'
      - 'pubspec.yaml'
      - 'assets/branding/**'
      - 'lib/l10n/**'
      - '.github/workflows/build-tv.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-tv:
    name: Build DeFew TV APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Generate native Android folder
        run: flutter create . --platforms=android --org com.manzilionellm.tvking --project-name tv_king

      - name: Brand manifest (DeFew TV)
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i 's|android:label="tv_king"|android:label="The Few TV"|g' "$MANIFEST" || true
          grep 'android:label' "$MANIFEST" || true

      - name: Patch manifest — réseau (cleartext HTTP + INTERNET)
        run: |
          set -e
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if ! grep -q 'android.permission.INTERNET' "$MANIFEST"; then
            sed -i '/<manifest /a\    <uses-permission android:name="android.permission.INTERNET"/>' "$MANIFEST"
          fi
          if ! grep -q 'usesCleartextTraffic' "$MANIFEST"; then
            sed -i 's|<application|<application\n        android:usesCleartextTraffic="true"|' "$MANIFEST"
          fi
          grep -nE 'INTERNET|usesCleartextTraffic' "$MANIFEST" || true

      - name: Patch manifest — Android TV (leanback)
        run: |
          set -e
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if ! grep -q 'android.software.leanback' "$MANIFEST"; then
            sed -i '/<manifest /a\    <uses-feature android:name="android.software.leanback" android:required="false"/>\n    <uses-feature android:name="android.hardware.touchscreen" android:required="false"/>' "$MANIFEST"
          fi
          # Catégorie LEANBACK_LAUNCHER sur l'activité principale (visible
          # dans la home Android TV à côté de Netflix/Prime).
          if ! grep -q 'LEANBACK_LAUNCHER' "$MANIFEST"; then
            sed -i 's#<category android:name="android.intent.category.LAUNCHER"/>#<category android:name="android.intent.category.LAUNCHER"/>\n                <category android:name="android.intent.category.LEANBACK_LAUNCHER"/>#' "$MANIFEST"
          fi
          grep -nE 'leanback|LEANBACK_LAUNCHER|touchscreen' "$MANIFEST" || true

      - name: Flutter pub get
        run: flutter pub get

      - name: Patch screen_brightness_android build.gradle
        run: |
          set -e
          FILE=$(find ~/.pub-cache/hosted/pub.dev -path "*/screen_brightness_android-*/android/build.gradle" 2>/dev/null | head -1)
          if [ -z "$FILE" ]; then
            echo "⊙ screen_brightness_android pas dans pub-cache, skip"
            exit 0
          fi
          export PATCH_FILE="$FILE"
          python3 << 'PYEOF'
          import os, re
          file = os.environ['PATCH_FILE']
          with open(file) as f:
              lines = f.readlines()
          kotlin_block_re = re.compile(r'^\s*kotlin\s*\{')
          out = []
          in_kotlin = False
          depth = 0
          removed = 0
          for line in lines:
              if not in_kotlin:
                  if kotlin_block_re.match(line):
                      in_kotlin = True
                      depth = line.count('{') - line.count('}')
                      removed += 1
                      if depth <= 0:
                          in_kotlin = False
                      continue
                  out.append(line)
              else:
                  depth += line.count('{') - line.count('}')
                  removed += 1
                  if depth <= 0:
                      in_kotlin = False
          if removed > 0:
              with open(file, 'w') as f:
                  f.writelines(out)
              print(f'retire {removed} ligne(s) kotlin{{}}')
          else:
              print('aucun bloc kotlin{} (deja fixe)')
          PYEOF

      - name: Patch build.gradle.kts for notifications (desugaring)
        run: |
          set -e
          python3 << 'PYEOF'
          f = "android/app/build.gradle.kts"
          s = open(f).read()
          if 'isCoreLibraryDesugaringEnabled' not in s:
              s = s.replace(
                  'compileOptions {',
                  'compileOptions {\n        isCoreLibraryDesugaringEnabled = true',
                  1)
              print('desugaring active')
          if 'desugar_jdk_libs' not in s:
              s = s.rstrip() + ('\n\ndependencies {\n'
                  '    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n'
                  '}\n')
              print('dep desugar ajoutee')
          # libVLC (flutter_vlc_player) ET media_kit embarquent libc++_shared.so
          # → conflit de packaging. On garde la 1re occurrence.
          if 'pickFirsts.add' not in s:
              s = s.replace(
                  'android {',
                  'android {\n    packaging { jniLibs { pickFirsts.add("**/libc++_shared.so") } }',
                  1)
              print('packaging pickFirst ajoute')
          open(f, 'w').write(s)
          PYEOF

      - name: Generate AppLocalizations from .arb files
        run: flutter gen-l10n || true

      # Icône de marque (pas le logo Flutter par défaut) — même source que
      # le mobile (assets/branding/logo_black7royal.png).
      - name: Generate launcher icons (logo The Few)
        run: dart run flutter_launcher_icons -f flutter_launcher_icons_tv.yaml || true

      # BANNIÈRE Android TV — c'est CE logo qu'affiche la home Leanback (à côté
      # de Netflix/Prime). Sans bannière, la TV montre une vignette grise/
      # générique (« le logo ne vient pas »). On copie notre bannière de marque
      # dans les drawables et on l'attache à l'application via android:banner.
      - name: Bannière Android TV (logo The Few)
        run: |
          set -e
          RES=android/app/src/main/res
          mkdir -p "$RES/drawable" "$RES/drawable-xhdpi" "$RES/drawable-xxhdpi"
          cp assets/branding/thefew_tv_banner.png    "$RES/drawable/tv_banner.png"
          cp assets/branding/thefew_tv_banner.png    "$RES/drawable-xhdpi/tv_banner.png"
          cp assets/branding/thefew_tv_banner_2x.png "$RES/drawable-xxhdpi/tv_banner.png"
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if ! grep -q 'android:banner' "$MANIFEST"; then
            sed -i 's|<application|<application\n        android:banner="@drawable/tv_banner"|' "$MANIFEST"
          fi
          grep -n 'android:banner' "$MANIFEST" || true

      # SIGNATURE STABLE — « mise à jour sans désinstaller ».
      # Le build release est signé par signingConfigs.debug, qui lit
      # ~/.android/debug.keystore. Or chaque runner CI en GÉNÈRE un NOUVEAU
      # (clé différente) → Android refuse la mise à jour (« appli non
      # installée »). On impose donc NOTRE keystore fixe (ci/defew-debug.keystore,
      # identifiants debug standard) : toutes les versions sont signées avec LA
      # MÊME clé → l'update s'installe par-dessus l'ancienne, sans désinstaller.
      - name: Signature stable (keystore fixe)
        run: |
          set -e
          mkdir -p ~/.android
          cp ci/defew-debug.keystore ~/.android/debug.keystore
          echo "Keystore fixe en place (~/.android/debug.keystore)."

      # RELEASE + SPLIT-PER-ABI : APK ~40-60 Mo (au lieu de 202 Mo en debug
      # multi-ABI). On publie l'arm64-v8a (box Android TV / Fire TV 4K).
      - name: Build DeFew TV (release, arm64, target main_tv)
        run: |
          set -e
          flutter build apk --release --no-tree-shake-icons --split-per-abi \
            --obfuscate --split-debug-info=build/symbols \
            --target=lib/main_tv.dart
          echo "=== APKs produits ==="
          ls -lah build/app/outputs/flutter-apk/

      - name: Publish "tv-latest" release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -ex
          REPO="${{ github.repository }}"
          SRC="build/app/outputs/flutter-apk/app-arm64-v8a-release.apk"
          OUT="build/app/outputs/flutter-apk/defew-tv.apk"
          cp "$SRC" "$OUT"
          NOTES="DeFew TV — build de prévisualisation (10-foot, D-pad).

          Même backend/panel que le mobile. Sideload sur Android TV / Fire TV :
          Downloader → https://github.com/$REPO/releases/download/tv-latest/defew-tv.apk

          Commit : ${{ github.sha }}"
          if gh release view tv-latest --repo "$REPO" >/dev/null 2>&1; then
            gh release edit tv-latest --repo "$REPO" --notes "$NOTES"
            gh release upload tv-latest --repo "$REPO" --clobber "$OUT"
          else
            gh release create tv-latest --repo "$REPO" \
              --title "DeFew TV — dernier build" \
              --notes "$NOTES" --prerelease "$OUT"
          fi
          gh release view tv-latest --repo "$REPO"
