# ============================================================================
#  build-tv.yml — Compile DeFew TV (entrée lib/main_tv.dart) en APK
#  sideloadable et le publie sur la release "tv-latest".
#
#  App SŒUR du mobile : MÊME projet Flutter, MÊME backend/panel. Seule
#  l'UI (10-foot, D-pad) diffère. On régénère android/ via `flutter create`
#  (comme le build mobile), on patche le manifest (réseau cleartext + TV
#  leanback + label DeFew TV), puis on build le TARGET main_tv.
#
#  Build RELEASE signé avec un KEYSTORE FIXE (ci/defew-debug.keystore) :
#  toutes les versions partagent la même clé → les mises à jour s'installent
#  PAR-DESSUS l'ancienne (pas de « désinstaller d'abord »). Bannière Android TV
#  de marque attachée pour la home Leanback.
# ============================================================================
name: Build DeFew TV (APK)

on:
  push:
    branches: ['main', 'claude/**', 'feature/**']
    paths:
      - 'lib/main_tv.dart'
      - 'lib/features/tv/**'
      # Modules PARTAGÉS dont dépend l'app TV — sinon une correction ici ne
      # déclenchait pas le build TV (ex. identité device / abonnement / cœur).
      - 'lib/features/device/**'
      - 'lib/features/subscription/**'
      - 'lib/features/channels/**'
      - 'lib/features/playlists/**'
      - 'lib/features/epg/**'
      - 'lib/core/**'
      - 'packages/**'
      - 'pubspec.yaml'
      - 'assets/branding/**'
      - 'lib/l10n/**'
      - '.github/workflows/build-tv.yml'
      - 'lib/features/cast/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-tv:
    name: Build DeFew TV APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # Retry manuel (2 tentatives) : sdkmanager télécharge parfois une
      # archive SDK CORROMPUE côté serveurs Google (« Error on ZipFile
      # unknown archive », constaté 2026-07-06 sur le run #222) — panne
      # transitoire de l'infra, pas un problème de ce dépôt. On rejoue
      # l'action une seule fois si elle échoue avant d'abandonner le build.
      - name: Setup Android SDK
        id: setup_android
        uses: android-actions/setup-android@v3
        continue-on-error: true

      - name: Setup Android SDK (retry après échec transitoire)
        if: steps.setup_android.outcome == 'failure'
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Generate native Android folder
        run: flutter create . --platforms=android --org com.manzilionellm.tvking --project-name tv_king

      - name: Brand manifest (DeFew TV)
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i 's|android:label="tv_king"|android:label="The Few TV"|g' "$MANIFEST" || true
          grep 'android:label' "$MANIFEST" || true

      - name: Patch manifest — réseau (cleartext HTTP + INTERNET)
        run: |
          set -e
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if ! grep -q 'android.permission.INTERNET' "$MANIFEST"; then
            sed -i '/<manifest /a\    <uses-permission android:name="android.permission.INTERNET"/>' "$MANIFEST"
          fi
          if ! grep -q 'usesCleartextTraffic' "$MANIFEST"; then
            sed -i 's|<application|<application\n        android:usesCleartextTraffic="true"|' "$MANIFEST"
          fi
          grep -nE 'INTERNET|usesCleartextTraffic' "$MANIFEST" || true

      - name: Patch manifest — Android TV (leanback)
        run: |
          set -e
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if ! grep -q 'android.software.leanback' "$MANIFEST"; then
            sed -i '/<manifest /a\    <uses-feature android:name="android.software.leanback" android:required="false"/>\n    <uses-feature android:name="android.hardware.touchscreen" android:required="false"/>' "$MANIFEST"
          fi
          # Catégorie LEANBACK_LAUNCHER sur l'activité principale (visible
          # dans la home Android TV à côté de Netflix/Prime).
          if ! grep -q 'LEANBACK_LAUNCHER' "$MANIFEST"; then
            sed -i 's#<category android:name="android.intent.category.LAUNCHER"/>#<category android:name="android.intent.category.LAUNCHER"/>\n                <category android:name="android.intent.category.LEANBACK_LAUNCHER"/>#' "$MANIFEST"
          fi
          grep -nE 'leanback|LEANBACK_LAUNCHER|touchscreen' "$MANIFEST" || true

      # ALLÉGER L'APK TV (~25-40 Mo) : la TV lit EXCLUSIVEMENT via ExoPlayer
      # (native_video_player), JAMAIS via media_kit/libmpv (qui embarque les
      # binaires lourds de libmpv). On retire media_kit du pubspec POUR CE BUILD
      # TV SEULEMENT (checkout CI, non commité → mobile/Privé gardent media_kit).
      #
      # PRÉ-REQUIS VÉRIFIÉ : plus AUCUN fichier atteignable depuis main_tv.dart
      # n'importe media_kit. L'ancienne fuite (tv_player_screen → EPG mobile
      # channel_programs_screen → play_channel → video_player_screen[media_kit])
      # a été coupée : le lecteur TV ouvre désormais un guide NATIF TV
      # (tv_channel_programs_screen.dart) qui n'importe aucun lecteur. La
      # compilation TV ne touche donc plus media_kit → ce retrait est sûr.
      # (Si jamais une régression réintroduisait l'import, ce build passerait au
      # rouge sans toucher l'APK publié, et on reviendrait.)
      - name: Alléger l'APK TV (retirer media_kit, inutile sur TV)
        run: |
          set -e
          python3 - <<'PYEOF'
          import re
          f = "pubspec.yaml"
          lines = open(f).read().splitlines(keepends=True)
          out = []
          for line in lines:
              if re.match(r'\s*(media_kit|media_kit_video|media_kit_libs_android_video|media_kit_libs_windows_video)\s*:', line):
                  print("retiré:", line.strip())
                  continue
              out.append(line)
          open(f, "w").write("".join(out))
          PYEOF
          if grep -nE "^\s*media_kit" pubspec.yaml; then
            echo "::warning::media_kit encore présent dans pubspec TV"
          else
            echo "✓ media_kit retiré du pubspec (build TV uniquement)"
          fi

      # ANALYSE TV-ONLY (CI, non commité) : media_kit vient d'être retiré du
      # pubspec (étape précédente) POUR CE BUILD SEULEMENT, mais TOUS les
      # fichiers qui l'importent restent dans lib/ (mobile/Windows le gardent
      # dans LEUR pubspec, analysé normalement par LEUR CI). `flutter
      # analyze` scanne TOUT lib/ sans notion de --target : sans exclure ces
      # fichiers ICI, le build TV échouerait sur des erreurs qui ne le
      # concernent pas. DÉCOUVERTE DYNAMIQUE (grep) plutôt qu'une liste figée
      # à la main : un fichier media_kit oublié dans la liste a déjà fait
      # échouer ce build (2026-07-07) — le grep ne peut pas se démoder.
      - name: Exclure les fichiers non-TV de l'analyse (media_kit retiré)
        run: |
          set -e
          python3 - <<'PYEOF'
          import subprocess
          out = subprocess.run(
              ["grep", "-rl", "package:media_kit", "lib/", "--include=*.dart"],
              capture_output=True, text=True,
          ).stdout
          media_kit_files = sorted(out.split())
          print("fichiers media_kit détectés :", media_kit_files)

          f = "analysis_options.yaml"
          s = open(f).read()
          marker = "    - lib/features/tv/presentation/player/tizen_player_screen.dart\n"
          if marker not in s:
              raise SystemExit("marker introuvable dans analysis_options.yaml")
          extra = "".join(f"    - {p}\n" for p in media_kit_files if f"- {p}\n" not in s)
          if extra:
              s = s.replace(marker, marker + extra, 1)
              open(f, "w").write(s)
              print("excludes TV-only ajoutés :\n" + extra)
          else:
              print("déjà tous présents")
          PYEOF

      - name: Flutter pub get
        run: flutter pub get

      - name: Patch screen_brightness_android build.gradle
        run: |
          set -e
          FILE=$(find ~/.pub-cache/hosted/pub.dev -path "*/screen_brightness_android-*/android/build.gradle" 2>/dev/null | head -1)
          if [ -z "$FILE" ]; then
            echo "⊙ screen_brightness_android pas dans pub-cache, skip"
            exit 0
          fi
          export PATCH_FILE="$FILE"
          python3 << 'PYEOF'
          import os, re
          file = os.environ['PATCH_FILE']
          with open(file) as f:
              lines = f.readlines()
          kotlin_block_re = re.compile(r'^\s*kotlin\s*\{')
          out = []
          in_kotlin = False
          depth = 0
          removed = 0
          for line in lines:
              if not in_kotlin:
                  if kotlin_block_re.match(line):
                      in_kotlin = True
                      depth = line.count('{') - line.count('}')
                      removed += 1
                      if depth <= 0:
                          in_kotlin = False
                      continue
                  out.append(line)
              else:
                  depth += line.count('{') - line.count('}')
                  removed += 1
                  if depth <= 0:
                      in_kotlin = False
          if removed > 0:
              with open(file, 'w') as f:
                  f.writelines(out)
              print(f'retire {removed} ligne(s) kotlin{{}}')
          else:
              print('aucun bloc kotlin{} (deja fixe)')
          PYEOF

      - name: Patch build.gradle.kts for notifications (desugaring)
        run: |
          set -e
          python3 << 'PYEOF'
          f = "android/app/build.gradle.kts"
          s = open(f).read()
          if 'isCoreLibraryDesugaringEnabled' not in s:
              s = s.replace(
                  'compileOptions {',
                  'compileOptions {\n        isCoreLibraryDesugaringEnabled = true',
                  1)
              print('desugaring active')
          if 'desugar_jdk_libs' not in s:
              s = s.rstrip() + ('\n\ndependencies {\n'
                  '    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n'
                  '}\n')
              print('dep desugar ajoutee')
          # libVLC (flutter_vlc_player) ET media_kit embarquent libc++_shared.so
          # → conflit de packaging. On garde la 1re occurrence.
          if 'pickFirsts.add' not in s:
              s = s.replace(
                  'android {',
                  'android {\n    packaging { jniLibs { pickFirsts.add("**/libc++_shared.so") } }',
                  1)
              print('packaging pickFirst ajoute')
          open(f, 'w').write(s)
          PYEOF

      - name: Generate AppLocalizations from .arb files
        run: flutter gen-l10n || true

      # Icône de marque (pas le logo Flutter par défaut) — même source que
      # le mobile (assets/branding/logo_black7royal.png).
      - name: Generate launcher icons (logo The Few)
        run: dart run flutter_launcher_icons -f flutter_launcher_icons_tv.yaml || true

      # BANNIÈRE Android TV — c'est CE logo qu'affiche la home Leanback (à côté
      # de Netflix/Prime). Sans bannière, la TV montre une vignette grise/
      # générique (« le logo ne vient pas »). On copie notre bannière de marque
      # dans les drawables et on l'attache à l'application via android:banner.
      - name: Bannière Android TV (logo The Few)
        run: |
          set -e
          RES=android/app/src/main/res
          mkdir -p "$RES/drawable" "$RES/drawable-xhdpi" "$RES/drawable-xxhdpi"
          cp assets/branding/thefew_tv_banner.png    "$RES/drawable/tv_banner.png"
          cp assets/branding/thefew_tv_banner.png    "$RES/drawable-xhdpi/tv_banner.png"
          cp assets/branding/thefew_tv_banner_2x.png "$RES/drawable-xxhdpi/tv_banner.png"
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if ! grep -q 'android:banner' "$MANIFEST"; then
            sed -i 's|<application|<application\n        android:banner="@drawable/tv_banner"|' "$MANIFEST"
          fi
          grep -n 'android:banner' "$MANIFEST" || true
          # ANTI-OOM box à FAIBLE RAM (« se connecte puis se ferme direct ») :
          # on autorise un TAS mémoire agrandi. Sur les Android d'entrée de gamme
          # (512 Mo–1 Go), le décodage vidéo (MediaCodec) + l'UI Flutter + le cache
          # d'images dépassent vite le heap par défaut → l'OS tue le process au
          # démarrage (kill natif non rattrapable). largeHeap repousse cette
          # limite. Sans effet négatif sur les box puissantes.
          if ! grep -q 'android:largeHeap' "$MANIFEST"; then
            sed -i 's|<application|<application\n        android:largeHeap="true"|' "$MANIFEST"
          fi
          grep -n 'largeHeap' "$MANIFEST" || true

      # SIGNATURE STABLE — « mise à jour sans désinstaller ».
      # Le build release est signé par signingConfigs.debug, qui lit
      # ~/.android/debug.keystore. Or chaque runner CI en GÉNÈRE un NOUVEAU
      # (clé différente) → Android refuse la mise à jour (« appli non
      # installée »). On impose donc NOTRE keystore fixe (ci/defew-debug.keystore,
      # identifiants debug standard) : toutes les versions sont signées avec LA
      # MÊME clé → l'update s'installe par-dessus l'ancienne, sans désinstaller.
      - name: Signature stable (keystore fixe)
        run: |
          set -e
          mkdir -p ~/.android
          cp ci/defew-debug.keystore ~/.android/debug.keystore
          echo "Keystore fixe en place (~/.android/debug.keystore)."

      # ----- SIGNATURE RELEASE (CLÉ MAÎTRESSE — identique mobile/Privé) -----
      # Si le secret est présent, on signe la TV avec TA clé de release
      # (ci/release.jks.enc déchiffré par ANDROID_KEYSTORE_PASSWORD), la MÊME que
      # The Few mobile et Privé → UNE seule clé maîtresse pour TOUTES les apps,
      # et c'est elle qui permet la publication (Play Store inclus).
      # REPLI : sans secret, on NE casse PAS le build → on garde la signature
      # debug fixe ci-dessus (sideload OK, mais non publiable Play Store).
      # ⚠️ Bascule de clé = les box ayant l'APK debug actuel devront réinstaller
      # UNE fois (signature différente), puis les MAJ s'installeront par-dessus.
      - name: Configure release signing (clé maîtresse, si secret présent)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -e
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > android/app/release.jks
            echo "✓ keystore depuis ANDROID_KEYSTORE_BASE64"
          elif [ -n "$KS_PW" ] && [ -f ci/release.jks.enc ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 \
              -in ci/release.jks.enc -out android/app/release.jks \
              -pass pass:"$KS_PW"
            echo "✓ keystore déchiffré depuis ci/release.jks.enc (clé maîtresse)"
          else
            echo "::warning title=Signature debug (TV)::Aucun keystore release (ANDROID_KEYSTORE_PASSWORD absent) → APK TV signé en DEBUG (sideload OK, NON publiable Play Store). Pose le secret pour signer avec la clé maîtresse."
            exit 0
          fi
          # key.properties à la racine android/ (lu par build.gradle.kts).
          cat > android/key.properties <<EOF
          storeFile=release.jks
          storePassword=$KS_PW
          keyAlias=sevenmotion
          keyPassword=$KS_PW
          EOF
          echo "✓ release.jks + key.properties écrits (TV signée avec la clé maîtresse)."

      # ----- Firebase Crashlytics (OPTIONNEL, activé si secret présent) -----
      # Identique au build mobile : si GOOGLE_SERVICES_JSON est posé, on écrit
      # le fichier et on applique le plugin Gradle google-services. Sans secret,
      # no-op → Crashlytics désactivé (fail-open), build vert.
      - name: Configure Firebase Crashlytics (si secret présent)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -e
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "⊙ GOOGLE_SERVICES_JSON absent → Crashlytics désactivé (build normal)."
            exit 0
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          echo "✓ google-services.json écrit."
          python3 << 'PYEOF'
          import re
          settings = "android/settings.gradle.kts"
          s = open(settings).read()
          if "com.google.gms.google-services" not in s:
              s = re.sub(r'(plugins\s*\{)',
                         r'\1\n    id("com.google.gms.google-services") version "4.4.2" apply false',
                         s, count=1)
              open(settings, "w").write(s)
              print("✓ google-services déclaré (settings.gradle.kts)")
          app = "android/app/build.gradle.kts"
          a = open(app).read()
          if "com.google.gms.google-services" not in a:
              a = re.sub(r'(plugins\s*\{)',
                         r'\1\n    id("com.google.gms.google-services")',
                         a, count=1)
              open(app, "w").write(a)
              print("✓ google-services appliqué (app/build.gradle.kts)")
          PYEOF

      # ----- R8 / ProGuard : rétrécissement code + ressources -----
      # Identique au build mobile. Règles keep dans ci/proguard-rules.pro
      # (conservatrices → media_kit / ExoPlayer / Firebase préservés).
      - name: Enable R8 + ProGuard (shrink code & resources)
        run: |
          set -e
          cp ci/proguard-rules.pro android/app/proguard-rules.pro
          python3 << 'PYEOF'
          f = "android/app/build.gradle.kts"
          s = open(f).read()
          if "isMinifyEnabled" not in s:
              s = s.replace(
                  "release {",
                  ('release {\n'
                   '            isMinifyEnabled = true\n'
                   '            isShrinkResources = true\n'
                   '            proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")'),
                  1)
              open(f, "w").write(s)
              print("R8/shrink actives")
          else:
              print("deja actif")
          PYEOF
          grep -n "isMinifyEnabled\|isShrinkResources\|proguardFiles" android/app/build.gradle.kts || true

      # COMPATIBILITÉ MAXIMALE BOX (corrige « Application non installée ») :
      #  1) minSdk fixé à 21 (Android 5.0 = plancher Flutter). Sans ça, le
      #     minSdk hérite de la valeur la plus haute exigée par un plugin →
      #     les box sur un Android plus ancien REFUSENT l'install. 21 = le plus
      #     grand dénominateur commun installable.
      #  2) Signatures v1 (JAR) + v2 + v3 toutes activées : les box < Android 7
      #     (API 24) ne savent vérifier QUE la v1 ; sans elle → install refusée.
      - name: Compatibilité box (minSdk 21 + signatures v1/v2/v3)
        run: |
          set -e
          python3 << 'PYEOF'
          import re
          f = "android/app/build.gradle.kts"
          s = open(f).read()
          # 1) minSdk -> 21
          if re.search(r'minSdk\s*=\s*flutter\.minSdkVersion', s):
              s = re.sub(r'minSdk\s*=\s*flutter\.minSdkVersion', 'minSdk = 21', s)
              print('minSdk -> 21 (depuis flutter.minSdkVersion)')
          elif re.search(r'minSdk\s*=\s*\d+', s):
              s = re.sub(r'minSdk\s*=\s*\d+', 'minSdk = 21', s, count=1)
              print('minSdk -> 21 (depuis litteral)')
          else:
              print('WARN: minSdk introuvable')
          # 1b) applicationId DISTINCT du mobile. Le build mobile « The Few » ET
          #     le build TV utilisaient TOUS LES DEUX com.manzilionellm.tvking.tv_king,
          #     signés avec des clés DIFFÉRENTES → "Application non installée"
          #     (conflit même-package/signature-différente) même après désinstall,
          #     y compris sur une box moderne (SHIELD). On donne à la TV son PROPRE
          #     package → installation propre, et cohabitation possible avec le
          #     mobile. Le `namespace` (chemin Kotlin/R) reste inchangé : seul le
          #     package INSTALLÉ change.
          if re.search(r'applicationId\s*=\s*"com\.manzilionellm\.tvking\.tv_king"', s):
              s = re.sub(r'applicationId\s*=\s*"com\.manzilionellm\.tvking\.tv_king"',
                         'applicationId = "com.manzilionellm.tvking.defewtv"', s, count=1)
              print('applicationId -> com.manzilionellm.tvking.defewtv (distinct du mobile)')
          else:
              print('WARN: applicationId tv_king introuvable')
          # 2) SIGNATURE : clé maîtresse RELEASE (même que mobile/Privé) + repli
          #    debug. On injecte les imports + le chargeur key.properties + un bloc
          #    signingConfigs contenant DEUX configs, toutes deux en v1/v2/v3
          #    (compat box) : `debug` (clé fixe) et `release` (clé maîtresse lue
          #    depuis key.properties). Puis on bascule le buildType release sur la
          #    clé maîtresse SI key.properties existe (secret présent), sinon debug.
          if 'signingConfigs.getByName("release")' not in s:
              if 'import java.util.Properties' not in s:
                  s = 'import java.util.Properties\nimport java.io.FileInputStream\n\n' + s
              loader = (
                  'val keystoreProperties = Properties()\n'
                  'val keystorePropertiesFile = rootProject.file("key.properties")\n'
                  'if (keystorePropertiesFile.exists()) {\n'
                  '    keystoreProperties.load(FileInputStream(keystorePropertiesFile))\n'
                  '}\n\n'
              )
              s = s.replace('android {', loader + 'android {', 1)
              signing = (
                  'android {\n'
                  '    signingConfigs {\n'
                  '        getByName("debug") {\n'
                  '            enableV1Signing = true\n'
                  '            enableV2Signing = true\n'
                  '            enableV3Signing = true\n'
                  '        }\n'
                  '        create("release") {\n'
                  '            val sf = keystoreProperties.getProperty("storeFile")\n'
                  '            if (sf != null) {\n'
                  '                storeFile = file(sf)\n'
                  '                storePassword = keystoreProperties.getProperty("storePassword")\n'
                  '                keyAlias = keystoreProperties.getProperty("keyAlias")\n'
                  '                keyPassword = keystoreProperties.getProperty("keyPassword")\n'
                  '            }\n'
                  '            enableV1Signing = true\n'
                  '            enableV2Signing = true\n'
                  '            enableV3Signing = true\n'
                  '        }\n'
                  '    }'
              )
              s = s.replace('android {', signing, 1)
              old = 'signingConfig = signingConfigs.getByName("debug")'
              new = ('signingConfig = if (keystorePropertiesFile.exists()) '
                     'signingConfigs.getByName("release") else '
                     'signingConfigs.getByName("debug")')
              if old in s:
                  s = s.replace(old, new, 1)
                  print('release buildType -> cle maitresse si presente, sinon debug')
              else:
                  print('WARN: ligne signingConfig debug introuvable (release reste debug)')
              print('signingConfigs debug+release injectes (v1/v2/v3)')
          else:
              print('signing deja patche')
          open(f, 'w').write(s)
          PYEOF
          grep -nE "minSdk|enableV1Signing|enableV2Signing|enableV3Signing" android/app/build.gradle.kts || true

      # APK UNIVERSEL (toutes ABIs : arm64-v8a + armeabi-v7a + x86_64).
      # CRUCIAL pour Amazon Fire Stick : beaucoup de Fire Stick (Lite, Stick de
      # base) tournent en 32 bits (armeabi-v7a). Un APK arm64-only REFUSE de
      # s'installer dessus. L'APK universel s'installe sur TOUS les Fire Stick
      # et toutes les box Android TV — un seul fichier, un seul lien.
      # BARRIÈRE QUALITÉ (TIER 0) — même garde-fou que le build mobile : on
      # ne publie pas un APK TV qui rate l'analyse (erreurs) ou les tests.
      - name: Quality gate (analyze + tests)
        run: |
          # `flutter create` (étape native plus haut) régénère un
          # test/widget_test.dart PAR DÉFAUT (compteur) référençant `MyApp`,
          # classe inexistante ici → erreur d'analyse. Pas un test du projet
          # (les vrais sont sous test/features, test/core), non committé. On le
          # retire avant la barrière.
          rm -f test/widget_test.dart
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test --reporter expanded

      - name: Build DeFew TV (release universel, target main_tv)
        run: |
          set -e
          # versionCode STRICTEMENT CROISSANT (secondes epoch) : chaque build a
          # un numéro plus grand que le précédent → Android voit TOUJOURS une
          # version plus récente et accepte la mise à jour PAR-DESSUS l'ancienne
          # (jamais de « rétrogradation » refusée). Reste < 2 100 000 000 (max
          # Android) jusqu'en 2036. Combiné à la signature stable = remplacement
          # garanti, plus jamais « application non installée ».
          BUILD_NUMBER=$(date +%s)
          echo "versionCode = $BUILD_NUMBER"
          flutter build apk --release --no-tree-shake-icons \
            --build-number="$BUILD_NUMBER" \
            --obfuscate --split-debug-info=build/symbols \
            --dart-define=GIT_SHA=${{ github.sha }} \
            --target=lib/main_tv.dart
          echo "=== APK produit ==="
          ls -lah build/app/outputs/flutter-apk/

      # ===== Google Play : App Bundle (.aab) SIGNÉ (Android TV) =====
      # Le Play Store n'accepte PAS l'APK : il faut un Android App Bundle,
      # signé avec la même clé release. On le construit EN PLUS de l'APK
      # (qui reste le canal sideload Fire TV / Downloader). À récupérer
      # dans les Artifacts du run pour l'uploader dans la Play Console.
      - name: Build release AAB TV (Google Play)
        run: |
          set -e
          # versionCode en SECONDES epoch : strictement croissant et
          # largement supérieur à toute version déjà publiée sur le Store
          # (la 677) → jamais de rétrogradation refusée par Play.
          BUILD_NUMBER=$(date +%s)
          echo "AAB versionCode = $BUILD_NUMBER"
          MANIFEST=android/app/src/main/AndroidManifest.xml
          # Play refuse/restreint REQUEST_INSTALL_PACKAGES (l'updater
          # sideload est inutile sur le Store) → on la retire de l'AAB si
          # elle a été ajoutée par le patch réseau. L'APK sideload, déjà
          # construit plus haut, la conserve.
          sed -i '/android.permission.REQUEST_INSTALL_PACKAGES/d' "$MANIFEST" || true
          ok=
          for attempt in 1 2 3 4; do
            echo "=== AAB TV build attempt $attempt ==="
            flutter build appbundle --release --no-tree-shake-icons \
              --build-number="$BUILD_NUMBER" \
              --obfuscate --split-debug-info=build/symbols \
              --dart-define=PLAY_BUILD=true \
              --dart-define=GIT_SHA=${{ github.sha }} \
              --target=lib/main_tv.dart && { ok=1; break; }
            echo "Attempt $attempt failed; retry in 25s"; sleep 25
          done
          [ "$ok" = 1 ] || { echo "AAB TV build failed after retries"; exit 1; }
          OUT=build/app/outputs/bundle/release
          cp "$OUT/app-release.aab" "$OUT/defew-tv.aab"
          ls -lah "$OUT/defew-tv.aab"

      - name: Upload AAB TV artifact (Google Play)
        uses: actions/upload-artifact@v4
        with:
          name: defew-tv-playstore-aab-${{ github.sha }}
          path: build/app/outputs/bundle/release/defew-tv.aab
          retention-days: 30
          if-no-files-found: error

      - name: Publish "tv-latest" release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -ex
          REPO="${{ github.repository }}"
          # ANTI-CLOBBER : la branche du correctif cast publie sur une release
          # DÉDIÉE (cast-fix-tv-latest) que rien d'autre n'écrase. Les autres
          # branches continuent d'écrire "tv-latest".
          if [ "${{ github.ref_name }}" = "claude/iptv-chromecast-cast-WeAyo" ]; then
            TAG="cast-fix-tv-latest"
          elif [ "${{ github.ref_name }}" = "claude/m3u-stream-playback-fix-cfdr2f" ]; then
            # Release DÉDIÉE à la branche de correctifs lecture : la
            # « tv-latest » est écrasée par d'autres branches → l'APK/.aab
            # avec les correctifs y disparaissait. Ici rien ne l'écrase.
            TAG="tv-fix-latest"
          else
            TAG="tv-latest"
          fi
          echo ">>> Release cible : $TAG (branche ${{ github.ref_name }})"
          SRC="build/app/outputs/flutter-apk/app-release.apk"
          OUT="build/app/outputs/flutter-apk/defew-tv.apk"
          cp "$SRC" "$OUT"
          # App Bundle pour la Play Console (Android TV) — construit à
          # l'étape précédente.
          AAB="build/app/outputs/bundle/release/defew-tv.aab"
          NOTES="DeFew TV — build de prévisualisation (10-foot, D-pad).

          APK UNIVERSEL (sideload Fire TV / box Android TV) :
          Downloader → https://github.com/$REPO/releases/download/$TAG/defew-tv.apk

          Google Play (Android TV) : App Bundle signé →
          https://github.com/$REPO/releases/download/$TAG/defew-tv.aab

          Commit : ${{ github.sha }} · Branche : ${{ github.ref_name }}"
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$REPO" --notes "$NOTES"
            gh release upload "$TAG" --repo "$REPO" --clobber "$OUT"
            [ -f "$AAB" ] && gh release upload "$TAG" --repo "$REPO" --clobber "$AAB" || true
          else
            gh release create "$TAG" --repo "$REPO" \
              --title "DeFew TV — dernier build" \
              --notes "$NOTES" --prerelease "$OUT"
            [ -f "$AAB" ] && gh release upload "$TAG" --repo "$REPO" --clobber "$AAB" || true
          fi
          gh release view "$TAG" --repo "$REPO"
