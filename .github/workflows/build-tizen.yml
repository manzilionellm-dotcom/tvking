# ============================================================================
#  build-tizen.yml — Compile The Few pour SAMSUNG TV (Tizen) en .tpk
#
#  App SŒUR de l'Android TV : MÊME projet Flutter, MÊME backend/panel. Seul le
#  moteur de lecture change (video_player_avplay / AVPlay natif Samsung) et la
#  chaîne de build (flutter-tizen au lieu de flutter).
#
#  ÉTAT : la chaîne compile et produit un .tpk signé avec le certificat AUTEUR
#  du client (secrets SAMSUNG_AUTHOR_P12_BASE64 / SAMSUNG_AUTHOR_PASSWORD) + le
#  distributeur Tizen par défaut du SDK, publié sur la release « tizen-latest ».
#  Ça suffit pour le sideload en Mode Développeur (TV Samsung 2021+, Tizen
#  6.0+). Pour INSTALLER sur une TV de détail / publier au store, il faut EN
#  PLUS un certificat DISTRIBUTEUR Samsung (compte Samsung Seller gratuit) —
#  cf. notes de release. Sans les secrets → repli auto-signé (validation).
#
#  Réf. : github.com/flutter-tizen/flutter-tizen (doc + CI plugins).
# ============================================================================
name: Build The Few (Samsung Tizen)

on:
  push:
    branches: ['main', 'claude/**', 'feature/**']
    paths:
      - 'lib/main_tizen.dart'
      - 'lib/features/tv/presentation/player/tizen_player_screen.dart'
      # L'app Samsung RÉUTILISE toute l'UI TV + les modules PARTAGÉS (comme
      # l'Android TV). Sans ces chemins, une amélioration TV (lecteur film,
      # téléchargements, catch-up, ambiances…) ne reconstruisait JAMAIS le
      # .tpk Samsung → il restait figé. On s'aligne sur build-tv.yml.
      - 'lib/features/tv/**'
      - 'lib/features/device/**'
      - 'lib/features/subscription/**'
      - 'lib/features/channels/**'
      - 'lib/features/playlists/**'
      - 'lib/features/vod/**'
      - 'lib/features/epg/**'
      - 'lib/features/sports/**'
      - 'lib/features/stats/**'
      - 'lib/core/**'
      - 'pubspec.yaml'
      - 'assets/branding/**'
      - 'lib/l10n/**'
      - '.github/workflows/build-tizen.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-tizen:
    name: Build The Few (.tpk)
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Dépendances système attendues par le SDK Tizen (web-cli + outils natifs).
      # python2.7 / libncurses5 ne sont plus dans les dépôts par défaut récents :
      # on tente, sans bloquer si l'un manque (le SDK fonctionne souvent sans).
      # L'installateur web-cli du SDK Tizen exige python3.8 + libpython3.8, qui
      # ne sont PAS dans les dépôts d'ubuntu-22.04 (python3.10 par défaut) → son
      # auto-install échoue (exit 4). On les fournit via le PPA deadsnakes AVANT.
      - name: System dependencies (Tizen SDK)
        run: |
          sudo apt-get update || true
          sudo add-apt-repository -y ppa:deadsnakes/ppa || true
          sudo apt-get update || true
          sudo apt-get install -y python3.8 libpython3.8 \
            libncurses5 libpython2.7 zip unzip xz-utils pciutils file curl || true
          # dbus + gnome-keyring : OBLIGATOIRES pour la signature. Le CLI
          # `tizen` range le mot de passe du certificat dans le TROUSSEAU
          # (gnome-keyring via D-Bus) ; le signeur .NET le relit au build.
          # Sans trousseau, l'ajout du profil « réussit » mais le mot de
          # passe est irrécupérable → « PKCS12 key store MAC invalid » à la
          # signature, même avec le BON mot de passe. (C'est la recette du
          # CI officiel de flutter-tizen : test.yml, job e2e.)
          sudo apt-get install -y dbus-x11 gnome-keyring gettext
          python3.8 --version || true

      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # flutter-tizen embarque SON Flutter pinné : on ne pose PAS subosito ici.
      - name: Clone flutter-tizen
        run: |
          set -e
          git clone --depth 1 https://github.com/flutter-tizen/flutter-tizen.git "$HOME/flutter-tizen"
          echo "$HOME/flutter-tizen/bin" >> "$GITHUB_PATH"

      # Installation HEADLESS du SDK Tizen (web-cli) + paquets nécessaires.
      - name: Install Tizen Studio (headless)
        run: |
          set -e
          curl -fsSL https://download.tizen.org/sdk/Installer/tizen-sdk_10.0/web-cli_Tizen_SDK_10.0_ubuntu-64.bin -o install.bin
          chmod a+x install.bin
          ./install.bin --accept-license "$HOME/tizen-studio"
          rm -f install.bin
          echo "$HOME/tizen-studio/tools/ide/bin" >> "$GITHUB_PATH"
          echo "$HOME/tizen-studio/tools" >> "$GITHUB_PATH"

      - name: Install Tizen SDK packages
        run: |
          set -e
          PM="$HOME/tizen-studio/package-manager/package-manager-cli.bin"
          # PAS de « || true » : on VEUT voir si l'install du rootstrap échoue
          # (c'est ce que flutter-tizen cherche via getRootstrap). On installe le
          # toolchain natif + la baseline IOT-Headed 6.0 (rootstrap du profil
          # « common », celui du template flutter-tizen) + l'add-on certificats.
          "$PM" install --accept-license \
            NativeToolchain-Gcc-9.2 \
            IOT-Headed-6.0-NativeAppDevelopment-CLI \
            cert-add-on
          echo "===== rootstraps installés (platforms/) ====="
          find "$HOME/tizen-studio/platforms" -maxdepth 3 -iname "*device.core*" 2>/dev/null || true
          ls -la "$HOME/tizen-studio/platforms" 2>/dev/null || true
          echo "===== paquets installés ====="
          "$PM" list installed 2>/dev/null || "$PM" show-pkgs 2>/dev/null || true

      # On AJOUTE les paquets Tizen au pubspec UNIQUEMENT pour ce build (checkout
      # CI, non commité) : ainsi les builds Android/Windows n'ont jamais ces
      # dépendances. Tous publiés par tizen.org (équipe flutter-tizen) :
      #   • video_player_avplay : lecteur natif AVPlay (HLS/TS/DASH) ;
      #   • sqflite_tizen       : SQLite natif Tizen (cache des chaînes) ;
      #   • path_provider_tizen : dossiers de l'app (chemin de la base) ;
      #   • shared_preferences_tizen : réglages persistés (MAC, prefs).
      - name: Inject Tizen plugins (Tizen only)
        run: |
          set -e
          python3 - <<'PYEOF'
          f = "pubspec.yaml"
          s = open(f, encoding="utf-8").read()
          if "video_player_avplay" not in s:
              s = s.replace(
                  "  http: ^1.2.2",
                  "  http: ^1.2.2\n\n"
                  "  # --- Paquets Tizen (ajoutés par le CI Tizen, jamais ailleurs) ---\n"
                  "  video_player_avplay: ^0.8.13\n"
                  "  sqflite_tizen: ^0.1.4\n"
                  "  path_provider_tizen: any\n"
                  "  shared_preferences_tizen: any",
                  1)
              open(f, "w", encoding="utf-8").write(s)
              print("paquets Tizen injectés")
          else:
              print("déjà présents")
          PYEOF
          grep -nE "video_player_avplay|_tizen" pubspec.yaml || true

      - name: flutter-tizen doctor
        run: flutter-tizen doctor -v || true

      - name: flutter-tizen pub get
        run: flutter-tizen pub get

      - name: Generate AppLocalizations
        run: flutter-tizen gen-l10n || true

      # Génère le dossier natif tizen/ (tizen-manifest.xml, icône, embedder).
      - name: Generate native Tizen folder
        run: flutter-tizen create . --platforms tizen || true

      # Manifeste TV : api-version 6.0 (plancher Flutter, TV 2021+) + accès
      # Internet (indispensable pour l'IPTV). On ajuste si le fichier existe.
      - name: Patch tizen-manifest.xml (TV + internet)
        run: |
          set -e
          M=tizen/tizen-manifest.xml
          if [ -f "$M" ]; then
            sed -i 's/api-version="[0-9.]*"/api-version="6.0"/' "$M" || true
            if ! grep -q 'tizen.org/privilege/internet' "$M"; then
              sed -i 's#</manifest>#  <privileges>\n    <privilege>http://tizen.org/privilege/internet</privilege>\n  </privileges>\n</manifest>#' "$M" || true
            fi
            echo "----- tizen-manifest.xml -----"
            cat "$M"
          else
            echo "::warning::tizen/tizen-manifest.xml introuvable"
          fi

      # ----- SIGNATURE du .tpk -----
      # On signe avec TON certificat AUTEUR (ton identité, créé une fois via le
      # Certificate Manager) + le certificat DISTRIBUTEUR Tizen PAR DÉFAUT livré
      # avec le SDK (mot de passe public bien connu). C'est exactement la combi
      # que tu as choisie en local (profil « thefew » → « Use the default Tizen
      # distributor certificate »). Avantage : un SEUL fichier à exporter.
      #
      #  • Le distributeur Tizen par défaut suffit pour : .tpk signé valide,
      #    test émulateur, et soumission au store (le store de Samsung re-signe).
      #  • Le distributeur Samsung lié au DUID ne sert QUE pour le sideload sur
      #    une TV physique précise en Mode Dev — on l'ajoutera le jour où il y a
      #    une vraie TV (cf. PORTAGE_TV_PLATEFORMES.md).
      #
      #  Secrets attendus (Réglages GitHub → Secrets and variables → Actions) :
      #     SAMSUNG_AUTHOR_P12_BASE64  = ton author.p12 encodé en base64
      #     SAMSUNG_AUTHOR_PASSWORD    = le mot de passe choisi à sa création
      #  (Plus besoin de secret distributeur : on prend celui du SDK.)
      #
      #  Sans le secret auteur → repli AUTO-SIGNÉ best-effort (valide juste que la
      #  chaîne de build compile et embarque la pile vidéo AVPlay).
      #  ⚠️ TROUSSEAU OBLIGATOIRE : le CLI `tizen` stocke le mot de passe du
      #  certificat dans gnome-keyring (via D-Bus). Cette étape ET l'étape de
      #  build tournent donc chacune dans `dbus-run-session` avec le trousseau
      #  déverrouillé par le MÊME mot de passe : le trousseau persiste sur
      #  disque ($HOME/.local/share/keyrings) entre les étapes, donc le mot de
      #  passe rangé ici est relisible au moment de signer. Sans ça, le signeur
      #  .NET reçoit une valeur irrécupérable → « PKCS12 key store MAC
      #  invalid » même quand le mot de passe est BON (c'était le bug).
      #  Recette identique au CI officiel de flutter-tizen (test.yml, job e2e).
      - name: Signature (certif auteur via secret + distributeur Tizen par défaut)
        env:
          AUTHOR_P12: ${{ secrets.SAMSUNG_AUTHOR_P12_BASE64 }}
          AUTHOR_PW: ${{ secrets.SAMSUNG_AUTHOR_PASSWORD }}
        run: |
          cat > "$RUNNER_TEMP/sign-profile.sh" <<'SCRIPT'
          # PAS de `set -e` global ici : on veut GÉRER nous-mêmes l'échec du
          # certificat (le diagnostiquer + retomber en auto-signé) plutôt que de
          # tuer tout le build sans produire aucun .tpk.
          # Déverrouille (crée au 1er passage) le trousseau « login ».
          echo thefewkeyring | gnome-keyring-daemon --unlock
          TZ="$HOME/tizen-studio/tools/ide/bin/tizen"
          PROFILES="$HOME/tizen-studio-data/profile/profiles.xml"
          # Distributeur Tizen PAR DÉFAUT du SDK (présent après l'install). Mot de
          # passe public documenté par Tizen : « tizenpkcs12passfordsigner ».
          DIST="$(find "$HOME/tizen-studio" -name 'tizen-distributor-signer.p12' 2>/dev/null | head -1)"
          DIST_PW="tizenpkcs12passfordsigner"
          echo "distributeur par défaut : ${DIST:-INTROUVABLE}"
          mkdir -p "$HOME/certs"

          # Repli AUTO-SIGNÉ (certif jetable) : garantit qu'un .tpk sort toujours.
          # (Le drapeau mot de passe de « tizen certificate » est -pw, PAS -p.)
          AUTHOR_KEYSTORE="$HOME/tizen-studio-data/keystore/author/author.p12"
          autosign() {
            # Profil et certificat propres (une tentative précédente a pu laisser
            # un profil « TheFewProfile » incohérent dans profiles.xml).
            "$TZ" security-profiles remove -n TheFewProfile 2>/dev/null || true
            rm -f "$AUTHOR_KEYSTORE" 2>/dev/null || true
            "$TZ" certificate -a thefew -pw thefewpass -f author \
              || "$TZ" certificate --alias thefew --password thefewpass --filename author \
              || true
            "$TZ" security-profiles add -n TheFewProfile \
              -a "$AUTHOR_KEYSTORE" -p thefewpass \
              -d "$DIST" --dist-password "$DIST_PW" || true
          }

          SIGNED_WITH_AUTHOR=0
          if [ -n "$AUTHOR_P12" ]; then
            # 1) Le base64 est-il valide ? (une copie avec espaces/coupures le casse)
            if echo "$AUTHOR_P12" | base64 -d > "$HOME/certs/author.p12" 2>/dev/null \
                && [ -s "$HOME/certs/author.p12" ]; then
              echo "base64 auteur : OK ($(stat -c%s "$HOME/certs/author.p12") octets)."
              # 2) Le couple certificat + mot de passe est-il bon ?
              if "$TZ" security-profiles add -n TheFewProfile \
                    -a "$HOME/certs/author.p12" -p "$AUTHOR_PW" \
                    -d "$DIST" --dist-password "$DIST_PW" \
                 || "$TZ" security-profiles add -n TheFewProfile \
                    -a "$HOME/certs/author.p12" -p "$AUTHOR_PW" \
                    -d "$DIST" -dp "$DIST_PW"; then
                SIGNED_WITH_AUTHOR=1
                echo "✓ profil signé : TON certificat auteur + distributeur Tizen par défaut."
              else
                echo "::warning title=Certificat Samsung refusé::author.p12 chargé mais REJETÉ (« Invalid file or password »). Cause quasi certaine : le secret SAMSUNG_AUTHOR_PASSWORD ne correspond PAS au mot de passe du certificat (ou le author.p12 encodé n'est pas le bon). Vérifie/recrée SAMSUNG_AUTHOR_PASSWORD. → .tpk AUTO-SIGNÉ en attendant."
                autosign
              fi
            else
              echo "::warning title=base64 invalide::SAMSUNG_AUTHOR_P12_BASE64 ne se décode pas en fichier valide (copie tronquée / espaces / retours ligne). Ré-encode SANS saut de ligne et recolle le secret entier. → .tpk AUTO-SIGNÉ en attendant."
              autosign
            fi
          else
            echo "::warning::Secret SAMSUNG_AUTHOR_P12_BASE64 absent → .tpk AUTO-SIGNÉ (validation de la chaîne de build)."
            autosign
          fi
          echo "SIGNED_WITH_AUTHOR=$SIGNED_WITH_AUTHOR" >> "$GITHUB_ENV"
          "$TZ" cli-config "profiles.path=$PROFILES" || true
          SCRIPT
          dbus-run-session -- bash "$RUNNER_TEMP/sign-profile.sh"

      # Profil « common » : son rootstrap (iot-headed-6.0) est celui qu'on peut
      # installer headless (le rootstrap « tv » exige l'extension SDK Samsung TV,
      # non publique). Un TPK common s'installe et tourne sur Tizen TV 6.0+.
      # continue-on-error : en cas d'échec, l'étape « Archive build output »
      # publie quand même la sortie de build pour diagnostic, puis l'étape
      # finale « Vérification » met le run en ROUGE (pas de .tpk = échec).
      #
      # Le build tourne dans `dbus-run-session` + trousseau déverrouillé (même
      # mot de passe que l'étape Signature) : c'est là que le signeur relit le
      # mot de passe du certificat rangé dans le trousseau. NB : quand la
      # signature .NET échoue, msbuild n'émet AUCUN .tpk (même pas un brut non
      # signé) → aucune « signature de repli » n'est possible après coup ;
      # l'ancienne tentative de repli via `tizen package` était donc sans objet.
      - name: Build .tpk (profil common, rootstrap IOT-Headed 6.0)
        id: buildtpk
        continue-on-error: true
        run: |
          cat > "$RUNNER_TEMP/build-tpk.sh" <<'SCRIPT'
          set -e
          echo thefewkeyring | gnome-keyring-daemon --unlock
          flutter-tizen build tpk --device-profile common \
            --security-profile TheFewProfile \
            --target lib/main_tizen.dart
          SCRIPT
          dbus-run-session -- bash "$RUNNER_TEMP/build-tpk.sh"

          echo "=== .tpk final ==="
          ls -lah build/tizen/tpk/ 2>/dev/null || true
          ls build/tizen/tpk/*.tpk >/dev/null 2>&1 && echo "TPK_OK=1" >> "$GITHUB_ENV"

      # Filet : si la signature a échoué (pas de .tpk), on archive quand même la
      # sortie de build (preuve que le portage compile + embarque AVPlay).
      - name: Archive build output (si pas de .tpk)
        if: steps.buildtpk.outcome != 'success'
        uses: actions/upload-artifact@v4
        with:
          name: TheFew-Tizen-build-output
          path: build/tizen/**
          retention-days: 14
          if-no-files-found: warn

      - name: Upload .tpk artifact
        uses: actions/upload-artifact@v4
        with:
          name: TheFew-Tizen
          path: build/tizen/tpk/*.tpk
          retention-days: 14
          if-no-files-found: warn

      - name: Publish "tizen-latest" release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          REPO="${{ github.repository }}"
          TPK=$(ls build/tizen/tpk/*.tpk 2>/dev/null | head -1 || true)
          if [ -z "$TPK" ]; then
            echo "::warning::Aucun .tpk produit (compilation Tizen à finaliser)."
            exit 0
          fi
          cp "$TPK" build/tizen/tpk/thefew-tizen.tpk
          if [ "${SIGNED_WITH_AUTHOR:-0}" = "1" ]; then
            SIGN_LINE="✅ Signé avec TON certificat auteur Samsung (+ distributeur Tizen par défaut) — prêt pour le sideload et la soumission au store."
          else
            SIGN_LINE="⚠️ AUTO-SIGNÉ (certificat jetable) : le certificat auteur a été refusé ou est absent. Vérifie les secrets SAMSUNG_AUTHOR_P12_BASE64 / SAMSUNG_AUTHOR_PASSWORD (cf. logs de l'étape « Signature »)."
          fi
          NOTES="The Few — build Samsung TV (Tizen).

          $SIGN_LINE

          Sideload en Mode Développeur : Tizen 6.0+ (TV Samsung 2021+).
          Pour une TV de détail / le store : certificat DISTRIBUTEUR Samsung requis.

          Commit : ${{ github.sha }}"
          if gh release view tizen-latest --repo "$REPO" >/dev/null 2>&1; then
            gh release edit tizen-latest --repo "$REPO" --notes "$NOTES"
            gh release upload tizen-latest --repo "$REPO" --clobber build/tizen/tpk/thefew-tizen.tpk
          else
            gh release create tizen-latest --repo "$REPO" \
              --title "The Few — Samsung TV (dernier build)" \
              --notes "$NOTES" --prerelease build/tizen/tpk/thefew-tizen.tpk
          fi

      # FINI les runs « verts » sans .tpk : si rien n'est sorti, le run est
      # ROUGE. (Les artefacts de diagnostic ont déjà été publiés plus haut.)
      - name: Vérification (échec si aucun .tpk)
        run: |
          if [ "${TPK_OK:-0}" != "1" ]; then
            echo "::error::Aucun .tpk produit — voir les logs de l'étape « Build .tpk » (signature/trousseau ?)."
            exit 1
          fi
          if [ "${SIGNED_WITH_AUTHOR:-0}" != "1" ]; then
            echo "::warning::.tpk produit mais AUTO-SIGNÉ (certificat auteur absent ou refusé) — voir l'étape « Signature »."
          fi
          echo "✓ .tpk présent (signé auteur : ${SIGNED_WITH_AUTHOR:-0})."
