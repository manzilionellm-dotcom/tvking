name: NovaTube MAX LAB – accueil TV

on:
  push:
    branches: ['feature/novatube-accueil-tv-20261128']
    paths: ['.github/workflows/novatube-lab-accueil.yml', 'android-app/ci/novatube_tv/verify_lab_accueil.py', 'android-app/lib/**', 'android-app/test/novatube_tv/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: novatube-lab-accueil-${{ github.sha }}
  cancel-in-progress: false

env:
  CI: 'true'
  FLUTTER_SUPPRESS_ANALYTICS: 'true'
  SOURCE_SHA: ${{ github.sha }}
  NOVATUBE_TV_APP_ID: com.sevenmotion.novatube.tv.lab.accueil
  NOVATUBE_TV_VERSION: '1.0.0'

jobs:
  build:
    name: Compiler, tester et signer NovaTube TV
    if: github.repository == 'manzilionellm-dotcom/tvking'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: android-app
    outputs:
      apk-name: ${{ steps.verify.outputs.apk-name }}
      apk-sha256: ${{ steps.verify.outputs.apk-sha256 }}
      version-code: ${{ steps.build.outputs.version-code }}
      signing: ${{ steps.sign.outputs.signing }}
      cert-sha256: ${{ steps.verify.outputs.cert-sha256 }}
    env:
      # Les scripts TV existants lisent ces deux variables (ZUNO_ = historique).
      ZUNO_APP_ID: com.sevenmotion.novatube.tv.lab.accueil
      ZUNO_APP_LABEL: NovaTube MAX LAB Accueil
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false

      - name: Java 17 (Temurin)
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter 3.47.7 (même version que Zuno TV)
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: SDK Android
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Licences Android
        run: yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Manifeste et Gradle TV (scripts Zuno, identité NovaTube)
        run: |
          set -e
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          python3 ci/tv/patch_manifest.py android/app/src/main/AndroidManifest.xml
          cp ci/proguard-rules.pro android/app/proguard-rules.pro
          python3 ci/tv/patch_gradle.py android/app/build.gradle.kts
          grep -q 'applicationId = "com.sevenmotion.novatube.tv.lab.accueil"' android/app/build.gradle.kts
          grep -q 'android:label="NovaTube MAX LAB Accueil"' android/app/src/main/AndroidManifest.xml

      - name: Préférences compatibles box Android 5 (identique à Zuno TV)
        run: |
          python3 - <<'PYEOF'
          from pathlib import Path
          path = Path('pubspec.yaml')
          source = path.read_text(encoding='utf-8')
          anchor = '  shared_preferences: ^2.3.4\n'
          if source.count(anchor) != 1 or '  shared_preferences_android:' in source:
              raise SystemExit('Contrainte SharedPreferences inattendue : vérifier le pin TV.')
          source = source.replace(anchor, anchor + '  shared_preferences_android: 2.5.0\n', 1)
          path.write_text(source, encoding='utf-8')
          PYEOF

      - name: Dépendances
        run: flutter pub get

      - name: Tests NovaTube en mode Zuno (prouve que Zuno ne change pas)
        run: |
          set -e
          flutter gen-l10n
          flutter test --no-pub test/novatube_tv

      - name: Préparer l'édition NovaTube (logo, nom, bannière, lancement)
        run: |
          set -e
          python3 ci/novatube_tv/prepare_build.py
          flutter pub get
          flutter gen-l10n

      - name: Patch screen_brightness_android (identique à Zuno TV)
        run: |
          set -e
          FILE=$(find ~/.pub-cache/hosted/pub.dev -path "*/screen_brightness_android-*/android/build.gradle" 2>/dev/null | head -1)
          if [ -z "$FILE" ]; then echo "screen_brightness_android absent, rien à faire"; exit 0; fi
          export PATCH_FILE="$FILE"
          python3 - <<'PYEOF'
          import os, re
          file = os.environ['PATCH_FILE']
          lines = open(file).readlines()
          out, in_kotlin, depth, removed = [], False, 0, 0
          for line in lines:
              if not in_kotlin:
                  if re.match(r'^\s*kotlin\s*\{', line):
                      in_kotlin = True
                      depth = line.count('{') - line.count('}')
                      removed += 1
                      if depth <= 0:
                          in_kotlin = False
                      continue
                  out.append(line)
              else:
                  depth += line.count('{') - line.count('}')
                  removed += 1
                  if depth <= 0:
                      in_kotlin = False
          if removed:
              open(file, 'w').writelines(out)
          print(f'lignes kotlin{{}} retirées : {removed}')
          PYEOF

      - name: Analyse et tests de l'édition NovaTube
        run: |
          set -e
          flutter analyze --no-pub --no-fatal-infos \
            lib/main_tv.dart lib/core/app/novatube_tv_edition.dart \
            lib/features/tv/core lib/features/tv/presentation/tv_app.dart \
            lib/features/tv/presentation/tv_novatube_welcome_screen.dart \
            lib/features/tv/presentation/tv_components.dart \
            lib/features/theme test/novatube_tv
          flutter test --no-pub --dart-define=NOVATUBE_TV=true --dart-define=NOVATUBE_COMPACT_ZAP=true test/novatube_tv

      - name: Icône, bannière Android TV et écran de lancement NovaTube
        run: |
          set -e
          dart run flutter_launcher_icons -f flutter_launcher_icons_novatube_tv.yaml
          python3 ci/tv/apply_splash.py
          python3 ci/novatube_tv/prepare_build.py --splash-color

      - name: Signature
        id: sign
        env:
          NT_KS_B64: ${{ secrets.NOVATUBE_ACCUEIL_LAB_KEYSTORE_BASE64 }}
          NT_KS_PW: ${{ secrets.NOVATUBE_ACCUEIL_LAB_KEYSTORE_PASSWORD }}
          NT_ALIAS: ${{ secrets.NOVATUBE_ACCUEIL_LAB_KEY_ALIAS }}
          NT_KEY_PW: ${{ secrets.NOVATUBE_ACCUEIL_LAB_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "$NT_KS_B64" ] && [ -n "$NT_KS_PW" ]; then
            printf '%s' "$NT_KS_B64" | base64 -d > android/app/release.jks
            alias="${NT_ALIAS:-novatube-tv}"; key_pw="${NT_KEY_PW:-$NT_KS_PW}"; store_pw="$NT_KS_PW"
            echo "signing=cle-novatube-tv" >> "$GITHUB_OUTPUT"
            echo "✓ clé NovaTube TV (secret du dépôt)"
          else
            # Clé de TEST jetable : jamais réutilisée, jamais publiée.
            store_pw="$(openssl rand -hex 24)"; key_pw="$store_pw"; alias="novatube-tv-test"
            echo "::add-mask::$store_pw"
            keytool -genkeypair -keystore android/app/release.jks -storetype PKCS12 \
              -alias "$alias" -keyalg RSA -keysize 3072 -validity 3650 \
              -storepass "$store_pw" -keypass "$key_pw" \
              -dname "CN=NovaTube TV test build, O=Test" >/dev/null 2>&1
            echo "signing=cle-de-test-jetable" >> "$GITHUB_OUTPUT"
            echo "::warning title=Signature de test::Aucun secret NOVATUBE_ACCUEIL_LAB_KEYSTORE_BASE64 : APK signé avec une clé de test jetable (désinstaller la version de test précédente avant d'installer celle-ci)."
          fi
          {
            echo "storeFile=release.jks"
            echo "storePassword=$store_pw"
            echo "keyAlias=$alias"
            echo "keyPassword=$key_pw"
          } > android/key.properties

      - name: Compiler l'APK NovaTube TV (lib/main_tv.dart + NOVATUBE_TV)
        id: build
        run: |
          set -euo pipefail
          BUILD_NUMBER=$(date +%s)
          echo "version-code=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          flutter build apk --release --no-tree-shake-icons \
            --android-skip-build-dependency-validation \
            --target-platform android-arm,android-arm64,android-x64 \
            --build-number="$BUILD_NUMBER" \
            --build-name="$NOVATUBE_TV_VERSION" \
            --obfuscate --split-debug-info=build/symbols \
            --dart-define=NOVATUBE_TV=true --dart-define=NOVATUBE_COMPACT_ZAP=true \
            --dart-define=APP_BUILD_TS="$BUILD_NUMBER" \
            --dart-define=GIT_SHA="$SOURCE_SHA" \
            --target=lib/main_tv.dart

      - name: Vérifier l'APK (identité, Leanback, signature, empreinte)
        id: verify
        run: |
          set -euo pipefail
          name="NovaTube-Max-Accueil-LAB.apk"
          mkdir -p build/novatube_tv
          cp build/app/outputs/flutter-apk/app-release.apk "build/novatube_tv/$name"
          apk="build/novatube_tv/$name"
          bt="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          # aapt (v1) n'existe plus dans certains build-tools : aapt2 sinon.
          if [ -x "$bt/aapt" ]; then aapt="$bt/aapt"; else aapt="$bt/aapt2"; fi
          "$aapt" dump badging "$apk" > build/novatube_tv/badging.txt
          grep -E "^package:|^application-label:|leanback" build/novatube_tv/badging.txt
          grep -q "^package: name='${NOVATUBE_TV_APP_ID}'" build/novatube_tv/badging.txt
          grep -q "^application-label:'NovaTube MAX LAB Accueil'" build/novatube_tv/badging.txt
          grep -q "^leanback-launchable-activity:" build/novatube_tv/badging.txt
          "$bt/apksigner" verify --verbose --print-certs "$apk" > build/novatube_tv/signature.txt
          cert="$(grep -m1 'certificate SHA-256 digest' build/novatube_tv/signature.txt | awk '{print $NF}')"
          sha="$(sha256sum "$apk" | awk '{print $1}')"
          (cd build/novatube_tv && sha256sum "$name" > SHA256SUMS.txt)
          echo "apk-name=$name" >> "$GITHUB_OUTPUT"
          echo "apk-sha256=$sha" >> "$GITHUB_OUTPUT"
          echo "cert-sha256=$cert" >> "$GITHUB_OUTPUT"
          echo "APK $name · $(stat -c %s "$apk") octets · SHA-256 $sha · certificat $cert"

      - name: Conserver l'APK vérifié
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: novatube-accueil-apk-${{ github.sha }}
          path: |
            android-app/build/novatube_tv/*.apk
            android-app/build/novatube_tv/SHA256SUMS.txt
            android-app/build/novatube_tv/badging.txt
            android-app/build/novatube_tv/signature.txt
          if-no-files-found: error
          retention-days: 14

  smoke:
    name: Installer et vérifier les pixels du fichier signé sur Android TV
    runs-on: ubuntu-24.04
    needs: build
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: novatube-accueil-apk-${{ github.sha }}
          path: apk
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
      - name: Émulateur Android TV sans compte ni accès au panel
        shell: bash
        run: |
          set -euo pipefail
          (cd apk && sha256sum -c SHA256SUMS.txt)
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libpulse0 tesseract-ocr-eng python3-pil
          image="system-images;android-36;android-tv;x86_64"
          sdkmanager platform-tools emulator "$image" >/dev/null
          echo no | avdmanager create avd -f -n accueil -k "$image" >/dev/null
          sudo setfacl -m "u:$(id -un):rw" /dev/kvm
          export ANDROID_SERIAL=emulator-5554
          adb start-server
          "$ANDROID_HOME/emulator/emulator" -avd accueil -port 5554 -http-proxy http://127.0.0.1:9 -no-window -no-audio -no-snapshot -no-boot-anim -gpu swiftshader -memory 2048 -cores 2 > "$RUNNER_TEMP/emulator.txt" 2>&1 &
          trap 'adb emu kill >/dev/null 2>&1 || true' EXIT
          for i in {1..180}; do
            if [[ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" == 1 ]] && adb shell pm list packages android | grep -q 'package:android'; then break; fi
            sleep 2
          done
          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = 1
          adb root
          adb wait-for-device
          test "$(adb shell id -u | tr -d '\r')" = 0
          for fw in iptables ip6tables; do
            adb shell "$fw" -w -I OUTPUT 1 '!' -o lo -j REJECT
            adb shell "$fw" -w -C OUTPUT '!' -o lo -j REJECT
          done
          adb shell settings put global device_provisioned 1
          adb shell settings put secure user_setup_complete 1
          adb shell settings put secure tv_user_setup_complete 1
          adb shell svc power stayon true
          adb shell input keyevent KEYCODE_WAKEUP
          adb shell wm dismiss-keyguard
          adb shell input keyevent 82
          adb shell wm size 1920x1080
          adb shell wm density 320
          adb shell pm list features | grep -F android.software.leanback
          /usr/bin/python3 android-app/ci/novatube_tv/verify_lab_accueil.py apk/NovaTube-Max-Accueil-LAB.apk "$NOVATUBE_TV_APP_ID" controle
      - name: Conserver les vues filtrées et les valeurs booléennes
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: accueil-preuves-${{ github.sha }}
          path: controle/
          retention-days: 30

  publish:
    name: Préversion autonome, vérification du téléchargement final
    runs-on: ubuntu-latest
    needs: [build, smoke]
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: novatube-accueil-apk-${{ github.sha }}
          path: apk
      - name: Publier et relire les octets de cette préversion
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED: ${{ needs.build.outputs.apk-sha256 }}
          CERT: ${{ needs.build.outputs.cert-sha256 }}
          VERSION_CODE: ${{ needs.build.outputs.version-code }}
        working-directory: apk
        shell: bash
        run: |
          set -euo pipefail
          asset=NovaTube-Max-Accueil-LAB.apk
          sha256sum -c SHA256SUMS.txt
          test "$(sha256sum "$asset" | awk '{print $1}')" = "$EXPECTED"
          tag="novatube-accueil-lab-${GITHUB_SHA:0:12}-${EXPECTED:0:12}"
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" "$asset" SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --latest=false \
              --title "NovaTube MAX LAB Accueil · ${GITHUB_SHA:0:12}" \
              --notes "Accueil TV, canal de test. Source : $GITHUB_SHA. Paquet : $NOVATUBE_TV_APP_ID. Version : $NOVATUBE_TV_VERSION ($VERSION_CODE). Certificat : $CERT. SHA-256 de l'APK : $EXPECTED."
          fi
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/$asset"
          curl --fail --location --retry 7 --retry-all-errors --retry-delay 2 "$url" --output "$RUNNER_TEMP/retelecharge.apk"
          test "$(sha256sum "$RUNNER_TEMP/retelecharge.apk" | awk '{print $1}')" = "$EXPECTED"
          digest="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" --jq '.assets[] | select(.name=="NovaTube-Max-Accueil-LAB.apk") | .digest')"
          test "$digest" = "sha256:$EXPECTED"
          echo "[$asset]($url) — $EXPECTED" >> "$GITHUB_STEP_SUMMARY"
