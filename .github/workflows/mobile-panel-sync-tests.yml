name: 7 MOTION mobile — régressions du téléphone

on:
  push:
    branches: ['feature/7motion-panel-sync', 'feature/7motion-foot-upcoming-20261020', 'feature/7motion-player-zap-20261020', 'feature/playlist-delete-definitive-20261026', 'feature/7motion-play-panel-update-20261101']
  pull_request:
    paths:
      - 'patches/mobile-panel-sync.patch'
      - 'patches/mobile-sport-gratuit.patch'
      - 'patches/mobile-radio.patch'
      - 'patches/mobile-identity.patch'
      - 'patches/mobile-stability.patch'
      - 'android-app/ci/mobile/**'
      - 'android-app/lib/features/ads/**'
      - 'android-app/lib/features/simple_home/data/announcement_repository.dart'
      - 'android-app/lib/features/simple_home/presentation/widgets/announcement*'
      - 'android-app/lib/features/device/data/device_identity.dart'
      - 'android-app/lib/features/subscription/data/subscription_backend.dart'
      - 'android-app/lib/main.dart'
      - 'android-app/packages/tvking_device/**'
      - 'android-app/android_overlay/google_cast/MainActivity.kt'
      - 'android-app/test/features/ads/**'
      - 'android-app/test/features/simple_home/**'
      - 'android-app/test/features/device/device_info_retry_test.dart'
      - 'android-app/test/features/subscription/heartbeat_device_kind_test.dart'
      - '.github/workflows/mobile-panel-sync-tests.yml'

# Tests du vrai code mobile préparé par la chaîne de livraison. Aucun
# secret de signature ni droit de publication n'est nécessaire ici.
permissions:
  contents: read

concurrency:
  group: mobile-panel-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: mission
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 37fdf3305c5de9d35e20fd6567df38008fc7a7ee
          path: phone
          persist-credentials: false
      - name: Récupérer le candidat mobile déjà testé sur Android
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 69eee01d24f50d5e516935b94a189f791de0837c
          path: mobile-reviewed
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.7'
          channel: stable
      - name: Préparer le code mobile sans fusionner la lignée TV
        working-directory: phone
        run: |
          bash ../mission/android-app/ci/mobile/prepare-reviewed-source.sh ../mobile-reviewed
          flutter pub get
          flutter gen-l10n
      - name: Vérifier la numérotation des APK publiés
        working-directory: phone
        run: bash ci/build_label_test.sh
      - name: Vérifier la classification du matériel sans appareil client
        working-directory: phone
        run: bash ci/test-device-hardware-kind.sh
      - name: Analyser le code mobile complet
        working-directory: phone
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Vérifier les gestes et les actions utilisateur corrigés
        working-directory: phone
        run: flutter test --reporter expanded test/core/settled_page_view_test.dart test/features/playlists/library_refresh_test.dart test/features/playlists/import_return_test.dart
      - name: Vérifier les régressions et la suite mobile complète
        working-directory: phone
        run: |
          mkdir -p build/premium-captures
          flutter test --reporter expanded --dart-define=PREMIUM_CAPTURE_DIR=build/premium-captures
      - name: Conserver les captures du vrai accueil mobile
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: 7motion-premium-preview
          path: phone/build/premium-captures/*.png
          if-no-files-found: ignore
          retention-days: 14
