# Artefacts isolés pour essayer le Cast ZUNO sur téléphone/tablette et PC.
# Aucun job de publication, aucune clé client, aucun environnement de sortie.
# Les workflows TV et la version en examen sur Play restent indépendants.
name: Zuno Mobile Noir Fantome (test APK)

on:
  push:
    branches: ['design/zuno-mobile-phantom-black-20261109']
    paths:
      - '.github/workflows/zuno-mobile-phantom-test.yml'
      - 'android-app/lib/**'
      - 'android-app/packages/native_video_player/**'
      - 'android-app/test/**'
      - 'android-app/ci/cast_test/**'
      - 'android-app/android_overlay/google_cast/**'
      - 'android-app/pubspec.yaml'
      - 'android-app/assets/fonts/**'
  workflow_dispatch: {}

permissions:
  contents: read

env:
  CI: 'true'
  BOT: 'true'
  FLUTTER_SUPPRESS_ANALYTICS: 'true'

concurrency:
  group: zuno-mobile-phantom-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: android-app

jobs:
  native-logic:
    name: Handoff réseau natif (Kotlin/JVM)
    if: github.repository == 'manzilionellm-dotcom/tvking' && github.actor == github.repository_owner && github.triggering_actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout du commit exact
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Java 21 pour la logique seule
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      # Le runner Kotlin/JUnit épingle ses JAR et leurs SHA-256. Il compile
      # les vraies sources de handoff, sans SDK Android ni Gradle du runner.
      # La compilation complète du plugin/Media3 a lieu avec l'APK ci-dessous.
      - name: Tester le handoff natif sans lecteur ni flux distant
        run: python3 ci/cast_test/run_native_logic.py

  android-touch:
    name: APK téléphone et tablette (test isolé)
    needs: native-logic
    if: github.repository == 'manzilionellm-dotcom/tvking' && github.actor == github.repository_owner && github.triggering_actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout du commit exact
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Vérifier le packaging isolé sur une copie temporaire
        run: python3 -m unittest discover -s ci/cast_test -p 'test_*.py' -v

      - name: Setup Java 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: false
          pub-cache: false

      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Préparer le téléphone/tablette et ses ponts natifs
        run: python3 ci/cast_test/prepare_android.py

      - name: Dépendances et traductions
        run: |
          set -euo pipefail
          flutter pub get
          flutter gen-l10n

      - name: Vérifier les composants Noir Fantôme
        run: |
          flutter analyze --no-pub lib/features/tv/presentation/tv_hub_screen.dart \
            lib/features/tv/presentation/tv_components.dart \
            lib/features/tv/core/tv_tokens.dart lib/core/theme/app_text_styles.dart

      - name: Contrats Cast, moteur natif, téléchargements et mises à jour
        run: |
          flutter test --no-pub test/features/cast test/features/tv/desktop \
            test/features/tv/touch test/features/subscription \
            test/core/update packages/native_video_player/test \
            test/features/player/single_player_audio_test.dart \
            test/features/cinema/playback_download_pause_test.dart \
            test/features/cinema/download_repository_handoff_test.dart \
            --reporter expanded

      - name: Mesurer le push réel et la reprise réseau sur serveur local
        run: |
          flutter test --no-pub --concurrency=1 \
            --dart-define=RUN_PANEL_CONNECTION=true \
            --dart-define=BACKEND_URL=http://127.0.0.1:18789 \
            test/features/subscription/panel_connection_test.dart \
            test/features/subscription/panel_connection_websocket_test.dart \
            test/features/subscription/box_channel_session_live_test.dart \
            --reporter expanded

      - name: Construire un APK debug avec la seule clé jetable du runner
        run: |
          set -euo pipefail
          flutter build apk --debug --target=lib/main_zuno_mobile.dart \
            --build-name=0.1.${{ github.run_number }} \
            --build-number=${{ github.run_number }} \
            --dart-define=ZUNO_CAST_TEST=true \
            --dart-define=GIT_SHA=${{ github.sha }}
          mkdir -p build/cast-test
          cp build/app/outputs/flutter-apk/app-debug.apk build/cast-test/ZUNO-Mobile-Noir-Fantome-test.apk

      - name: Vérifier le vrai APK (identité, lanceur mobile, SDK et signature debug)
        run: |
          set -euo pipefail
          APK=build/cast-test/ZUNO-Mobile-Noir-Fantome-test.apk
          SDK_ANALYZER="$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"
          "$SDK_ANALYZER" manifest print "$APK" > build/cast-test/AndroidManifest.xml
          SDK_SIGNER=$(python3 - <<'PY'
          import os
          from pathlib import Path
          import re
          import sys

          build_tools = Path(os.environ['ANDROID_HOME']) / 'build-tools'
          # glob/is_file suivent les liens du SDK, des versions et du binaire.
          signers = [path for path in build_tools.glob('*/apksigner') if path.is_file()]
          if not signers:
              print(f'::error::apksigner absent des versions installées dans {build_tools}', file=sys.stderr)
              sys.exit(1)
          print(max(signers, key=lambda path: tuple(map(int, re.findall(r'\d+', path.parent.name)))))
          PY
          )
          echo "apksigner sélectionné : $SDK_SIGNER"
          "$SDK_SIGNER" verify --print-certs "$APK" 2>&1 | tee build/cast-test/signature.txt
          if ! grep -E '^(Signer #1 certificate DN:|V2 Signer: certificate DN:)([[:space:]]+|.*,[[:space:]]*)CN=Android Debug([[:space:]]*,|[[:space:]]*$)' build/cast-test/signature.txt; then
            echo '::error::Le certificat Android Debug attendu est absent du rapport de signature.'
            exit 1
          fi
          python3 ci/cast_test/verify_android.py "$APK" build/cast-test/AndroidManifest.xml build/cast-test/build-provenance.json

      - name: Conserver l’APK et sa preuve de compilation
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zuno-mobile-phantom-test-${{ github.sha }}
          path: android-app/build/cast-test/
          if-no-files-found: error
          retention-days: 14

      - name: Conserver un diagnostic Android NON VALIDÉ en cas d’échec
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zuno-mobile-phantom-DIAGNOSTIC-NON-VALIDE-${{ github.sha }}-${{ github.run_attempt }}
          path: android-app/build/cast-test/
          if-no-files-found: ignore
          retention-days: 1

