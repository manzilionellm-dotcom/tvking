# ============================================================================
#  build-seventv.yml — Compile « 7 MOTION TV » (Seven Motion TV) en APK
#  sideloadable. C'est la 2e app TV du projet (applicationId
#  com.sevenmotion.tv.seven_tv, historique juin 2026), SŒUR de DeFew TV :
#  MÊME code Flutter (lib/main_tv.dart), autre identité/canal.
#
#  POURQUOI ce workflow dédié : le job historique `build_tv_flutter`
#  (build-android.yml, commit 387474f) a été supprimé avec la release
#  `seventv-latest` — mais les box installées via /7tv ont TOUJOURS l'app,
#  figée sur un vieux build. On la ressuscite AVEC le blindage compat box
#  mis au point pour DeFew TV (voir build-tv.yml), plus 2 correctifs
#  propres à elle :
#   1) APK UNIVERSEL ARM (32+64 bits) — l'ancien job ne publiait QUE
#      l'arm64 → « Application non installée » sur les box/sticks 32 bits.
#   2) SIGNATURE STABLE (clé maîtresse, repli keystore fixe) — l'ancien
#      job signait avec le keystore debug ALÉATOIRE du runner → aucune
#      mise à jour ne pouvait s'installer par-dessus.
#  ⚠️ Conséquence de (2) : les installs de juin (clé aléatoire) devront
#  être réinstallées UNE fois (désinstaller → /7tv) ; ensuite les MAJ
#  s'appliquent par-dessus, pour toujours.
#
#  DÉCLENCHEMENT : manuel (workflow_dispatch). `publish=true` publie la
#  release `seventv-latest` (asset seven-tv.apk + version.json pour
#  l'updater in-app) ; par défaut on ne publie RIEN (artifact du run
#  seulement). Push : uniquement quand CE fichier change (validation).
# ============================================================================
name: Build 7 MOTION TV (Seven Motion TV)

on:
  push:
    branches: ['main', 'claude/**', 'feature/**']
    #  PUBLICATION AUTOMATIQUE — demande du proprietaire (10/09/2026) :
    #  « toujours, si on corrige quelque chose, ca se publie ».
    #
    #  CE QUI SE PASSAIT AVANT. Ce workflow ne partait QUE sur commande
    #  manuelle. Un correctif pouvait donc etre compile, teste, vert, et
    #  ne JAMAIS arriver sur les box — sans qu'aucune alerte ne le dise.
    #  Le proprietaire a appuye sur « Verifier les mises a jour » pendant
    #  trente minutes en attendant une version qui n'etait jamais partie.
    #  « Vert » et « livre » n'etaient pas la meme chose, et rien ne le
    #  signalait.
    #
    #  Desormais, tout changement du code de l'app publie. Le garde-fou
    #  n'est pas retire, il est deplace au bon endroit : un build qui ne
    #  COMPILE pas ne produit aucun APK, donc ne publie rien. C'est
    #  exactement ce qui a protege le parc hier, quand la compilation
    #  etait cassee.
    paths:
      - '.github/workflows/build-seventv.yml'
      - 'lib/**'
      - 'pubspec.yaml'
      - 'assets/**'
      - 'packages/**'
      - 'ci/**'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publier la release seventv-latest (lien /7tv + updater)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

permissions:
  contents: write

#  QUI PUBLIE ? Une seule reponse, lue par les trois etapes concernees.
#  Trois copies de la meme condition auraient fini par diverger — et le
#  jour ou l'une dit oui pendant que l'autre dit non, on publie un APK
#  sans le manifeste qui l'annonce (ou l'inverse).
#    - push        : un changement de code -> on publie.
#    - dispatch    : on publie si l'humain a coche « publish ».
env:
  PUBLIER: ${{ github.event_name == 'push' || github.event.inputs.publish == 'true' }}

#  UNE SEULE PUBLICATION À LA FOIS SUR CE CANAL (07/09/2026).
#
#  Ce workflow ÉCRIT sur une release partagée (seventv-latest) : l'APK,
#  puis le manifeste qui l'annonce. Deux exécutions simultanées écrivent
#  sur les mêmes fichiers, et rien ne garantit l'ordre — on peut se
#  retrouver avec le manifeste d'un build et l'APK d'un autre. Le
#  30/08, deux exécutions sont bien parties à cinq secondes d'écart.
#
#  `cancel-in-progress: false` est VOLONTAIRE, et c'est l'inverse du
#  réglage habituel : une exécution qui publie ne doit JAMAIS être
#  interrompue en cours de téléversement — on laisserait la release à
#  moitié écrite, donc un bouton de mise à jour qui pointe vers un
#  fichier absent. On fait la queue, on n'annule pas.
#
#  Le groupe ne dépend PAS de la branche : le canal publié est unique,
#  la file d'attente doit l'être aussi.
concurrency:
  group: publish-seventv-latest
  cancel-in-progress: false

jobs:
  build-seventv:
    name: Build 7 MOTION TV APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # =========================================================
      #  VERROU DE PUBLICATION — avant tout le reste
      # =========================================================
      #  Demande du proprietaire (30/08) : « il faut un code qui protege
      #  les liens des dernieres builds. C'est moi qui donne le code.
      #  N'importe qui ne peut pas changer ca — MEME SI C'EST MOI QUI AI
      #  DONNE LE PROMPT. »
      #
      #  Ce dernier morceau est le vrai sujet. Un assistant a qui l'on dit
      #  « change le lien » le changera. Cette etape fait qu'un tel
      #  changement NE PEUT PAS ETRE PUBLIE sans la phrase secrete.
      #
      #  Placee AVANT le build : inutile de compiler 12 minutes pour
      #  refuser de publier a la fin.
      #
      #  ⚠ Sur une publication (publish=true), la phrase est EXIGEE. Sans
      #  elle, on peut verifier que les valeurs n'ont pas bouge, mais pas
      #  prouver que le fichier de verrou lui-meme n'a pas ete reecrit —
      #  et c'est exactement le trou par lequel passerait quelqu'un qui
      #  modifie les deux. Rien ne part vers les clients sans cette
      #  preuve.
      - name: Verrou de distribution (liens, canal, signature)
        env:
          DIST_LOCK_PASSPHRASE: ${{ secrets.DIST_LOCK_PASSPHRASE }}
        run: |
          set -e
          chmod +x ci/distribution_lock.sh
          #  ⚠ CORRECTION DU 30/08, le jour meme de la mise en place.
          #
          #  La regle etait : « sur une publication, la phrase est
          #  EXIGEE ». Bonne intention, mauvais enchainement : le verrou
          #  est livre NON ARME (seal=UNSEALED) parce que je n'ai pas la
          #  phrase du proprietaire. Resultat, la toute premiere
          #  publication apres la mise en place a ECHOUE — et elle
          #  portait justement un correctif attendu. J'avais livre une
          #  serrure qui se ferme avant que le proprietaire ait la cle.
          #
          #  La regle correcte : la preuve n'est exigee QUE si le verrou
          #  a REELLEMENT ete arme. Tant qu'il est UNSEALED, la
          #  comparaison des valeurs protege deja (un lien modifie
          #  arrete la publication), et rien ne bloque le travail.
          #  Une fois arme, le comportement est celui voulu : aucune
          #  publication sans la preuve.
          if grep -q '^seal=UNSEALED' ci/distribution.lock; then
            echo "::warning title=Verrou non arme::Le verrou protege les VALEURS mais n'est pas encore scelle. Poser le secret DIST_LOCK_PASSPHRASE puis lancer « Sceller le verrou de distribution » pour l'armer completement."
          elif [ "${{ env.PUBLIER }}" = "true" ] \
               && [ -z "${DIST_LOCK_PASSPHRASE:-}" ]; then
            echo "::error title=Preuve manquante::Le verrou est arme mais DIST_LOCK_PASSPHRASE est absent de ce build. Sans lui, on ne peut pas prouver que les liens n'ont pas ete changes — rien ne part vers les clients."
            exit 1
          fi
          ci/distribution_lock.sh verify

      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # FLUTTER ÉPINGLÉ 3.32.x — même justification que build-tv.yml :
      # dernière stable qui supporte l'API 21 ET l'opt-out Impeller.
      # (3.35 a relevé le plancher à l'API 24 ; 3.44 a supprimé Skia.)
      # NE PAS remettre `channel: stable` seul sans revalider sur box.
      - name: Setup Flutter (épinglé compat box)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.x'
          channel: 'stable'
          cache: true

      - name: Setup Android SDK
        id: setup_android
        uses: android-actions/setup-android@v3
        continue-on-error: true

      - name: Setup Android SDK (retry après échec transitoire)
        if: steps.setup_android.outcome == 'failure'
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      # IDENTITÉ HISTORIQUE : mêmes --org/--project-name que le job de juin
      # → même applicationId (com.sevenmotion.tv.seven_tv) que l'app déjà
      # installée sur les box. NE PAS changer, sinon double icône.
      - name: Generate native Android folder (org Seven Motion TV)
        run: flutter create . --platforms=android --org com.sevenmotion.tv --project-name seven_tv

      - name: Brand manifest (7 MOTION TV)
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i 's|android:label="seven_tv"|android:label="7 MOTION TV"|g' "$MANIFEST" || true
          grep 'android:label' "$MANIFEST" || true

      - name: Patch manifest — réseau (cleartext HTTP + INTERNET)
        run: |
          set -e
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if ! grep -q 'android.permission.INTERNET' "$MANIFEST"; then
            sed -i '/<manifest /a\    <uses-permission android:name="android.permission.INTERNET"/>' "$MANIFEST"
          fi
          if ! grep -q 'usesCleartextTraffic' "$MANIFEST"; then
            sed -i 's|<application|<application\n        android:usesCleartextTraffic="true"|' "$MANIFEST"
          fi
          # Updater in-app (MAJ par-dessus, sideload sans store).
          if ! grep -q 'REQUEST_INSTALL_PACKAGES' "$MANIFEST"; then
            sed -i '/<manifest /a\    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES"/>' "$MANIFEST"
          fi
          # Notifications (alarmes sport) — parité avec le job historique.
          if ! grep -q 'POST_NOTIFICATIONS' "$MANIFEST"; then
            sed -i '/<manifest /a\    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>' "$MANIFEST"
          fi
          # ANTI-OOM box à faible RAM : tas mémoire agrandi.
          if ! grep -q 'android:largeHeap' "$MANIFEST"; then
            sed -i 's|<application|<application\n        android:largeHeap="true"|' "$MANIFEST"
          fi
          # PROPRETÉ STORES (autopsie refus Amazon n°2) : un plugin injecte
          # android.permission.DUMP (débogage système) à la fusion des
          # manifestes — inutile pour nous et il effraie les scanners
          # (« security concerns »). tools:node=remove l'élimine du binaire.
          if ! grep -q 'xmlns:tools' "$MANIFEST"; then
            sed -i 's|<manifest xmlns:android="http://schemas.android.com/apk/res/android"|<manifest xmlns:android="http://schemas.android.com/apk/res/android" xmlns:tools="http://schemas.android.com/tools"|' "$MANIFEST"
          fi
          if ! grep -q 'android.permission.DUMP' "$MANIFEST"; then
            sed -i '/<manifest /a\    <uses-permission android:name="android.permission.DUMP" tools:node="remove"/>' "$MANIFEST"
          fi
          grep -nE 'INTERNET|usesCleartextTraffic|REQUEST_INSTALL_PACKAGES|largeHeap|DUMP' "$MANIFEST" || true

      - name: Patch manifest — Android TV (leanback)
        run: |
          set -e
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if ! grep -q 'android.software.leanback' "$MANIFEST"; then
            sed -i '/<manifest /a\    <uses-feature android:name="android.software.leanback" android:required="false"/>\n    <uses-feature android:name="android.hardware.touchscreen" android:required="false"/>' "$MANIFEST"
          fi
          if ! grep -q 'LEANBACK_LAUNCHER' "$MANIFEST"; then
            sed -i 's#<category android:name="android.intent.category.LAUNCHER"/>#<category android:name="android.intent.category.LAUNCHER"/>\n                <category android:name="android.intent.category.LEANBACK_LAUNCHER"/>#' "$MANIFEST"
          fi
          grep -nE 'leanback|LEANBACK_LAUNCHER|touchscreen' "$MANIFEST" || true

      # RENDU COMPATIBLE BOX — Impeller OFF (→ Skia) + paysage verrouillé
      # + features non requises. Même blindage que build-tv.yml (c'est LE
      # correctif écran noir GPU / écran blanc des box anciennes).
      # + PiP/resizeable : parité avec le job historique de cette app.
      - name: Compatibilité rendu box (Impeller OFF + paysage + PiP)
        run: |
          set -e
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if ! grep -q 'EnableImpeller' "$MANIFEST"; then
            sed -i 's|</application>|    <meta-data\n            android:name="io.flutter.embedding.android.EnableImpeller"\n            android:value="false" />\n    </application>|' "$MANIFEST"
            echo "✓ Impeller OFF (rendu Skia) — anti écran noir GPU box"
          fi
          if ! grep -q 'android:screenOrientation' "$MANIFEST"; then
            sed -i 's|android:name=".MainActivity"|android:name=".MainActivity"\n            android:screenOrientation="landscape"\n            android:supportsPictureInPicture="true"\n            android:resizeableActivity="true"|' "$MANIFEST"
            echo "✓ paysage verrouillé + PiP au niveau activité"
          fi
          for FEAT in android.hardware.microphone android.hardware.camera android.hardware.screen.portrait android.hardware.faketouch; do
            if ! grep -q "$FEAT" "$MANIFEST"; then
              sed -i "/<manifest /a\\    <uses-feature android:name=\"$FEAT\" android:required=\"false\"/>" "$MANIFEST"
            fi
          done
          grep -nE 'EnableImpeller|screenOrientation|uses-feature' "$MANIFEST" || true

      # APK plus léger : la TV lit EXCLUSIVEMENT via ExoPlayer — media_kit
      # (libmpv) retiré POUR CE BUILD (checkout CI, non commité).
      - name: Alléger l'APK TV (retirer media_kit, inutile sur TV)
        run: |
          set -e
          python3 - <<'PYEOF'
          import re
          f = "pubspec.yaml"
          lines = open(f).read().splitlines(keepends=True)
          out = []
          for line in lines:
              if re.match(r'\s*(media_kit|media_kit_video|media_kit_libs_android_video|media_kit_libs_windows_video|ffmpeg_kit_flutter_new_min)\s*:', line):
                  print("retiré:", line.strip())
                  continue
              out.append(line)
          open(f, "w").write("".join(out))
          PYEOF

      - name: Exclure les fichiers non-TV de l'analyse (media_kit retiré)
        run: |
          set -e
          python3 - <<'PYEOF'
          import subprocess
          out = subprocess.run(
              ["grep", "-rl", "package:media_kit", "lib/", "--include=*.dart"],
              capture_output=True, text=True,
          ).stdout
          out_ff = subprocess.run(
              ["grep", "-rl", "package:ffmpeg_kit", "lib/", "--include=*.dart"],
              capture_output=True, text=True,
          ).stdout
          media_kit_files = sorted(set(out.split()) | set(out_ff.split()))
          print("fichiers exclus :", media_kit_files)
          f = "analysis_options.yaml"
          s = open(f).read()
          marker = "    - lib/features/tv/presentation/player/tizen_player_screen.dart\n"
          if marker not in s:
              raise SystemExit("marker introuvable dans analysis_options.yaml")
          extra = "".join(f"    - {p}\n" for p in media_kit_files if f"- {p}\n" not in s)
          if extra:
              s = s.replace(marker, marker + extra, 1)
              open(f, "w").write(s)
          PYEOF

      # PLUGINS ALIGNÉS SUR LE TOOLCHAIN ÉPINGLÉ — même correctif que
      # build-tv.yml : screen_brightness_android 2.1.4 est en Kotlin 2.3,
      # incompatible avec le KGP 2.1 de Flutter 3.32.
      - name: Aligner les plugins sur Flutter 3.32 (Kotlin 2.1)
        run: |
          set -e
          sed -i -E 's/^([[:space:]]*screen_brightness_android:).*/\1 2.1.1/' pubspec.yaml
          grep -n "screen_brightness_android" pubspec.yaml

      # EXCLURE FIREBASE DU BUILD TV. POURQUOI : Amazon a REFUSÉ l'app le
      # 14/08/2026 (« content policy violation : ad network libraries …
      # collect personally identifiable information ») — l'autopsie de l'APK
      # montre que le coupable est Firebase Crashlytics (+ measurement
      # connector + installations), qui collecte des identifiants d'appareil.
      # La TV n'en a AUCUN besoin : Boîte noire maison + télémétrie native du
      # lecteur (getStats) couvrent le diagnostic, SANS identifiants Google.
      # Même recette que build-windows.yml : checkout CI uniquement (non
      # commité → le téléphone garde Firebase intact).
      - name: Exclure Firebase (motif du refus Amazon — inutile sur TV)
        run: |
          set -e
          python3 - <<'PYEOF'
          import re
          f = "pubspec.yaml"
          out = []
          for line in open(f, encoding="utf-8").read().splitlines(keepends=True):
              if re.match(r'\s*(firebase_core|firebase_crashlytics)\s*:', line):
                  print("retiré:", line.strip())
                  continue
              out.append(line)
          open(f, "w", encoding="utf-8").write("".join(out))
          PYEOF
          cat > lib/core/crash/crash_reporting_firebase.dart <<'DARTEOF'
          // STUB CI TV — Firebase est exclu du build TV (cf. build-seventv.yml :
          // motif du refus Amazon du 14/08/2026). Même signature que la version
          // Android téléphone : ne fait RIEN (fail-open).
          Future<bool> attachCrashlytics() async => false;
          DARTEOF
          echo "✓ Firebase retiré du build TV (pubspec + stub)."

      - name: Flutter pub get
        run: flutter pub get

      - name: Patch screen_brightness_android build.gradle
        run: |
          set -e
          FILE=$(find ~/.pub-cache/hosted/pub.dev -path "*/screen_brightness_android-*/android/build.gradle" 2>/dev/null | head -1)
          if [ -z "$FILE" ]; then
            echo "⊙ screen_brightness_android pas dans pub-cache, skip"
            exit 0
          fi
          export PATCH_FILE="$FILE"
          python3 << 'PYEOF'
          import os, re
          file = os.environ['PATCH_FILE']
          with open(file) as f:
              lines = f.readlines()
          kotlin_block_re = re.compile(r'^\s*kotlin\s*\{')
          out = []
          in_kotlin = False
          depth = 0
          removed = 0
          for line in lines:
              if not in_kotlin:
                  if kotlin_block_re.match(line):
                      in_kotlin = True
                      depth = line.count('{') - line.count('}')
                      removed += 1
                      if depth <= 0:
                          in_kotlin = False
                      continue
                  out.append(line)
              else:
                  depth += line.count('{') - line.count('}')
                  removed += 1
                  if depth <= 0:
                      in_kotlin = False
          if removed > 0:
              with open(file, 'w') as f:
                  f.writelines(out)
              print(f'retire {removed} ligne(s) kotlin{{}}')
          else:
              print('aucun bloc kotlin{} (deja fixe)')
          PYEOF

      - name: Patch build.gradle.kts for notifications (desugaring)
        run: |
          set -e
          python3 << 'PYEOF'
          f = "android/app/build.gradle.kts"
          s = open(f).read()
          if 'isCoreLibraryDesugaringEnabled' not in s:
              s = s.replace(
                  'compileOptions {',
                  'compileOptions {\n        isCoreLibraryDesugaringEnabled = true',
                  1)
              print('desugaring active')
          if 'desugar_jdk_libs' not in s:
              s = s.rstrip() + ('\n\ndependencies {\n'
                  '    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n'
                  '}\n')
              print('dep desugar ajoutee')
          if 'pickFirsts.add' not in s:
              s = s.replace(
                  'android {',
                  'android {\n    packaging { jniLibs { pickFirsts.add("**/libc++_shared.so") } }',
                  1)
              print('packaging pickFirst ajoute')
          open(f, 'w').write(s)
          PYEOF

      - name: Generate AppLocalizations from .arb files
        run: flutter gen-l10n || true

      - name: Generate launcher icons (logo 7 MOTION)
        run: dart run flutter_launcher_icons -f flutter_launcher_icons_tv.yaml || true

      - name: Bannière Android TV (logo 7 MOTION)
        run: |
          set -e
          RES=android/app/src/main/res
          mkdir -p "$RES/drawable" "$RES/drawable-xhdpi" "$RES/drawable-xxhdpi"
          cp assets/branding/thefew_tv_banner.png    "$RES/drawable/tv_banner.png"
          cp assets/branding/thefew_tv_banner.png    "$RES/drawable-xhdpi/tv_banner.png"
          cp assets/branding/thefew_tv_banner_2x.png "$RES/drawable-xxhdpi/tv_banner.png"
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if ! grep -q 'android:banner' "$MANIFEST"; then
            sed -i 's|<application|<application\n        android:banner="@drawable/tv_banner"|' "$MANIFEST"
          fi
          grep -n 'android:banner' "$MANIFEST" || true

      # ÉCRAN DE LANCEMENT SOMBRE — fin de « l'écran blanc au démarrage »
      # du template flutter create (même correctif que build-tv.yml).
      - name: Écran de lancement sombre (anti écran blanc)
        run: |
          set -e
          RES=android/app/src/main/res
          for DIR in drawable drawable-v21; do
            mkdir -p "$RES/$DIR"
            cat > "$RES/$DIR/launch_background.xml" <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item>
                  <shape android:shape="rectangle">
                      <solid android:color="#FF101010" />
                  </shape>
              </item>
              <item>
                  <bitmap
                      android:gravity="center"
                      android:src="@drawable/tv_banner" />
              </item>
          </layer-list>
          XML
          done
          for DIR in values values-night; do
            mkdir -p "$RES/$DIR"
            cat > "$RES/$DIR/styles.xml" <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="LaunchTheme" parent="@android:style/Theme.Black.NoTitleBar">
                  <item name="android:windowBackground">@drawable/launch_background</item>
              </style>
              <style name="NormalTheme" parent="@android:style/Theme.Black.NoTitleBar">
                  <item name="android:windowBackground">@drawable/launch_background</item>
              </style>
          </resources>
          XML
          done
          echo "✓ splash + fond d'app sombres (4 fichiers res écrasés)"

      # SIGNATURE STABLE — fini le keystore debug ALÉATOIRE du job de juin.
      # Repli : keystore fixe du repo ; idéal : clé maîtresse (secrets).
      - name: Signature stable (keystore fixe)
        run: |
          set -e
          mkdir -p ~/.android
          cp ci/defew-debug.keystore ~/.android/debug.keystore
          echo "Keystore fixe en place (~/.android/debug.keystore)."

      - name: Configure release signing (clé maîtresse, si secret présent)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -e
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > android/app/release.jks
            echo "✓ keystore depuis ANDROID_KEYSTORE_BASE64"
          elif [ -n "$KS_PW" ] && [ -f ci/release.jks.enc ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 \
              -in ci/release.jks.enc -out android/app/release.jks \
              -pass pass:"$KS_PW"
            echo "✓ keystore déchiffré depuis ci/release.jks.enc (clé maîtresse)"
          else
            echo "::warning title=Signature debug (7 MOTION TV)::Aucun keystore release → APK signé en DEBUG fixe (sideload OK)."
            exit 0
          fi
          cat > android/key.properties <<EOF
          storeFile=release.jks
          storePassword=$KS_PW
          keyAlias=sevenmotion
          keyPassword=$KS_PW
          EOF
          echo "✓ release.jks + key.properties écrits."

      - name: Enable R8 + ProGuard (shrink code & resources)
        run: |
          set -e
          cp ci/proguard-rules.pro android/app/proguard-rules.pro
          python3 << 'PYEOF'
          f = "android/app/build.gradle.kts"
          s = open(f).read()
          if "isMinifyEnabled" not in s:
              s = s.replace(
                  "release {",
                  ('release {\n'
                   '            isMinifyEnabled = true\n'
                   '            isShrinkResources = true\n'
                   '            proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")'),
                  1)
              open(f, "w").write(s)
              print("R8/shrink actives")
          else:
              print("deja actif")
          PYEOF

      # COMPATIBILITÉ MAXIMALE BOX : minSdk 21, signatures v1/v2/v3,
      # targetSdk 35 explicite. L'applicationId n'est PAS modifié (identité
      # historique com.sevenmotion.tv.seven_tv conservée).
      - name: Compatibilité box (minSdk 21 + signatures v1/v2/v3)
        run: |
          set -e
          python3 << 'PYEOF'
          import re
          f = "android/app/build.gradle.kts"
          s = open(f).read()
          if re.search(r'minSdk\s*=\s*flutter\.minSdkVersion', s):
              s = re.sub(r'minSdk\s*=\s*flutter\.minSdkVersion', 'minSdk = 21', s)
              print('minSdk -> 21')
          elif re.search(r'minSdk\s*=\s*\d+', s):
              s = re.sub(r'minSdk\s*=\s*\d+', 'minSdk = 21', s, count=1)
              print('minSdk -> 21 (litteral)')
          if re.search(r'targetSdk\s*=\s*flutter\.targetSdkVersion', s):
              s = re.sub(r'targetSdk\s*=\s*flutter\.targetSdkVersion', 'targetSdk = 35', s)
              print('targetSdk -> 35')
          if 'signingConfigs.getByName("release")' not in s:
              if 'import java.util.Properties' not in s:
                  s = 'import java.util.Properties\nimport java.io.FileInputStream\n\n' + s
              loader = (
                  'val keystoreProperties = Properties()\n'
                  'val keystorePropertiesFile = rootProject.file("key.properties")\n'
                  'if (keystorePropertiesFile.exists()) {\n'
                  '    keystoreProperties.load(FileInputStream(keystorePropertiesFile))\n'
                  '}\n\n'
              )
              s = s.replace('android {', loader + 'android {', 1)
              signing = (
                  'android {\n'
                  '    signingConfigs {\n'
                  '        getByName("debug") {\n'
                  '            enableV1Signing = true\n'
                  '            enableV2Signing = true\n'
                  '            enableV3Signing = true\n'
                  '        }\n'
                  '        create("release") {\n'
                  '            val sf = keystoreProperties.getProperty("storeFile")\n'
                  '            if (sf != null) {\n'
                  '                storeFile = file(sf)\n'
                  '                storePassword = keystoreProperties.getProperty("storePassword")\n'
                  '                keyAlias = keystoreProperties.getProperty("keyAlias")\n'
                  '                keyPassword = keystoreProperties.getProperty("keyPassword")\n'
                  '            }\n'
                  '            enableV1Signing = true\n'
                  '            enableV2Signing = true\n'
                  '            enableV3Signing = true\n'
                  '        }\n'
                  '    }'
              )
              s = s.replace('android {', signing, 1)
              old = 'signingConfig = signingConfigs.getByName("debug")'
              new = ('signingConfig = if (keystorePropertiesFile.exists()) '
                     'signingConfigs.getByName("release") else '
                     'signingConfigs.getByName("debug")')
              if old in s:
                  s = s.replace(old, new, 1)
              print('signingConfigs debug+release injectes (v1/v2/v3)')
          open(f, 'w').write(s)
          PYEOF
          grep -nE "minSdk|targetSdk|enableV1Signing" android/app/build.gradle.kts || true

      # BARRIÈRE QUALITÉ — mêmes gates que build-tv.yml (même code).
      - name: Quality gate (analyze + tests)
        run: |
          rm -f test/widget_test.dart
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test --reporter expanded

      # APK UNIVERSEL ARM (32+64 bits) — LE correctif « Application non
      # installée » des box/sticks 32 bits que l'arm64-only de juin excluait.
      # versionCode = epoch secondes (strictement croissant, MAJ par-dessus).
      - name: Build 7 MOTION TV (release universel, target main_tv)
        run: |
          set -e
          BUILD_NUMBER=$(date +%s)
          echo "versionCode = $BUILD_NUMBER"
          echo "SEVENTV_BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"

          #  LE NUMÉRO LISIBLE (« 19881 »), celui qu'on dicte au client.
          #  Calcul PARTAGÉ par toutes les apps : ci/build_label.sh. Ne
          #  recopie pas la formule ici — voir l'en-tête du script.
          BUILD_LABEL=$(ci/build_label.sh "${{ github.repository }}" seventv-latest)
          echo "numero lisible = $BUILD_LABEL"
          echo "SEVENTV_BUILD_LABEL=$BUILD_LABEL" >> "$GITHUB_ENV"
          flutter build apk --release --no-tree-shake-icons \
            --target-platform android-arm,android-arm64 \
            --build-number="$BUILD_NUMBER" \
            --obfuscate --split-debug-info=build/symbols \
            --dart-define=GIT_SHA=${{ github.sha }} \
            --dart-define=TV_UPDATE_TAG=seventv-latest \
            --dart-define=APP_BUILD_LABEL="$BUILD_LABEL" \
            --target=lib/main_tv.dart
          cp build/app/outputs/flutter-apk/app-release.apk \
             build/app/outputs/flutter-apk/seven-tv.apk
          ls -lah build/app/outputs/flutter-apk/

      - name: Upload APK artifact (7 MOTION TV)
        uses: actions/upload-artifact@v4
        with:
          name: seven-tv-apk-${{ github.sha }}
          path: build/app/outputs/flutter-apk/seven-tv.apk
          retention-days: 30
          if-no-files-found: error

      # AAB GOOGLE PLAY TV (Android TV / Google TV) — distribution STORE de
      # la même app. Deux différences OBLIGATOIRES vs l'APK sideload :
      #  1) permission REQUEST_INSTALL_PACKAGES RETIRÉE (interdite sur Play —
      #     elle ne sert qu'à l'updater sideload) ;
      #  2) --dart-define=PLAY_BUILD=true → kIsPlayBuild : l'updater in-app
      #     est neutralisé (« les MAJ viennent du Store »).
      # Même identité (com.sevenmotion.tv.seven_tv), même versionCode epoch.
      - name: Build AAB Google Play TV (sans updater sideload)
        run: |
          set -e
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i '/REQUEST_INSTALL_PACKAGES/d' "$MANIFEST"
          grep -c 'REQUEST_INSTALL_PACKAGES' "$MANIFEST" && exit 1 || echo "✓ permission retirée"
          #  USE_EXACT_ALARM — MÊME CORRECTIF QUE LE TÉLÉPHONE (07/09/2026).
          #
          #  Constaté le soir même sur la fiche Play du téléphone : Google
          #  refuse d'enregistrer la release tant qu'on n'a pas rempli la
          #  déclaration « alarmes exactes ». Cette permission est RÉSERVÉE
          #  aux réveils et aux agendas ; 7 MOTION TV est un lecteur IPTV.
          #
          #  Vérifié ensuite DANS l'AAB TV publié : la permission y était
          #  aussi. Sans cette ligne, on se serait cogné au même mur le jour
          #  de la publication TV — dans trois jours, avec la fenêtre des
          #  14 jours de test qui se referme.
          #
          #  On garde SCHEDULE_EXACT_ALARM (celle que l'utilisateur accorde
          #  lui-même, chemin de demande déjà présent côté natif) : le
          #  magnétoscope continue de fonctionner sur la version Store.
          #  L'APK sideload, empaqueté plus haut, n'est pas touché.
          grep -q 'xmlns:tools' "$MANIFEST" || sed -i 's|<manifest |<manifest xmlns:tools="http://schemas.android.com/tools" |' "$MANIFEST"
          sed -i '/<manifest /a\    <uses-permission android:name="android.permission.USE_EXACT_ALARM" tools:node="remove"/>\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" tools:node="replace"/>' "$MANIFEST"
          echo "✓ USE_EXACT_ALARM retirée / SCHEDULE_EXACT_ALARM conservée (AAB Play TV)"
          # EXIGENCE PLAY (e-mail 15/08, échéance 31/08/2026 « cible une
          # ancienne version d'Android ») : API 36 pour le canal STORE
          # SEULEMENT — le sideload client reste targetSdk 35 (comportements
          # validés sur box réelle), l'étape Amazon plus bas re-descend à 35.
          # =========================================================
          #  TV UNIQUEMENT — ajouté le 11/09/2026
          # =========================================================
          #  CONSTATÉ SUR LA FICHE PLAY du build en test : 24 229 appareils
          #  compatibles, tailles d'écran de « small » à « xlarge », et le
          #  canal résumé en « Téléphones, Tablettes, Android TV, Chrome OS,
          #  Android XR ». Autrement dit : Play PROPOSE l'app TV aux
          #  téléphones.
          #
          #  LA CAUSE EST ICI, pas dans un réglage de la console. Plus haut,
          #  l'étape « Patch manifest » déclare leanback en `required="false"`
          #  — c'est VOLONTAIRE pour l'APK sideload, car certaines box bon
          #  marché ne déclarent pas la fonctionnalité leanback et on ne veut
          #  filtrer personne. Mais sur le STORE, ce même « false » dit à Play
          #  « je sais aussi vivre sans télécommande », et il la propose donc
          #  à des écrans tactiles. Un client sur téléphone atterrirait sur
          #  une interface pilotée à la flèche, alors qu'il existe une app
          #  téléphone séparée.
          #
          #  On bascule donc à `true` POUR LA SEULE VERSION STORE, et on
          #  REMET `false` juste après la compilation — l'APK Amazon
          #  fabriqué ensuite hérite du manifeste et doit garder exactement
          #  le comportement d'aujourd'hui. Même logique que la permission
          #  USE_EXACT_ALARM ci-dessus : on ne touche au manifeste que pour
          #  le canal qui l'exige, jamais pour les autres.
          #
          #  `touchscreen required="false"` est déjà posé plus haut : les
          #  deux ensemble forment la déclaration « app de télévision » que
          #  Google attend. Aucune perte de portée sur les vraies TV : tout
          #  appareil Android TV / Google TV certifié déclare leanback.
          sed -i 's#<uses-feature android:name="android.software.leanback" android:required="false"/>#<uses-feature android:name="android.software.leanback" android:required="true"/>#' "$MANIFEST"
          grep -q 'android.software.leanback" android:required="true"' "$MANIFEST" \
            || { echo "❌ leanback n'a PAS ete bascule en required=true — l'AAB serait encore propose aux telephones"; exit 1; }
          echo "✓ leanback required=true (version Store seulement)"

          GRADLE=android/app/build.gradle.kts
          sed -i 's/targetSdk = 35/targetSdk = 36/' "$GRADLE"
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' "$GRADLE"
          echo "android.suppressUnsupportedCompileSdk=36" >> android/gradle.properties
          grep -nE 'compileSdk|targetSdk' "$GRADLE" | head -4
          flutter build appbundle --release --no-tree-shake-icons \
            --target-platform android-arm,android-arm64 \
            --build-number="$SEVENTV_BUILD_NUMBER" \
            --obfuscate --split-debug-info=build/symbols-aab \
            --dart-define=GIT_SHA=${{ github.sha }} \
            --dart-define=PLAY_BUILD=true \
            --dart-define=APP_BUILD_LABEL="$SEVENTV_BUILD_LABEL" \
            --target=lib/main_tv.dart
          cp build/app/outputs/bundle/release/app-release.aab seven-tv-play.aab
          ls -lah seven-tv-play.aab
          #  ON REND LE MANIFESTE À L'ÉTAT D'AVANT. L'APK Amazon se compile
          #  juste en dessous à partir du même fichier : sans cette ligne, il
          #  hériterait du `required="true"` et son comportement changerait
          #  sans qu'on l'ait demandé. La règle de la maison : une
          #  modification faite pour un canal se défait avant le suivant.
          sed -i 's#<uses-feature android:name="android.software.leanback" android:required="true"/>#<uses-feature android:name="android.software.leanback" android:required="false"/>#' "$MANIFEST"
          echo "✓ leanback remis a required=false pour la suite (Amazon)"
          #  GARDE-FOU DANS LES DEUX SENS, sur le manifeste FUSIONNÉ — le
          #  seul qui dise la vérité (les permissions viennent des plugins).
          #  Le contrôle a été ajouté après avoir découvert, en ouvrant le
          #  fichier publié, que la permission interdite y était toujours.
          MERGED=$(find android/app/build build/app -path '*merged_manifest*release*AndroidManifest.xml' 2>/dev/null | head -1)
          if [ -n "$MERGED" ]; then
            if grep -q 'android.permission.USE_EXACT_ALARM' "$MERGED"; then
              echo "❌ USE_EXACT_ALARM encore dans l'AAB TV : Play bloquera la release"; exit 1
            fi
            if ! grep -q 'android.permission.SCHEDULE_EXACT_ALARM' "$MERGED"; then
              echo "❌ SCHEDULE_EXACT_ALARM absente : le magnetoscope ne pourrait plus poser d'alarme"; exit 1
            fi
            #  TV UNIQUEMENT — on le vérifie sur le manifeste FUSIONNÉ, le
            #  seul qui dise la vérité. Un plugin peut très bien redéclarer
            #  `leanback` de son côté et écraser notre bascule sans un mot.
            #  C'est exactement ce qui s'était produit pour USE_EXACT_ALARM.
            #
            #  ON APLATIT LE FICHIER AVANT DE CHERCHER. Le run 84 est tombé
            #  ici sur un AAB pourtant CORRECT — le journal le prouve :
            #  « ✓ leanback required=true » puis « ✓ Built app-release.aab »
            #  puis ce contrôle en échec. La raison est bête et instructive :
            #  le manifeste fusionné écrit UN ATTRIBUT PAR LIGNE,
            #        <uses-feature
            #            android:name="android.software.leanback"
            #            android:required="true" />
            #  et `grep` travaille ligne par ligne. Chercher le nom ET le
            #  `required` dans une seule expression ne pouvait JAMAIS
            #  aboutir. Les deux contrôles voisins passent, eux, parce
            #  qu'ils cherchent un SEUL mot, qui tient sur une ligne.
            #
            #  `tr` recolle le fichier en une ligne : on retrouve alors
            #  l'élément entier, quelle que soit sa mise en forme et quel
            #  que soit l'ordre des attributs. Pas de heredoc ici — le
            #  marqueur de fin devrait être en colonne zéro et on est
            #  indenté (piège rencontré hier sur la chaîne Windows).
            LB=$(tr '\n' ' ' < "$MERGED" | tr -s ' ' | grep -o '<uses-feature[^>]*android.software.leanback[^>]*>' || true)
            echo "leanback lu dans le manifeste fusionne : ${LB:-<absent>}"
            case "$LB" in
              *'android:required="true"'*)
                echo "✓ leanback obligatoire" ;;
              '')
                echo "❌ leanback ABSENT du manifeste fusionne"; exit 1 ;;
              *)
                echo "❌ leanback present mais PAS required=true : Play proposerait l'app TV aux telephones"; exit 1 ;;
            esac
            echo "✓ Manifeste AAB TV : sans USE_EXACT_ALARM, avec SCHEDULE_EXACT_ALARM, leanback obligatoire"
          else
            echo "⚠️ Manifeste fusionné introuvable — vérif sautée (non bloquant)"
          fi

      - name: Upload AAB artifact (Google Play TV)
        uses: actions/upload-artifact@v4
        with:
          name: seven-tv-play-aab-${{ github.sha }}
          path: seven-tv-play.aab
          retention-days: 30
          if-no-files-found: error

      # APK AMAZON APPSTORE — même app, CONFORMITÉ Amazon (refus n°2) :
      #  1) REQUEST_INSTALL_PACKAGES déjà retirée du manifeste (étape AAB) —
      #     Amazon interdit l'auto-mise à jour hors magasin ;
      #  2) --dart-define=PLAY_BUILD=true → updater in-app neutralisé
      #     (les MAJ viennent d'Amazon) ;
      #  3) déjà SANS Firebase (étape « Exclure Firebase ») ni DUMP.
      # Même identité, même versionCode epoch (croissant pour les replace).
      - name: Build APK Amazon Appstore (sans updater sideload)
        run: |
          set -e
          grep -q 'REQUEST_INSTALL_PACKAGES' android/app/src/main/AndroidManifest.xml \
            && { echo "⛔ permission encore là"; exit 1; } || echo "✓ sans REQUEST_INSTALL_PACKAGES"
          # Amazon/Fire TV : on REVIENT à targetSdk 35 (profil testé box —
          # l'API 36 n'est exigée que par Google Play). compileSdk 36 reste
          # (sans effet à l'exécution).
          sed -i 's/targetSdk = 36/targetSdk = 35/' android/app/build.gradle.kts
          grep -nE 'targetSdk' android/app/build.gradle.kts | head -2
          flutter build apk --release --no-tree-shake-icons \
            --target-platform android-arm,android-arm64 \
            --build-number="$SEVENTV_BUILD_NUMBER" \
            --obfuscate --split-debug-info=build/symbols-amazon \
            --dart-define=GIT_SHA=${{ github.sha }} \
            --dart-define=PLAY_BUILD=true \
            --target=lib/main_tv.dart
          cp build/app/outputs/flutter-apk/app-release.apk seven-tv-amazon.apk
          ls -lah seven-tv-amazon.apk

      - name: Upload APK artifact (Amazon Appstore)
        uses: actions/upload-artifact@v4
        with:
          name: seven-tv-amazon-apk-${{ github.sha }}
          path: seven-tv-amazon.apk
          retention-days: 30
          if-no-files-found: error

      # PUBLICATION (OPT-IN uniquement, dispatch avec publish=true) :
      # release `seventv-latest` + version.json → lien /7tv du Worker et
      # updater in-app des builds NEUFS. Garde anti-retour-arrière incluse.
      - name: Publish "seventv-latest" release (si demandé)
        if: env.PUBLIER == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -ex
          REPO="${{ github.repository }}"
          TAG="seventv-latest"
          NEW_VC=${SEVENTV_BUILD_NUMBER:-0}
          PREV_VC=$(curl -fsSL "https://github.com/$REPO/releases/download/$TAG/version.json" 2>/dev/null \
            | tr -d ' \n' | grep -oE '"versionCode":[0-9]+' | grep -oE '[0-9]+' || true)
          PREV_VC=${PREV_VC:-0}
          if [ "${NEW_VC:-0}" -le "$PREV_VC" ]; then
            echo "⛔ versionCode $NEW_VC <= $PREV_VC → pas de republication (anti-downgrade)."
            exit 0
          fi
          APK="build/app/outputs/flutter-apk/seven-tv.apk"
          # L'API d'assets GitHub renvoie parfois un 502 en pleine mise en
          # ligne (16/08 : build entier perdu pour ça, alors que les trois
          # binaires étaient bons). On réessaie au lieu d'échouer : 5 essais,
          # attente croissante. `set -e` est neutralisé le temps des essais.
          up() {
            local i
            for i in 1 2 3 4 5; do
              if gh release upload "$TAG" --repo "$REPO" --clobber "$@"; then return 0; fi
              echo "⚠️ upload échoué (essai $i/5) → nouvelle tentative dans $((i*10))s"
              sleep $((i*10))
            done
            echo "⛔ upload impossible après 5 essais : $*"
            return 1
          }
          NOTES="7 MOTION TV (Seven Motion TV) — build compatible TOUTES box.

          APK universel ARM 32+64 bits, moteur Skia (Impeller OFF), minSdk 21,
          splash sombre. Downloader → https://github.com/$REPO/releases/download/$TAG/seven-tv.apk

          ⚠️ Les installs de juin 2026 (signature aléatoire) doivent être
          réinstallées UNE fois ; ensuite les MAJ s'appliquent par-dessus.

          Commit : ${{ github.sha }} · Branche : ${{ github.ref_name }}"
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$REPO" --title "7 MOTION TV — dernier build" --notes "$NOTES" --prerelease
            up "$APK" seven-tv-amazon.apk
          else
            gh release create "$TAG" --repo "$REPO" \
              --title "7 MOTION TV — dernier build" \
              --notes "$NOTES" --prerelease "$APK" seven-tv-amazon.apk
          fi
          VN=$(grep -m1 '^version:' pubspec.yaml | sed -E 's/version:[[:space:]]*//; s/\+.*//')
          [ -z "$VN" ] && VN="0.3.3"
          # `buildLabel` (07/09) : le numéro COURT, celui qu'on dicte au
          # téléphone. `versionCode` reste l'horodatage, qui ne sert qu'à
          # Android et que personne ne lit. Champ ADDITIONNEL : les apps
          # déjà installées, qui ne le connaissent pas, l'ignorent sans
          # broncher — aucune rupture de compatibilité.
          cat > version.json <<JSON
          {
            "versionCode": ${SEVENTV_BUILD_NUMBER:-0},
            "versionName": "$VN",
            "buildLabel": "${SEVENTV_BUILD_LABEL:-}",
            "url": "https://github.com/$REPO/releases/download/$TAG/seven-tv.apk",
            "mandatory": false
          }
          JSON
          up version.json
          # AAB Google Play TV : lien public propre pour l'upload Play Console
          # (invisible pour l'updater in-app, qui ne lit que version.json).
          up seven-tv-play.aab
          gh release view "$TAG" --repo "$REPO"

      # =========================================================
      #  GARDE-FOU — LE BOUTON « METTRE À JOUR » DOIT MARCHER
      # =========================================================
      #  POURQUOI (30/08). Le bouton de mise à jour est ce qui permet de
      #  corriger un bug chez TOUS les clients sans que personne ne
      #  retouche à quoi que ce soit. C'est l'organe le plus précieux du
      #  projet, et il repose sur une chaîne de trois maillons :
      #
      #     1. l'APK est compilé avec TV_UPDATE_TAG=<canal>
      #     2. version.json est publié SUR ce canal
      #     3. l'APK annoncé par version.json est téléchargeable
      #
      #  Si un seul maillon lâche, le bouton ne dit RIEN. Pas d'erreur,
      #  pas de message : juste « vous êtes à jour », pour toujours. Le
      #  client ne se plaint pas — il reste simplement sur une vieille
      #  version, et on ne l'apprend jamais.
      #
      #  Constaté le jour même : le canal de repli du code, `tv-prod`,
      #  répondait 404. Personne ne s'en était aperçu parce qu'il ne
      #  servait qu'en secours.
      #
      #  Cette étape vérifie la chaîne ENTIÈRE, depuis l'extérieur,
      #  exactement comme le ferait une box. Elle échoue bruyamment.
      - name: Vérifier que le bouton de mise à jour fonctionne
        if: ${{ env.PUBLIER == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="seventv-latest"
          BASE="https://github.com/${{ github.repository }}/releases/download/$TAG"

          #  ⚠ CORRIGÉ LE 07/09/2026 — LA VÉRIFICATION SE TROMPAIT DE PANNE.
          #
          #  CE QUI S'EST PASSÉ le 30/08 : la publication a RÉUSSI, et cette
          #  étape l'a quand même déclarée cassée —
          #      « le manifeste annonce 1788122176 au lieu du build 1788127315 »
          #  — puis a fait échouer tout le job. Résultat : personne n'a
          #  republié pendant une semaine, et les box sont restées sur une
          #  vieille version alors que le fichier en ligne était le bon.
          #
          #  LA CAUSE : l'ancienne boucle ne retentait que sur un code HTTP
          #  ≠ 200. Or le CDN de GitHub sert encore l'ANCIEN fichier, en
          #  cache, pendant quelques secondes après un remplacement — avec
          #  un beau 200. La boucle sortait donc au premier tour, comparait
          #  un manifeste périmé, et criait à la panne.
          #
          #  LA RÈGLE CORRECTE : on retente tant que la VALEUR n'est pas la
          #  bonne, pas seulement tant que le fichier est injoignable. Et on
          #  ajoute un paramètre anti-cache pour ne pas relire la copie que
          #  le CDN nous a déjà servie.
          #
          #  Leçon, notée parce qu'elle se représentera : une vérification
          #  qui échoue à tort coûte plus cher que pas de vérification du
          #  tout — elle fait perdre confiance dans le garde-fou, et on
          #  finit par publier sans lui.
          WANT="${SEVENTV_BUILD_NUMBER:-0}"
          PUB=""
          for i in 1 2 3 4 5 6 7 8; do
            # Paramètre anti-cache : le CDN ne peut pas nous resservir une
            # réponse mémorisée pour une URL qu'il n'a jamais vue.
            CODE=$(curl -sSL -o version.check.json -w '%{http_code}' \
              -H 'Cache-Control: no-cache' \
              "$BASE/version.json?cb=$(date +%s)-$i" || echo 000)
            if [ "$CODE" = "200" ]; then
              PUB=$(python3 -c "import json;print(json.load(open('version.check.json'))['versionCode'])" 2>/dev/null || echo "")
              [ "$PUB" = "$WANT" ] && break
              echo "manifeste encore en cache ($PUB, on attend $WANT), tentative $i/8"
            else
              echo "manifeste pas encore servi (HTTP $CODE), tentative $i/8"
            fi
            sleep 8
          done
          [ "$CODE" = "200" ] || { echo "::error title=Mise a jour cassee::version.json injoignable sur $TAG (HTTP $CODE)"; exit 1; }
          cat version.check.json

          # Le manifeste doit annoncer LE build qu'on vient de produire.
          # Sinon l'app verrait une version plus ancienne que la sienne et
          # ne proposerait jamais rien.
          echo "manifeste=$PUB  build=$WANT"
          [ "$PUB" = "$WANT" ] || { echo "::error title=Mise a jour cassee::le manifeste annonce $PUB au lieu du build $WANT apres 8 tentatives (ce n est plus un cache : la publication a echoue)"; exit 1; }

          # L'APK annoncé doit vraiment se télécharger.
          URL=$(python3 -c "import json;print(json.load(open('version.check.json'))['url'])")
          SIZE=$(curl -sSL -o /dev/null -w '%{size_download}' "$URL" || echo 0)
          echo "APK annonce : $URL  ($SIZE octets)"
          [ "$SIZE" -gt 5000000 ] || { echo "::error title=Mise a jour cassee::l APK annonce ne se telecharge pas ($SIZE octets)"; exit 1; }

          # Le MIROIR de secours (utilisé quand la box n'atteint pas
          # github.com : DNS de FAI, IPv6 bancale) doit répondre lui aussi.
          MCODE=$(curl -sSL -o /dev/null -w '%{http_code}' "https://app.7themotion.com/r/$TAG/version.json" || echo 000)
          echo "miroir de secours : HTTP $MCODE"
          [ "$MCODE" = "200" ] || echo "::warning title=Miroir muet::le miroir /r/ ne repond pas (HTTP $MCODE) — GitHub direct fonctionne, mais les box mal servies par leur FAI n auront pas de secours"

          echo "OK — la chaine de mise a jour est verifiee de bout en bout."
