# ============================================================================
#  build-zuno-tv.yml — Compile « Zuno » (app TV Flutter, entrée
#  android-app/lib/main_tv.dart) en APK sideloadable pour box Android TV /
#  Fire TV / Google TV, et le publie sur la release « zuno-tv » :
#
#    https://github.com/<repo>/releases/download/zuno-tv/zuno-tv.apk
#
#  ⚠ RELEASE SÉPARÉE (24/09/2026, décision du propriétaire ; renommée
#  « zuno-tv » le 25/09/2026 avec la nouvelle marque Zuno). La release
#  « 7motion-tv » appartient à l'APK 4K Player rebrandé (workflow
#  publish-7motion-tv.yml) : CE workflow n'y écrit JAMAIS. Package différent
#  (com.sevenmotion.tv.seven_tv vs com.manthefew) → les deux apps
#  cohabitent sur la même box.
#
#  POURQUOI CE WORKFLOW (24/09/2026). Le 4K Player rebrandé est un binaire
#  tiers fermé (sans code source ici) : il s'active sur le serveur de son
#  fournisseur, pas sur notre panel. L'app Flutter `main_tv.dart`, elle, est
#  câblée sur le MÊME Worker que le panel (https://app.7themotion.com) :
#  heartbeat au démarrage (platform=tv), licence essai/payé, sources
#  Xtream/M3U saisies par le client OU poussées par le panel
#  (/api/device-source), thème, annonces, historique multi-box.
#
#  CE QUI SE PASSE :
#    1. Flutter stable + Java 17 + SDK Android ; Firebase reste fail-open
#       (sans secret GOOGLE_SERVICES_JSON → Crashlytics désactivé, build vert).
#    2. Manifeste et Gradle patchés POUR CE BUILD par des scripts Python
#       lisibles et idempotents (android-app/ci/tv/*.py) : label « Zuno »,
#       Leanback, bannière, paysage, largeHeap, applicationId historique
#       com.sevenmotion.tv.seven_tv, signatures v1/v2/v3, R8.
#    3. Icône + bannière Zuno (logo or sur noir), écran de lancement sombre.
#    4. SIGNATURE = CLÉ MAÎTRESSE DES BOX CLIENTS (corrigé le 26/09/2026).
#       Constat sur les APK publiés : les box clients « 7 MOTION TV »
#       portent le certificat 5145b8e0… ; les builds Zuno 89 et 90 étaient
#       signés chacun avec une clé DIFFÉRENTE (clé jetable du runner : la
#       copie de ~/.android/debug.keystore n'était pas prise par Gradle) →
#       « Application non installée » sur toutes les box déjà équipées et
#       mise à jour in-app impossible. Désormais :
#         a) secrets ANDROID_KEYSTORE_BASE64 + ANDROID_KEYSTORE_PASSWORD ;
#         b) sinon ANDROID_KEYSTORE_PASSWORD seul → déchiffre
#            android-app/ci/release.jks.enc (la MÊME clé maîtresse que le
#            workflow historique build-seventv.yml) ;
#         c) sinon build de contrôle seulement (signature jetable), et la
#            PUBLICATION EST REFUSÉE.
#       Garde-fou : on ne publie QUE si le certificat de l'APK produit est
#       exactement celui des box clients (EXPECTED_CERT) et si minSdk = 21.
#    5. Barrière qualité : `flutter analyze` + `flutter test`.
#    6. Build release universel ARM 32/64 bits (Fire Stick Lite inclus) +
#       x86_64 (box Intel/AMD, émulateurs) ; chaque architecture vérifiée complète,
#       versionCode = secondes epoch (strictement croissant → la mise à jour
#       s'installe toujours par-dessus), APP_BUILD_TS pour la « mise à jour
#       forcée » pilotée par le panel.
#    7. Artefact du run TOUJOURS ; PUBLICATION sur la release zuno-tv
#       uniquement après dégel revu, lancement manuel par le propriétaire,
#       publish=true et confirmation PUBLIER_APP. Un push compile et vérifie,
#       mais n'écrase PAS le lien donné aux clients.
#       Le job de build reste en lecture seule ; le canal de preuve utilise
#       test_box=true, publish=false et le publisher séparé zuno-tv-test.
#
#  Surcharger le backend visé (staging…) : input `backend_url` (dispatch)
#  → `--dart-define=BACKEND_URL=…` (cf. subscription_backend.dart).
# ============================================================================
name: Build Zuno TV (APK → release zuno-tv)

on:
  push:
    branches: ['main', 'claude/**', 'feature/**']
    paths:
      - 'android-app/lib/**'
      - 'android-app/packages/**'
      - 'android-app/assets/**'
      - 'android-app/android/**'
      - 'android-app/ci/**'
      - 'android-app/pubspec.yaml'
      - 'android-app/l10n.yaml'
      - 'android-app/analysis_options.yaml'
      - 'android-app/flutter_launcher_icons_zuno_tv.yaml'
      - '.github/workflows/build-zuno-tv.yml'
  workflow_dispatch:
    inputs:
      confirme:
        description: 'Publication clients : PUBLIER_APP après dégel et ordre écrit du propriétaire'
        required: false
        default: ''
        type: string
      publish:
        description: 'Publier sur la release zuno-tv'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
      play_aab:
        description: 'Construire aussi le .aab Google Play (Android TV)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
      test_box:
        description: 'BOX DE TEST seulement (release zuno-tv-test) : AUCUN client mis à jour'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
      backend_url:
        description: 'Worker/panel visé (vide = https://app.7themotion.com)'
        required: false
        default: ''
        type: string
      variante:
        description: 'telephone = « Zuno essai » (package .essai, fichier zuno-essai.apk) — EXIGE test_box=true'
        required: false
        default: 'box'
        type: choice
        options: ['box', 'telephone']

  # Preuve sur la branche de travail lorsque le workflow est absent de main.
  # Le même constructeur signe l'APK ; seul le canal de test est autorisé.
  workflow_call:
    inputs:
      publish:
        type: string
        default: 'false'
      test_box:
        type: string
        default: 'true'
      play_aab:
        type: string
        default: 'false'
      backend_url:
        type: string
        default: ''
      variante:
        type: string
        default: 'box'
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false
      ANDROID_KEY_ALIAS:
        required: false
      ANDROID_KEY_PASSWORD:
        required: false

permissions:
  contents: read   # le build ne peut modifier aucune release

env:
  # QUI PUBLIE ? Lancement manuel explicite seulement, jamais un push.
  # La preuve Sport ci-dessous passe publish=false et test_box=true.
  # STABILITÉ (29/09/2026) : test_box=true ne publie JAMAIS pour les clients,
  # même si publish=true (la version va d'abord sur UNE box de test).
  PUBLIER: ${{ github.event_name == 'workflow_dispatch' && inputs.publish == 'true' && inputs.test_box != 'true' }}
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  RELEASE_TAG: zuno-tv
  # Certificat des box clients « 7 MOTION TV » (seven-tv.apk, depuis l'été 2026).
  EXPECTED_CERT: 5145b8e019f6d5fb96a207f2e73673fd954f799966fd598889211556cbdf9e61
  # VARIANTE « essai téléphone » (02/10/2026) : même code, même clé, mais
  # package com.sevenmotion.tv.seven_tv.essai, nom « Zuno essai » et fichier
  # zuno-essai.apk → s'installe à côté d'un Zuno déjà présent sur un
  # téléphone. Elle ne va QUE sur zuno-tv-test (garde-fou plus bas) et ne
  # remplace jamais zuno-tv.apk ni version.json.
  ESSAI: ${{ inputs.variante == 'telephone' }}
  APK_NAME: ${{ inputs.variante == 'telephone' && 'zuno-essai.apk' || 'zuno-tv.apk' }}
  ZUNO_APP_ID: ${{ inputs.variante == 'telephone' && 'com.sevenmotion.tv.seven_tv.essai' || 'com.sevenmotion.tv.seven_tv' }}
  ZUNO_APP_LABEL: ${{ inputs.variante == 'telephone' && 'Zuno essai' || 'Zuno' }}

# Une seule publication à la fois sur ce canal : deux runs simultanés
# écriraient l'APK de l'un et le version.json de l'autre. On fait la queue,
# on n'annule jamais un téléversement en cours.
concurrency:
  group: publish-zuno-tv
  cancel-in-progress: false

defaults:
  run:
    working-directory: android-app

jobs:
  build-tv:
    environment: ${{ inputs.test_box == 'true' && 'zuno-app-test' || 'zuno-app-production' }}
    outputs:
      version-name: ${{ env.TV_VERSION_NAME }}
      version-code: ${{ env.TV_BUILD_NUMBER }}
      signing: ${{ env.SIGNING }}
      aab-ready: ${{ env.AAB_READY }}
    name: Build Zuno TV APK
    if: >-
      (github.actor == github.repository_owner && github.triggering_actor == github.repository_owner && github.repository == 'manzilionellm-dotcom/tvking') &&
      (github.event_name != 'pull_request' ||
      (github.repository == 'manzilionellm-dotcom/tvking' &&
       github.actor == github.repository_owner &&
       github.event.pull_request.user.login == github.repository_owner &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.head.ref == 'ccr-b93e1afd-gwirw0' &&
       github.event.pull_request.base.ref == 'ccr-sport-preuve-20261008' &&
       inputs.publish == 'false' && inputs.test_box == 'true' &&
       inputs.play_aab == 'false' && inputs.backend_url == '' && inputs.variante == 'box'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # La variante « essai » n'existe que pour la box/le téléphone de test :
      # sans test_box=true, on s'arrête avant de construire quoi que ce soit.
      - name: Garde-fou variante essai
        if: env.ESSAI == 'true'
        working-directory: .
        run: |
          [ "${{ inputs.test_box }}" = "true" ] \
            || { echo "::error::variante=telephone exige test_box=true (jamais pour les clients)"; exit 1; }
          echo "variante essai : $ZUNO_APP_ID · $ZUNO_APP_LABEL · $APK_NAME"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          ref: ${{ env.SOURCE_SHA }}

      - name: Autoriser le build signé et son canal
        working-directory: .
        env:
          APP_PUBLISH: ${{ inputs.publish || 'false' }}
          APP_TEST_BOX: ${{ inputs.test_box || 'false' }}
          APP_PLAY_AAB: ${{ inputs.play_aab || 'false' }}
          APP_BACKEND_URL: ${{ inputs.backend_url }}
          APP_VARIANT: ${{ inputs.variante || 'box' }}
        run: node .github/app-release-guard.mjs

      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'temurin'
          java-version: '17'

      # Le dossier android-app/android/ versionné a été généré par un Flutter
      # récent (AGP 9, Kotlin 2.3, Gradle 9.1) : on compile avec le canal
      # stable courant, cohérent avec ces fichiers.
      # Compatibilité Android 5/6 malgré Flutter récent : voir
      # android-app/ci/tv/patch_gradle.py (point 5) et le drapeau
      # --android-skip-build-dependency-validation du build.
      - name: Setup Flutter (stable)
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.7'
          channel: 'stable'
          cache: false
          pub-cache: false

      - name: Setup Android SDK
        id: setup_android
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        continue-on-error: true

      - name: Setup Android SDK (retry après échec transitoire)
        if: steps.setup_android.outcome == 'failure'
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        continue-on-error: true

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses >/dev/null 2>&1 || true

      # ------------------------------------------------------------------
      #  Manifeste + Gradle propres au build TV (scripts idempotents)
      # ------------------------------------------------------------------
      - name: Patch manifest (Zuno, Leanback, réseau, compat box)
        run: python3 ci/tv/patch_manifest.py android/app/src/main/AndroidManifest.xml

      - name: Patch build.gradle.kts (applicationId TV, signature, R8)
        run: |
          set -e
          cp ci/proguard-rules.pro android/app/proguard-rules.pro
          python3 ci/tv/patch_gradle.py android/app/build.gradle.kts

      - name: Flutter pub get
        run: flutter pub get

      # screen_brightness_android : certaines versions du plugin ont un
      # bloc `kotlin {}` top-level qui casse la config Gradle. Filet de
      # sécurité identique aux workflows historiques (no-op si déjà propre).
      - name: Patch screen_brightness_android build.gradle (si nécessaire)
        run: |
          set -e
          FILE=$(find ~/.pub-cache/hosted/pub.dev -path "*/screen_brightness_android-*/android/build.gradle" 2>/dev/null | head -1)
          if [ -z "$FILE" ]; then
            echo "⊙ screen_brightness_android pas dans pub-cache, skip"
            exit 0
          fi
          export PATCH_FILE="$FILE"
          python3 - <<'PYEOF'
          import os, re
          file = os.environ['PATCH_FILE']
          lines = open(file).readlines()
          out, in_kotlin, depth, removed = [], False, 0, 0
          for line in lines:
              if not in_kotlin:
                  if re.match(r'^\s*kotlin\s*\{', line):
                      in_kotlin = True
                      depth = line.count('{') - line.count('}')
                      removed += 1
                      if depth <= 0:
                          in_kotlin = False
                      continue
                  out.append(line)
              else:
                  depth += line.count('{') - line.count('}')
                  removed += 1
                  if depth <= 0:
                      in_kotlin = False
          if removed:
              open(file, 'w').writelines(out)
              print(f'retiré {removed} ligne(s) kotlin{{}}')
          else:
              print('aucun bloc kotlin{} (déjà propre)')
          PYEOF

      - name: Generate AppLocalizations (.arb → Dart)
        run: flutter gen-l10n

      # ------------------------------------------------------------------
      #  Identité visuelle Zuno : icône launcher + bannière Leanback +
      #  écran de lancement sombre (fin de l'écran blanc au démarrage).
      # ------------------------------------------------------------------
      - name: Icône launcher (logo Zuno)
        run: dart run flutter_launcher_icons -f flutter_launcher_icons_zuno_tv.yaml

      - name: Bannière Android TV + écran de lancement sombre
        run: |
          set -e
          RES=android/app/src/main/res
          mkdir -p "$RES/drawable" "$RES/drawable-v21" "$RES/drawable-xhdpi" "$RES/drawable-xxhdpi" "$RES/values" "$RES/values-night"
          # Bannière Leanback (spec Android TV : 320×180 en xhdpi).
          cp assets/branding/zuno_tv_banner.png    "$RES/drawable/tv_banner.png"
          cp assets/branding/zuno_tv_banner.png    "$RES/drawable-xhdpi/tv_banner.png"
          cp assets/branding/zuno_tv_banner_2x.png "$RES/drawable-xxhdpi/tv_banner.png"
          # Splash sombre avec le logo centré (remplace le fond blanc du template).
          for DIR in drawable drawable-v21; do
            cat > "$RES/$DIR/launch_background.xml" <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item>
                  <shape android:shape="rectangle">
                      <solid android:color="#FF050505" />
                  </shape>
              </item>
              <item>
                  <bitmap
                      android:gravity="center"
                      android:src="@drawable/tv_banner" />
              </item>
          </layer-list>
          XML
          done
          for DIR in values values-night; do
            cat > "$RES/$DIR/styles.xml" <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="LaunchTheme" parent="@android:style/Theme.Black.NoTitleBar">
                  <item name="android:windowBackground">@drawable/launch_background</item>
              </style>
              <style name="NormalTheme" parent="@android:style/Theme.Black.NoTitleBar">
                  <item name="android:windowBackground">@drawable/launch_background</item>
              </style>
          </resources>
          XML
          done
          echo "✓ bannière + splash sombre en place"

      # ------------------------------------------------------------------
      #  SIGNATURE STABLE (voir en-tête, point 4)
      # ------------------------------------------------------------------
      - name: Signature (clé maîtresse des box clients)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PW: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          write_props() {
            cat > android/key.properties <<EOF
          storeFile=release.jks
          storePassword=$KS_PW
          keyAlias=${KS_ALIAS:-sevenmotion}
          keyPassword=${KEY_PW:-$KS_PW}
          EOF
          }
          if [ -n "$KS_B64" ] && [ -n "$KS_PW" ]; then
            echo "$KS_B64" | base64 -d > android/app/release.jks
            write_props
            echo "✓ clé maîtresse (secret ANDROID_KEYSTORE_BASE64)."
            echo "SIGNING=release" >> "$GITHUB_ENV"
            exit 0
          fi
          if [ -n "$KS_PW" ] && [ -f ci/release.jks.enc ]; then
            if openssl enc -d -aes-256-cbc -pbkdf2 -in ci/release.jks.enc \
                 -out android/app/release.jks -pass pass:"$KS_PW" 2>/dev/null \
               && keytool -list -keystore android/app/release.jks -storepass "$KS_PW" >/dev/null 2>&1; then
              write_props
              echo "✓ clé maîtresse (ci/release.jks.enc déchiffré, même clé que les box 7 MOTION TV)."
              echo "SIGNING=release" >> "$GITHUB_ENV"
              exit 0
            fi
            echo "::error title=Clé maîtresse illisible::ci/release.jks.enc ne se déchiffre pas avec ANDROID_KEYSTORE_PASSWORD."
            exit 1
          fi
          echo "::warning title=Pas de clé maîtresse::Aucun secret de signature → build de CONTRÔLE (signature jetable). La publication sera refusée."
          echo "SIGNING=controle" >> "$GITHUB_ENV"

      # ------------------------------------------------------------------
      #  BARRIÈRE QUALITÉ : pas d'APK publié si l'analyse ou les tests échouent.
      # ------------------------------------------------------------------
      - name: Quality gate (analyze + tests)
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test --reporter expanded

      # ------------------------------------------------------------------
      #  NUMÉRO DE VERSION VISIBLE (décision du propriétaire, 25/09/2026) :
      #  la 1re version publiée s'appelle « 88 », puis 89, 90… à CHAQUE
      #  publication réelle. Il est calculé à partir de la dernière version
      #  publiée (version.json de la release) → jamais deux publications avec le
      #  même numéro. Un build NON publié garde le numéro courant (il n'apparaît
      #  nulle part). Le versionCode (secondes epoch) reste la clé technique
      #  strictement croissante qui permet l'installation par-dessus.
      # ------------------------------------------------------------------
      - name: Numéro de version visible (88, 89, 90…)
        run: |
          set -e
          PREV_VN=$(curl -fsSL "https://github.com/${{ github.repository }}/releases/download/$RELEASE_TAG/version.json" 2>/dev/null \
            | tr -d ' \n' | grep -oE '"versionName":"[^"]*"' | grep -oE '[0-9]+' | head -1 || true)
          PREV_VN=${PREV_VN:-0}
          if [ "$PREV_VN" -lt 88 ]; then PREV_VN=87; fi
          # Plancher : la branche connexion affichait au moins 105, la
          # branche arrêt-hors-app au moins 106. On garde le plus haut
          # (106) : un build non publié reste au-dessus des deux, et le
          # versionCode (secondes epoch) dépasse 1790642483 et 1790640358.
          # version.json n'est écrit que si PUBLIER est vrai.
          FLOOR_VN=106
          if [ "$PUBLIER" = "true" ]; then NEW_VN=$((PREV_VN + 1)); else NEW_VN=$PREV_VN; fi
          if [ "$NEW_VN" -lt "$FLOOR_VN" ]; then NEW_VN=$FLOOR_VN; fi
          # Build de TEST : son propre numéro, lisible sur la box (Réglages,
          # Boîte noire) et dans le panel. Forme « <prochain>-test.<run> » :
          # 107-test.152, 107-test.153… La publication client prendra 107.
          # Le numéro client n'est jamais consommé par un test (il ne lit
          # que le version.json de zuno-tv).
          if [ "${{ inputs.test_box }}" = "true" ]; then
            NEXT_VN=$((NEW_VN + 1))
            if [ "$NEXT_VN" -le "$PREV_VN" ]; then NEXT_VN=$((PREV_VN + 1)); fi
            NEW_VN="${NEXT_VN}-test.${{ github.run_number }}"
          fi
          echo "version visible = $NEW_VN (précédente publiée : $PREV_VN, publication : $PUBLIER, plancher : $FLOOR_VN)"
          echo "TV_VERSION_NAME=$NEW_VN" >> "$GITHUB_ENV"

      - name: Build Zuno TV (release universel ARM, target main_tv)
        env:
          BACKEND_URL_INPUT: ${{ inputs.backend_url }}
        run: |
          set -e
          BUILD_NUMBER=$(date +%s)
          # Secondes epoch, donc croissant. Plancher = le dernier
          # versionCode déjà posé sur une box de test (1790642483),
          # lui-même au-dessus de la v102 (1790640358). Un APK plus
          # petit est refusé par Android.
          MIN_CODE=1790642483
          if [ "$BUILD_NUMBER" -le "$MIN_CODE" ]; then
            echo "::error title=versionCode trop petit::$BUILD_NUMBER n'est pas au-dessus de $MIN_CODE."
            exit 1
          fi
          echo "versionCode = $BUILD_NUMBER · versionName = $TV_VERSION_NAME"
          echo "TV_BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          EXTRA_DEFINES=""
          if [ -n "$BACKEND_URL_INPUT" ]; then
            EXTRA_DEFINES="--dart-define=BACKEND_URL=$BACKEND_URL_INPUT"
            echo "backend visé : $BACKEND_URL_INPUT"
          fi
          # Box de TEST (pas la variante téléphone, autre package) : le
          # bouton « Mise à jour » lit aussi la release zuno-tv-test et
          # prend le plus récent (lib/main_tv.dart). Un APK client ne
          # reçoit jamais ce réglage.
          if [ "${{ inputs.test_box }}" = "true" ] && [ "$ESSAI" != "true" ]; then
            EXTRA_DEFINES="$EXTRA_DEFINES --dart-define=ZUNO_UPDATE_CHANNEL=test"
            echo "canal de mise à jour : test (zuno-tv-test + zuno-tv)"
          fi
          flutter build apk --release --no-tree-shake-icons \
            --android-skip-build-dependency-validation \
            --target-platform android-arm,android-arm64,android-x64 \
            --build-number="$BUILD_NUMBER" \
            --build-name="$TV_VERSION_NAME" \
            --obfuscate --split-debug-info=build/symbols \
            --dart-define=APP_BUILD_TS="$BUILD_NUMBER" \
            --dart-define=GIT_SHA=${{ env.SOURCE_SHA }} \
            $EXTRA_DEFINES \
            --target=lib/main_tv.dart
          cp build/app/outputs/flutter-apk/app-release.apk "build/app/outputs/flutter-apk/$APK_NAME"
          ls -lah build/app/outputs/flutter-apk/

      # Vérification sur le binaire produit (pas sur nos intentions) :
      # package, versionCode, label, catégorie Leanback, et surtout le
      # backend compilé dedans (= le Worker que le panel utilise).
      - name: Vérifier l'APK (identité, Leanback, backend du panel)
        run: |
          set -e
          APK="build/app/outputs/flutter-apk/$APK_NAME"
          AAPT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/aapt
          BADGING=$("$AAPT" dump badging "$APK")
          echo "$BADGING" | grep -E "^package:|^application:|application-label:|leanback" || true
          echo "$BADGING" | grep -q "name='$ZUNO_APP_ID'" \
            || { echo "❌ applicationId inattendu (attendu $ZUNO_APP_ID)"; exit 1; }
          echo "$BADGING" | grep -q "application-label:'$ZUNO_APP_LABEL'" \
            || { echo "❌ nom affiché inattendu (attendu $ZUNO_APP_LABEL)"; exit 1; }
          # aapt ne recrache pas le nom brut de la catégorie : une activité
          # portant LEANBACK_LAUNCHER apparaît comme « leanback-launchable-activity ».
          echo "$BADGING" | grep -q "^leanback-launchable-activity:" \
            || { echo "❌ aucune activité LEANBACK_LAUNCHER : l'app n'apparaîtrait pas sur la home TV"; exit 1; }
          echo "$BADGING" | grep -E "^application:" | grep -q "banner='[^']" \
            || echo "::warning title=Bannière absente::android:banner non détecté sur <application> — vignette générique sur la home Leanback."
          # L'URL du Worker est une constante Dart : elle survit à l'obfuscation
          # (les chaînes ne sont pas renommées) et doit être présente dans le
          # code AOT (libapp.so, toutes ABIs). Si elle manque, l'app ne parle
          # PAS au panel.
          WANT="${{ inputs.backend_url }}"
          WANT="${WANT:-https://app.7themotion.com}"
          unzip -p "$APK" 'lib/*/libapp.so' | grep -aq "$WANT" \
            || { echo "❌ backend $WANT introuvable dans l'APK"; exit 1; }
          echo "✓ APK vérifié : $ZUNO_APP_ID ($ZUNO_APP_LABEL), Leanback, backend $WANT"
          # Chaque dossier d'architecture présent dans l'APK DOIT contenir le
          # moteur (libflutter.so) et le code (libapp.so) : Android choisit le
          # dossier de SON processeur ; un dossier incomplet = app qui ne démarre
          # pas (constaté le 26/09/2026 : x86_64 ne contenait que les libs mpv).
          for ABI in $(unzip -Z1 "$APK" 'lib/*' | cut -d/ -f2 | sort -u); do
            for LIB in libflutter.so libapp.so; do
              unzip -Z1 "$APK" "lib/$ABI/$LIB" >/dev/null 2>&1 \
                || { echo "❌ lib/$ABI/$LIB absent : l'app ne démarrerait pas sur les box $ABI"; exit 1; }
            done
            echo "✓ lib/$ABI complet"
          done
          # Compatibilité toutes box : minSdk 21 (Android 5) réellement dans l'APK.
          MIN_SDK=$(echo "$BADGING" | grep -oE "^sdkVersion:'[0-9]+'" | grep -oE "[0-9]+" || true)
          echo "minSdk de l'APK : ${MIN_SDK:-?}"
          [ "$MIN_SDK" = "21" ] || { echo "❌ minSdk ${MIN_SDK:-?} ≠ 21 : les box Android 5/6 refuseraient l'installation"; exit 1; }
          # Signature : DOIT être celle des box clients pour publier.
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner
          CERT=$("$APKSIGNER" verify --print-certs "$APK" | grep -m1 -oiE "SHA-256 digest: [0-9a-f]+" | awk '{print $3}')
          echo "certificat de l'APK : $CERT"
          echo "APK_CERT=$CERT" >> "$GITHUB_ENV"
          if [ "$CERT" = "$EXPECTED_CERT" ]; then
            echo "✓ signature = clé des box clients (mise à jour par-dessus garantie)."
          elif [ "$PUBLIER" = "true" ]; then
            echo "::error title=Signature différente des box clients::$CERT ≠ $EXPECTED_CERT → publication refusée (sinon « Application non installée » chez tous les clients)."
            exit 1
          else
            echo "::warning title=Signature de contrôle::$CERT (build non publié)."
          fi

      # ------------------------------------------------------------------
      #  AAB GOOGLE PLAY (Android TV) — sur demande (input play_aab=true).
      #  Même code, même clé maîtresse (= clé d'importation Play), mêmes
      #  numéros de version que l'APK. Différences exigées par Google Play :
      #    • PLAY_BUILD=true → l'updater sideload est coupé (les mises à jour
      #      viennent du Store, cf. core/update/build_flags.dart) ;
      #    • permission REQUEST_INSTALL_PACKAGES RETIRÉE du manifeste fusionné
      #      (permission restreinte sur Google Play), y compris si un plugin
      #      l'ajoute (tools:node="remove").
      #  Contrôles : permission absente du bundle + certificat = clé maîtresse.
      # ------------------------------------------------------------------
      - name: Build AAB Google Play (Android TV)
        if: inputs.play_aab == 'true'
        run: |
          set -e
          python3 - <<'PYEOF'
          f = "android/app/src/main/AndroidManifest.xml"
          s = open(f, encoding="utf-8").read()
          keep = '<uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES"/>'
          drop = '<uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" tools:node="remove"/>'
          if drop not in s:
              s = s.replace(keep, drop) if keep in s else s.replace("<application", drop + "\n    <application", 1)
          open(f, "w", encoding="utf-8").write(s)
          print("REQUEST_INSTALL_PACKAGES retirée pour Google Play")
          PYEOF
          # minSdk 24 pour Google Play SEULEMENT : la « protection automatique
          # Play » (activée sur l'app dans la Play Console) refuse un bundle
          # sous le SDK 24 (Android 7). L'APK des box, déjà construit et
          # vérifié plus haut, garde minSdk 21 (box Android 5/6, sideload).
          sed -i 's/^val kBoxMinSdk = 21$/val kBoxMinSdk = 24/' android/app/build.gradle.kts
          grep -q '^val kBoxMinSdk = 24$' android/app/build.gradle.kts \
            || { echo "❌ minSdk 24 non posé pour l'AAB Play"; exit 1; }
          flutter build appbundle --release --no-tree-shake-icons \
            --android-skip-build-dependency-validation \
            --build-number="$TV_BUILD_NUMBER" \
            --build-name="$TV_VERSION_NAME" \
            --obfuscate --split-debug-info=build/symbols-aab \
            --dart-define=PLAY_BUILD=true \
            --dart-define=APP_BUILD_TS="$TV_BUILD_NUMBER" \
            --dart-define=GIT_SHA=${{ env.SOURCE_SHA }} \
            --target=lib/main_tv.dart
          AAB=build/app/outputs/bundle/release/zuno-tv.aab
          cp build/app/outputs/bundle/release/app-release.aab "$AAB"
          ls -lah "$AAB"
          if unzip -p "$AAB" base/manifest/AndroidManifest.xml | grep -aq "REQUEST_INSTALL_PACKAGES"; then
            echo "❌ REQUEST_INSTALL_PACKAGES encore présente dans l'AAB (refusé par Google Play)"; exit 1
          fi
          # minSdk réellement dans le bundle (bundletool officiel de Google,
          # version fixée : pas d'appel d'API GitHub, pas de limite de débit).
          curl -fsSL -o /tmp/bundletool.jar \
            https://github.com/google/bundletool/releases/download/1.18.1/bundletool-all-1.18.1.jar
          AAB_MIN=$(java -jar /tmp/bundletool.jar dump manifest --bundle "$AAB" \
            --xpath /manifest/uses-sdk/@android:minSdkVersion 2>/dev/null | tail -1 | tr -d '[:space:]')
          echo "minSdk de l'AAB : $AAB_MIN"
          [ "$AAB_MIN" = "24" ] || { echo "❌ minSdk AAB $AAB_MIN ≠ 24 : refusé par la protection automatique Play"; exit 1; }
          AAB_CERT=$(keytool -printcert -jarfile "$AAB" | grep -m1 -oE "SHA256: [0-9A-F:]+" | cut -d' ' -f2 | tr -d ':' | tr 'A-F' 'a-f')
          echo "certificat de l'AAB : $AAB_CERT"
          if [ "$AAB_CERT" != "$EXPECTED_CERT" ]; then
            if [ "$PUBLIER" = "true" ]; then
              echo "::error title=AAB mal signé::$AAB_CERT ≠ clé maîtresse → non publié"; exit 1
            fi
            echo "::warning title=AAB de contrôle::signature $AAB_CERT (build non publié)"
          fi
          echo "✓ AAB Google Play prêt : $AAB"
          echo "AAB_READY=1" >> "$GITHUB_ENV"

      - name: Upload AAB artifact (Google Play)
        if: env.AAB_READY == '1'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zuno-tv-aab-${{ env.SOURCE_SHA }}
          path: android-app/build/app/outputs/bundle/release/zuno-tv.aab
          retention-days: 30
          if-no-files-found: error

      - name: Upload APK artifact (Zuno TV)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zuno-tv-apk-${{ env.SOURCE_SHA }}
          path: android-app/build/app/outputs/flutter-apk/${{ env.APK_NAME }}
          retention-days: 30
          if-no-files-found: error

      - name: Résumé du build sans publication
        run: |
          echo "APK construit et contrôlé ; la publication utilise un job séparé" >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publier uniquement le canal autorisé
    needs: [build-tv]
    if: >-
      needs.build-tv.result == 'success' &&
      github.actor == github.repository_owner && github.triggering_actor == github.repository_owner && github.repository == 'manzilionellm-dotcom/tvking' &&
      (inputs.test_box == 'true' ||
       (github.event_name == 'workflow_dispatch' && inputs.publish == 'true'))
    environment: ${{ inputs.test_box == 'true' && 'zuno-app-test' || 'zuno-app-production' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      TV_VERSION_NAME: ${{ needs.build-tv.outputs.version-name }}
      TV_BUILD_NUMBER: ${{ needs.build-tv.outputs.version-code }}
      SIGNING: ${{ needs.build-tv.outputs.signing }}
      AAB_READY: ${{ needs.build-tv.outputs.aab-ready }}
    steps:
      - name: Relire les protections du même commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.SOURCE_SHA }}
      - name: Autoriser la publication avant le téléchargement
        working-directory: .
        env:
          APP_OPERATION: ${{ inputs.test_box == 'true' && 'test' || 'client' }}
          APP_PUBLISH: ${{ inputs.publish || 'false' }}
          APP_TEST_BOX: ${{ inputs.test_box || 'false' }}
          APP_PLAY_AAB: ${{ inputs.play_aab || 'false' }}
          APP_BACKEND_URL: ${{ inputs.backend_url }}
          APP_VARIANT: ${{ inputs.variante || 'box' }}
          APP_CONFIRMATION: ${{ inputs.confirme }}
        run: node .github/app-release-guard.mjs
      - name: Télécharger l’APK de ce build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: zuno-tv-apk-${{ env.SOURCE_SHA }}
          path: android-app/build/app/outputs/flutter-apk
      - name: Télécharger l’AAB seulement si construit
        if: env.AAB_READY == '1'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: zuno-tv-aab-${{ env.SOURCE_SHA }}
          path: android-app/build/app/outputs/bundle/release

      # ------------------------------------------------------------------
      #  PUBLICATION (dispatch explicite publish=true) — release zuno-tv
      # ------------------------------------------------------------------
      - name: Publier sur la release zuno-tv
        if: env.PUBLIER == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          REPO="${{ github.repository }}"
          APK="build/app/outputs/flutter-apk/$APK_NAME"
          NEW_VC=${TV_BUILD_NUMBER:-0}
          # Anti-retour-arrière : on ne remplace jamais un APK plus récent
          # (deux branches qui publient à quelques minutes d'écart).
          PREV_VC=$(curl -fsSL "https://github.com/$REPO/releases/download/$RELEASE_TAG/version.json" 2>/dev/null \
            | tr -d ' \n' | grep -oE '"versionCode":[0-9]+' | grep -oE '[0-9]+' || true)
          PREV_VC=${PREV_VC:-0}
          if [ "$NEW_VC" -le "$PREV_VC" ]; then
            echo "⛔ versionCode $NEW_VC <= $PREV_VC déjà publié → pas de republication."
            exit 0
          fi
          SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          VN="$TV_VERSION_NAME"
          SIZE=$(stat -c%s "$APK")
          cat > version.json <<JSON
          {
            "versionCode": $NEW_VC,
            "versionName": "$VN",
            "url": "https://github.com/$REPO/releases/download/$RELEASE_TAG/$APK_NAME",
            "sha256": "$SHA",
            "size": $SIZE,
            "mandatory": false
          }
          JSON
          cat version.json
          NOTES="Zuno — app box Android TV / Fire TV (Flutter, lib/main_tv.dart) reliée au panel admin (https://app.7themotion.com) : activation par MAC, essai 7 jours puis licence payée, sources Xtream/M3U saisies par le client ou poussées par le panel, thème noir & or Zuno.

          Lien direct : https://github.com/$REPO/releases/download/$RELEASE_TAG/$APK_NAME

          versionCode : $NEW_VC · version : $VN · signature : ${SIGNING:-?}
          SHA-256 : $SHA
          Commit : ${{ env.SOURCE_SHA }}"
          if gh release view "$RELEASE_TAG" -R "$REPO" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" -R "$REPO" --title "Zuno — APK box Android TV" --notes "$NOTES"
          else
            gh release create "$RELEASE_TAG" -R "$REPO" --prerelease \
              --title "Zuno — APK box Android TV" --notes "$NOTES"
          fi
          gh release upload "$RELEASE_TAG" "$APK" version.json --clobber -R "$REPO"
          # AAB Google Play (si construit) : fichier à déposer dans la Play
          # Console, JAMAIS installable directement sur une box.
          if [ "${AAB_READY:-0}" = "1" ]; then
            gh release upload "$RELEASE_TAG" build/app/outputs/bundle/release/zuno-tv.aab --clobber -R "$REPO"
            echo "✓ https://github.com/$REPO/releases/download/$RELEASE_TAG/zuno-tv.aab"
          fi
          echo "✓ https://github.com/$REPO/releases/download/$RELEASE_TAG/$APK_NAME"

      # ------------------------------------------------------------------
      #  BOX DE TEST (29/09/2026) — règle de stabilité : une nouvelle version
      #  du lecteur passe D'ABORD sur une seule box. Les box des clients ne
      #  lisent que la release zuno-tv (version.json) : la release
      #  zuno-tv-test ne déclenche AUCUNE mise à jour chez eux. Installation
      #  sur la box de test : zuno.7themotion.com/test dans Downloader.
      #  Après validation : relancer avec publish=true (test_box=false).
      # ------------------------------------------------------------------
      - name: Publier pour la box de test (release zuno-tv-test)
        if: inputs.test_box == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TEST_TAG: zuno-tv-test
        run: |
          set -e
          REPO="${{ github.repository }}"
          APK="build/app/outputs/flutter-apk/$APK_NAME"
          # Même clé que les box clients, sinon l'APK de test ne s'installe pas
          # par-dessus (et la version validée ne passerait pas non plus).
          [ "${APK_CERT:-}" = "$EXPECTED_CERT" ] \
            || { echo "::error::signature ${APK_CERT:-?} ≠ clé des box → pas de publication test"; exit 1; }
          SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          if [ "$ESSAI" = "true" ]; then
            # Variante essai : on AJOUTE zuno-essai.apk à la release de test,
            # sans toucher zuno-tv.apk, version.json ni les notes (qui
            # décrivent le build de la box).
            [ "$APK_NAME" = "zuno-essai.apk" ] || { echo "::error::nom de fichier essai inattendu : $APK_NAME"; exit 1; }
            gh release view "$TEST_TAG" -R "$REPO" >/dev/null
            gh api "repos/$REPO/releases/tags/$TEST_TAG" \
              --jq '.assets[] | "\(.name) \(.size) \(.digest)"' > test_avant.txt
            gh release upload "$TEST_TAG" "$APK" --clobber -R "$REPO"
            gh api "repos/$REPO/releases/tags/$TEST_TAG" \
              --jq '.assets[] | "\(.name) \(.size) \(.digest)"' > test_apres.txt
            echo "== zuno-tv-test avant"; cat test_avant.txt
            echo "== zuno-tv-test après"; cat test_apres.txt
            # Seul zuno-essai.apk a le droit de changer.
            diff <(grep -v '^zuno-essai.apk ' test_avant.txt) <(grep -v '^zuno-essai.apk ' test_apres.txt) \
              || { echo "::error::un autre fichier de zuno-tv-test a changé"; exit 1; }
            echo "✓ essai téléphone : https://github.com/$REPO/releases/download/$TEST_TAG/$APK_NAME"
            echo "   package $ZUNO_APP_ID · versionCode ${TV_BUILD_NUMBER:-?} · SHA-256 $SHA"
            exit 0
          fi
          NOTES="Zuno — version de TEST (une seule box, jamais les clients).

          Installation : zuno.7themotion.com/test dans l'app Downloader.
          versionCode : ${TV_BUILD_NUMBER:-?} · SHA-256 : $SHA
          Commit : ${{ env.SOURCE_SHA }}"
          if gh release view "$TEST_TAG" -R "$REPO" >/dev/null 2>&1; then
            gh release edit "$TEST_TAG" -R "$REPO" --title "Zuno — box de TEST" --notes "$NOTES"
          else
            gh release create "$TEST_TAG" -R "$REPO" --prerelease \
              --title "Zuno — box de TEST" --notes "$NOTES"
          fi
          # version.json de TEST : lu seulement par les APK de test (canal
          # « test »). Même format que celui des clients. Les box clients
          # ne lisent jamais cette release.
          SIZE=$(stat -c%s "$APK")
          cat > version-test.json <<JSON
          {
            "versionCode": ${TV_BUILD_NUMBER:-0},
            "versionName": "$TV_VERSION_NAME",
            "url": "https://github.com/$REPO/releases/download/$TEST_TAG/$APK_NAME",
            "sha256": "$SHA",
            "size": $SIZE,
            "mandatory": false
          }
          JSON
          python3 -c "import json; d=json.load(open('version-test.json')); assert d['versionCode']>0 and len(d['sha256'])==64 and d['size']>0, d"
          mkdir -p test-manifest && cp version-test.json test-manifest/version.json
          gh release upload "$TEST_TAG" "$APK" test-manifest/version.json --clobber -R "$REPO"
          echo "✓ box de test : https://github.com/$REPO/releases/download/$TEST_TAG/$APK_NAME"
          echo "✓ manifeste de test : https://github.com/$REPO/releases/download/$TEST_TAG/version.json"
          # AAB Google Play demandé (play_aab=true) : on l'attache AUSSI à la
          # release de test, pour un lien direct vers la Play Console (les
          # artefacts Actions sont zippés et exigent une connexion GitHub).
          # Même garde-fou que l'APK : clé des box, sinon rien.
          if [ "${AAB_READY:-}" = "1" ]; then
            AAB="build/app/outputs/bundle/release/zuno-tv.aab"
            AAB_CERT=$(keytool -printcert -jarfile "$AAB" | grep -m1 -oE "SHA256: [0-9A-F:]+" | cut -d' ' -f2 | tr -d ':' | tr 'A-F' 'a-f')
            [ "$AAB_CERT" = "$EXPECTED_CERT" ] \
              || { echo "::error::AAB signé $AAB_CERT ≠ clé des box → pas attaché"; exit 1; }
            gh release upload "$TEST_TAG" "$AAB" --clobber -R "$REPO"
            echo "✓ AAB Google Play (test) : https://github.com/$REPO/releases/download/$TEST_TAG/zuno-tv.aab"
            echo "   SHA-256 : $(sha256sum "$AAB" | cut -d' ' -f1)"
          fi

      - name: Résumé
        run: |
          {
            echo "## Zuno TV"
            echo "- applicationId : \`$ZUNO_APP_ID\` · nom : \`$ZUNO_APP_LABEL\`"
            echo "- version visible : \`${TV_VERSION_NAME:-?}\` · versionCode : \`${TV_BUILD_NUMBER:-?}\` · signature : \`${SIGNING:-?}\`"
            echo "- backend : \`${{ inputs.backend_url || 'https://app.7themotion.com' }}\`"
            if [ "$PUBLIER" = "true" ]; then
              echo "- publié : https://github.com/${{ github.repository }}/releases/download/$RELEASE_TAG/$APK_NAME"
            else
              echo "- **non publié pour les clients**. Publication clients : lancement manuel explicite seulement."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

