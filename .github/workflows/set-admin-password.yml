# =========================================================
#  set-admin-password.yml — (Ré)initialise le mot de passe admin
# =========================================================
#  Pose la valeur du secret `ADMIN_SECRET` du Worker = ton nouveau
#  mot de passe admin. À déclencher manuellement (Actions →
#  « Set admin password » → Run workflow), en tapant le mot de passe.
#
#  Le mot de passe N'EST PAS stocké dans le dépôt : il arrive en
#  paramètre du run (input), est passé en variable d'environnement,
#  puis envoyé à Cloudflare via `wrangler secret put` (jamais affiché
#  dans les logs). Pense à le changer ensuite dans « Mon compte ».
#
#  Réutilise les secrets déjà configurés : CLOUDFLARE_API_TOKEN +
#  CLOUDFLARE_ACCOUNT_ID.
name: Set admin password

on:
  workflow_dispatch:
    inputs:
      password:
        description: "Nouveau mot de passe admin (= ADMIN_SECRET)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  set-secret:
    name: Pose ADMIN_SECRET sur le Worker
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set ADMIN_SECRET via wrangler
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_PW: ${{ inputs.password }}
        run: |
          npm i -g wrangler@3.90.0
          # `wrangler secret put` lit la valeur sur stdin (non interactif).
          # printf %s = pas de saut de ligne ajouté au mot de passe.
          printf '%s' "$ADMIN_PW" | npx wrangler secret put ADMIN_SECRET
          echo "✅ ADMIN_SECRET mis à jour. Connecte-toi : admin + ce mot de passe."
