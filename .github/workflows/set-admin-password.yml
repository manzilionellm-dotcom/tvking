# Configuration manuelle : le secret ne passe jamais dans les entrées du workflow.
name: Set admin password (protégé)

on:
  workflow_dispatch:
    inputs:
      confirme:
        description: 'Tape DEPLOYER pour changer le secret administrateur après dégel autorisé'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-panel-cloudflare
  cancel-in-progress: false

env:
  WRANGLER_VERSION: '4.149.0'

jobs:
  validation:
    name: Autorisation du propriétaire
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - name: Refuser une autre branche, un autre auteur ou un panel gelé
        env:
          PANEL_CONFIRMATION: ${{ inputs.confirme }}
        run: node .github/panel-deploy-guard.mjs

  set-secret:
    name: Poser ADMIN_SECRET après approbation
    needs: [validation]
    environment: zuno-panel-production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - name: Transmettre le secret par stdin, sans affichage
        working-directory: android-app/cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_PW: ${{ secrets.PANEL_ADMIN_SECRET_NEXT }}
        run: |
          set -euo pipefail
          [ -n "$ADMIN_PW" ] || { echo "::error::PANEL_ADMIN_SECRET_NEXT absent de l’environnement protégé"; exit 1; }
          printf '%s' "$ADMIN_PW" | npx --yes "wrangler@$WRANGLER_VERSION" secret put ADMIN_SECRET

