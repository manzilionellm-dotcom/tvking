# Voie historique neutralisée : aucune mutation de secret ni livraison parallèle.
name: Ancien changement de mot de passe (bloqué)

on:
  workflow_dispatch:
    inputs:
      confirme:
        description: 'Tape DEPLOYER pour vérifier le verrouillage, sans modification de secret'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-panel-cloudflare
  cancel-in-progress: false

jobs:
  validation:
    name: Autorisation du propriétaire
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - name: Refuser une autre branche, un autre auteur ou un panel gelé
        env:
          PANEL_CONFIRMATION: ${{ inputs.confirme }}
        run: node .github/panel-deploy-guard.mjs

  set-secret:
    name: Refuser la voie de livraison parallèle
    needs: [validation]
    environment: zuno-panel-production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Utiliser exclusivement le circuit approuvé
        run: |
          echo "::error::Voie historique bloquée. Toute mutation du Worker doit passer par deploy-panel-cloudflare.yml après revue et contrôle avant/après."
          exit 1

