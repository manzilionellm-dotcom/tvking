# =========================================================
#  build-nova-tv.yml — APK Android TV / Fire TV de NOVA+
# =========================================================
#  Empaquette le front NOVA+ (Next.js exporte en statique) dans le
#  wrapper WebView `nova-tv-wrapper`, produit un APK Downloader-ready,
#  et le publie sur la release `nova-latest`.
#
#  Lien court Downloader (via le Worker) :
#    https://99999.7themotion.com/nova
#  URL stable de la release :
#    https://github.com/<owner>/<repo>/releases/download/nova-latest/nova.apk
# =========================================================

name: Build NOVA+ TV APK

on:
  push:
    branches:
      - main
      - 'claude/**'
      - 'feature/**'
    paths:
      - 'tv-king/**'
      - 'nova-tv-wrapper/**'
      - '.github/workflows/build-nova-tv.yml'
  workflow_dispatch:

concurrency:
  group: nova-tv-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build NOVA+ WebView APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # -------- Toolchain --------
      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses > /dev/null

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: tv-king/package-lock.json

      - name: Install ImageMagick (icônes + bannière TV)
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends imagemagick fonts-dejavu-core
          command -v convert
          convert --version | head -1

      # -------- 1) Build NOVA+ (export statique) --------
      - name: Install NOVA+ deps
        working-directory: tv-king
        run: npm ci --no-audit --no-fund

      - name: Lint + test NOVA+
        working-directory: tv-king
        run: |
          npm run lint
          npm test

      - name: Build NOVA+ (export statique pour APK)
        working-directory: tv-king
        env:
          NOVA_TARGET: tv-apk
        run: npm run build

      # -------- 2) Stage out/ -> assets/web de l'APK --------
      - name: Copy NOVA+ bundle into APK assets
        run: |
          set -e
          DEST=nova-tv-wrapper/app/src/main/assets/web
          mkdir -p "$DEST"
          rm -rf "$DEST"/*
          cp -r tv-king/out/* "$DEST"/
          echo "=== Contenu assets/web ==="
          ls -la "$DEST"
          test -f "$DEST/index.html"

      # -------- 3) Icônes launcher + bannière TV (synthétiques NOVA+) --------
      - name: Generate launcher icons + TV banner
        run: |
          set -e
          RES=nova-tv-wrapper/app/src/main/res
          # Détection d'une police bold pour le texte.
          FONT_FILE="$(fc-list 'DejaVu Sans:bold' file 2>/dev/null | head -1 | sed 's/: *$//')"
          if [ -z "$FONT_FILE" ]; then
            for c in /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf \
                     /usr/share/fonts/dejavu/DejaVuSans-Bold.ttf; do
              [ -f "$c" ] && FONT_FILE="$c" && break
            done
          fi
          FONT_ARG=""
          [ -n "$FONT_FILE" ] && FONT_ARG="-font $FONT_FILE"
          echo "Font: ${FONT_FILE:-default}"

          # Icône launcher : fond #121212 (jamais noir pur) + « N+ » or.
          for entry in "mdpi:48" "hdpi:72" "xhdpi:96" "xxhdpi:144" "xxxhdpi:192"; do
            DPI="${entry%%:*}"; SIZE="${entry##*:}"
            DEST="$RES/mipmap-$DPI"; mkdir -p "$DEST"
            PT=$(( SIZE * 52 / 100 ))
            convert -size "${SIZE}x${SIZE}" xc:'#121212' \
                    -gravity center -fill '#e3b96b' \
                    $FONT_ARG -pointsize "$PT" -annotate +0+0 'N+' \
                    "$DEST/ic_launcher.png"
            cp "$DEST/ic_launcher.png" "$DEST/ic_launcher_round.png"
          done

          # Bannière Android TV 320x180 : fond sombre + « NOVA+ » or.
          mkdir -p "$RES/drawable"
          convert -size 320x180 xc:'#121212' \
                  -gravity center -fill '#e3b96b' \
                  $FONT_ARG -pointsize 52 -annotate +0+0 'NOVA+' \
                  "$RES/drawable/tv_banner.png"

          echo "=== Assets générés ==="
          find "$RES" -name '*.png' -exec ls -la {} \;

      # -------- 4) Build APK --------
      # Version UNIQUE par build : sinon Android voit le meme versionCode
      # et REFUSE de mettre a jour (l'ancienne version cassee reste). On
      # injecte le numero de run comme versionCode + versionName.
      - name: Set unique version from run number
        run: |
          set -e
          GB=nova-tv-wrapper/app/build.gradle.kts
          sed -i "s/versionCode = 1/versionCode = ${{ github.run_number }}/" "$GB"
          sed -i "s/versionName = \"1.0.0\"/versionName = \"1.0.${{ github.run_number }}\"/" "$GB"
          grep -nE "versionCode|versionName" "$GB"

      - name: Make gradlew executable
        run: chmod +x nova-tv-wrapper/gradlew

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-nova-${{ hashFiles('nova-tv-wrapper/**/*.gradle*', 'nova-tv-wrapper/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-nova-

      - name: Build debug APK
        working-directory: nova-tv-wrapper
        run: ./gradlew --no-daemon assembleDebug

      - name: Rename APK + verify
        run: |
          set -e
          SRC=nova-tv-wrapper/app/build/outputs/apk/debug/app-debug.apk
          DST=nova-tv-wrapper/app/build/outputs/apk/debug/nova.apk
          test -f "$SRC" || { echo "APK introuvable"; find nova-tv-wrapper -name '*.apk' || true; exit 1; }
          cp "$SRC" "$DST"
          ls -lah "$DST"

      # -------- 5) Upload artifact --------
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nova-tv-debug-apk-${{ github.sha }}
          path: nova-tv-wrapper/app/build/outputs/apk/debug/nova.apk
          retention-days: 30
          if-no-files-found: error

      # -------- 6) Publish to GitHub Release nova-latest --------
      - name: Publish nova-latest release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          APK="nova-tv-wrapper/app/build/outputs/apk/debug/nova.apk"
          BODY=$(cat <<EOF
          NOVA+ — derniere version Android TV / Fire TV.

          - Branche : \`${{ github.ref_name }}\`
          - Commit : \`${{ github.sha }}\`
          - Run : #${{ github.run_number }}

          **Installation via Downloader** :
          1. Ouvre Downloader sur ta TV
          2. Tape : \`99999.7themotion.com/nova\`
          3. Downloader telecharge -> installe.
          4. L'icone "NOVA+" apparait sur l'ecran d'accueil Android TV.

          Mode debug. Cible Android 6+ (SHIELD, Fire TV Stick 4K Max, Chromecast Google TV).
          EOF
          )
          if gh release view nova-latest --repo "$REPO" >/dev/null 2>&1; then
            gh release edit nova-latest --repo "$REPO" \
              --title "NOVA+ TV — dernier build" \
              --notes "$BODY" --prerelease
            gh release upload nova-latest --repo "$REPO" --clobber "$APK"
          else
            gh release create nova-latest --repo "$REPO" \
              --title "NOVA+ TV — dernier build" \
              --notes "$BODY" --prerelease "$APK"
          fi
          gh release view nova-latest --repo "$REPO"
