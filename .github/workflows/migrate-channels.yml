# ============================================================================
#  migrate-channels.yml — Pont de migration vers la MAISON MÈRE
# ----------------------------------------------------------------------------
#  Les appareils installés AVANT la maison mère ont un ANCIEN canal de MAJ
#  gravé dans l'APK (`latest` téléphone, `tv-latest` / `tv-fix-latest` /
#  `cast-fix-tv-latest` pour la TV). La maison mère publie désormais sur
#  `prod` / `tv-prod` → ces vieux appareils ne verraient plus la MAJ.
#
#  Ce workflow écrit UN version.json « pont » sur chaque ancien canal : il
#  annonce une version très récente dont l'URL pointe vers l'APK de la MAISON
#  MÈRE (prod / tv-prod). Résultat : au prochain check, l'appareil affiche
#  « Mise à jour disponible », télécharge la maison mère et s'installe
#  par-dessus → il bascule DÉFINITIVEMENT sur le bon canal (prod / tv-prod),
#  sans réinstallation manuelle. Zéro client perdu.
#
#  Lancement MANUEL (workflow_dispatch), à faire UNE fois quand prod et
#  tv-prod existent. À relancer si besoin (idempotent). On NE touche PAS à
#  seventv-latest (autre applicationId : 7 MOTION TV ≠ DeFew TV) — un APK
#  DeFew ne s'installe pas par-dessus.
# ============================================================================
name: Migrate old channels to maison mère

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  bridge:
    name: Pont version.json → maison mère
    runs-on: ubuntu-latest
    steps:
      - name: Write bridge version.json on old channels
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          BASE="https://github.com/$REPO/releases/download"
          # versionCode « pont » volontairement très élevé (mais < 2^31) :
          # supérieur à tous les anciens builds (run_number ~900, epoch ~1.78e9)
          # → l'ancien appareil voit TOUJOURS la MAJ. Une fois migré, il lit le
          # version.json de SON nouveau canal (prod/tv-prod) et non ce pont.
          BRIDGE_VC=2100000000
          bridge() {
            TAG="$1"; APK_URL="$2"
            cat > version.json <<JSON
          {
            "versionCode": ${BRIDGE_VC},
            "versionName": "0.3.1",
            "url": "${APK_URL}",
            "mandatory": false
          }
          JSON
            NOTES="Pont de migration → maison mère. Mets à jour : l'app bascule sur le canal officiel (prod / tv-prod) et se mettra à jour toute seule ensuite."
            if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
              gh release edit "$TAG" --repo "$REPO" --notes "$NOTES" --prerelease
            else
              gh release create "$TAG" --repo "$REPO" --title "$TAG (migration)" --notes "$NOTES" --prerelease
            fi
            gh release upload "$TAG" --repo "$REPO" --clobber version.json
            echo "✓ pont posé : $TAG → $APK_URL"
          }
          # Téléphone : anciens installs sur « latest » → APK maison mère prod
          bridge "latest"            "$BASE/prod/7motion.apk"
          # TV DeFew (même applicationId) : anciens canaux → APK maison mère tv-prod
          bridge "tv-latest"         "$BASE/tv-prod/defew-tv.apk"
          bridge "tv-fix-latest"     "$BASE/tv-prod/defew-tv.apk"
          bridge "cast-fix-tv-latest" "$BASE/tv-prod/defew-tv.apk"
          echo ">>> Ponts posés. Les anciens appareils migreront au prochain check MAJ."
