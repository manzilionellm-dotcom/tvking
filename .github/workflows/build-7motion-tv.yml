# ============================================================================
#  build-7motion-tv.yml — Compile « 7 MOTION TV » (app Flutter, entrée
#  android-app/lib/main_tv.dart) en APK sideloadable pour box Android TV /
#  Fire TV / Google TV, et le publie sur la release « 7motion-tv » :
#
#    https://github.com/<repo>/releases/download/7motion-tv/7motion-tv.apk
#
#  POURQUOI CE WORKFLOW (24/09/2026). L'APK qui occupait cette release était
#  un lecteur tiers « 4K Player » simplement rebrandé (binaire fermé, sans
#  code source ici) : il NE PEUT PAS parler au panel admin. L'app Flutter
#  `main_tv.dart`, elle, est câblée sur le MÊME Worker que le panel
#  (https://app.7themotion.com) : heartbeat au démarrage (platform=tv),
#  statut licence, sources poussées (/api/device-source), thème, annonces,
#  historique multi-box. Publier CETTE app sous la même URL, c'est ce qui
#  « connecte l'app au panel ». L'ancien APK 4K Player reste récupérable
#  (branche claude/salut-mg9ub7, dossier android-app/release-7motion-tv).
#
#  CE QUI SE PASSE :
#    1. Flutter stable + Java 17 + SDK Android ; Firebase reste fail-open
#       (sans secret GOOGLE_SERVICES_JSON → Crashlytics désactivé, build vert).
#    2. Manifeste et Gradle patchés POUR CE BUILD par des scripts Python
#       lisibles et idempotents (android-app/ci/tv/*.py) : label « 7 MOTION »,
#       Leanback, bannière, paysage, largeHeap, applicationId historique
#       com.sevenmotion.tv.seven_tv, signatures v1/v2/v3, R8.
#    3. Icône + bannière 7 MOTION, écran de lancement sombre.
#    4. SIGNATURE STABLE — jamais la clé jetable du runner (sinon aucune mise
#       à jour ne s'installe par-dessus) :
#         a) clé maîtresse 7 MOTION via secrets ANDROID_KEYSTORE_BASE64 +
#            ANDROID_KEYSTORE_PASSWORD (+ ANDROID_KEY_ALIAS, défaut
#            « sevenmotion », + ANDROID_KEY_PASSWORD, défaut = mot de passe
#            du keystore) ;
#         b) sinon, repli sur le keystore FIXE historique du projet
#            (ci/defew-debug.keystore, lu dans l'historique git — il n'est
#            volontairement pas versionné dans android-app/) ;
#         c) sinon, ÉCHEC explicite : on ne publie pas un APK impossible à
#            mettre à jour.
#    5. Barrière qualité : `flutter analyze` + `flutter test`.
#    6. Build release universel ARM (32 + 64 bits : Fire Stick Lite inclus),
#       versionCode = secondes epoch (strictement croissant → la mise à jour
#       s'installe toujours par-dessus), APP_BUILD_TS pour la « mise à jour
#       forcée » pilotée par le panel.
#    7. Artefact du run TOUJOURS ; PUBLICATION sur la release 7motion-tv
#       uniquement (a) sur push vers `main`, ou (b) en lancement manuel avec
#       publish=true. Un push sur une branche de travail compile et vérifie,
#       mais n'écrase PAS le lien donné aux clients.
#
#  Surcharger le backend visé (staging…) : input `backend_url` (dispatch)
#  → `--dart-define=BACKEND_URL=…` (cf. subscription_backend.dart).
# ============================================================================
name: Build 7 MOTION TV (APK → release 7motion-tv)

on:
  push:
    branches: ['main', 'claude/**', 'feature/**']
    paths:
      - 'android-app/lib/**'
      - 'android-app/packages/**'
      - 'android-app/assets/**'
      - 'android-app/android/**'
      - 'android-app/ci/**'
      - 'android-app/pubspec.yaml'
      - 'android-app/l10n.yaml'
      - 'android-app/analysis_options.yaml'
      - 'android-app/flutter_launcher_icons_7motion_tv.yaml'
      - '.github/workflows/build-7motion-tv.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publier sur la release 7motion-tv (lien clients)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
      backend_url:
        description: 'Worker/panel visé (vide = https://app.7themotion.com)'
        required: false
        default: ''
        type: string

permissions:
  contents: write   # publier l'APK + version.json sur la release

env:
  # QUI PUBLIE ? Une seule réponse, lue par toutes les étapes concernées.
  PUBLIER: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event.inputs.publish == 'true' }}
  RELEASE_TAG: 7motion-tv
  APK_NAME: 7motion-tv.apk

# Une seule publication à la fois sur ce canal : deux runs simultanés
# écriraient l'APK de l'un et le version.json de l'autre. On fait la queue,
# on n'annule jamais un téléversement en cours.
concurrency:
  group: publish-7motion-tv
  cancel-in-progress: false

defaults:
  run:
    working-directory: android-app

jobs:
  build-tv:
    name: Build 7 MOTION TV APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Le dossier android-app/android/ versionné a été généré par un Flutter
      # récent (AGP 9, Kotlin 2.3, Gradle 9.1) : on compile avec le canal
      # stable courant, cohérent avec ces fichiers.
      - name: Setup Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Setup Android SDK
        id: setup_android
        uses: android-actions/setup-android@v3
        continue-on-error: true

      - name: Setup Android SDK (retry après échec transitoire)
        if: steps.setup_android.outcome == 'failure'
        uses: android-actions/setup-android@v3
        continue-on-error: true

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses >/dev/null 2>&1 || true

      # ------------------------------------------------------------------
      #  Manifeste + Gradle propres au build TV (scripts idempotents)
      # ------------------------------------------------------------------
      - name: Patch manifest (7 MOTION, Leanback, réseau, compat box)
        run: python3 ci/tv/patch_manifest.py android/app/src/main/AndroidManifest.xml

      - name: Patch build.gradle.kts (applicationId TV, signature, R8)
        run: |
          set -e
          cp ci/proguard-rules.pro android/app/proguard-rules.pro
          python3 ci/tv/patch_gradle.py android/app/build.gradle.kts

      - name: Flutter pub get
        run: flutter pub get

      # screen_brightness_android : certaines versions du plugin ont un
      # bloc `kotlin {}` top-level qui casse la config Gradle. Filet de
      # sécurité identique aux workflows historiques (no-op si déjà propre).
      - name: Patch screen_brightness_android build.gradle (si nécessaire)
        run: |
          set -e
          FILE=$(find ~/.pub-cache/hosted/pub.dev -path "*/screen_brightness_android-*/android/build.gradle" 2>/dev/null | head -1)
          if [ -z "$FILE" ]; then
            echo "⊙ screen_brightness_android pas dans pub-cache, skip"
            exit 0
          fi
          export PATCH_FILE="$FILE"
          python3 - <<'PYEOF'
          import os, re
          file = os.environ['PATCH_FILE']
          lines = open(file).readlines()
          out, in_kotlin, depth, removed = [], False, 0, 0
          for line in lines:
              if not in_kotlin:
                  if re.match(r'^\s*kotlin\s*\{', line):
                      in_kotlin = True
                      depth = line.count('{') - line.count('}')
                      removed += 1
                      if depth <= 0:
                          in_kotlin = False
                      continue
                  out.append(line)
              else:
                  depth += line.count('{') - line.count('}')
                  removed += 1
                  if depth <= 0:
                      in_kotlin = False
          if removed:
              open(file, 'w').writelines(out)
              print(f'retiré {removed} ligne(s) kotlin{{}}')
          else:
              print('aucun bloc kotlin{} (déjà propre)')
          PYEOF

      - name: Generate AppLocalizations (.arb → Dart)
        run: flutter gen-l10n

      # ------------------------------------------------------------------
      #  Identité visuelle 7 MOTION : icône launcher + bannière Leanback +
      #  écran de lancement sombre (fin de l'écran blanc au démarrage).
      # ------------------------------------------------------------------
      - name: Icône launcher (logo 7 MOTION)
        run: dart run flutter_launcher_icons -f flutter_launcher_icons_7motion_tv.yaml

      - name: Bannière Android TV + écran de lancement sombre
        run: |
          set -e
          RES=android/app/src/main/res
          mkdir -p "$RES/drawable" "$RES/drawable-v21" "$RES/drawable-xhdpi" "$RES/drawable-xxhdpi" "$RES/values" "$RES/values-night"
          # Bannière Leanback (spec Android TV : 320×180 en xhdpi).
          cp assets/branding/7motion_tv_banner.png    "$RES/drawable/tv_banner.png"
          cp assets/branding/7motion_tv_banner.png    "$RES/drawable-xhdpi/tv_banner.png"
          cp assets/branding/7motion_tv_banner_2x.png "$RES/drawable-xxhdpi/tv_banner.png"
          # Splash sombre avec le logo centré (remplace le fond blanc du template).
          for DIR in drawable drawable-v21; do
            cat > "$RES/$DIR/launch_background.xml" <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item>
                  <shape android:shape="rectangle">
                      <solid android:color="#FF0E0E0E" />
                  </shape>
              </item>
              <item>
                  <bitmap
                      android:gravity="center"
                      android:src="@drawable/tv_banner" />
              </item>
          </layer-list>
          XML
          done
          for DIR in values values-night; do
            cat > "$RES/$DIR/styles.xml" <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="LaunchTheme" parent="@android:style/Theme.Black.NoTitleBar">
                  <item name="android:windowBackground">@drawable/launch_background</item>
              </style>
              <style name="NormalTheme" parent="@android:style/Theme.Black.NoTitleBar">
                  <item name="android:windowBackground">@drawable/launch_background</item>
              </style>
          </resources>
          XML
          done
          echo "✓ bannière + splash sombre en place"

      # ------------------------------------------------------------------
      #  SIGNATURE STABLE (voir en-tête, point 4)
      # ------------------------------------------------------------------
      - name: Signature (clé maîtresse via secrets, sinon keystore fixe)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PW: ${{ secrets.ANDROID_KEY_PASSWORD }}
          # Commit de l'historique qui porte ci/defew-debug.keystore (clé fixe,
          # identifiants debug standard) — repli quand la clé maîtresse manque.
          FALLBACK_KEYSTORE_COMMIT: 32d7280a31a725fcb7386d20a9a909eff89bf161
        run: |
          set -e
          if [ -n "$KS_B64" ] && [ -n "$KS_PW" ]; then
            echo "$KS_B64" | base64 -d > android/app/release.jks
            cat > android/key.properties <<EOF
          storeFile=release.jks
          storePassword=$KS_PW
          keyAlias=${KS_ALIAS:-sevenmotion}
          keyPassword=${KEY_PW:-$KS_PW}
          EOF
            echo "✓ signature RELEASE avec la clé maîtresse (alias ${KS_ALIAS:-sevenmotion})."
            echo "SIGNING=release" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "::warning title=Clé maîtresse absente::Secrets ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD non posés → repli sur le keystore fixe historique (stable entre builds, mais pas la clé 7 MOTION)."
          if git fetch --depth=1 origin "$FALLBACK_KEYSTORE_COMMIT" \
             && git show FETCH_HEAD:ci/defew-debug.keystore > /tmp/defew-debug.keystore 2>/dev/null \
             && [ -s /tmp/defew-debug.keystore ]; then
            mkdir -p ~/.android
            cp /tmp/defew-debug.keystore ~/.android/debug.keystore
            echo "✓ keystore fixe historique installé (~/.android/debug.keystore)."
            echo "SIGNING=fixed-debug" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "::error title=Aucune clé stable::Ni clé maîtresse (secrets) ni keystore fixe historique. On refuse de signer avec la clé jetable du runner : aucune mise à jour ne pourrait s'installer par-dessus chez les clients."
          exit 1

      # ------------------------------------------------------------------
      #  BARRIÈRE QUALITÉ : pas d'APK publié si l'analyse ou les tests échouent.
      # ------------------------------------------------------------------
      - name: Quality gate (analyze + tests)
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test --reporter expanded

      - name: Build 7 MOTION TV (release universel ARM, target main_tv)
        env:
          BACKEND_URL_INPUT: ${{ github.event.inputs.backend_url }}
        run: |
          set -e
          BUILD_NUMBER=$(date +%s)
          echo "versionCode = $BUILD_NUMBER"
          echo "TV_BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          EXTRA_DEFINES=""
          if [ -n "$BACKEND_URL_INPUT" ]; then
            EXTRA_DEFINES="--dart-define=BACKEND_URL=$BACKEND_URL_INPUT"
            echo "backend visé : $BACKEND_URL_INPUT"
          fi
          flutter build apk --release --no-tree-shake-icons \
            --target-platform android-arm,android-arm64 \
            --build-number="$BUILD_NUMBER" \
            --obfuscate --split-debug-info=build/symbols \
            --dart-define=APP_BUILD_TS="$BUILD_NUMBER" \
            --dart-define=GIT_SHA=${{ github.sha }} \
            $EXTRA_DEFINES \
            --target=lib/main_tv.dart
          cp build/app/outputs/flutter-apk/app-release.apk "build/app/outputs/flutter-apk/$APK_NAME"
          ls -lah build/app/outputs/flutter-apk/

      # Vérification sur le binaire produit (pas sur nos intentions) :
      # package, versionCode, label, catégorie Leanback, et surtout le
      # backend compilé dedans (= le Worker que le panel utilise).
      - name: Vérifier l'APK (identité, Leanback, backend du panel)
        run: |
          set -e
          APK="build/app/outputs/flutter-apk/$APK_NAME"
          AAPT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/aapt
          "$AAPT" dump badging "$APK" | grep -E "^package:|application-label:|leanback" || true
          "$AAPT" dump badging "$APK" | grep -q "name='com.sevenmotion.tv.seven_tv'" \
            || { echo "❌ applicationId inattendu"; exit 1; }
          "$AAPT" dump badging "$APK" | grep -q "android.intent.category.LEANBACK_LAUNCHER" \
            || { echo "❌ catégorie LEANBACK_LAUNCHER absente : l'app n'apparaîtrait pas sur la home TV"; exit 1; }
          # L'URL du Worker est une constante Dart : elle survit à l'obfuscation
          # (les chaînes ne sont pas renommées) et doit être présente dans le
          # code AOT. Si elle manque, l'app ne parle PAS au panel.
          WANT="${{ github.event.inputs.backend_url }}"
          WANT="${WANT:-https://app.7themotion.com}"
          unzip -p "$APK" 'lib/arm64-v8a/libapp.so' | grep -aq "$WANT" \
            || { echo "❌ backend $WANT introuvable dans l'APK"; exit 1; }
          echo "✓ APK vérifié : com.sevenmotion.tv.seven_tv, Leanback, backend $WANT"
          # Empreinte de signature (pour la traçabilité dans les notes de release).
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner
          "$APKSIGNER" verify --print-certs "$APK" | grep -i "SHA-256" | head -1 || true

      - name: Upload APK artifact (7 MOTION TV)
        uses: actions/upload-artifact@v4
        with:
          name: 7motion-tv-apk-${{ github.sha }}
          path: android-app/build/app/outputs/flutter-apk/7motion-tv.apk
          retention-days: 30
          if-no-files-found: error

      # ------------------------------------------------------------------
      #  PUBLICATION (main ou dispatch publish=true) — release 7motion-tv
      # ------------------------------------------------------------------
      - name: Publier sur la release 7motion-tv
        if: env.PUBLIER == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          REPO="${{ github.repository }}"
          APK="build/app/outputs/flutter-apk/$APK_NAME"
          NEW_VC=${TV_BUILD_NUMBER:-0}
          # Anti-retour-arrière : on ne remplace jamais un APK plus récent
          # (deux branches qui publient à quelques minutes d'écart).
          PREV_VC=$(curl -fsSL "https://github.com/$REPO/releases/download/$RELEASE_TAG/version.json" 2>/dev/null \
            | tr -d ' \n' | grep -oE '"versionCode":[0-9]+' | grep -oE '[0-9]+' || true)
          PREV_VC=${PREV_VC:-0}
          if [ "$NEW_VC" -le "$PREV_VC" ]; then
            echo "⛔ versionCode $NEW_VC <= $PREV_VC déjà publié → pas de republication."
            exit 0
          fi
          SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          VN=$(grep -E '^version:' pubspec.yaml | sed -E 's/^version:\s*([^+ ]+).*/\1/')
          cat > version.json <<JSON
          {
            "versionCode": $NEW_VC,
            "versionName": "$VN",
            "url": "https://github.com/$REPO/releases/download/$RELEASE_TAG/$APK_NAME",
            "mandatory": false
          }
          JSON
          cat version.json
          NOTES="7 MOTION TV — app Flutter (lib/main_tv.dart) reliée au panel admin (https://app.7themotion.com) : heartbeat, activation par MAC, sources poussées, thème, annonces.

          Installation box : Downloader → https://app.7themotion.com/tv
          Lien direct : https://github.com/$REPO/releases/download/$RELEASE_TAG/$APK_NAME

          versionCode : $NEW_VC · version : $VN · signature : ${SIGNING:-?}
          SHA-256 : $SHA
          Commit : ${{ github.sha }}"
          if gh release view "$RELEASE_TAG" -R "$REPO" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" -R "$REPO" --title "7 MOTION TV — APK box" --notes "$NOTES"
          else
            gh release create "$RELEASE_TAG" -R "$REPO" --prerelease \
              --title "7 MOTION TV — APK box" --notes "$NOTES"
          fi
          gh release upload "$RELEASE_TAG" "$APK" version.json --clobber -R "$REPO"
          echo "✓ https://github.com/$REPO/releases/download/$RELEASE_TAG/$APK_NAME"

      - name: Résumé
        run: |
          {
            echo "## 7 MOTION TV"
            echo "- applicationId : \`com.sevenmotion.tv.seven_tv\`"
            echo "- versionCode : \`${TV_BUILD_NUMBER:-?}\` · signature : \`${SIGNING:-?}\`"
            echo "- backend : \`${{ github.event.inputs.backend_url || 'https://app.7themotion.com' }}\`"
            if [ "$PUBLIER" = "true" ]; then
              echo "- publié : https://github.com/${{ github.repository }}/releases/download/$RELEASE_TAG/$APK_NAME"
            else
              echo "- **non publié** (artefact du run seulement). Pour publier : push sur \`main\` ou « Run workflow » avec publish=true."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
