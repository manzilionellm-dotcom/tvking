name: ZUNO LAB — recherche des secours et non-régression
on:
  push:
    branches: ['lab/zuno-119-qualification-20261128']
    paths: ['.github/workflows/zuno-lab-secours.yml', 'android-app/ci/zuno_lab/secours_bench_test.dart']
permissions:
  contents: read
env:
  FLUTTER_SUPPRESS_ANALYTICS: 'true'
  DART_SUPPRESS_ANALYTICS: 'true'
jobs:
  secours:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.7'
          channel: stable
      - name: Comparer douze mesures par chemin, dont une de chauffe
        working-directory: android-app
        run: |
          set -euo pipefail
          flutter pub get
          flutter gen-l10n
          mkdir -p "$RUNNER_TEMP/mesures"
          export BACKEND_URL=http://127.0.0.1:18789
          opts=(--no-pub --concurrency=1 --reporter expanded --dart-define=ZUNO_EDITION=auto --dart-define=ZUNO_FREE_PLAYER=true --dart-define=PLAY_BUILD=true --dart-define=BACKEND_URL=$BACKEND_URL)
          cp ci/zuno_lab/secours_bench_test.dart test/perf/zuno_secours_test.dart
          file=lib/features/player/domain/live_fallback.dart
          for item in 1A 2B 3B 4A; do
            git show "a096b2f85de082622ec232fa198069bdefbbccab:android-app/$file" > "$file"
            if [[ "$item" == *B ]]; then (cd .. && git apply android-app/ci/zuno_lab/essai-secours.patch); fi
            ZUNO_FALLBACK_OUTPUT="$RUNNER_TEMP/mesures/$item.json" flutter test "${opts[@]}" test/perf/zuno_secours_test.dart test/features/player/live_fallback_test.dart
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: zuno-secours-20000
          path: ${{ runner.temp }}/mesures/
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.7'
          channel: stable
      - name: Tester ZUNO adaptatif et la préparation des éditions
        working-directory: android-app
        run: |
          set -euo pipefail
          flutter pub get
          flutter gen-l10n
          python3 ci/play_editions/test_editions.py
          flutter test --no-pub --concurrency=2 --reporter expanded --dart-define=ZUNO_EDITION=auto --dart-define=ZUNO_FREE_PLAYER=true --dart-define=PLAY_BUILD=true --dart-define=BACKEND_URL=http://127.0.0.1:18789 \
            test/core/blackbox test/features/profiles test/features/security test/features/recordings \
            test/features/epg test/features/player/pip_video_dimensions_test.dart test/features/player/reconnect_plan_test.dart \
            test/features/tv/zuno_pip_player_widget_test.dart test/features/tv/zuno_tv_m3u_variant_test.dart \
            test/features/tv/desktop/zuno_mobile_cast_controls_test.dart test/features/tv/tv_channel_guide_replay_test.dart \
            test/features/cast/session_lifecycle_test.dart test/features/cast/data/relay_upstream_reconnect_test.dart \
            test/features/playlists/profile_source_switches_test.dart
