# ============================================================================
#  ci-tests.yml — Garde-fou qualité : `flutter analyze` + `flutter test`
#
#  POURQUOI (Étape 4 du brief stabilité-zap) : jusqu'ici AUCUN workflow ne
#  lançait les tests ni l'analyse statique. Les 14 fichiers de test du repo
#  n'étaient donc jamais exécutés en CI → une régression pouvait passer
#  inaperçue. Ce workflow rend les deux BLOQUANTS sur push/PR : si l'analyse
#  trouve une erreur ou si un test échoue, le job est rouge.
#
#  Léger et rapide : pas besoin du SDK Android ici (les tests tournent sur la
#  VM Dart). On installe juste Java + Flutter, on résout les deps, on génère
#  les localisations (certains widgets en dépendent), puis analyze + test.
# ============================================================================
name: CI — analyze & tests

on:
  push:
    branches: ['main', 'claude/**', 'feature/**']
    paths:
      - 'lib/**'
      - 'test/**'
      - 'packages/**'
      - 'pubspec.yaml'
      - 'analysis_options.yaml'
      - 'l10n.yaml'
      - '.github/workflows/ci-tests.yml'
  pull_request:
    paths:
      - 'lib/**'
      - 'test/**'
      - 'packages/**'
      - 'pubspec.yaml'
      - 'analysis_options.yaml'
      - 'l10n.yaml'
  workflow_dispatch:

jobs:
  analyze-and-test:
    name: flutter analyze + test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      # Les écrans utilisent AppLocalizations (généré depuis les .arb). On le
      # génère avant l'analyse/les tests pour éviter les imports manquants.
      - name: Generate AppLocalizations
        run: flutter gen-l10n || true

      # BLOQUANT sur les ERREURS uniquement (références indéfinies, types, code
      # qui ne compile pas). On NE bloque PAS sur les infos/warnings de style
      # (~250 `prefer_const`, quelques imports inutilisés) : c'est une dette
      # pré-existante, à résorber séparément, et la rendre bloquante d'un coup
      # ferait échouer tout le repo sans rapport avec la stabilité du lecteur.
      #
      # NB : `flutter analyze` sort en code 1 dès qu'il reste la MOINDRE info,
      # même avec --no-fatal-*. On ne se fie donc PAS à son code de sortie : on
      # capture la sortie et on échoue UNIQUEMENT s'il y a des lignes de
      # sévérité « error ». Filet anti-régression conservé : un test qui ne
      # compile plus / un symbole renommé / un mauvais type = error = CI rouge.
      - name: Flutter analyze (bloquant sur erreurs)
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee analyze.log || true
          if grep -qE "(^|[[:space:]])error[[:space:]]•" analyze.log; then
            echo "::error::flutter analyze a trouvé des ERREURS (voir le journal ci-dessus)."
            exit 1
          fi
          echo "✓ Aucune ERREUR d'analyse (infos/warnings de style tolérés)."

      # BLOQUANT : tous les tests unitaires/widget doivent passer.
      - name: Flutter test (bloquant)
        run: flutter test --reporter expanded
