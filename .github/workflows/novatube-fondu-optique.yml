name: NovaTube audit Android 11 (mires uniquement)

on:
  push:
    branches: ['qa/novatube-fondu-optique-20261127']

permissions:
  contents: read

concurrency:
  group: novatube-tv-test-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  FLUTTER_SUPPRESS_ANALYTICS: 'true'
  NOVATUBE_TV_APP_ID: com.sevenmotion.novatube.tv
  NOVATUBE_TV_VERSION: '1.0.0'

jobs:
  emulator:
    name: Ouvrir l'APK sur Android 11 (émulateur TV 1080p, hors réseau)
    strategy:
      fail-fast: false
      matrix:
        ordre: [AB, BA]
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout (script de contrôle du même commit)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: APK A release
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          github-token: ${{ github.token }}
          run-id: '46010144518'
          name: novatube-tv-apk-52e2b794383e097607c0d5b12dd722b5cdbcf370
          path: artifacts/A/release

      - name: APK A emu
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          github-token: ${{ github.token }}
          run-id: '46010144518'
          name: novatube-emulateur-apk-52e2b794383e097607c0d5b12dd722b5cdbcf370
          path: artifacts/A/emu

      - name: Attendre la fin de la compilation du second APK déjà lancée
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for n in $(seq 1 70); do
            result=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/46012631686" --jq '[.status,.conclusion] | @tsv')
            case "$result" in
              completed*success) break ;;
              completed*) exit 1 ;;
            esac
            sleep 15
          done
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/46012631686" --jq .conclusion)" = success

      - name: APK B release
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          github-token: ${{ github.token }}
          run-id: '46012631686'
          name: novatube-tv-apk-87c6662a7ff3d9640841d9f8700807ec5d3d1a15
          path: artifacts/B/release

      - name: APK B emu
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          github-token: ${{ github.token }}
          run-id: '46012631686'
          name: novatube-emulateur-apk-87c6662a7ff3d9640841d9f8700807ec5d3d1a15
          path: artifacts/B/emu

      - name: Code serveur Atlas NovaTube (lecture seule, routes /api/novatube4k)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feature/novatube-activation-status-20261114
          path: atlas
          persist-credentials: false
          sparse-checkout: android-app/cloudflare

      - name: Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Installer les dépendances de l'Atlas local
        run: cd atlas/android-app/cloudflare && npm ci --no-audit --no-fund

      - name: Java 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      - name: SDK Android
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Bibliothèques Linux de l'émulateur et accélération KVM
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libpulse0 ffmpeg tesseract-ocr python3-pil
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm

      - name: Fabriquer la liste M3U de test (mires générées, aucun fournisseur)
        run: |
          set -euo pipefail
          media="$RUNNER_TEMP/novatube-media"
          mkdir -p "$media/A" "$media/B"
          python3 android-app/ci/novatube_tv/pilot_live_source.py prepare "$RUNNER_TEMP/novatube-encoded"
          for ch in A B; do
            ffmpeg -hide_banner -nostdin -loglevel error -y -i "$RUNNER_TEMP/novatube-encoded/$ch.mkv" -c copy -f hls -hls_playlist_type vod -hls_time 2 -hls_segment_filename "$media/$ch/seg%04d.ts" "$media/$ch/index.m3u8"
          done
          cat > "$media/novatube-test.m3u" <<'M3U'
          #EXTM3U
          #EXTINF:-1 group-title="Test NovaTube",Mire de test 1080p
          http://127.0.0.1:8080/A/index.m3u8
          #EXTINF:-1 group-title="Test NovaTube",Barres HD de test
          http://127.0.0.1:8080/B/index.m3u8
          M3U

      - name: Mesures croisées sur un même hôte
        env:
          ORDRE: ${{ matrix.ordre }}
        run: |
          set -euo pipefail
          errors=0
          for i in 0 1; do
            variant="${ORDRE:i:1}"
            (cd "artifacts/$variant/release" && sha256sum -c SHA256SUMS.txt)
            emu="artifacts/$variant/emu/NovaTube-TV-emulateur.apk"
            sha256sum "$emu"
            apk=$(find "artifacts/$variant/release" -name '*.apk' -print -quit)
            ATLAS_PORT=8788 node android-app/ci/novatube_tv/atlas_local_server.mjs atlas/android-app/cloudflare "$RUNNER_TEMP/atlas-$variant.json" > "$RUNNER_TEMP/atlas-$variant.log" 2>&1 &
            service=$!
            for k in $(seq 1 50); do test ! -s "$RUNNER_TEMP/atlas-$variant.json" || break; sleep .5; done
            test -s "$RUNNER_TEMP/atlas-$variant.json"
            NOVATUBE_EMULATOR_APK="$emu" NOVATUBE_TEST_MEDIA="$RUNNER_TEMP/novatube-media" bash android-app/ci/novatube_tv/emulator_smoke.sh "$apk" "artifacts/results/$variant" || errors=1
            kill "$service" || true
            wait "$service" || true
            sleep 3
          done
          exit "$errors"

      - name: Conserver captures et journaux (même en cas d'échec)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: novatube-fondu-optique-${{ matrix.ordre }}-${{ github.sha }}
          path: artifacts/results/
          if-no-files-found: warn
          retention-days: 14
