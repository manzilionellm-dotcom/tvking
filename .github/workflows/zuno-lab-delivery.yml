name: ZUNO LAB — installation et double ouverture du candidat
on:
  push:
    branches: ['lab/zuno-119-qualification-20261128']
    paths: ['.github/workflows/zuno-lab-delivery.yml']

permissions:
  contents: read
  actions: read

env:
  BUILD_RUN: '46095717223'
  BUILD_SHA: daba06b196754e4fff9dbfd8a454bd804b752be6
  RIGHTS_RUN: '46095717245'
  LAB_PACKAGE: com.sevenmotion.tv.seven_tv.lab

jobs:
  exact:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Attendre le constructeur signé de cette révision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for i in {1..60}; do
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN" > "$RUNNER_TEMP/run.json"
            jq -e --arg expected "$BUILD_SHA" '.head_sha==$expected and .path==".github/workflows/zuno-lab-build.yml" and .head_branch=="lab/zuno-119-qualification-20261128"' "$RUNNER_TEMP/run.json" >/dev/null
            if [[ "$(jq -r .status "$RUNNER_TEMP/run.json")" == completed ]]; then break; fi
            sleep 20
          done
          jq -e '.conclusion=="success"' "$RUNNER_TEMP/run.json" >/dev/null
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.BUILD_RUN }}
          name: zuno-lab-${{ env.BUILD_SHA }}
          path: apk
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          github-token: ${{ github.token }}
          run-id: 45710084378
          artifact-ids: 15068980205
          merge-multiple: true
          path: original
      - name: Vérifier les empreintes de la chaîne native de lecture
        run: |
          (cd apk && sha256sum -c SHA256SUMS)
          echo "43fcccd171434d18961a2c27aeed8064ab2f08aeffcf7364f0ae439560fa149d  original/ZUNO-auto-119.aab" | sha256sum -c -
          python3 android-app/ci/zuno_lab/engine_bytes.py original/ZUNO-auto-119.aab apk/ZUNO-LAB.apk moteurs.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: inventaire-natif-ZUNO
          path: moteurs.json

  launch:
    needs: exact
    runs-on: ubuntu-24.04
    timeout-minutes: 33
    strategy:
      fail-fast: false
      matrix:
        include:
          - {kind: tv, image: 'system-images;android-36;android-tv;x86_64'}
          - {kind: phone, image: 'system-images;android-30;google_apis;x86_64'}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.BUILD_RUN }}
          name: zuno-lab-${{ env.BUILD_SHA }}
          path: apk
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
      - name: Lire le premier écran et chronométrer les activités
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          set -euo pipefail
          (cd apk && sha256sum -c SHA256SUMS)
          sudo apt-get update -qq
          sudo apt-get install -y -qq libpulse0 tesseract-ocr python3-pil
          source android-app/ci/zuno_lab/boot_lab.sh "$IMAGE" "$PWD/qa"
          adb install -g apk/ZUNO-LAB.apk
          source_path=$(adb shell pm path "$LAB_PACKAGE" | tr -d '\r' | sed 's/^package://')
          adb shell sha256sum "$source_path" | cut -d' ' -f1 > qa/installed.before
          test "$(cat qa/installed.before)" = "$(awk '{print $1}' apk/SHA256SUMS)"
          visual=0
          python3 android-app/ci/zuno_lab/visible_launch.py qa || visual=$?
          series=0
          python3 android-app/ci/zuno_lab/device_smoke.py --apk apk/ZUNO-LAB.apk --package "$LAB_PACKAGE" --out qa/launches --count 30 || series=$?
          adb shell sha256sum "$source_path" | cut -d' ' -f1 > qa/installed.after
          cmp qa/installed.before qa/installed.after
          test "$visual" -eq 0
          # Les métriques HOME contiennent chaque échec, y compris les erreurs
          # de commande malgré présence au premier plan. Une collecte interrompue
          # ou des octets différents bloquent la remise de cet APK interne.
          python3 - <<'PYSERIES'
          import json, pathlib
          r=json.loads(pathlib.Path('qa/launches/summary.json').read_text())
          digest=pathlib.Path('qa/installed.after').read_text().strip()
          assert r['installed_after_series']=={'base.apk':digest}
          for name in ('cold','warm'):
              row=r[name]
              assert row['attempts']==row['successes']+row['errors']==30, row
              print(name, row['successes'], 'réussites sur', row['attempts'], 'P95', row['host_command'].get('p95_nearest_rank_ms'))
          PYSERIES
          echo "Statut des 60 commandes d’activité : $series" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: zuno-lab-${{ matrix.kind }}-preuves
          path: qa/

  journal:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.7'
          cache: false
          pub-cache: false
      - name: Reproduire le détail erroné sur 926 puis vérifier la version d’APK demandée
        working-directory: android-app
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/journal"
          flutter pub get
          flutter gen-l10n
          for path in lib/core/blackbox/black_box.dart lib/features/tv/presentation/tv_black_box_screen.dart; do
            git show "926377d224daf77b14b775981adfe1590e5d113a:android-app/$path" > "$path"
          done
          if flutter test --no-pub --concurrency=1 --reporter expanded test/core/blackbox/black_box_session_widget_test.dart > "$RUNNER_TEMP/journal/temoin.log" 2>&1; then
            echo 'Le défaut du témoin n’est pas reproduit'; exit 1
          fi
          grep -F 'ZUNO_SORTIE_NON_CORRELEE' "$RUNNER_TEMP/journal/temoin.log"
          for path in lib/core/blackbox/black_box.dart lib/features/tv/presentation/tv_black_box_screen.dart; do
            git show "$BUILD_SHA:android-app/$path" > "$path"
          done
          flutter test --no-pub --concurrency=1 --reporter expanded test/core/blackbox/ | tee "$RUNNER_TEMP/journal/candidat.log"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: comparaison-journal-926-daba
          path: ${{ runner.temp }}/journal/
  deliver:
    needs: [launch,journal]
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: write
      actions: read
    steps:
      - name: Contrôler les trois transitions de droits pour cette révision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RIGHTS_RUN" > "$RUNNER_TEMP/rights.json"
          jq -e --arg sha "$BUILD_SHA" '.head_sha==$sha and .path==".github/workflows/zuno-lab-guide.yml" and .conclusion=="success"' "$RUNNER_TEMP/rights.json"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.BUILD_RUN }}
          name: zuno-lab-${{ env.BUILD_SHA }}
          path: apk
      - name: Rattacher la préversion au reçu et relire son APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = manzilionellm-dotcom/tvking
          test "$GITHUB_REF" = refs/heads/lab/zuno-119-qualification-20261128
          repo="$GITHUB_REPOSITORY"
          tag="zuno-lab-119-${BUILD_SHA:0:12}-$BUILD_RUN"
          (cd apk && sha256sum -c SHA256SUMS)
          digest=$(sha256sum apk/ZUNO-LAB.apk | cut -d' ' -f1)
          for kind in tv phone; do
            gh run download "$GITHUB_RUN_ID" -R "$repo" -n "zuno-lab-$kind-preuves" -D "$kind"
            test "$(cat "$kind/installed.before")" = "$digest"
            cmp "$kind/installed.before" "$kind/installed.after"
          done
          if ! gh api "repos/$repo/git/ref/tags/$tag" > tag.json 2>/dev/null; then
            gh api --method POST "repos/$repo/git/refs" -f ref="refs/tags/$tag" -f sha="$GITHUB_SHA" > tag.json
          fi
          tag_sha=$(jq -r '.object.sha' tag.json)
          gh api "repos/$repo/compare/$BUILD_SHA...$tag_sha" | jq -e '.status=="ahead" or .status=="identical"'
          if ! gh release view "$tag" -R "$repo" >/dev/null 2>&1; then
            gh release create "$tag" --verify-tag --prerelease --latest=false -R "$repo" --title "ZUNO LAB 119 — diagnostic de session corrigé" --notes "Canal LAB. Source exacte de l’APK $BUILD_SHA, constructeur $BUILD_RUN, paquet $LAB_PACKAGE. Clé de test propre à ce constructeur. Panel local, ajout de listes personnelles. Cette préversion est indépendante de la diffusion Play."
          fi
          gh api "repos/$repo/releases/tags/$tag" > publication.json
          jq -e --arg name "$tag" '.tag_name==$name and .prerelease and (.draft|not)' publication.json
          for asset in ZUNO-LAB.apk SHA256SUMS signature.txt; do
            if ! jq -e --arg name "$asset" 'any(.assets[];.name==$name)' publication.json >/dev/null; then
              gh release upload "$tag" -R "$repo" "apk/$asset"
            fi
          done
          url="https://github.com/$repo/releases/download/$tag/ZUNO-LAB.apk"
          curl --fail --silent --show-error --location --retry 6 --retry-all-errors "$url" -o "$RUNNER_TEMP/relu.apk"
          echo "$digest  $RUNNER_TEMP/relu.apk" | sha256sum -c -
          echo "[APK signé ouvert sur TV et téléphone]($url) — $digest" >> "$GITHUB_STEP_SUMMARY"
