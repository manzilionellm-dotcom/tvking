name: ZUNO LAB — installation et double ouverture du candidat
on:
  push:
    branches: ['lab/zuno-119-qualification-20261128']
    paths: ['.github/workflows/zuno-lab-delivery.yml']

permissions:
  contents: read
  actions: read

env:
  BUILD_RUN: '46091822042'
  BUILD_SHA: 926377d224daf77b14b775981adfe1590e5d113a
  RIGHTS_RUN: '46091822040'
  LAB_PACKAGE: com.sevenmotion.tv.seven_tv.lab

jobs:
  exact:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Attendre le constructeur signé de cette révision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for i in {1..60}; do
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN" > "$RUNNER_TEMP/run.json"
            jq -e --arg expected "$BUILD_SHA" '.head_sha==$expected and .path==".github/workflows/zuno-lab-build.yml" and .head_branch=="lab/zuno-119-qualification-20261128"' "$RUNNER_TEMP/run.json" >/dev/null
            if [[ "$(jq -r .status "$RUNNER_TEMP/run.json")" == completed ]]; then break; fi
            sleep 20
          done
          jq -e '.conclusion=="success"' "$RUNNER_TEMP/run.json" >/dev/null
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.BUILD_RUN }}
          name: zuno-lab-${{ env.BUILD_SHA }}
          path: apk
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          github-token: ${{ github.token }}
          run-id: 45710084378
          artifact-ids: 15068980205
          merge-multiple: true
          path: original
      - name: Vérifier les empreintes de la chaîne native de lecture
        run: |
          (cd apk && sha256sum -c SHA256SUMS)
          echo "43fcccd171434d18961a2c27aeed8064ab2f08aeffcf7364f0ae439560fa149d  original/ZUNO-auto-119.aab" | sha256sum -c -
          python3 android-app/ci/zuno_lab/engine_bytes.py original/ZUNO-auto-119.aab apk/ZUNO-LAB.apk moteurs.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: inventaire-natif-ZUNO
          path: moteurs.json

  launch:
    needs: exact
    runs-on: ubuntu-24.04
    timeout-minutes: 33
    strategy:
      fail-fast: false
      matrix:
        include:
          - {kind: tv, image: 'system-images;android-36;android-tv;x86_64'}
          - {kind: phone, image: 'system-images;android-30;google_apis;x86_64'}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.BUILD_RUN }}
          name: zuno-lab-${{ env.BUILD_SHA }}
          path: apk
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
      - name: Lire le premier écran et chronométrer les activités
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          set -euo pipefail
          (cd apk && sha256sum -c SHA256SUMS)
          sudo apt-get update -qq
          sudo apt-get install -y -qq libpulse0 tesseract-ocr python3-pil
          source android-app/ci/zuno_lab/boot_lab.sh "$IMAGE" "$PWD/qa"
          adb install -g apk/ZUNO-LAB.apk
          source_path=$(adb shell pm path "$LAB_PACKAGE" | tr -d '\r' | sed 's/^package://')
          adb shell sha256sum "$source_path" | cut -d' ' -f1 > qa/installed.before
          test "$(cat qa/installed.before)" = "$(awk '{print $1}' apk/SHA256SUMS)"
          visual=0
          python3 android-app/ci/zuno_lab/visible_launch.py qa || visual=$?
          series=0
          python3 android-app/ci/zuno_lab/device_smoke.py --apk apk/ZUNO-LAB.apk --package "$LAB_PACKAGE" --out qa/launches --count 30 || series=$?
          adb shell sha256sum "$source_path" | cut -d' ' -f1 > qa/installed.after
          cmp qa/installed.before qa/installed.after
          test "$visual" -eq 0
          # Les métriques HOME contiennent chaque échec, y compris les erreurs
          # de commande malgré présence au premier plan. Une collecte interrompue
          # ou des octets différents bloquent la remise de cet APK interne.
          python3 - <<'PYSERIES'
          import json, pathlib
          r=json.loads(pathlib.Path('qa/launches/summary.json').read_text())
          digest=pathlib.Path('qa/installed.after').read_text().strip()
          assert r['installed_after_series']=={'base.apk':digest}
          for name in ('cold','warm'):
              row=r[name]
              assert row['attempts']==row['successes']+row['errors']==30, row
              print(name, row['successes'], 'réussites sur', row['attempts'], 'P95', row['host_command'].get('p95_nearest_rank_ms'))
          PYSERIES
          echo "Statut des 60 commandes d’activité : $series" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: zuno-lab-${{ matrix.kind }}-preuves
          path: qa/

  deliver:
    needs: launch
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: write
      actions: read
    steps:
      - name: Contrôler les trois transitions de droits pour cette révision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RIGHTS_RUN" > "$RUNNER_TEMP/rights.json"
          jq -e --arg sha "$BUILD_SHA" '.head_sha==$sha and .path==".github/workflows/zuno-lab-guide.yml" and .conclusion=="success"' "$RUNNER_TEMP/rights.json"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.BUILD_RUN }}
          name: zuno-lab-${{ env.BUILD_SHA }}
          path: apk
      - name: Créer une nouvelle préversion LAB et relire son fichier
        working-directory: apk
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha256sum -c SHA256SUMS
          tag="zuno-lab-119-${BUILD_SHA:0:12}-$BUILD_RUN"
          expected=$(awk '{print $1}' SHA256SUMS)
          if ! gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" ZUNO-LAB.apk SHA256SUMS signature.txt --target "$BUILD_SHA" --prerelease --latest=false \
              -R "$GITHUB_REPOSITORY" --title "ZUNO LAB 119 — essai téléphone et TV" \
              --notes "Essai interne uniquement. Paquet $LAB_PACKAGE. Base ZUNO 119. Clé de test propre à la compilation $BUILD_RUN. Les listes personnelles sont disponibles. Le panel de cette édition vise la boucle locale du banc."
          fi
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/ZUNO-LAB.apk"
          curl -fsSL --retry 8 --retry-all-errors "$url" -o "$RUNNER_TEMP/recu.apk"
          echo "$expected  $RUNNER_TEMP/recu.apk" | sha256sum -c -
          echo "[APK vérifié]($url) — $expected" >> "$GITHUB_STEP_SUMMARY"
