# ============================================================
#  tests.yml — Tests unitaires Dart (cœur métier)
# ============================================================
#  VOLONTAIREMENT SÉPARÉ des workflows de build (build-tv / build-android /
#  build-prive) : un test rouge NE DOIT JAMAIS bloquer la publication d'un APK.
#  Ce workflow ne fait que COMPILER et exécuter `flutter test` → il sert de
#  filet de régression sur la logique critique (parsing, anti-boucle, anti-OOM)
#  sans toucher au pipeline de release.
# ============================================================
name: Tests

on:
  push:
    branches:
      - main
      - "claude/**"
      - "feature/**"
  workflow_dispatch:

jobs:
  unit-tests:
    name: flutter test (cœur métier)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      # Génère AppLocalizations (generate: true) au cas où un test futur en
      # dépendrait. Best-effort : ne bloque pas si rien à générer.
      - name: Generate AppLocalizations
        run: flutter gen-l10n || true

      # Gate VERT sur les suites qu'on durcit (anti-boucle, anti-OOM, parsing,
      # chiffrement). La suite complète reste rouge à cause de tests
      # PRÉ-EXISTANTS hérités, non liés à ce travail, à nettoyer dans un lot
      # dédié (chacun = assertion périmée, API supprimée, ou binding de test
      # non initialisé) :
      #   - test/features/cast/data/preflight_reachability_test.dart
      #   - test/features/cast/multicast_lock_test.dart
      #   - test/features/recordings/data/auto_stop_reason_test.dart
      # (lg_diagnostic_fixes_test + cast_discovery_rules_test déjà traités.)
      - name: Run unit tests (cœur métier)
        run: flutter test test/core test/features/playlists --reporter expanded
