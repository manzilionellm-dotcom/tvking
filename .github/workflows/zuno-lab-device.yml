name: ZUNO LAB • témoin 119 sur téléviseur Android émulé

on:
  push:
    branches: [lab/zuno-119-qualification-20261128]
    paths:
      - '.github/workflows/zuno-lab-device.yml'
      - 'android-app/ci/zuno_lab/device_smoke.py'
      - 'android-app/ci/zuno_lab/run_witness_device.sh'

permissions:
  contents: read
  actions: read

jobs:
  witness:
    runs-on: ubuntu-24.04
    timeout-minutes: 48
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          github-token: ${{ github.token }}
          run-id: 45710084378
          artifact-ids: 15068980205
          merge-multiple: true
          path: ${{ runner.temp }}/official
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
      - name: Transformer le bundle sans recompiler et chronométrer les activités
        run: bash android-app/ci/zuno_lab/run_witness_device.sh
      - name: Conserver uniquement les résultats expurgés
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: zuno-witness-119-activity
          path: zuno-witness/
          retention-days: 14
          if-no-files-found: error
