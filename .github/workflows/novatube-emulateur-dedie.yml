name: NovaTube TV • émulateur dédié au binaire 425c46f1
'on':
  push:
    branches:
    - qa/nt-emulateur-425c46f1
permissions:
  contents: read
  actions: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 42
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Java 17 (Temurin)
      uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
      with:
        distribution: temurin
        java-version: '17'
    - name: SDK Android
      uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
    - name: Préparer le contrôle sur une machine dédiée
      run: |
        set -euo pipefail
        df -h /
        test -c /dev/kvm
        sudo chmod a+rw /dev/kvm
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends libpulse0
        umask 077
        openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out "$RUNNER_TEMP/runner.pem" 2>/dev/null
        openssl pkey -in "$RUNNER_TEMP/runner.pem" -pubout -out "$RUNNER_TEMP/runner.pub"
    - name: Partager la clé publique de cette exécution
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: demande-emulateur-${{ github.run_id }}
        path: ${{ runner.temp }}/runner.pub
        if-no-files-found: error
        retention-days: 1
    - name: Reprendre le candidat chiffré de la compilation 425c46f1
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        github-token: ${{ github.token }}
        run-id: '44048584363'
        name: novatube-tv-prive-425c46f187efdf9611694a2ff781be1bfa7a8cfc
        path: coffre
    - name: Ouvrir uniquement cet APK sur le runner
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        umask 077
        found=false
        for i in $(seq 1 120); do
          if gh api "repos/$GITHUB_REPOSITORY/contents/.github/qa-session.b64?ref=qa/nt-session-$GITHUB_RUN_ID" --jq .content 2>/dev/null | base64 -d | base64 -d > "$RUNNER_TEMP/session.rsa" && test "$(wc -c < "$RUNNER_TEMP/session.rsa")" -eq 384; then found=true; break; fi
          sleep 5
        done
        test "$found" = true
        openssl pkeyutl -decrypt -inkey "$RUNNER_TEMP/runner.pem" -in "$RUNNER_TEMP/session.rsa" -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -out "$RUNNER_TEMP/session.key"
        rm "$RUNNER_TEMP/runner.pem"
        python3 - <<'PYTHON'
        import os, subprocess, sys
        from pathlib import Path
        sys.path.insert(0,'.github/qa-outils')
        from cms_apk import cms_parts
        tmp=Path(os.environ['RUNNER_TEMP'])
        data=Path('coffre/NovaTube-TV.apk.cms').read_bytes()
        _,iv,(a,b)=cms_parts(data)
        key=(tmp/'session.key').read_bytes()
        assert len(key)==32
        with (tmp/'cible.apk').open('wb') as f:
         subprocess.run(['openssl','enc','-d','-aes-256-cbc','-K',key.hex(),'-iv',iv.hex()],input=data[a:b],stdout=f,check=True)
        (tmp/'session.key').unlink()
        PYTHON
        echo "44ccd223942ec418842016ed7f5712e28d54c84b9bbf37a02962a585883fe758  $RUNNER_TEMP/cible.apk" | sha256sum -c -
    - name: Installer le fichier signé et piloter l’application sous Android 11
      run: |
        set -euo pipefail
        df -h /
        python3 - <<'PYTHON'
        from pathlib import Path
        source=Path('android-app/ci/novatube_tv/emulator_smoke.sh')
        text=source.read_text()
        text=text.replace('adb -s "$serial" logcat -d -v threadtime', 'timeout 8s adb -s "$serial" logcat -d -v threadtime')
        text=text.replace('adb -s "$serial" exec-out screencap -p > "$out/99', 'timeout 8s adb -s "$serial" exec-out screencap -p > "$out/99')
        text=text.replace('adb -s "$serial" emu kill', 'timeout 8s adb -s "$serial" emu kill')
        text=text.replace('adb -s "$serial" shell getprop sys.boot_completed', 'timeout 8s adb -s "$serial" shell getprop sys.boot_completed')
        text=text.replace('  if [[ -n "$emu_pid" ]]','  if [[ "$status" != 0 ]]; then tail -40 "$out/emulator.txt" || true; df -h /; fi\n  if [[ -n "$emu_pid" ]]')
        Path('smoke-dedie.sh').write_text(text)
        PYTHON
        timeout --kill-after=40s 23m bash smoke-dedie.sh "$RUNNER_TEMP/cible.apk" preuves
    - name: Conserver les résultats, la signature et les captures
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: resultats-emulateur-${{ github.run_id }}
        path: preuves/
        if-no-files-found: ignore
        retention-days: 7
