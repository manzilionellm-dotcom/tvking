# =========================================================
#  quality-zuno.yml — Tests de la box et preuve Sport dédiée
# =========================================================
#  GitHub ne lance QUE les workflows du dossier `.github/workflows`
#  à la RACINE du dépôt. L'ancien fichier
#  `android-app/.github/workflows/quality.yml` ne partait donc
#  jamais. Celui-ci est au bon endroit.
#
#  Les tests ne publient rien. La PR de preuve Sport du propriétaire
#  appelle build-zuno-tv.yml sur zuno-tv-test après les deux barrières.
#  Aucun déploiement Worker/panel, aucune écriture sur zuno-tv.
# =========================================================

name: Quality Zuno (tests)

on:
  push:
    branches:
      - main
      - 'claude/**'
      - 'feature/**'
    paths:
      - 'android-app/lib/**'
      - 'android-app/test/**'
      - 'android-app/pubspec.yaml'
      - 'android-app/pubspec.lock'
      - 'android-app/analysis_options.yaml'
      - 'android-app/cloudflare/**'
      - '.github/workflows/quality-zuno.yml'
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: quality-zuno-${{ github.ref }}
  # La preuve dédiée peut publier sur zuno-tv-test : un autre commit ne
  # doit pas couper son téléversement entre l'APK et le manifeste.
  cancel-in-progress: ${{ github.event_name != 'pull_request' || github.event.pull_request.base.ref != 'ccr-sport-preuve-20261008' }}

permissions:
  contents: read

jobs:
  flutter:
    name: flutter analyze + test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: android-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run tests
        run: flutter test --reporter expanded

  worker:
    name: tests Worker (sécurité)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Smoke + sécurité
        run: |
          node android-app/cloudflare/worker_security.smoke.mjs
          node android-app/cloudflare/zuno_security.test.mjs

  changes:
    name: Choisir l’APK concerné
    runs-on: ubuntu-latest
    outputs:
      box: ${{ steps.paths.outputs.box }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
      - id: paths
        run: |
          python3 - <<'PYPATHS'
          import os,subprocess
          paths=subprocess.check_output(['git','diff','--name-only','HEAD^','HEAD'],text=True).splitlines()
          roots=['android-app/lib/','android-app/test/','android-app/packages/','android-app/android_overlay/','android-app/pubspec']
          box=any(any(p.startswith(r) for r in roots) for p in paths)
          with open(os.environ['GITHUB_OUTPUT'],'a') as out: out.write('box='+str(box).lower()+'\n')
          PYPATHS

  # Appel réservé à la PR de preuve créée par le propriétaire. Le workflow
  # n'est pas sur main : cet appel évite de toucher la branche interdite.
  sport-test-box:
    name: APK Sport pour la box de test
    needs: [flutter, worker, changes]
    if: >-
      github.event_name == 'pull_request' &&
      needs.changes.outputs.box == 'true' &&
      github.repository == 'manzilionellm-dotcom/tvking' &&
      github.actor == github.repository_owner &&
      github.event.pull_request.user.login == github.repository_owner &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'ccr-b93e1afd-gwirw0' &&
      github.event.pull_request.base.ref == 'ccr-sport-preuve-20261008'
    permissions:
      contents: write
    uses: ./.github/workflows/build-zuno-tv.yml
    with:
      publish: 'false'
      test_box: 'true'
      play_aab: 'false'
      backend_url: ''
      variante: 'box'
    secrets:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

  mobile-sport-test:
    name: APK mobile Sport gratuit
    needs: [flutter, worker]
    if: >-
      github.event_name == 'pull_request' &&
      github.repository == 'manzilionellm-dotcom/tvking' &&
      github.actor == github.repository_owner &&
      github.event.pull_request.user.login == github.repository_owner &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'ccr-b93e1afd-gwirw0' &&
      github.event.pull_request.base.ref == 'ccr-sport-preuve-20261008'
    permissions:
      contents: write
    uses: ./.github/workflows/build-7motion-sport-test.yml
    secrets:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
