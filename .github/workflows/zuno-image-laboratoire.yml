name: ZUNO TV · APK de comparaison et rendu Android
'on':
  push:
    branches:
    - qa/zuno-tv-1794878682-laboratoire
permissions:
  contents: read
concurrency:
  group: zuno-image-1794878682-essai
  cancel-in-progress: false
defaults:
  run:
    working-directory: android-app
env:
  SOURCE_SHA: f7acfcd86bfcada85d5ff5b6b16d850aef8f0b64
  ZUNO_APP_ID: com.sevenmotion.tv.seven_tv.imageqa
  ZUNO_APP_LABEL: Zuno TV Test
  APK_NAME: zuno-tv.apk
  ESSAI: 'false'
  PUBLIER: 'false'
  EXPECTED_CERT: 5145b8e019f6d5fb96a207f2e73673fd954f799966fd598889211556cbdf9e61
jobs:
  build-tv:
    name: Construire Zuno TV Test
    if: github.actor == github.repository_owner && github.triggering_actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 55
    outputs:
      version-name: ${{ env.TV_VERSION_NAME }}
      version-code: ${{ env.TV_BUILD_NUMBER }}
      signing: ${{ env.SIGNING }}
      apk-cert: ${{ env.APK_CERT }}
      source-sha: ${{ steps.apk-identity.outputs.source-sha }}
      build-attempt: ${{ steps.apk-identity.outputs.build-attempt }}
      apk-sha256: ${{ steps.apk-identity.outputs.sha256 }}
      apk-size: ${{ steps.apk-identity.outputs.size }}
      apk-artifact-id: ${{ steps.apk-upload.outputs.artifact-id }}
      apk-artifact-digest: ${{ steps.apk-upload.outputs.artifact-digest }}
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        fetch-depth: 1
        ref: ${{ env.SOURCE_SHA }}
    - name: Autoriser le build signé et son canal
      working-directory: .
      env:
        APP_PUBLISH: ${{ inputs.publish || 'false' }}
        APP_TEST_BOX: ${{ inputs.test_box || 'false' }}
        APP_PLAY_AAB: ${{ inputs.play_aab || 'false' }}
        APP_BACKEND_URL: ${{ inputs.backend_url }}
        APP_VARIANT: ${{ inputs.variante || 'box' }}
      run: node .github/app-release-guard.mjs
    - name: Setup Java 17 (Temurin)
      uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
      with:
        distribution: temurin
        java-version: '17'
    - name: Setup Flutter (stable)
      uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
      with:
        flutter-version: 3.47.7
        channel: stable
        cache: false
        pub-cache: false
    - name: Setup Android SDK
      id: setup_android
      uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
      continue-on-error: true
    - name: Setup Android SDK (retry après échec transitoire)
      if: steps.setup_android.outcome == 'failure'
      uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
      continue-on-error: true
    - name: Accept Android licenses
      run: yes | sdkmanager --licenses >/dev/null 2>&1 || true
    - name: Patch manifest (Zuno, Leanback, réseau, compat box)
      run: python3 ci/tv/patch_manifest.py android/app/src/main/AndroidManifest.xml
    - name: Patch build.gradle.kts (applicationId TV, signature, R8)
      run: |
        set -e
        cp ci/proguard-rules.pro android/app/proguard-rules.pro
        python3 ci/tv/patch_gradle.py android/app/build.gradle.kts
    - name: Préserver les préférences sur les box Android 5
      if: env.ESSAI != 'true'
      run: |
        # La version 2.5.1 impose DataStore 1.2.1 (Android 6 minimum).
        # La box conserve Android 5 et la version 2.5.0 du build signé
        # du 19/10/2026. Ce pin local au runner ne touche pas le mobile.
        python3 - <<'PYEOF'
        from pathlib import Path
        path = Path('pubspec.yaml')
        source = path.read_text(encoding='utf-8')
        anchor = '  shared_preferences: ^2.3.4\n'
        if source.count(anchor) != 1 or '  shared_preferences_android:' in source:
            raise SystemExit('Contrainte SharedPreferences inattendue : vérifier le pin TV.')
        source = source.replace(anchor, anchor + '  shared_preferences_android: 2.5.0\n', 1)
        path.write_text(source, encoding='utf-8')
        PYEOF
    - name: Flutter pub get
      run: flutter pub get
    - name: Patch screen_brightness_android build.gradle (si nécessaire)
      run: |
        set -e
        FILE=$(find ~/.pub-cache/hosted/pub.dev -path "*/screen_brightness_android-*/android/build.gradle" 2>/dev/null | head -1)
        if [ -z "$FILE" ]; then
          echo "⊙ screen_brightness_android pas dans pub-cache, skip"
          exit 0
        fi
        export PATCH_FILE="$FILE"
        python3 - <<'PYEOF'
        import os, re
        file = os.environ['PATCH_FILE']
        lines = open(file).readlines()
        out, in_kotlin, depth, removed = [], False, 0, 0
        for line in lines:
            if not in_kotlin:
                if re.match(r'^\s*kotlin\s*\{', line):
                    in_kotlin = True
                    depth = line.count('{') - line.count('}')
                    removed += 1
                    if depth <= 0:
                        in_kotlin = False
                    continue
                out.append(line)
            else:
                depth += line.count('{') - line.count('}')
                removed += 1
                if depth <= 0:
                    in_kotlin = False
        if removed:
            open(file, 'w').writelines(out)
            print(f'retiré {removed} ligne(s) kotlin{{}}')
        else:
            print('aucun bloc kotlin{} (déjà propre)')
        PYEOF
    - name: Generate AppLocalizations (.arb → Dart)
      run: flutter gen-l10n
    - name: Icône launcher (logo Zuno)
      run: dart run flutter_launcher_icons -f flutter_launcher_icons_zuno_tv.yaml
    - name: Bannière Android TV + écran de lancement sombre
      run: |
        set -e
        RES=android/app/src/main/res
        mkdir -p "$RES/drawable" "$RES/drawable-xhdpi" "$RES/drawable-xxhdpi"
        # Bannière Leanback (spec Android TV : 320×180 en xhdpi).
        cp assets/branding/zuno_tv_banner.png    "$RES/drawable/tv_banner.png"
        cp assets/branding/zuno_tv_banner.png    "$RES/drawable-xhdpi/tv_banner.png"
        cp assets/branding/zuno_tv_banner_2x.png "$RES/drawable-xxhdpi/tv_banner.png"
        # Splash = calligraphie transparente sur TvTokens.bg (#070708).
        # Le thème de marche reste un aplat : un windowBackground avec
        # bitmap reste derrière Flutter toute la session et peut couvrir
        # la SurfaceView (rectangle noir, ou le logo figé à la place de
        # l'image).
        python3 ci/tv/apply_splash.py
        python3 ci/tv/apply_splash_test.py
    - name: Signer la variante isolée avec une clé de test éphémère
      run: |
        set -euo pipefail
        umask 077
        passphrase="$(openssl rand -hex 24)"
        keytool -genkeypair -keystore android/app/release.jks -storetype PKCS12 \
          -alias test -keyalg RSA -keysize 3072 -validity 3650 -storepass "$passphrase" -keypass "$passphrase" \
          -dname 'CN=Zuno TV Android Test' >/dev/null 2>&1
        printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=test\nkeyPassword=%s\n' "$passphrase" "$passphrase" > android/key.properties
        echo 'SIGNING=controle' >> "$GITHUB_ENV"
    - name: Sélection de flux, focus et préférences image
      run: flutter test --reporter expanded test/features/tv/zuno_tv_m3u_variant_test.dart test/features/tv/zuno_tv_variant_focus_test.dart test/features/tv/tv_video_focus_test.dart
        test/features/tv/tv_focusable_select_test.dart test/features/player/hdr_compat_test.dart
    - name: Nom visible du test
      run: echo "TV_VERSION_NAME=117-test.${{ github.run_number }}" >> "$GITHUB_ENV"
    - name: Build Zuno TV (release universel ARM, target main_tv)
      env:
        BACKEND_URL_INPUT: ${{ inputs.backend_url }}
      run: |
        set -e
        BUILD_NUMBER=$(date +%s)
        # Secondes epoch, donc croissant. Plancher = le dernier
        # versionCode déjà posé sur une box de test (1790642483),
        # lui-même au-dessus de la v102 (1790640358). Un APK plus
        # petit est refusé par Android.
        MIN_CODE=1790642483
        if [ "$BUILD_NUMBER" -le "$MIN_CODE" ]; then
          echo "::error title=versionCode trop petit::$BUILD_NUMBER n'est pas au-dessus de $MIN_CODE."
          exit 1
        fi
        echo "versionCode = $BUILD_NUMBER · versionName = $TV_VERSION_NAME"
        echo "TV_BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
        EXTRA_DEFINES=""
        if [ -n "$BACKEND_URL_INPUT" ]; then
          EXTRA_DEFINES="--dart-define=BACKEND_URL=$BACKEND_URL_INPUT"
          echo "backend visé : $BACKEND_URL_INPUT"
        fi
        # Box de TEST (pas la variante téléphone, autre package) : le
        # bouton « Mise à jour » lit aussi la release zuno-tv-test et
        # prend le plus récent (lib/main_tv.dart). Un APK client ne
        # reçoit jamais ce réglage.
        if [ "${{ inputs.test_box }}" = "true" ] && [ "$ESSAI" != "true" ]; then
          EXTRA_DEFINES="$EXTRA_DEFINES --dart-define=ZUNO_UPDATE_CHANNEL=test"
          echo "canal de mise à jour : test (zuno-tv-test + zuno-tv)"
        fi
        flutter build apk --release --no-tree-shake-icons \
          --android-skip-build-dependency-validation \
          --target-platform android-arm,android-arm64,android-x64 \
          --build-number="$BUILD_NUMBER" \
          --build-name="$TV_VERSION_NAME" \
          --obfuscate --split-debug-info=build/symbols \
          --dart-define=APP_BUILD_TS="$BUILD_NUMBER" \
          --dart-define=GIT_SHA=${{ env.SOURCE_SHA }} \
          $EXTRA_DEFINES \
          --target=lib/main_tv.dart
        cp build/app/outputs/flutter-apk/app-release.apk "build/app/outputs/flutter-apk/$APK_NAME"
        ls -lah build/app/outputs/flutter-apk/
    - name: Vérifier le démarrage SharedPreferences après R8
      run: |
        set -e
        BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
        python3 ci/tv/verify_apk_jni.py \
          "build/app/outputs/flutter-apk/$APK_NAME" \
          --dexdump "$BUILD_TOOLS/dexdump"
    - name: Vérifier l'APK (identité, Leanback, backend du panel)
      run: |
        set -e
        APK="build/app/outputs/flutter-apk/$APK_NAME"
        AAPT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/aapt
        BADGING=$("$AAPT" dump badging "$APK")
        echo "$BADGING" | grep -E "^package:|^application:|application-label:|leanback" || true
        echo "$BADGING" | grep -q "name='$ZUNO_APP_ID'" \
          || { echo "❌ applicationId inattendu (attendu $ZUNO_APP_ID)"; exit 1; }
        echo "$BADGING" | grep -q "application-label:'$ZUNO_APP_LABEL'" \
          || { echo "❌ nom affiché inattendu (attendu $ZUNO_APP_LABEL)"; exit 1; }
        # aapt ne recrache pas le nom brut de la catégorie : une activité
        # portant LEANBACK_LAUNCHER apparaît comme « leanback-launchable-activity ».
        echo "$BADGING" | grep -q "^leanback-launchable-activity:" \
          || { echo "❌ aucune activité LEANBACK_LAUNCHER : l'app n'apparaîtrait pas sur la home TV"; exit 1; }
        echo "$BADGING" | grep -E "^application:" | grep -q "banner='[^']" \
          || echo "::warning title=Bannière absente::android:banner non détecté sur <application> — vignette générique sur la home Leanback."
        # L'URL du Worker est une constante Dart : elle survit à l'obfuscation
        # (les chaînes ne sont pas renommées) et doit être présente dans le
        # code AOT (libapp.so, toutes ABIs). Si elle manque, l'app ne parle
        # PAS au panel.
        WANT="${{ inputs.backend_url }}"
        WANT="${WANT:-https://api.zuno8k.com}"
        unzip -p "$APK" 'lib/*/libapp.so' | grep -aq "$WANT" \
          || { echo "❌ backend $WANT introuvable dans l'APK"; exit 1; }
        echo "✓ APK vérifié : $ZUNO_APP_ID ($ZUNO_APP_LABEL), Leanback, backend $WANT"
        # Chaque dossier d'architecture présent dans l'APK DOIT contenir le
        # moteur (libflutter.so) et le code (libapp.so) : Android choisit le
        # dossier de SON processeur ; un dossier incomplet = app qui ne démarre
        # pas (constaté le 26/09/2026 : x86_64 ne contenait que les libs mpv).
        for ABI in $(unzip -Z1 "$APK" 'lib/*' | cut -d/ -f2 | sort -u); do
          for LIB in libflutter.so libapp.so; do
            unzip -Z1 "$APK" "lib/$ABI/$LIB" >/dev/null 2>&1 \
              || { echo "❌ lib/$ABI/$LIB absent : l'app ne démarrerait pas sur les box $ABI"; exit 1; }
          done
          echo "✓ lib/$ABI complet"
        done
        # Compatibilité toutes box : minSdk 21 (Android 5) réellement dans l'APK.
        MIN_SDK=$(echo "$BADGING" | grep -oE "^sdkVersion:'[0-9]+'" | grep -oE "[0-9]+" || true)
        echo "minSdk de l'APK : ${MIN_SDK:-?}"
        [ "$MIN_SDK" = "21" ] || { echo "❌ minSdk ${MIN_SDK:-?} ≠ 21 : les box Android 5/6 refuseraient l'installation"; exit 1; }
        # Signature : DOIT être celle des box clients pour publier.
        APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner
        CERT=$("$APKSIGNER" verify --print-certs "$APK" | grep -m1 -oiE "SHA-256 digest: [0-9a-f]+" | awk '{print $3}')
        echo "certificat de l'APK : $CERT"
        echo "APK_CERT=$CERT" >> "$GITHUB_ENV"
        if [ "$CERT" = "$EXPECTED_CERT" ]; then
          echo "✓ signature = clé des box clients (mise à jour par-dessus garantie)."
        elif [ "$PUBLIER" = "true" ]; then
          echo "::error title=Signature différente des box clients::$CERT ≠ $EXPECTED_CERT → publication refusée (sinon « Application non installée » chez tous les clients)."
          exit 1
        else
          echo "::warning title=Signature de contrôle::$CERT (build non publié)."
        fi
    - name: Figer l'identité des octets APK avant upload
      id: apk-identity
      run: |
        set -euo pipefail
        APK="build/app/outputs/flutter-apk/$APK_NAME"
        test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
        printf 'source-sha=%s\n' "$SOURCE_SHA" >> "$GITHUB_OUTPUT"
        printf 'build-attempt=%s\n' "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
        printf 'sha256=%s\n' "$(sha256sum "$APK" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
        printf 'size=%s\n' "$(stat -c%s "$APK")" >> "$GITHUB_OUTPUT"
    - name: Upload APK artifact (Zuno TV)
      id: apk-upload
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: zuno-tv-apk-${{ env.SOURCE_SHA }}
        path: android-app/build/app/outputs/flutter-apk/${{ env.APK_NAME }}
        retention-days: 30
        if-no-files-found: error
  startup:
    name: Ouvrir l'APK signé — API ${{ matrix.api }}
    needs:
    - build-tv
    if: needs.build-tv.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: .
    strategy:
      fail-fast: false
      matrix:
        api:
        - 29
        - 35
    env:
      STARTUP_API_LEVEL: ${{ matrix.api }}
      STARTUP_APK_PATH: ${{ github.workspace }}/artifacts/startup-input/zuno-tv.apk
      STARTUP_SOURCE_SHA: ${{ needs.build-tv.outputs.source-sha }}
      STARTUP_BUILD_ATTEMPT: ${{ needs.build-tv.outputs.build-attempt }}
      STARTUP_APK_SHA256: ${{ needs.build-tv.outputs.apk-sha256 }}
      STARTUP_APK_SIZE: ${{ needs.build-tv.outputs.apk-size }}
      STARTUP_VERSION_NAME: ${{ needs.build-tv.outputs.version-name }}
      STARTUP_VERSION_CODE: ${{ needs.build-tv.outputs.version-code }}
      STARTUP_APK_CERT: ${{ needs.build-tv.outputs.apk-cert }}
      STARTUP_ARTIFACT_ID: ${{ needs.build-tv.outputs.apk-artifact-id }}
      STARTUP_ARTIFACT_DIGEST: ${{ needs.build-tv.outputs.apk-artifact-digest }}
    steps:
    - name: Extraire le contrôle du même commit que le build
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ env.SOURCE_SHA }}
        persist-credentials: false
    - name: Préparer le décodeur des captures dans un environnement Python isolé
      run: |
        set -euo pipefail
        startup_python="$RUNNER_TEMP/zuno-startup-python"
        python3 -m venv "$startup_python"
        "$startup_python/bin/python" -m pip install --disable-pip-version-check \
          --only-binary=:all: --no-deps -r android-app/ci/requirements-startup.txt
        printf '%s\n' "$startup_python/bin" >> "$GITHUB_PATH"
    - name: Vérifier le contrôle et ses cas d'échec
      run: |
        set -euo pipefail
        test "$(git rev-parse HEAD)" = "$STARTUP_SOURCE_SHA"
        bash -n android-app/ci/run-apk-startup.sh
        python3 -m unittest discover -s android-app/ci -p test_apk_startup.py -v
        python3 android-app/ci/verify_apk_startup.py identity
    - name: Télécharger uniquement l'APK uploadé par build-tv
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        artifact-ids: ${{ needs.build-tv.outputs.apk-artifact-id }}
        merge-multiple: true
        path: artifacts/startup-input
    - name: Java 17
      uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
      with:
        distribution: temurin
        java-version: '17'
    - name: SDK Android
      uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
    - name: Préparer les bibliothèques Linux de l'émulateur
      run: |
        set -euo pipefail
        # Même avec -no-audio, le binaire de l'émulateur charge libpulse.
        # Sa présence n'est pas garantie sur le runner Ubuntu 24.04.
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends libpulse0
    - name: Accélération de l'émulateur éphémère
      run: |
        set -euo pipefail
        test -c /dev/kvm
        sudo chmod a+rw /dev/kvm
    - name: Cibler le package d’essai installé à côté de Zuno
      run: |-
        python3 - <<'PYTHON'
        from pathlib import Path
        for name in ('android-app/ci/run-apk-startup.sh', 'android-app/ci/verify_apk_startup.py'):
            p=Path(name)
            s=p.read_text()
            assert s.count('com.sevenmotion.tv.seven_tv')==1, name
            p.write_text(s.replace('com.sevenmotion.tv.seven_tv','com.sevenmotion.tv.seven_tv.imageqa'))
        PYTHON
    - name: Installer, ouvrir, quitter et rouvrir l'APK signé hors réseau
      run: bash android-app/ci/run-apk-startup.sh
    - name: Conserver les écrans et diagnostics, même en cas d'échec
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: zuno-startup-api-${{ matrix.api }}-${{ env.SOURCE_SHA }}-attempt-${{ github.run_attempt }}
        path: artifacts/startup-api-${{ matrix.api }}/
        if-no-files-found: error
        retention-days: 14
  pixels:
    name: Pixels Android API ${{ matrix.api }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        api:
        - 29
        - 35
    env:
      SOURCE_SHA: f7acfcd86bfcada85d5ff5b6b16d850aef8f0b64
    steps:
    - name: Extraire exactement le commit à vérifier
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ env.SOURCE_SHA }}
        persist-credentials: false
    - name: Vérifier la provenance du code
      run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
    - name: Vérifier le contrat des rapports Android
      run: |
        python3 -m unittest discover -s android-app/ci -p test_contrast_results.py -v
        python3 -m unittest discover -s android-app/ci -p test_ai_picture_results.py -v
    - name: Java 17
      uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
      with:
        distribution: temurin
        java-version: '17'
    - name: Flutter stable validé par le dépôt
      uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
      with:
        flutter-version: 3.47.7
        channel: stable
        cache: false
        pub-cache: false
    - name: SDK Android
      uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
    - name: Préparer KVM et le générateur de mire
      run: |
        set -euo pipefail
        test -c /dev/kvm
        # Permission limitée au runner éphémère ; aucun repli lent ne masque
        # l'absence d'accélération de la machine virtuelle.
        sudo chmod a+rw /dev/kvm
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends ffmpeg
    - name: Préparer uniquement les outils Android de debug
      working-directory: android-app
      run: |
        set -euo pipefail
        # Génère le wrapper/local.properties absents de Git, sans refaire
        # le code du plugin ni appliquer les patches de publication APK.
        flutter create . --platforms=android --no-pub --project-name tv_king
        flutter pub get
        python3 ci/generate-contrast-fixture.py
    - name: Vérifier les pixels puis prouver que l’ancien défaut est détecté
      env:
        CONTRAST_API_LEVEL: ${{ matrix.api }}
      run: bash android-app/ci/run-contrast-render-tests.sh
    - name: Conserver les images, mesures et rapports même en cas d’échec
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: zuno-contrast-api-${{ matrix.api }}-${{ env.SOURCE_SHA }}
        path: |
          artifacts/contrast-api-${{ matrix.api }}/
          android-app/build/native_video_player/reports/androidTests/
          android-app/build/native_video_player/outputs/androidTest-results/
          android-app/packages/native_video_player/android/build/reports/androidTests/
          android-app/packages/native_video_player/android/build/outputs/androidTest-results/
        if-no-files-found: error
        retention-days: 14
    defaults:
      run:
        working-directory: .
