# ============================================================================
#  dns-zuno-subdomain.yml — Branche zuno.7themotion.com sur le site (Vercel)
# ----------------------------------------------------------------------------
#  UNE seule action, idempotente : dans la zone Cloudflare 7themotion.com,
#  crée l'enregistrement  CNAME  zuno → cname.vercel-dns.com  (DNS only,
#  nuage gris) s'il n'existe pas. Ne modifie ni ne supprime AUCUN autre
#  enregistrement, ne touche pas au Worker du panel.
#
#  Utilise le jeton déjà présent (secrets.CLOUDFLARE_API_TOKEN). S'il n'a pas
#  la permission « Zone → DNS → Edit », l'étape échoue avec le message de
#  Cloudflare et RIEN n'est changé : il faut alors ajouter la ligne à la main.
#
#  Déclenché au push de ce fichier (le lancement manuel exige que le workflow
#  soit sur la branche par défaut).
# ============================================================================
name: DNS zuno.7themotion.com

on:
  push:
    branches: ['main', 'claude/**']
    paths:
      - '.github/workflows/dns-zuno-subdomain.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cname:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ZONE: 7themotion.com
      NAME: zuno.7themotion.com
      TARGET: cname.vercel-dns.com
    steps:
      - name: Créer le CNAME s'il manque
        run: |
          set -euo pipefail
          api() { curl -sS -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" "$@"; }
          [ -n "$CF_TOKEN" ] || { echo "::error::secret CLOUDFLARE_API_TOKEN absent"; exit 1; }

          Z=$(api "https://api.cloudflare.com/client/v4/zones?name=$ZONE")
          ZONE_ID=$(echo "$Z" | jq -r '.result[0].id // empty')
          if [ -z "$ZONE_ID" ]; then
            echo "::error::zone $ZONE introuvable avec ce jeton (permission Zone:Read manquante ?)"
            echo "$Z" | jq -c '{success, errors}'
            exit 1
          fi
          echo "zone trouvée"

          EXIST=$(api "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records?name=$NAME")
          COUNT=$(echo "$EXIST" | jq -r '.result | length')
          if [ "$COUNT" != "0" ]; then
            echo "déjà présent (rien modifié) :"
            echo "$EXIST" | jq -c '.result[] | {type, name, content, proxied}'
            exit 0
          fi

          R=$(api -X POST "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records" \
            --data "{\"type\":\"CNAME\",\"name\":\"zuno\",\"content\":\"$TARGET\",\"proxied\":false,\"ttl\":1,\"comment\":\"Site Zuno (Vercel)\"}")
          if [ "$(echo "$R" | jq -r '.success')" != "true" ]; then
            echo "::error::Cloudflare a refusé la création"
            echo "$R" | jq -c '{success, errors}'
            exit 1
          fi
          echo "✓ créé :"
          echo "$R" | jq -c '.result | {type, name, content, proxied}'
