# Client et serveur immuables, fournisseur local : aucun déploiement.
name: Zuno 107 — import réel et confirmation panel
on:
  push:
    branches: ['feature/zuno107-simulation-20261013']
    paths:
      - '.github/workflows/zuno107-functional-simulation.yml'
      - 'android-app/e2e/zuno107/**'
permissions:
  contents: read
concurrency:
  group: zuno107-functional-${{ github.ref }}
  cancel-in-progress: false
jobs:
  simulation:
    name: Zuno 107 publié et Worker de référence
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
    defaults:
      run:
        working-directory: app/android-app
    steps:
      - name: Scénario de simulation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: scenario
          persist-credentials: false
      - name: Code publié dans Zuno 107
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fa7fa00661f79dea1997c4782c76f8265eaf7200
          path: app
          persist-credentials: false
      - name: Worker référencé par le gel de production
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fb0277e1f5476db3400100c4fe4163b1b9ef1fe3
          path: backend
          persist-credentials: false
      - name: Préparer le scénario sans changer le code du client
        working-directory: .
        run: |
          mkdir -p tooling
          cp app/android-app/cloudflare/package*.json tooling/
          rm -rf app/android-app/cloudflare
          cp -R backend/android-app/cloudflare app/android-app/cloudflare
          cp tooling/package*.json app/android-app/cloudflare/
          cp scenario/android-app/e2e/zuno107/zuno107_reference_e2e_test.dart app/android-app/test/features/subscription/
          test -z "$(git -C app diff --name-only HEAD -- android-app/lib)"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Dépendances locales du test
        run: |
          npm ci --prefix cloudflare
          flutter pub get
      - name: Activation, M3U, Xtream, refus, reprise et effacement
        run: |
          set -o pipefail
          flutter test --reporter expanded --dart-define=RUN_E2E=true --dart-define=BACKEND_URL=http://127.0.0.1:8787 test/features/subscription/zuno107_reference_e2e_test.dart 2>&1 | tee functional-simulation.log
      - name: Conserver les preuves synthétiques
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: zuno107-functional-reference
          path: app/android-app/functional-simulation.log
          if-no-files-found: ignore
          retention-days: 14
