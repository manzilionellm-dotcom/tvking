        -----END CERTIFICATE-----
        CERT
        apk=build/app/outputs/bundle/release/app-release.aab
        test -s "$apk"
        openssl cms -encrypt -binary -aes-256-cbc -in "$apk" -outform DER -out "$RUNNER_TEMP/max-private/NovaTube-MAX.aab.cms" "$RUNNER_TEMP/transfer.pem"
        zip -q -r "$RUNNER_TEMP/symbols.zip" build/symbols
        openssl cms -encrypt -binary -aes-256-cbc -in "$RUNNER_TEMP/symbols.zip" -outform DER -out "$RUNNER_TEMP/max-private/symbols.zip.cms" "$RUNNER_TEMP/transfer.pem"
        sha256sum "$apk" > "$RUNNER_TEMP/max-private/SHA256"
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: novatube-max-prive-${{ github.sha }}
        path: ${{ runner.temp }}/max-private/
        if-no-files-found: error
        retention-days: 7
    - name: Générer un APK de contrôle à partir du bundle
      working-directory: android-app
      run: |
        set -eu
        j="$RUNNER_TEMP/max-bundletool.jar"
        curl -fsSL --retry 3 --max-time 150 -o "$j" https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar
        echo "a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29  $j" | sha256sum -c -
        sed -n 's/^storePassword=//p' android/key.properties > "$RUNNER_TEMP/max-test-pass"
        java -jar "$j" build-apks --bundle=build/app/outputs/bundle/release/app-release.aab --output="$RUNNER_TEMP/max-test.apks" --mode=universal --ks=android/app/work.p12 --ks-key-alias=intermediate --ks-pass=file:"$RUNNER_TEMP/max-test-pass" --key-pass=file:"$RUNNER_TEMP/max-test-pass"
        unzip -p "$RUNNER_TEMP/max-test.apks" universal.apk > "$RUNNER_TEMP/max-test.apk"
        python3 -c 'import os,shutil;print("Espace disponible",shutil.disk_usage(os.environ["RUNNER_TEMP"]).free)'
    - name: Démarrer MAX sur téléphone, tablette et téléviseur émulés
      working-directory: android-app
      run: |
        set -eu
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends libpulse0 tesseract-ocr
        test -c /dev/kvm
        sudo chmod a+rw /dev/kvm
        bash ci/novatube_tv/smoke_max_devices.sh "$RUNNER_TEMP/max-test.apk" "$RUNNER_TEMP/controle-max"
    - name: Conserver les résultats des démarrages
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: controle-appareils-max-${{ github.sha }}
        path: |
          ${{ runner.temp }}/controle-max/demarrages.txt
          ${{ runner.temp }}/controle-max/start-*.log
          ${{ runner.temp }}/controle-max/ocr-*.txt
          ${{ runner.temp }}/controle-max/telecommande-*.txt
          ${{ runner.temp }}/controle-max/*.png
        if-no-files-found: ignore
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
    - *id001
    - *id002
    - *id003
    - *id004
    - *id005
    - *id006
    - *id007
    - *id008
    - *id009
    - name: Tester le guide, la navigation, les profils et les sources
      working-directory: android-app
      run: |
        set -euo pipefail
        flags=(--no-pub --dart-define=NOVATUBE_TV=true --dart-define=NOVATUBE_MAX=true --dart-define=PLAY_BUILD=true)
        flutter analyze --no-pub --no-fatal-infos lib/features/tv/presentation/tv_channel_guide_screen.dart lib/features/tv/presentation/tv_epg_preview_screen.dart lib/features/channels/data/recently_watched_repository.dart lib/features/tv/presentation/novatube_max_m3u_batch.dart lib/features/tv/presentation/tv_sources_screen.dart test/novatube_max
        flutter test "${flags[@]}" test/novatube_max test/features/epg/catchup_url_builder_test.dart test/features/epg/epg_replay_keep_test.dart test/features/tv/history_policy_test.dart test/features/tv/tv_scaled_viewport_test.dart test/features/playlists/profile_source_switches_test.dart test/features/profiles test/novatube_tv/novatube_m3u_variants_test.dart test/novatube_tv/novatube_panel_list_test.dart test/features/playlists/import_bulk_persistence_test.dart
    - name: Vérifier le guide TV historique hors MAX
      working-directory: android-app
      run: |
        flutter test --no-pub test/features/tv/tv_channel_guide_replay_test.dart
