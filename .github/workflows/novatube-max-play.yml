name: MAXTUBE Android TV — bundle Play et tests privés
'on':
  push:
    branches:
    - feature/maxtube-android-tv-20261117
  workflow_dispatch: {}
permissions:
  contents: read
env:
  CI: 'true'
  FLUTTER_SUPPRESS_ANALYTICS: 'true'
  ZUNO_APP_ID: com.sevenmotion.novatube.max
  ZUNO_APP_LABEL: MAXTUBE
  NOVATUBE_MAX: 'true'
  NOVATUBE_TV_APP_ID: com.sevenmotion.novatube.max
jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
    - &id001
      name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - &id002
      name: Java 17 (Temurin)
      uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
      with:
        distribution: temurin
        java-version: '17'
    - &id003
      name: Flutter 3.47.7 (même version que Zuno TV)
      uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
      with:
        flutter-version: 3.47.7
        channel: stable
        cache: true
    - &id004
      name: SDK Android
      uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
    - &id005
      name: Licences Android
      run: yes | sdkmanager --licenses >/dev/null 2>&1 || true
      working-directory: android-app
    - &id006
      name: Manifeste et Gradle TV (scripts Zuno, identité NovaTube)
      run: |
        set -e
        python3 ci/tv/patch_manifest.py android/app/src/main/AndroidManifest.xml
        cp ci/proguard-rules.pro android/app/proguard-rules.pro
        python3 ci/tv/patch_gradle.py android/app/build.gradle.kts
        grep -q 'applicationId = "com.sevenmotion.novatube.max"' android/app/build.gradle.kts
        grep -q 'android:label="MAXTUBE"' android/app/src/main/AndroidManifest.xml
        python3 ci/novatube_tv/prepare_max_play.py
      working-directory: android-app
    - &id007
      name: Préférences compatibles box Android 5 (identique à Zuno TV)
      run: |
        python3 - <<'PYEOF'
        from pathlib import Path
        path = Path('pubspec.yaml')
        source = path.read_text(encoding='utf-8')
        anchor = '  shared_preferences: ^2.3.4\n'
        if source.count(anchor) != 1 or any(dep in source for dep in ('  shared_preferences_android:', '  url_launcher_android:')):
            raise SystemExit('Contrainte SharedPreferences inattendue : vérifier le pin TV.')
        # Même graphe natif que le dernier APK signé, y compris le plugin Android des liens.
        source = source.replace(anchor, anchor + '  shared_preferences_android: 2.5.0\n  url_launcher_android: 6.3.33\n', 1)
        path.write_text(source, encoding='utf-8')
        PYEOF
      working-directory: android-app
    - &id008
      name: Dépendances
      run: flutter pub get
      working-directory: android-app
    - &id009
      name: Préparer l'édition NovaTube (logo, nom, bannière, lancement)
      run: |
        python3 -m pip install --quiet Pillow
        python3 ci/novatube_tv/make_brand_assets.py
        set -e
        python3 ci/novatube_tv/prepare_build.py
        flutter pub get
        flutter gen-l10n
      working-directory: android-app
    - name: Patch screen_brightness_android (identique à Zuno TV)
      run: |
        set -e
        FILE=$(find ~/.pub-cache/hosted/pub.dev -path "*/screen_brightness_android-*/android/build.gradle" 2>/dev/null | head -1)
        if [ -z "$FILE" ]; then echo "screen_brightness_android absent, rien à faire"; exit 0; fi
        export PATCH_FILE="$FILE"
        python3 - <<'PYEOF'
        import os, re
        file = os.environ['PATCH_FILE']
        lines = open(file).readlines()
        out, in_kotlin, depth, removed = [], False, 0, 0
        for line in lines:
            if not in_kotlin:
                if re.match(r'^\s*kotlin\s*\{', line):
                    in_kotlin = True
                    depth = line.count('{') - line.count('}')
                    removed += 1
                    if depth <= 0:
                        in_kotlin = False
                    continue
                out.append(line)
            else:
                depth += line.count('{') - line.count('}')
                removed += 1
                if depth <= 0:
                    in_kotlin = False
        if removed:
            open(file, 'w').writelines(out)
        print(f'lignes kotlin{{}} retirées : {removed}')
        PYEOF
      working-directory: android-app
    - name: Icône, bannière Android TV et écran de lancement NovaTube
      run: |
        set -e
        dart run flutter_launcher_icons -f flutter_launcher_icons_maxtube.yaml
        python3 ci/tv/apply_splash.py
        python3 ci/novatube_tv/prepare_build.py --splash-color
      working-directory: android-app
    - name: Configurer le conteneur Gradle de travail
      working-directory: android-app
      shell: bash
      run: |
        set -euo pipefail
        pw="$(openssl rand -hex 32)"
        echo "::add-mask::$pw"
        keytool -genkeypair -keystore android/app/work.p12 -storetype PKCS12 -alias intermediate -keyalg RSA -keysize 2048 -validity 2 -storepass "$pw" -dname 'CN=Temporary Gradle packaging'
        printf 'storeFile=work.p12
        storePassword=%s
        keyAlias=intermediate
        keyPassword=%s
        ' "$pw" "$pw" > android/key.properties
    - name: Assembler MAXTUBE Play multiformat
      working-directory: android-app
      run: |
        set -euo pipefail
        flutter build appbundle --release --no-tree-shake-icons --android-skip-build-dependency-validation \
          --target-platform android-arm,android-arm64,android-x64 --build-number=2 --build-name=1.0.1 \
          --obfuscate --split-debug-info=build/symbols --dart-define=NOVATUBE_TV=true \
          --dart-define=NOVATUBE_MAX=true --dart-define=PLAY_BUILD=true \
          --dart-define=APP_BUILD_TS="$(date +%s)" --dart-define=GIT_SHA="${{ github.sha }}" --target=lib/main_tv.dart
    - name: Livrer le bundle et ses symboles sous chiffrement
      working-directory: android-app
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/max-private"
        cat > "$RUNNER_TEMP/transfer.pem" <<'CERT'
        -----BEGIN CERTIFICATE-----
        MIIELzCCApegAwIBAgIUTM6frMceDe7jKJ7PjMWZQW9CB2swDQYJKoZIhvcNAQEL
        BQAwJzElMCMGA1UEAwwcTm92YVR1YmUgcHJpdmF0ZSBRQSBkZWxpdmVyeTAeFw0y
        NjExMTcwODMyMDBaFw0yNjExMjQwODMyMDBaMCcxJTAjBgNVBAMMHE5vdmFUdWJl
        IHByaXZhdGUgUUEgZGVsaXZlcnkwggGiMA0GCSqGSIb3DQEBAQUAA4IBjwAwggGK
        AoIBgQCaBuGkid6ONdGtEFIqIna5kJdf5jW8NUVjzIzM34Wa8E0+qnIP4BMVKmr3
