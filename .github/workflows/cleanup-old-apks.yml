# Nettoyage manuel ; les canaux actifs sont toujours exclus.
name: Cleanup old APKs (protégé)
on:
  workflow_dispatch:
    inputs:
      tags:
        description: 'Anciens tags build-N ou cast-N, séparés par des espaces'
        required: true
        default: 'build-522 build-526 cast-1132'
        type: string
      confirme:
        description: 'NETTOYER_RELEASES après dégel autorisé'
        required: true
        type: string
permissions:
  contents: read
jobs:
  cleanup:
    name: Nettoyage validé avant toute suppression
    if: github.event_name == 'workflow_dispatch' && github.actor == github.repository_owner && github.triggering_actor == github.repository_owner && github.repository == 'manzilionellm-dotcom/tvking'
    environment: zuno-app-production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Refuser le nettoyage tant que les apps sont gelées
        env:
          APP_OPERATION: cleanup
        run: node .github/app-release-guard.mjs
      - name: Valider les tags et supprimer sans shell interpolé
        env:
          CLEANUP_TAGS: ${{ inputs.tags }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/release-cleanup.mjs
