# ============================================================================
#  publish-phone-aab.yml — Attache l'AAB Google Play d'un run build-android à
#  la release « phone-test » existante, pour un LIEN DIRECT sans zip :
#    https://github.com/<repo>/releases/download/phone-test/7motion.aab
#
#  POURQUOI : les artefacts Actions sont servis en .zip et exigent d'être
#  connecté à GitHub — pénible pour téléverser dans la Play Console. Ici on
#  obtient le fichier .aab NU, téléchargeable d'un clic.
#
#  GARDE-FOUS :
#    - n'ÉCRASE PAS la release phone-test (upload --clobber du seul asset
#      7motion.aab) : l'APK de test reste en place ;
#    - déclenchement MANUEL uniquement (workflow_dispatch) ;
#    - aucun version.json → invisible pour l'updater in-app.
# ============================================================================
name: Publish Phone AAB (lien direct)

on:
  workflow_dispatch:
    inputs:
      confirme:
        description: PUBLIER_APP après dégel autorisé
        required: true
        type: string
      run_id:
        description: 'ID du run build-android dont on publie l''AAB Google Play'
        required: true
        type: string

permissions:
  contents: read
  actions: read     # télécharger l'artefact du run build-android

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' && github.actor == github.repository_owner && github.triggering_actor == github.repository_owner && github.repository == 'manzilionellm-dotcom/tvking'
    environment: zuno-app-production
    permissions:
      contents: write
    name: Attache 7motion.aab à phone-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Lire les protections
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Refuser une publication clients non revue
        env:
          APP_OPERATION: client
        run: node .github/app-release-guard.mjs
      - name: Télécharger l'AAB du run build-android
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: 7motion-playstore-aab-*
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          merge-multiple: true

      - name: Attacher l'AAB à la release phone-test (asset écrasé si présent)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          ls -la
          test -f 7motion.aab
          gh release upload phone-test 7motion.aab --clobber -R "$GITHUB_REPOSITORY"
          echo "✓ https://github.com/$GITHUB_REPOSITORY/releases/download/phone-test/7motion.aab"

