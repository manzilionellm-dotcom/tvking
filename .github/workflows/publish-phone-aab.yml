# Ce chemin est déjà enregistré sur la branche principale de GitHub Actions.
# Sur la branche de travail, il prépare désormais le bundle mobile exact ;
# il ne recopie plus un ancien AAB vers une release et ne publie pas sur Play.
name: Préparer 7 MOTION pour Google Play (artefact uniquement)

on:
  workflow_dispatch:
    inputs:
      confirme:
        description: 'PREPARER_AAB : construire le bundle 1724, sans publication'
        required: true
        type: string

permissions:
  contents: read

jobs:
  prepare-play:
    name: Préparer le bundle mobile signé pour revue
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.confirme == 'PREPARER_AAB' &&
      github.ref == 'refs/heads/ccr-b93e1afd-gwirw0' &&
      github.repository == 'manzilionellm-dotcom/tvking' &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner
    # Plafond nécessaire au workflow réutilisé, qui possède aussi un publisher
    # réservé aux PR. Son job de construction reste contents:read et le
    # publisher est exclu de tout lancement manuel, avant tout téléchargement.
    permissions:
      contents: write
    uses: ./.github/workflows/build-7motion-sport-test.yml
    with:
      play_aab: true
    secrets:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
