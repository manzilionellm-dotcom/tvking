name: NovaTube LAB Retour – APK de retour sur aff73d9e

on:
  push:
    branches: ['qa/novatube-lab-retour-aff73d9e']
    paths: ['.github/workflows/novatube-lab-box.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: novatube-lab-box-retour-aff73d9e
  cancel-in-progress: false

env:
  CI: 'true'
  FLUTTER_SUPPRESS_ANALYTICS: 'true'
  SOURCE_SHA: aff73d9e6c54f60e4063819844c1601abd6aa7c8
  NOVATUBE_TV_APP_ID: com.sevenmotion.novatube.tv.lab.retour
  NOVATUBE_TV_VERSION: '1.0.0'

jobs:
  build:
    name: Compiler, tester et signer NovaTube TV
    if: github.repository == 'manzilionellm-dotcom/tvking'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: android-app
    outputs:
      apk-name: ${{ steps.verify.outputs.apk-name }}
      apk-sha256: ${{ steps.verify.outputs.apk-sha256 }}
      version-code: ${{ steps.build.outputs.version-code }}
      signing: ${{ steps.sign.outputs.signing }}
      cert-sha256: ${{ steps.verify.outputs.cert-sha256 }}
    env:
      # Les scripts TV existants lisent ces deux variables (ZUNO_ = historique).
      ZUNO_APP_ID: com.sevenmotion.novatube.tv.lab.retour
      ZUNO_APP_LABEL: NovaTube LAB Retour
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false

      - name: Java 17 (Temurin)
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter 3.47.7 (même version que Zuno TV)
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: SDK Android
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Licences Android
        run: yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Manifeste et Gradle TV (scripts Zuno, identité NovaTube)
        run: |
          set -e
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          python3 ci/tv/patch_manifest.py android/app/src/main/AndroidManifest.xml
          cp ci/proguard-rules.pro android/app/proguard-rules.pro
          python3 ci/tv/patch_gradle.py android/app/build.gradle.kts
          grep -q 'applicationId = "com.sevenmotion.novatube.tv.lab.retour"' android/app/build.gradle.kts
          grep -q 'android:label="NovaTube LAB Retour"' android/app/src/main/AndroidManifest.xml

      - name: Préférences compatibles box Android 5 (identique à Zuno TV)
        run: |
          python3 - <<'PYEOF'
          from pathlib import Path
          path = Path('pubspec.yaml')
          source = path.read_text(encoding='utf-8')
          anchor = '  shared_preferences: ^2.3.4\n'
          if source.count(anchor) != 1 or '  shared_preferences_android:' in source:
              raise SystemExit('Contrainte SharedPreferences inattendue : vérifier le pin TV.')
          source = source.replace(anchor, anchor + '  shared_preferences_android: 2.5.0\n', 1)
          path.write_text(source, encoding='utf-8')
          PYEOF

      - name: Dépendances
        run: flutter pub get

      - name: Tests NovaTube en mode Zuno (prouve que Zuno ne change pas)
        run: |
          set -e
          flutter gen-l10n
          flutter test --no-pub test/novatube_tv

      - name: Préparer l'édition NovaTube (logo, nom, bannière, lancement)
        run: |
          set -e
          python3 ci/novatube_tv/prepare_build.py
          flutter pub get
          flutter gen-l10n

      - name: Patch screen_brightness_android (identique à Zuno TV)
        run: |
          set -e
          FILE=$(find ~/.pub-cache/hosted/pub.dev -path "*/screen_brightness_android-*/android/build.gradle" 2>/dev/null | head -1)
          if [ -z "$FILE" ]; then echo "screen_brightness_android absent, rien à faire"; exit 0; fi
          export PATCH_FILE="$FILE"
          python3 - <<'PYEOF'
          import os, re
          file = os.environ['PATCH_FILE']
          lines = open(file).readlines()
          out, in_kotlin, depth, removed = [], False, 0, 0
          for line in lines:
              if not in_kotlin:
                  if re.match(r'^\s*kotlin\s*\{', line):
                      in_kotlin = True
                      depth = line.count('{') - line.count('}')
                      removed += 1
                      if depth <= 0:
                          in_kotlin = False
                      continue
                  out.append(line)
              else:
                  depth += line.count('{') - line.count('}')
                  removed += 1
                  if depth <= 0:
                      in_kotlin = False
          if removed:
              open(file, 'w').writelines(out)
          print(f'lignes kotlin{{}} retirées : {removed}')
          PYEOF

      - name: Analyse et tests de l'édition NovaTube
        run: |
          set -e
          flutter analyze --no-pub --no-fatal-infos \
            lib/main_tv.dart lib/core/app/novatube_tv_edition.dart \
            lib/features/tv/core lib/features/tv/presentation/tv_app.dart \
            lib/features/tv/presentation/tv_novatube_welcome_screen.dart \
            lib/features/tv/presentation/tv_components.dart \
            lib/features/theme test/novatube_tv
          flutter test --no-pub --dart-define=NOVATUBE_TV=true test/novatube_tv

      - name: Icône, bannière Android TV et écran de lancement NovaTube
        run: |
          set -e
          dart run flutter_launcher_icons -f flutter_launcher_icons_novatube_tv.yaml
          python3 ci/tv/apply_splash.py
          python3 ci/novatube_tv/prepare_build.py --splash-color

      - name: Signature
        id: sign
        run: |
          set -euo pipefail
          alias="novatube-lab-retour"
          store_pw="$(openssl rand -hex 24)"
          key_pw="$store_pw"
          echo "::add-mask::$store_pw"
          keytool -genkeypair -keystore android/app/release.jks -storetype PKCS12 \
            -alias "$alias" -keyalg RSA -keysize 3072 -validity 3650 \
            -storepass "$store_pw" -keypass "$key_pw" -dname "CN=NovaTube LAB Retour, O=Test" >/dev/null 2>&1
          echo "signing=cle-de-test-jetable" >> "$GITHUB_OUTPUT"
          {
            echo "storeFile=release.jks"
            echo "storePassword=$store_pw"
            echo "keyAlias=$alias"
            echo "keyPassword=$key_pw"
          } > android/key.properties

      - name: Compiler l'APK NovaTube TV (lib/main_tv.dart + NOVATUBE_TV)
        id: build
        run: |
          set -euo pipefail
          BUILD_NUMBER=$(date +%s)
          echo "version-code=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          flutter build apk --release --no-tree-shake-icons \
            --android-skip-build-dependency-validation \
            --target-platform android-arm,android-arm64,android-x64 \
            --build-number="$BUILD_NUMBER" \
            --build-name="$NOVATUBE_TV_VERSION" \
            --obfuscate --split-debug-info=build/symbols \
            --dart-define=NOVATUBE_TV=true \
            --dart-define=APP_BUILD_TS="$BUILD_NUMBER" \
            --dart-define=GIT_SHA="$SOURCE_SHA" \
            --target=lib/main_tv.dart

      - name: Vérifier l'APK (identité, Leanback, signature, empreinte)
        id: verify
        run: |
          set -euo pipefail
          name="NovaTube-LAB-Retour.apk"
          mkdir -p build/novatube_tv
          cp build/app/outputs/flutter-apk/app-release.apk "build/novatube_tv/$name"
          apk="build/novatube_tv/$name"
          bt="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          # aapt (v1) n'existe plus dans certains build-tools : aapt2 sinon.
          if [ -x "$bt/aapt" ]; then aapt="$bt/aapt"; else aapt="$bt/aapt2"; fi
          "$aapt" dump badging "$apk" > build/novatube_tv/badging.txt
          grep -E "^package:|^application-label:|leanback" build/novatube_tv/badging.txt
          grep -q "^package: name='${NOVATUBE_TV_APP_ID}'" build/novatube_tv/badging.txt
          grep -q "^application-label:'NovaTube LAB Retour'" build/novatube_tv/badging.txt
          grep -q "^leanback-launchable-activity:" build/novatube_tv/badging.txt
          "$bt/apksigner" verify --verbose --print-certs "$apk" > build/novatube_tv/signature.txt
          cert="$(grep -m1 'certificate SHA-256 digest' build/novatube_tv/signature.txt | awk '{print $NF}')"
          sha="$(sha256sum "$apk" | awk '{print $1}')"
          (cd build/novatube_tv && sha256sum "$name" > SHA256SUMS.txt)
          echo "apk-name=$name" >> "$GITHUB_OUTPUT"
          echo "apk-sha256=$sha" >> "$GITHUB_OUTPUT"
          echo "cert-sha256=$cert" >> "$GITHUB_OUTPUT"
          echo "APK $name · $(stat -c %s "$apk") octets · SHA-256 $sha · certificat $cert"

      - name: Conserver l'APK vérifié
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: novatube-tv-apk-${{ github.sha }}
          path: |
            android-app/build/novatube_tv/*.apk
            android-app/build/novatube_tv/SHA256SUMS.txt
            android-app/build/novatube_tv/badging.txt
            android-app/build/novatube_tv/signature.txt
          if-no-files-found: error
          retention-days: 14

  smoke:
    name: Installer, ouvrir et rouvrir l’APK LAB sur Android 11
    runs-on: ubuntu-24.04
    needs: build
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: novatube-tv-apk-${{ github.sha }}
          path: apk
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
      - name: Contrôler sur émulateur le fichier destiné à la box
        run: |
          set -euo pipefail
          (cd apk && sha256sum -c SHA256SUMS.txt)
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libpulse0
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
          # Le contrôle existant attend le nom et le paquet de NovaTube TV.
          # Seules ces deux attentes changent pour vérifier l'identité LAB.
          sed -e 's/pkg="com.sevenmotion.novatube.tv"/pkg="com.sevenmotion.novatube.tv.lab.retour"/' \
              -e "s/application-label:'NovaTube'/application-label:'NovaTube LAB Retour'/" \
              android-app/ci/novatube_tv/emulator_smoke.sh > "$RUNNER_TEMP/smoke-lab.sh"
          bash "$RUNNER_TEMP/smoke-lab.sh" apk/NovaTube-LAB-Retour.apk controle
      - name: Conserver les captures, la signature et le bilan Android
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: controle-android-lab-${{ github.sha }}
          path: controle/
          retention-days: 14

  image:
    name: Vérifier l’image animée sur deux chaînes avec l’APK de livraison
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: dc37f3c8ece077fc806b835fa56c965039bae1ca
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: novatube-tv-apk-${{ github.sha }}
          path: apk
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          accept-android-sdk-licenses: false
      - name: Filmer et reconnaître les deux mires et leurs compteurs
        env:
          ANDROID_SERIAL: emulator-5554
          BENCH_PACKAGE: com.sevenmotion.novatube.tv.lab.retour
          OMP_THREAD_LIMIT: '1'
        run: |
          set -euo pipefail
          (cd apk && sha256sum -c SHA256SUMS.txt)
          work="$GITHUB_WORKSPACE/android-app/ci/novatube_tv"
          out="$GITHUB_WORKSPACE/preuve-image"
          mkdir -p "$out"
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg libpulse0 python3-pil tesseract-ocr
          image='system-images;android-36;android-tv;x86_64'
          sdkmanager platform-tools emulator 'build-tools;35.0.0' "$image" </dev/null >/dev/null
          printf 'no\n' | avdmanager create avd -f -n retour -k "$image" >/dev/null
          sudo chmod a+rw /dev/kvm
          python3 "$work/pilot_live_source.py" prepare "$RUNNER_TEMP/mire"
          python3 "$work/pilot_live_source.py" serve "$RUNNER_TEMP/mire" --duration 1800 > "$out/source.log" 2>&1 &
          src_pid=$!
          adb start-server
          "$ANDROID_HOME/emulator/emulator" -avd retour -port 5554 -no-window -no-audio -no-snapshot -no-boot-anim -gpu swiftshader -memory 1536 -cores 2 > "$out/emulator.log" 2>&1 &
          emu_pid=$!
          trap 'kill "$src_pid" "$emu_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 100); do
            if timeout 5 adb shell pm list features 2>/dev/null | grep 'android.software.leanback' >/dev/null && [[ "$(adb shell getprop sys.boot_completed | tr -d '\r')" == 1 ]]; then break; fi
            sleep 3
          done
          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = 1
          adb shell wm size 1920x1080
          adb shell svc power stayon true
          adb shell input keyevent 82
          adb reverse tcp:18471 tcp:18471
          adb install --no-streaming "apk/NovaTube-LAB-Retour.apk"
          installed="$(adb shell pm path "$BENCH_PACKAGE" | tr -d '\r' | sed -n 's/^package://p')"
          test -n "$installed"
          adb pull "$installed" "$RUNNER_TEMP/installe.apk"
          cmp "apk/NovaTube-LAB-Retour.apk" "$RUNNER_TEMP/installe.apk"
          component="$(adb shell cmd package resolve-activity --brief -a android.intent.action.MAIN -c android.intent.category.LEANBACK_LAUNCHER "$BENCH_PACKAGE" | tr -d '\r' | tail -1)"
          [[ "$component" == "$BENCH_PACKAGE/"* ]]
          adb shell am start -W -n "$component"
          sleep 15
          python3 "$work/novatube_pilot.py" "$out"
          python3 "$work/clocked_record.py" "$out/clip-1"
          python3 - "$out/clip-1/clock-results.json" <<'PY'
          import json
          import sys
          from pathlib import Path
          trials = json.loads(Path(sys.argv[1]).read_text())["trials"]
          if len(trials) != 10 or not all(t.get("valid") for t in trials):
              raise SystemExit("Image et mouvement attendus après chacune des dix commandes.")
          print("Dix changements avec image et mouvement vérifiés sur l’APK livré.")
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: preuve-image-lab-retour-${{ github.sha }}
          path: |
            preuve-image/*.png
            preuve-image/clip-1/clocked-video.mp4
            preuve-image/clip-1/clock-results.json
            preuve-image/clip-1/device-keys.txt
          if-no-files-found: warn

  publish:
    name: Publier et retélécharger l’APK LAB pour vérifier ses octets
    runs-on: ubuntu-latest
    needs: [build, smoke, image]
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: novatube-tv-apk-${{ github.sha }}
          path: apk
      - name: Préversion dédiée à cet essai
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: novatube-tv-lab-retour-aff73d9e
          EXPECTED: ${{ needs.build.outputs.apk-sha256 }}
        working-directory: apk
        run: |
          set -euo pipefail
          sha256sum -c SHA256SUMS.txt
          test "$(sha256sum NovaTube-LAB-Retour.apk | awk '{print $1}')" = "$EXPECTED"
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" NovaTube-LAB-Retour.apk SHA256SUMS.txt \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --latest=false \
              --title "NovaTube LAB Retour pour Android TV · retour-aff73d9e" \
              --notes "Source Android : $SOURCE_SHA. Version de récupération issue de l’avant-dernier build. Lecture de mires animées contrôlée sur Android TV. Paquet autonome : $NOVATUBE_TV_APP_ID. SHA-256 : $EXPECTED."
          fi
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/NovaTube-LAB-Retour.apk"
          curl --fail --location --retry 8 --retry-all-errors --retry-delay 2 "$url" --output "$RUNNER_TEMP/recu.apk"
          test "$(sha256sum "$RUNNER_TEMP/recu.apk" | awk '{print $1}')" = "$EXPECTED"
          digest="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '.assets[] | select(.name=="NovaTube-LAB-Retour.apk") | .digest')"
          test "$digest" = "sha256:$EXPECTED"
          echo "[NovaTube-LAB-Retour.apk]($url) — SHA-256 \`$EXPECTED\`" >> "$GITHUB_STEP_SUMMARY"
