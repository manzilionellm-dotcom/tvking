# ============================================================================
#  publish-phone-prod.yml — Met à jour la release CLIENTE « prod » (téléphone)
#  depuis un run build-android VERT, SANS toucher au tag.
#
#  POURQUOI (21/08) : la publication historique vit dans build-android.yml,
#  verrouillée sur la branche claude/maison-mere-phone — or pousser cette
#  branche re-déclencherait ses pipelines TV (recréation de releases TV
#  supprimées sur ordre du propriétaire). Ce workflow publie donc la MÊME
#  chose, à la demande, depuis n'importe quelle branche : l'APK et l'AAB
#  du run choisi remplacent les assets de « prod » EN PLACE.
#
#  GARDE-FOUS :
#    - le tag « prod » n'est JAMAIS supprimé/recréé (liens et updater
#      intacts) — uniquement `gh release upload --clobber` + edit du body ;
#    - ANTI-RETOUR-ARRIÈRE STRICT : le versionCode du nouvel APK (lu par
#      aapt, jamais déclaré à la main) doit être STRICTEMENT supérieur à
#      celui du version.json en ligne, sinon on refuse ;
#    - le version.json publié est extrait de l'APK réel → l'updater des
#      téléphones clients voit la mise à jour, chiffres exacts.
#
#  DÉCLENCHEMENT : manuel uniquement (Actions → Run workflow, avec l'ID
#  d'un run build-android vert — vérifier Quality + Tests sur le commit).
# ============================================================================
name: Publish Phone PROD (clients)

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'ID du run build-android dont on publie APK+AAB (Actions → run → URL)'
        required: true
        type: string

permissions:
  contents: write   # éditer la release prod
  actions: read     # télécharger les artefacts du run build-android

jobs:
  publish:
    name: Release prod (mise à jour en place)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Télécharger APK + AAB du run build-android
        uses: actions/download-artifact@v4
        with:
          pattern: tvking-release-apk-*
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          merge-multiple: true

      - name: Mettre à jour la release prod (tag préservé)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          set -e
          ls -la
          test -f 7motion.apk || { echo "⛔ 7motion.apk absent de l'artifact"; exit 1; }
          echo "SHA-256 des fichiers publiés :"
          sha256sum 7motion.apk 7motion.aab 2>/dev/null || sha256sum 7motion.apk
          # Commit du build (traçabilité dans le body de la release).
          BUILD_SHA=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq .head_sha)
          # versionCode RÉEL de l'APK (aapt) — jamais déclaré à la main.
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt 2>/dev/null | tail -1)
          test -n "$AAPT" || { echo "⛔ aapt introuvable"; exit 1; }
          BADGING=$("$AAPT" dump badging 7motion.apk)
          VC=$(echo "$BADGING" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" | head -1)
          VN=$(echo "$BADGING" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p" | head -1)
          test -n "$VC" || { echo "⛔ versionCode illisible"; exit 1; }
          # ANTI-RETOUR-ARRIÈRE STRICT : prod ne redescend jamais.
          PREV_VC=$(curl -fsSL "https://github.com/$GITHUB_REPOSITORY/releases/download/prod/version.json" 2>/dev/null \
            | sed -n 's/.*"versionCode"[^0-9]*\([0-9]*\).*/\1/p' | head -1)
          echo "versionCode : en ligne=${PREV_VC:-aucun} → nouveau=$VC"
          if [ -n "$PREV_VC" ] && [ "$VC" -le "$PREV_VC" ]; then
            echo "⛔ STRICT : $VC <= $PREV_VC — publication refusée."
            exit 1
          fi
          printf '{"versionCode": %s, "versionName": "%s", "url": "https://github.com/%s/releases/download/prod/7motion.apk", "mandatory": false}\n' \
            "$VC" "${VN:-0.0.0}" "$GITHUB_REPOSITORY" > version.json
          cat version.json
          NOTES=$(printf 'Dernier build de 7 MOTION (release signée).\n\n• Commit : `%s`\n• Run : %s\n• versionCode : %s (%s)\n\nLien direct (à donner aux clients) :\nhttps://github.com/%s/releases/download/prod/7motion.apk\nAussi servi via https://app.7themotion.com/android (/phone, /app, /fone).' \
            "$BUILD_SHA" "$RUN_ID" "$VC" "${VN:-?}" "$GITHUB_REPOSITORY")
          # EN PLACE : jamais de delete — le tag et les liens ne bougent pas.
          gh release edit prod -R "$GITHUB_REPOSITORY" --notes "$NOTES"
          ASSETS=(7motion.apk version.json)
          [ -f 7motion.aab ] && ASSETS+=(7motion.aab)
          gh release upload prod -R "$GITHUB_REPOSITORY" --clobber "${ASSETS[@]}"
          echo "✓ prod mise à jour : versionCode $VC"
