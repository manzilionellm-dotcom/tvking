# Entrée déjà enregistrée dans Actions ; construit les sources du lancement,
# puis livre exactement ce binaire signé et son manifeste au canal clients.
name: Publier 7 MOTION téléphone (APK corrigé et manifeste)

on:
  workflow_dispatch:
    inputs:
      confirme:
        description: 'PUBLIER_APP : construire, contrôler puis publier phone-latest'
        required: true
        type: string
      mandatory:
        description: 'Mise à jour critique ; laisser false pour une proposition ordinaire'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

permissions:
  contents: read

jobs:
  publish-phone:
    name: Construire et livrer le téléphone corrigé
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.confirme == 'PUBLIER_APP' &&
      github.ref == 'refs/heads/ccr-b93e1afd-gwirw0' &&
      github.repository == 'manzilionellm-dotcom/tvking' &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner
    # Plafond du publisher réutilisé ; son job de build reste en lecture seule.
    permissions:
      contents: write
    uses: ./.github/workflows/build-7motion-sport-test.yml
    with:
      play_aab: false
      client_release: true
      confirmation: ${{ inputs.confirme }}
      mandatory: ${{ inputs.mandatory == 'true' }}
    secrets:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
