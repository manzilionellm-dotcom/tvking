# ============================================================================
#  publish-phone-update.yml — Pose le manifeste de MAJ (version.json) des
#  TÉLÉPHONES installés depuis /fone, sur la release phone-test, pointant
#  vers l'APK 7motion-test.apk COURANT.
#
#  Même principe que publish-tv-update.yml : versionCode LU dans l'APK en
#  ligne (aapt) — jamais inventé ; téléphone déjà à jour → silence total ;
#  téléphone en retard → invité UNE fois (l'app applique en plus la grâce
#  12 h + l'espacement 24 h). DÉCLENCHEMENT MANUEL : un par lot validé.
# ============================================================================
name: Publish Phone update manifest (anti-harcèlement)

on:
  workflow_dispatch:
    inputs:
      confirme:
        description: PUBLIER_APP après dégel autorisé
        required: true
        type: string
      mandatory:
        description: 'Correctif critique (perce la grâce/espacement côté app)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

permissions:
  contents: read

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' && github.actor == github.repository_owner && github.triggering_actor == github.repository_owner && github.repository == 'manzilionellm-dotcom/tvking'
    environment: zuno-app-production
    permissions:
      contents: write
    name: version.json → phone-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Lire les protections
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Refuser une publication clients non revue
        env:
          APP_OPERATION: client
        run: node .github/app-release-guard.mjs
      - name: Lire le versionCode réel de l'APK phone-test puis poser le manifeste
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          APK_URL="https://github.com/$REPO/releases/download/phone-test/7motion-test.apk"
          curl -fsSL -o phone.apk "$APK_URL"
          AAPT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/aapt
          BADGING=$("$AAPT" dump badging phone.apk | head -1)
          echo "$BADGING"
          VC=$(echo "$BADGING" | grep -oE "versionCode='[0-9]+'" | grep -oE '[0-9]+')
          VN=$(echo "$BADGING" | grep -oE "versionName='[^']+'" | sed "s/versionName='//; s/'//")
          test -n "$VC"
          echo ">>> APK phone-test : versionCode=$VC versionName=$VN"
          SHA=$(sha256sum phone.apk | cut -d' ' -f1)
          SIZE=$(stat -c%s phone.apk)
          cat > version.json <<JSON
          {
            "versionCode": $VC,
            "versionName": "$VN",
            "url": "$APK_URL",
            "sha256": "$SHA",
            "size": $SIZE,
            "mandatory": ${{ inputs.mandatory }}
          }
          JSON
          cat version.json
          gh release upload phone-test version.json --clobber --repo "$REPO"
          echo "✓ phone-test"

