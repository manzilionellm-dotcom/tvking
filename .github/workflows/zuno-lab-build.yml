name: ZUNO LAB — APK adaptatif signé pour qualification
on:
  push:
    branches: ['lab/zuno-119-qualification-20261128']
    paths:
      - '.github/workflows/zuno-lab-build.yml'
      - 'android-app/ci/zuno_lab/prepare_lab.py'
      - 'android-app/packages/native_video_player/android/src/main/**'
      - 'android-app/lib/**'

permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: false
          pub-cache: false
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
      - name: Préparer ZUNO 119 adaptatif avec l'identité LAB
        run: |
          python3 -m venv "$RUNNER_TEMP/zuno-tools"
          "$RUNNER_TEMP/zuno-tools/bin/pip" install --only-binary=:all: Pillow==12.1.1 PyYAML==6.0.3
          "$RUNNER_TEMP/zuno-tools/bin/python" ci/zuno_lab/prepare_lab.py
          flutter pub get
          "$RUNNER_TEMP/zuno-tools/bin/python" ci/zuno_lab/prepare_lab.py --after-pub
          flutter gen-l10n
          dart run flutter_launcher_icons -f flutter_launcher_icons_zuno_tv.yaml
          "$RUNNER_TEMP/zuno-tools/bin/python" ci/play_editions/branding/apply.py
      - name: Compiler et signer uniquement le paquet LAB
        run: |
          set -euo pipefail
          umask 077
          pw=$(openssl rand -hex 24)
          keytool -genkeypair -keystore android/app/lab.p12 -storetype PKCS12 -alias zuno-lab -keyalg RSA -keysize 3072 -validity 365 -storepass "$pw" -keypass "$pw" -dname 'CN=ZUNO LAB, O=Qualification'
          printf 'storeFile=lab.p12\nstorePassword=%s\nkeyAlias=zuno-lab\nkeyPassword=%s\n' "$pw" "$pw" > android/key.properties
          flutter build apk --release --no-tree-shake-icons --android-skip-build-dependency-validation \
            --build-number=1794559152 --build-name=119-lab --obfuscate --split-debug-info=build/symbols-lab \
            --dart-define=PLAY_BUILD=true --dart-define=ZUNO_FREE_PLAYER=true --dart-define=ZUNO_EDITION=auto \
            --dart-define=BACKEND_URL=http://127.0.0.1:18789 --dart-define=GIT_SHA="$GITHUB_SHA" \
            --dart-define=APP_BUILD_TS="$(date +%s)" --target=lib/main_tv.dart
          mkdir -p build/lab
          cp build/app/outputs/flutter-apk/app-release.apk build/lab/ZUNO-LAB.apk
          cd build/lab
          bt=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$bt/apksigner" verify --verbose --print-certs ZUNO-LAB.apk > signature.txt
          "$bt/aapt" dump badging ZUNO-LAB.apk > badging.txt
          grep -F "package: name='com.sevenmotion.tv.seven_tv.lab' versionCode='1794559152' versionName='119-lab'" badging.txt
          grep -F "application-label:'ZUNO LAB'" badging.txt
          grep -F "sdkVersion:'24'" badging.txt
          sha256sum ZUNO-LAB.apk > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: zuno-lab-${{ github.sha }}
          path: android-app/build/lab/
          if-no-files-found: error
          retention-days: 14
