name: NovaTube LAB public et Televizo · 100 zaps sur horloge Android
on:
  push:
    branches: ['qa/novatube-device-clock-100-20261127']
permissions:
  contents: read
env:
  CI: 'true'
  FLUTTER_SUPPRESS_ANALYTICS: 'true'
  NOVATUBE_TV_APP_ID: com.sevenmotion.novatube.tv
  NOVATUBE_TV_VERSION: '1.0.0'
jobs:
  lecteur:
    name: 50 zaps filmés par lecteur (${{ matrix.order }})
    runs-on: ubuntu-24.04
    timeout-minutes: 105
    strategy:
      fail-fast: false
      matrix:
        order: [novatube-televizo, televizo-novatube]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          accept-android-sdk-licenses: false
      - name: Tester les deux lecteurs sur le même émulateur
        env:
          ORDER: ${{ matrix.order }}
        run: bash android-app/ci/novatube_tv/official_pilot.sh
      - name: Conserver les traces et les vidéos et les timestamps de chaque lecteur
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: device-clock-100-${{ matrix.order }}
          path: |
            pilot-results/egress-country.txt
            pilot-results/runner-region.txt
            pilot-results/system-image.txt
            pilot-results/client-memory.txt
            pilot-results/*/SHA256SUMS
            pilot-results/*/signature.txt
            pilot-results/*/badging.txt
            pilot-results/*/installed.sha256
            pilot-results/*/clip-*/device-keys.txt
            pilot-results/*/clip-*/device-clock-calibration.json
            pilot-results/*/clip-*/clocked-video.mp4
            pilot-results/*/clip-*/recording-status.txt
            pilot-results/*/clip-*/clock-results.json
            pilot-results/*/clip-*/valid.txt
            pilot-results/*/failed-clips/*/device-keys.txt
            pilot-results/*/failed-clips/*/clock-results.json
            pilot-results/*/failed-clips/*/recording-status.txt
            pilot-results/*/setup-status.txt
          retention-days: 14
          if-no-files-found: warn
