# =========================================================
#  NovaTube TV — APK de TEST (aucun client mis à jour)
# =========================================================
#  Compile l'édition NovaTube TV (code TV existant + --dart-define=
#  NOVATUBE_TV=true), la teste, la signe, la vérifie, l'ouvre sur un
#  émulateur Android 11 (hors réseau) avec captures d'écran, puis publie
#  une PRÉ-VERSION DE TEST séparée `novatube-tv-test-<commit>`.
#
#  Ce workflow ne touche JAMAIS :
#    • les releases publiques (zuno-tv, latest, novatube-private-…) ;
#    • le manifeste de téléchargement novatube.zuno8k.com ;
#    • le Worker, le panel, une licence, un paiement.
#
#  Signature : secret NOVATUBE_TV_KEYSTORE_BASE64 (+ mots de passe) s'il
#  existe ; sinon une clé de TEST jetable, différente à chaque build.
#  Avec une clé jetable, un nouvel APK de test ne s'installe PAS par-dessus
#  le précédent : il faut désinstaller d'abord (le rapport le rappelle).
#  Aucun APK de test ne peut mettre à jour NovaTube 334.2.6 (com.manthefew).
# =========================================================
name: NovaTube TV — APK de test

on:
  push:
    branches: ['qa/novatube-apk-tv-manuel-20261127']
    paths:
      - 'android-app/**'
      - '.github/workflows/novatube-tv-test.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: novatube-tv-test-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  FLUTTER_SUPPRESS_ANALYTICS: 'true'
  NOVATUBE_TV_APP_ID: com.sevenmotion.novatube.tv
  NOVATUBE_TV_VERSION: '1.0.0'

jobs:
  build:
    name: Compiler, tester et signer NovaTube TV
    if: github.repository == 'manzilionellm-dotcom/tvking'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: android-app
    outputs:
      apk-name: ${{ steps.verify.outputs.apk-name }}
      apk-sha256: ${{ steps.verify.outputs.apk-sha256 }}
      version-code: ${{ steps.build.outputs.version-code }}
      signing: ${{ steps.sign.outputs.signing }}
      cert-sha256: ${{ steps.verify.outputs.cert-sha256 }}
    env:
      # Les scripts TV existants lisent ces deux variables (ZUNO_ = historique).
      ZUNO_APP_ID: com.sevenmotion.novatube.tv
      ZUNO_APP_LABEL: NovaTube
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Java 17 (Temurin)
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter 3.47.7 (même version que Zuno TV)
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: SDK Android
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Licences Android
        run: yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Manifeste et Gradle TV (scripts Zuno, identité NovaTube)
        run: |
          set -e
          python3 ci/tv/patch_manifest.py android/app/src/main/AndroidManifest.xml
          cp ci/proguard-rules.pro android/app/proguard-rules.pro
          python3 ci/tv/patch_gradle.py android/app/build.gradle.kts
          grep -q 'applicationId = "com.sevenmotion.novatube.tv"' android/app/build.gradle.kts
          grep -q 'android:label="NovaTube"' android/app/src/main/AndroidManifest.xml

      - name: Préférences compatibles box Android 5 (identique à Zuno TV)
        run: |
          python3 - <<'PYEOF'
          from pathlib import Path
          path = Path('pubspec.yaml')
          source = path.read_text(encoding='utf-8')
          anchor = '  shared_preferences: ^2.3.4\n'
          if source.count(anchor) != 1 or '  shared_preferences_android:' in source:
              raise SystemExit('Contrainte SharedPreferences inattendue : vérifier le pin TV.')
          source = source.replace(anchor, anchor + '  shared_preferences_android: 2.5.0\n', 1)
          path.write_text(source, encoding='utf-8')
          PYEOF

      - name: Dépendances
        run: flutter pub get

      - name: Tests NovaTube en mode Zuno (prouve que Zuno ne change pas)
        run: |
          set -e
          flutter gen-l10n
          flutter test --no-pub test/novatube_tv

      - name: Préparer l'édition NovaTube (logo, nom, bannière, lancement)
        run: |
          set -e
          python3 ci/novatube_tv/prepare_build.py
          flutter pub get
          flutter gen-l10n

      - name: Patch screen_brightness_android (identique à Zuno TV)
        run: |
          set -e
          FILE=$(find ~/.pub-cache/hosted/pub.dev -path "*/screen_brightness_android-*/android/build.gradle" 2>/dev/null | head -1)
          if [ -z "$FILE" ]; then echo "screen_brightness_android absent, rien à faire"; exit 0; fi
          export PATCH_FILE="$FILE"
          python3 - <<'PYEOF'
          import os, re
          file = os.environ['PATCH_FILE']
          lines = open(file).readlines()
          out, in_kotlin, depth, removed = [], False, 0, 0
          for line in lines:
              if not in_kotlin:
                  if re.match(r'^\s*kotlin\s*\{', line):
                      in_kotlin = True
                      depth = line.count('{') - line.count('}')
                      removed += 1
                      if depth <= 0:
                          in_kotlin = False
                      continue
                  out.append(line)
              else:
                  depth += line.count('{') - line.count('}')
                  removed += 1
                  if depth <= 0:
                      in_kotlin = False
          if removed:
              open(file, 'w').writelines(out)
          print(f'lignes kotlin{{}} retirées : {removed}')
          PYEOF

      - name: Analyse et tests de l'édition NovaTube
        run: |
          set -e
          flutter analyze --no-pub --no-fatal-infos \
            lib/main_tv.dart lib/core/app/novatube_tv_edition.dart \
            lib/features/tv/core lib/features/tv/presentation/tv_app.dart \
            lib/features/tv/presentation/tv_novatube_welcome_screen.dart \
            lib/features/tv/presentation/tv_components.dart \
            lib/features/theme test/novatube_tv
          flutter test --no-pub --dart-define=NOVATUBE_TV=true test/novatube_tv

      - name: Icône, bannière Android TV et écran de lancement NovaTube
        run: |
          set -e
          dart run flutter_launcher_icons -f flutter_launcher_icons_novatube_tv.yaml
          python3 ci/tv/apply_splash.py
          python3 ci/novatube_tv/prepare_build.py --splash-color

      - name: Signature
        id: sign
        env:
          NT_KS_B64: ${{ secrets.NOVATUBE_TV_KEYSTORE_BASE64 }}
          NT_KS_PW: ${{ secrets.NOVATUBE_TV_KEYSTORE_PASSWORD }}
          NT_ALIAS: ${{ secrets.NOVATUBE_TV_KEY_ALIAS }}
          NT_KEY_PW: ${{ secrets.NOVATUBE_TV_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "$NT_KS_B64" ] && [ -n "$NT_KS_PW" ]; then
            printf '%s' "$NT_KS_B64" | base64 -d > android/app/release.jks
            alias="${NT_ALIAS:-novatube-tv}"; key_pw="${NT_KEY_PW:-$NT_KS_PW}"; store_pw="$NT_KS_PW"
            echo "signing=cle-novatube-tv" >> "$GITHUB_OUTPUT"
            echo "✓ clé NovaTube TV (secret du dépôt)"
          else
            # Clé de TEST jetable : jamais réutilisée, jamais publiée.
            store_pw="$(openssl rand -hex 24)"; key_pw="$store_pw"; alias="novatube-tv-test"
            echo "::add-mask::$store_pw"
            keytool -genkeypair -keystore android/app/release.jks -storetype PKCS12 \
              -alias "$alias" -keyalg RSA -keysize 3072 -validity 3650 \
              -storepass "$store_pw" -keypass "$key_pw" \
              -dname "CN=NovaTube TV test build, O=Test" >/dev/null 2>&1
            echo "signing=cle-de-test-jetable" >> "$GITHUB_OUTPUT"
            echo "::warning title=Signature de test::Aucun secret NOVATUBE_TV_KEYSTORE_BASE64 : APK signé avec une clé de test jetable (désinstaller la version de test précédente avant d'installer celle-ci)."
          fi
          {
            echo "storeFile=release.jks"
            echo "storePassword=$store_pw"
            echo "keyAlias=$alias"
            echo "keyPassword=$key_pw"
          } > android/key.properties

      - name: Compiler l'APK NovaTube TV (lib/main_tv.dart + NOVATUBE_TV)
        id: build
        run: |
          set -euo pipefail
          BUILD_NUMBER=$(date +%s)
          echo "version-code=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          flutter build apk --release --no-tree-shake-icons \
            --android-skip-build-dependency-validation \
            --target-platform android-arm,android-arm64,android-x64 \
            --build-number="$BUILD_NUMBER" \
            --build-name="$NOVATUBE_TV_VERSION" \
            --obfuscate --split-debug-info=build/symbols \
            --dart-define=NOVATUBE_TV=true \
            --dart-define=APP_BUILD_TS="$BUILD_NUMBER" \
            --dart-define=GIT_SHA=${{ github.sha }} \
            --target=lib/main_tv.dart

      - name: Vérifier l'APK (identité, Leanback, signature, empreinte)
        id: verify
        run: |
          set -euo pipefail
          short="${GITHUB_SHA:0:8}"
          name="NovaTube-TV-test-${NOVATUBE_TV_VERSION}-${short}.apk"
          mkdir -p build/novatube_tv
          cp build/app/outputs/flutter-apk/app-release.apk "build/novatube_tv/$name"
          apk="build/novatube_tv/$name"
          bt="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          # aapt (v1) n'existe plus dans certains build-tools : aapt2 sinon.
          if [ -x "$bt/aapt" ]; then aapt="$bt/aapt"; else aapt="$bt/aapt2"; fi
          "$aapt" dump badging "$apk" > build/novatube_tv/badging.txt
          grep -E "^package:|^application-label:|leanback" build/novatube_tv/badging.txt
          grep -q "^package: name='${NOVATUBE_TV_APP_ID}'" build/novatube_tv/badging.txt
          grep -q "^application-label:'NovaTube'" build/novatube_tv/badging.txt
          grep -q "^leanback-launchable-activity:" build/novatube_tv/badging.txt
          "$bt/apksigner" verify --verbose --print-certs "$apk" > build/novatube_tv/signature.txt
          cert="$(grep -m1 'certificate SHA-256 digest' build/novatube_tv/signature.txt | awk '{print $NF}')"
          sha="$(sha256sum "$apk" | awk '{print $1}')"
          (cd build/novatube_tv && sha256sum "$name" > SHA256SUMS.txt)
          echo "apk-name=$name" >> "$GITHUB_OUTPUT"
          echo "apk-sha256=$sha" >> "$GITHUB_OUTPUT"
          echo "cert-sha256=$cert" >> "$GITHUB_OUTPUT"
          echo "APK $name · $(stat -c %s "$apk") octets · SHA-256 $sha · certificat $cert"

      - name: Conserver l'APK vérifié
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: novatube-tv-apk-${{ github.sha }}
          path: |
            android-app/build/novatube_tv/*.apk
            android-app/build/novatube_tv/SHA256SUMS.txt
            android-app/build/novatube_tv/badging.txt
            android-app/build/novatube_tv/signature.txt
          if-no-files-found: error
          retention-days: 14

      - name: Variante d'émulateur (même code, Atlas LOCAL 127.0.0.1:8788)
        env:
          BUILD_NUMBER: ${{ steps.build.outputs.version-code }}
        run: |
          set -euo pipefail
          # Seule différence avec l'APK livré : l'adresse du serveur. Elle sert
          # au contrôle du parcours complet sur émulateur avec un Atlas local
          # (vrai code serveur). Ce fichier n'est JAMAIS publié.
          flutter build apk --release --no-tree-shake-icons \
            --android-skip-build-dependency-validation \
            --target-platform android-arm,android-arm64,android-x64 \
            --build-number="$BUILD_NUMBER" \
            --build-name="$NOVATUBE_TV_VERSION" \
            --obfuscate --split-debug-info=build/symbols-emulateur \
            --dart-define=NOVATUBE_TV=true \
            --dart-define=BACKEND_URL=http://127.0.0.1:8788 \
            --dart-define=APP_BUILD_TS="$BUILD_NUMBER" \
            --dart-define=GIT_SHA=${{ github.sha }} \
            --target=lib/main_tv.dart
          mkdir -p build/novatube_tv_emulateur
          cp build/app/outputs/flutter-apk/app-release.apk \
            build/novatube_tv_emulateur/NovaTube-TV-emulateur.apk
          # Le profil sert uniquement aux chronomètres et à gfxinfo sous Android 11.
          certdir="$RUNNER_TEMP/certificat-test-nova"
          mkdir -m 700 "$certdir"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj /CN=NovaTube-Test \
            -addext basicConstraints=critical,CA:TRUE -keyout "$certdir/ca.key" -out "$certdir/ca.pem" 2>/dev/null
          openssl req -new -newkey rsa:2048 -nodes -subj /CN=127.0.0.1 \
            -keyout "$certdir/server.key" -out "$certdir/server.csr" 2>/dev/null
          openssl x509 -req -in "$certdir/server.csr" -CA "$certdir/ca.pem" -CAkey "$certdir/ca.key" \
            -CAcreateserial -days 1 -extfile <(printf '%s\n' 'subjectAltName=IP:127.0.0.1' \
            'basicConstraints=CA:FALSE' 'extendedKeyUsage=serverAuth') -out "$certdir/server.pem" 2>/dev/null
          rm "$certdir/ca.key"
          openssl verify -CAfile "$certdir/ca.pem" "$certdir/server.pem"
          flutter build apk --profile --no-tree-shake-icons \
            --android-skip-build-dependency-validation --target-platform android-x64 \
            --build-number="$BUILD_NUMBER" --build-name="$NOVATUBE_TV_VERSION" \
            --dart-define=NOVATUBE_TV=true --dart-define=BACKEND_URL=http://127.0.0.1:8788 \
            --dart-define="NOVATUBE_CI_ROOT_PEM=$(base64 -w0 "$certdir/ca.pem")" \
            --target=ci/novatube_tv/profile_entry.dart
          mkdir build/novatube_tv_emulateur/tls-fixture
          cp "$certdir/server.pem" "$certdir/server.key" build/novatube_tv_emulateur/tls-fixture/
          cp build/app/outputs/flutter-apk/app-profile.apk \
            build/novatube_tv_emulateur/NovaTube-TV-profil.apk

      - name: Conserver la variante d'émulateur (jamais publiée)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: novatube-emulateur-apk-${{ github.sha }}
          path: |
            android-app/build/novatube_tv_emulateur/*.apk
            android-app/build/novatube_tv_emulateur/tls-fixture/
          if-no-files-found: error
          retention-days: 7

  emulator:
    name: Ouvrir l'APK sur Android 11 (émulateur TV 1080p, hors réseau)
    needs: [build]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
    outputs:
      source-sha: ${{ steps.origin.outputs.sha }}
      source-run: ${{ steps.origin.outputs.run }}
      apk-name: ${{ steps.binaire.outputs.nom }}
      apk-sha: ${{ steps.binaire.outputs.sha }}
      cert: ${{ steps.binaire.outputs.cert }}
      version: ${{ steps.binaire.outputs.version }}
      signature: ${{ steps.binaire.outputs.signature }}
    steps:
      - name: Checkout (script de contrôle du même commit)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Choisir les octets exacts du build à contrôler
        id: origin
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 android-app/ci/novatube_tv/select_test_artifacts.py

      - name: Télécharger l'APK signé et vérifié
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.origin.outputs.run }}
          name: novatube-tv-apk-${{ steps.origin.outputs.sha }}
          path: artifacts/apk

      - name: Télécharger la variante d'émulateur de la même compilation
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.origin.outputs.run }}
          name: novatube-emulateur-apk-${{ steps.origin.outputs.sha }}
          path: artifacts/variante

      - name: Relire l’empreinte et l’identité du binaire sélectionné
        id: binaire
        working-directory: artifacts/apk
        env:
          SOURCE: ${{ steps.origin.outputs.sha }}
        run: |
          set -euo pipefail
          sha256sum -c SHA256SUMS.txt
          nom="NovaTube-TV-test-${NOVATUBE_TV_VERSION}-${SOURCE:0:8}.apk"
          test -s "$nom"
          sha=$(sha256sum "$nom" | awk '{print $1}')
          cert=$(awk '/certificate SHA-256 digest:/ {print $NF; exit}' signature.txt)
          version=$(sed -n "s/^package: .*versionCode='\\([0-9]*\\)'.*/\\1/p" badging.txt)
          [[ "$cert" =~ ^[0-9a-f]{64}$ && "$version" =~ ^[0-9]+$ ]]
          signature=cle-novatube-tv
          if grep -Fq 'CN=NovaTube TV test build' signature.txt; then signature=cle-de-test-jetable; fi
          printf 'nom=%s\nsha=%s\ncert=%s\nversion=%s\nsignature=%s\n' "$nom" "$sha" "$cert" "$version" "$signature" >> "$GITHUB_OUTPUT"

      - name: Code serveur Atlas NovaTube (lecture seule, routes /api/novatube4k)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feature/novatube-activation-status-20261114
          path: atlas
          persist-credentials: false
          sparse-checkout: android-app/cloudflare

      - name: Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Lancer l'Atlas local (vrai code serveur, base vide, aucun réseau sortant)
        run: |
          set -euo pipefail
          (cd atlas/android-app/cloudflare && npm ci --no-audit --no-fund)
          ATLAS_PORT=8788 nohup node android-app/ci/novatube_tv/atlas_local_server.mjs \
            atlas/android-app/cloudflare "$RUNNER_TEMP/atlas.json" > "$RUNNER_TEMP/atlas.log" 2>&1 &
          for i in $(seq 1 90); do grep -q 'PRÊT' "$RUNNER_TEMP/atlas.log" && break; sleep 1; done
          grep 'PRÊT' "$RUNNER_TEMP/atlas.log"

      - name: Java 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      - name: SDK Android
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Bibliothèques Linux de l'émulateur et accélération KVM
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libpulse0 ffmpeg tesseract-ocr python3-pil
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm

      - name: Fabriquer la liste M3U de test (mires générées, aucun fournisseur)
        run: bash android-app/ci/novatube_tv/make_test_media.sh "$RUNNER_TEMP/novatube-media"

      - name: Installer, ouvrir, naviguer, importer, lire, rouvrir (captures)
        run: |
          set -euo pipefail
          apk="$(ls artifacts/apk/*.apk | head -1)"
          echo "$(sha256sum "$apk" | awk '{print $1}')" > expected.txt
          test "$(cat expected.txt)" = "${{ steps.binaire.outputs.sha }}"
          NOVATUBE_PROFILE_APK=artifacts/variante/NovaTube-TV-profil.apk NOVATUBE_EMULATOR_APK=artifacts/variante/NovaTube-TV-emulateur.apk \
          NOVATUBE_TEST_MEDIA="$RUNNER_TEMP/novatube-media" \
            bash android-app/ci/novatube_tv/emulator_smoke.sh "$apk" artifacts/emulateur

      - name: Créer la mire UHD SDR commune aux deux lecteurs de la SHIELD
        env:
          SOURCE: ${{ steps.origin.outputs.sha }}
        run: |
          set -euo pipefail
          tag="novatube-tv-test-${SOURCE:0:8}"
          python3 android-app/ci/novatube_tv/make_uhd_reference.py \
            artifacts/emulateur/mire-uhd-publique \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/$tag"

      - name: Conserver captures et journaux (même en cas d'échec)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: novatube-tv-emulateur-${{ github.sha }}
          path: artifacts/emulateur/
          if-no-files-found: warn
          retention-days: 14

  prerelease:
    name: Pré-version de TEST (lien direct, aucun client mis à jour)
    needs: [build, emulator]
    if: needs.build.result == 'success' && needs.emulator.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - name: Télécharger l’APK exact contrôlé sur Android
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ needs.emulator.outputs.source-run }}
          name: novatube-tv-apk-${{ needs.emulator.outputs.source-sha }}
          path: dl/apk

      - name: Télécharger les captures de ce contrôle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: novatube-tv-emulateur-${{ github.sha }}
          path: dl/emulateur

      - name: Publier la pré-version novatube-tv-test-<commit>
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE: ${{ needs.emulator.outputs.source-sha }}
          APK_NAME: ${{ needs.emulator.outputs.apk-name }}
          APK_SHA: ${{ needs.emulator.outputs.apk-sha }}
          CERT: ${{ needs.emulator.outputs.cert }}
          SIGNING: ${{ needs.emulator.outputs.signature }}
          VERSION_CODE: ${{ needs.emulator.outputs.version }}
        run: |
          set -euo pipefail
          tag="novatube-tv-test-${SOURCE:0:8}"
          apk="dl/apk/${APK_NAME}"
          test "$(sha256sum "$apk" | awk '{print $1}')" = "$APK_SHA"
          mkdir -p upload
          cp "$apk" "dl/apk/SHA256SUMS.txt" upload/
          (cd dl/emulateur/mire-uhd-publique && sha256sum -c mire-uhd-sommes.txt)
          cp dl/emulateur/mire-uhd-publique/mire-uhd{.m3u,-sdr.ts,-sommes.txt} upload/
          for png in dl/emulateur/*.png; do
            cp "$png" "upload/capture-$(basename "$png")"
          done
          if [ "$SIGNING" = "cle-de-test-jetable" ]; then
            sig="Clé de TEST jetable : désinstaller la version de test précédente avant d'installer celle-ci."
          else
            sig="Clé NovaTube TV du dépôt (mises à jour possibles entre APK de test)."
          fi
          media="$(cat "dl/emulateur/phase-media.txt" 2>/dev/null || echo absent)"
          if [ "$media" = "ok" ]; then
            parcours="**Parcours complet vérifié** sur la variante d'émulateur (même code, serveur = Atlas LOCAL avec le vrai code des routes NovaTube, hors production) : essai serveur de 10 jours, import M3U HTTP, Direct 3 zones, lecture d'une mire générée (captures 06 à 14)."
          else
            parcours="Parcours complet (Atlas local, import M3U, lecture) : **non concluant** sur ce build — voir captures 06 à 14."
          fi
          cat > notes.md <<EOF
          **APK de TEST NovaTube TV — ne pas distribuer aux clients.**

          - Paquet : \`com.sevenmotion.novatube.tv\` · version 1.0.0 (${VERSION_CODE}) · commit de l’APK ${SOURCE} · contrôle ${GITHUB_SHA}
          - SHA-256 de l'APK : \`${APK_SHA}\`
          - Certificat de signature (SHA-256) : \`${CERT}\` — ${sig}
          - **Ne met pas à jour NovaTube 334.2.6** (\`com.manthefew\`) : c'est une autre application, installée à côté.
          - Contrôlé automatiquement : installation, démarrage, télécommande, réouverture sans plantage sur émulateur Android 11 en 1080p, **hors réseau** (captures jointes).
          - ${parcours}
          - [Mire UHD SDR pour comparer les lecteurs sur la SHIELD](https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/mire-uhd.m3u). Ouvrir cette même liste dans les deux lecteurs. Source synthétique H.264 en 3 840 × 2 160, 25 images/s, BT.709, 60 secondes. Les colonnes comportent des traits de 1, 2, 4 et 8 pixels. La vérification physique reste à faire.
          - **Non contrôlé** : lecture d'un vrai flux, qualité d'image, HDR/Dolby Vision, son, essai sur une vraie NVIDIA SHIELD.
          EOF
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release download "$tag" --pattern "$APK_NAME" --dir existant --repo "$GITHUB_REPOSITORY"
            test "$(sha256sum "existant/$APK_NAME" | awk '{print $1}')" = "$APK_SHA"
            gh release upload "$tag" upload/capture-*.png --clobber --repo "$GITHUB_REPOSITORY"
            # Conserve les octets d'une mire déjà publiée au même lien de comparaison.
            noms=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
            if grep -Fxq 'mire-uhd-sommes.txt' <<< "$noms"; then
              gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern 'mire-uhd*' --dir mire-existante
              (cd mire-existante && sha256sum -c mire-uhd-sommes.txt)
              cmp mire-existante/mire-uhd.m3u upload/mire-uhd.m3u
            else
              # Le manifeste est publié en dernier. Un nouvel essai peut reprendre
              # après l'envoi d'un seul fichier sans en écraser une copie existante.
              for nom in mire-uhd-sdr.ts mire-uhd.m3u; do
                if grep -Fxq "$nom" <<< "$noms"; then
                  gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern "$nom" --dir mire-partielle
                  cmp "mire-partielle/$nom" "upload/$nom"
                else
                  gh release upload "$tag" "upload/$nom" --repo "$GITHUB_REPOSITORY"
                fi
              done
              gh release upload "$tag" upload/mire-uhd-sommes.txt --repo "$GITHUB_REPOSITORY"
            fi
          else
            gh release create "$tag" upload/* --repo "$GITHUB_REPOSITORY" \
              --target "$SOURCE" --prerelease \
              --title "NovaTube TV — APK de TEST ${GITHUB_SHA:0:8}" --notes-file notes.md
          fi
          echo "Lien direct : https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/${APK_NAME}"

  manual_lab_download:
    name: APK de laboratoire (lien séparé)
    needs: [build, emulator, prerelease]
    if: needs.prerelease.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    concurrency:
      group: novatube-tv-lab-download
      cancel-in-progress: false
    steps:
      - name: Relire le résultat du contrôle Android
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: novatube-tv-emulateur-${{ github.sha }}
          path: checked
      - name: Publier uniquement dans le canal laboratoire
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          SOURCE: ${{ needs.emulator.outputs.source-sha }}
          APK_SHA: ${{ needs.emulator.outputs.apk-sha }}
          APK_NAME: ${{ needs.emulator.outputs.apk-name }}
        run: |
          set -euo pipefail
          test "$(cat checked/phase-media.txt)" = ok
          tag="novatube-tv-test-${SOURCE:0:8}"
          lab="novatube-tv-lab"
          test "$(gh release view "$tag" --json isPrerelease,isDraft --jq '.isPrerelease and (.isDraft|not)')" = true
          mkdir source out backup
          gh release download "$tag" --pattern "$APK_NAME" --dir source
          printf '%s  %s\n' "$APK_SHA" "source/$APK_NAME" | sha256sum -c -
          cp "source/$APK_NAME" out/NovaTube-LAB.apk
          printf '%s  NovaTube-LAB.apk\n' "$APK_SHA" > out/SHA256SUMS.txt
          if gh release view "$lab" >/dev/null 2>&1; then
            test "$(gh release view "$lab" --json isPrerelease --jq .isPrerelease)" = true
            gh release download "$lab" --pattern NovaTube-LAB.apk --pattern SHA256SUMS.txt --dir backup
            (cd backup && sha256sum -c SHA256SUMS.txt)
          else
            gh release create "$lab" --target "$GITHUB_SHA" --prerelease --title "NovaTube Max — laboratoire privé de test" --notes "Canal expérimental distinct du téléchargement NovaTube habituel. Ne pas distribuer aux clients."
          fi
          restore() {
            rc=$?
            if [ "$rc" -ne 0 ] && [ -s backup/NovaTube-LAB.apk ]; then
              gh release upload "$lab" backup/NovaTube-LAB.apk backup/SHA256SUMS.txt --clobber
            fi
            exit "$rc"
          }
          trap restore EXIT
          gh release upload "$lab" out/NovaTube-LAB.apk out/SHA256SUMS.txt --clobber
          gh release download "$lab" --pattern NovaTube-LAB.apk --dir verified
          printf '%s  verified/NovaTube-LAB.apk\n' "$APK_SHA" | sha256sum -c -
          trap - EXIT
          echo "https://github.com/$GITHUB_REPOSITORY/releases/download/$lab/NovaTube-LAB.apk" >> "$GITHUB_STEP_SUMMARY"
          echo "SHA-256 : $APK_SHA" >> "$GITHUB_STEP_SUMMARY"
