# NOUVELLE APPLICATION : aucune clé, release ou fiche Play d'une autre app.
# Ce fichier ne déclenche rien au push ni à l'ouverture d'une pull request.
# Le workflow est déjà enregistré sur main ; sélectionner la branche
# NOVATUBE et son SHA approuvé. Aucun changement de main n'est nécessaire.
name: NOVATUBE — AAB Play ou APK privé vérifié

on:
  workflow_dispatch:
    inputs:
      confirme:
        description: 'COMPILER_NOVATUBE, PUBLIER_NOVATUBE_APK_PRIVE, CAPTURER_NOVATUBE_DATASYNC, CAPTURER_NOVATUBE_MEDIAPLAYBACK ou DIAGNOSTIQUER_NOVATUBE_CAST_RESEAU, après accord sur le SHA'
        type: string
        required: true
      reviewed_commit:
        description: 'SHA complet (40 caractères) de la version exactement approuvée'
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: novatube-play-aab
  cancel-in-progress: false

env:
  CI: 'true'
  BOT: 'true'
  FLUTTER_SUPPRESS_ANALYTICS: 'true'

defaults:
  run:
    shell: bash
    working-directory: android-app

jobs:
  release:
    name: Vérifier NOVATUBE — Play 0.1.8 (8) ou APK privé 0.1.5 (5)
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'manzilionellm-dotcom/tvking' &&
      github.ref == 'refs/heads/feature/novatube-play-aab' &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner &&
      (inputs.confirme == 'COMPILER_NOVATUBE' || inputs.confirme == 'PUBLIER_NOVATUBE_APK_PRIVE') &&
      inputs.reviewed_commit == github.sha
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Charger uniquement le commit approuvé
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Installer le parseur des garde-fous du workflow
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/novatube-ci-python"
          "$RUNNER_TEMP/novatube-ci-python/bin/python" -m pip install --disable-pip-version-check PyYAML==6.0.3
          echo "$RUNNER_TEMP/novatube-ci-python/bin" >> "$GITHUB_PATH"

      - name: Vérifier la base, l'identité, les icônes et la politique Play
        env:
          REVIEWED_COMMIT: ${{ inputs.reviewed_commit }}
        run: |
          set -euo pipefail
          python3 ci/novatube/verify_source.py \
            --reviewed-commit "$REVIEWED_COMMIT" \
            --report build/novatube/reports/source-verification.json
          python3 -m unittest discover -s ci/novatube -p 'test_*.py' -v \
            2>&1 | tee build/novatube/reports/static-tests.txt
          node --test ci/novatube/test_download_worker.mjs \
            2>&1 | tee build/novatube/reports/download-worker-tests.txt

      - name: Refuser le build si les quatre secrets dédiés manquent
        env:
          NOVATUBE_UPLOAD_KEYSTORE_BASE64: ${{ secrets.NOVATUBE_UPLOAD_KEYSTORE_BASE64 }}
          NOVATUBE_UPLOAD_STORE_PASSWORD: ${{ secrets.NOVATUBE_UPLOAD_STORE_PASSWORD }}
          NOVATUBE_UPLOAD_KEY_PASSWORD: ${{ secrets.NOVATUBE_UPLOAD_KEY_PASSWORD }}
          NOVATUBE_UPLOAD_KEY_ALIAS: ${{ secrets.NOVATUBE_UPLOAD_KEY_ALIAS }}
        run: python3 ci/novatube/prepare_signing.py --check-only

      - name: Java 21 pour les tests JVM du lecteur existant
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Vérifier le handoff natif du Cast
        run: |
          set -euo pipefail
          python3 ci/cast_test/run_native_logic.py \
            2>&1 | tee build/novatube/reports/native-jvm-tests.txt

      - name: Vérifier les règles de qualité et de sauvegarde MP4
        id: tests_recording_native
        run: |
          set -euo pipefail
          python3 ci/novatube/run_recording_logic.py \
            2>&1 | tee build/novatube/reports/recording-native-tests.txt

      - name: Java 17 pour la compilation Android
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter identique au tag de départ
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: false
          pub-cache: false

      - name: Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Vérifier le démarrage Android avant la compilation privée
        id: preflight_recording_device
        if: inputs.confirme == 'PUBLIER_NOVATUBE_APK_PRIVE'
        run: |
          set -euo pipefail
          python3 ci/novatube/run_recording_device.py --preflight \
            --reports build/novatube/reports

      - name: Installer SQLite pour les tests du vrai import manuel
        run: |
          # Le runner fournit normalement déjà SQLite. Ne contacter un
          # miroir Ubuntu que si la bibliothèque est réellement absente.
          if ! python3 -c 'import ctypes; ctypes.CDLL("libsqlite3.so.0")'; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends libsqlite3-0
          fi

      - name: Récupérer uniquement les trois fichiers du wrapper Gradle manquants
        run: |
          set -euo pipefail
          if [[ ! -f android/gradlew || ! -f android/gradlew.bat || ! -f android/gradle/wrapper/gradle-wrapper.jar ]]; then
            # Le tag ne versionne pas les wrappers. La génération temporaire
            # n'écrase jamais le manifeste, Gradle, les icônes ou les sources.
            flutter create --platforms=android --no-pub \
              --project-name=novatube_wrapper "$RUNNER_TEMP/novatube-wrapper"
            for relative in gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar; do
              if [[ ! -f "android/$relative" ]]; then
                mkdir -p "$(dirname "android/$relative")"
                cp "$RUNNER_TEMP/novatube-wrapper/android/$relative" "android/$relative"
              fi
            done
          fi
          chmod +x android/gradlew

      - name: Résoudre les dépendances et générer les traductions
        run: |
          set -euo pipefail
          flutter pub get
          flutter gen-l10n
          flutter --version --machine > build/novatube/reports/flutter-toolchain.json

      - name: Analyser le code livré et les nouveaux tests NOVATUBE
        id: analyze
        run: |
          set -euo pipefail
          flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings \
            lib test/novatube test/features/profiles \
            test/features/tv/touch/novatube_play_ui_test.dart \
            test/features/tv/touch/novatube_private_ui_test.dart \
            test/features/tv/touch/novatube_cinema_sort_ui_test.dart \
            test/features/tv/touch/novatube_recording_export_ui_test.dart \
            2>&1 | tee build/novatube/reports/flutter-analyze.txt

      - name: Tester les exclusions Play et les fonctions conservées
        id: tests_play
        run: |
          set -euo pipefail
          # Les anciens tests d'activation par MAC/panel ne décrivent pas
          # NOVATUBE. Les comportements remplacés ont leurs tests dédiés.
          flutter test --no-pub --machine \
            test/novatube \
            test/features/tv/touch/novatube_play_ui_test.dart \
            test/features/tv/touch/novatube_private_ui_test.dart \
            test/features/tv/touch/novatube_cinema_sort_ui_test.dart \
            test/features/tv/touch/novatube_recording_export_ui_test.dart \
            test/features/cast \
            test/features/epg \
            test/features/profiles \
            test/features/player \
            test/features/cinema \
            test/features/voice \
            test/features/tv/home_engagement_test.dart \
            test/features/tv/live_shelves_test.dart \
            test/features/playlists/m3u_parser_test.dart \
            test/features/playlists/m3u_link_test.dart \
            test/features/playlists/open_source_input_test.dart \
            test/features/playlists/xtream_category_parallel_test.dart \
            packages/native_video_player/test \
            | tee build/novatube/reports/flutter-tests.jsonl

      - name: Tester le tri adulte, la biométrie et les profils de l'APK privé
        id: tests_private
        if: inputs.confirme == 'PUBLIER_NOVATUBE_APK_PRIVE'
        run: |
          set -euo pipefail
          flutter test --no-pub --machine --concurrency=2 \
            --dart-define=NOVATUBE_PRIVATE_APK=true \
            test/features/cinema \
            test/features/profiles \
            test/features/voice \
            test/features/tv/home_engagement_test.dart \
            test/features/tv/live_shelves_test.dart \
            test/features/tv/touch/novatube_private_ui_test.dart \
            test/features/tv/touch/novatube_cinema_sort_ui_test.dart \
            test/features/tv/touch/novatube_recording_export_ui_test.dart \
            test/novatube/adult_access_test.dart \
            test/novatube/channel_classifier_adult_test.dart \
            test/novatube/declared_adult_routes_test.dart \
            test/novatube/provider_adult_persistence_test.dart \
            test/novatube/provider_adult_signal_test.dart \
            test/novatube/recording_relay_test.dart \
            test/novatube/recording_handoff_test.dart \
            | tee build/novatube/reports/flutter-tests-private.jsonl

      - name: Charger la clé dédiée et vérifier son certificat public
        env:
          NOVATUBE_KEYSTORE_PATH: ${{ runner.temp }}/novatube-upload.jks
          NOVATUBE_UPLOAD_KEYSTORE_BASE64: ${{ secrets.NOVATUBE_UPLOAD_KEYSTORE_BASE64 }}
          NOVATUBE_UPLOAD_STORE_PASSWORD: ${{ secrets.NOVATUBE_UPLOAD_STORE_PASSWORD }}
          NOVATUBE_UPLOAD_KEY_PASSWORD: ${{ secrets.NOVATUBE_UPLOAD_KEY_PASSWORD }}
          NOVATUBE_UPLOAD_KEY_ALIAS: ${{ secrets.NOVATUBE_UPLOAD_KEY_ALIAS }}
        run: python3 ci/novatube/prepare_signing.py

      - name: Compiler uniquement l'AAB release NOVATUBE approuvé
        id: build_play_aab
        if: inputs.confirme == 'COMPILER_NOVATUBE'
        env:
          NOVATUBE_KEYSTORE_PATH: ${{ runner.temp }}/novatube-upload.jks
          NOVATUBE_UPLOAD_STORE_PASSWORD: ${{ secrets.NOVATUBE_UPLOAD_STORE_PASSWORD }}
          NOVATUBE_UPLOAD_KEY_PASSWORD: ${{ secrets.NOVATUBE_UPLOAD_KEY_PASSWORD }}
          NOVATUBE_UPLOAD_KEY_ALIAS: ${{ secrets.NOVATUBE_UPLOAD_KEY_ALIAS }}
        run: |
          set -euo pipefail
          flutter build appbundle --release \
            --target=lib/main_zuno_mobile.dart \
            --build-name=0.1.8 --build-number=8

      - name: Vérifier le vrai bundle et produire sa provenance
        id: verify_play_aab
        if: inputs.confirme == 'COMPILER_NOVATUBE'
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 2 \
            --output "$RUNNER_TEMP/novatube-bundletool.jar" \
            https://github.com/google/bundletool/releases/download/1.18.2/bundletool-all-1.18.2.jar
          # Le script vérifie la somme officielle du JAR avant de l'exécuter.
          bundles=(build/app/outputs/bundle/release/*.aab)
          [[ "${#bundles[@]}" == 1 && -f "${bundles[0]}" ]]
          python3 ci/novatube/verify_aab.py \
            --aab "${bundles[0]}" \
            --bundletool "$RUNNER_TEMP/novatube-bundletool.jar" \
            --reports build/novatube/reports \
            --output build/novatube/verified

      - name: Conserver seulement l'AAB vérifié et ses preuves
        id: upload_play_aab
        if: inputs.confirme == 'COMPILER_NOVATUBE'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: NOVATUBE-0.1.8-8-verified-${{ github.sha }}-${{ github.run_attempt }}
          path: android-app/build/novatube/verified/
          if-no-files-found: error
          retention-days: 30

      - name: Compiler l'APK privé release NOVATUBE approuvé
        id: build_private_apk
        if: inputs.confirme == 'PUBLIER_NOVATUBE_APK_PRIVE'
        env:
          NOVATUBE_KEYSTORE_PATH: ${{ runner.temp }}/novatube-upload.jks
          NOVATUBE_UPLOAD_STORE_PASSWORD: ${{ secrets.NOVATUBE_UPLOAD_STORE_PASSWORD }}
          NOVATUBE_UPLOAD_KEY_PASSWORD: ${{ secrets.NOVATUBE_UPLOAD_KEY_PASSWORD }}
          NOVATUBE_UPLOAD_KEY_ALIAS: ${{ secrets.NOVATUBE_UPLOAD_KEY_ALIAS }}
        run: |
          set -euo pipefail
          flutter build apk --release \
            --target=lib/main_zuno_mobile.dart \
            --build-name=0.1.5 --build-number=5 \
            --dart-define=NOVATUBE_PRIVATE_APK=true

      - name: Vérifier de vrais exports MP4 sur Android 35
        id: tests_recording_device
        if: inputs.confirme == 'PUBLIER_NOVATUBE_APK_PRIVE'
        env:
          NOVATUBE_KEYSTORE_PATH: ${{ runner.temp }}/novatube-upload.jks
          NOVATUBE_UPLOAD_STORE_PASSWORD: ${{ secrets.NOVATUBE_UPLOAD_STORE_PASSWORD }}
          NOVATUBE_UPLOAD_KEY_PASSWORD: ${{ secrets.NOVATUBE_UPLOAD_KEY_PASSWORD }}
          NOVATUBE_UPLOAD_KEY_ALIAS: ${{ secrets.NOVATUBE_UPLOAD_KEY_ALIAS }}
        run: |
          set -euo pipefail
          python3 ci/novatube/run_recording_device.py \
            --apk build/app/outputs/flutter-apk/app-release.apk \
            --reports build/novatube/reports

      - name: Vérifier l'APK privé réel et ses preuves avant toute publication
        id: verify_private_apk
        if: inputs.confirme == 'PUBLIER_NOVATUBE_APK_PRIVE'
        run: |
          set -euo pipefail
          sdkmanager 'build-tools;36.0.0'
          python3 ci/novatube/verify_private_apk.py \
            --apk build/app/outputs/flutter-apk/app-release.apk \
            --reports build/novatube/reports \
            --output build/novatube/private-verified

      - name: Conserver uniquement l'APK privé vérifié et ses preuves
        id: upload_private_apk
        if: inputs.confirme == 'PUBLIER_NOVATUBE_APK_PRIVE'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: NOVATUBE-PRIVATE-APK-verified-${{ github.sha }}-${{ github.run_attempt }}
          path: android-app/build/novatube/private-verified/
          if-no-files-found: error
          retention-days: 30

      - name: Retirer la clé temporaire du runner
        if: always()
        working-directory: .
        env:
          NOVATUBE_KEYSTORE_PATH: ${{ runner.temp }}/novatube-upload.jks
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          Path(os.environ['NOVATUBE_KEYSTORE_PATH']).unlink(missing_ok=True)
          PY

      - name: Conserver le diagnostic Android en cas d'échec
        if: failure() && inputs.confirme == 'PUBLIER_NOVATUBE_APK_PRIVE'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: NOVATUBE-Android-diagnostic-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            android-app/build/novatube/reports/recording-emulator*.txt
            android-app/build/novatube/reports/recording-android-logcat*.txt
            android-app/build/novatube/reports/recording-device-tests.txt
            android-app/build/app/outputs/mapping/release/mapping.txt
          if-no-files-found: ignore
          retention-days: 7

  capture_play:
    name: Capturer le véritable binaire Play sur téléphone et tablette
    needs: release
    if: >-
      needs.release.result == 'success' &&
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'manzilionellm-dotcom/tvking' &&
      github.ref == 'refs/heads/feature/novatube-play-aab' &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner &&
      inputs.confirme == 'COMPILER_NOVATUBE' &&
      inputs.reviewed_commit == github.sha
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Charger les vérificateurs du commit approuvé
        id: capture_checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Java 17 pour bundletool, sans compilation de l'application
        id: capture_java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK pour les deux appareils jetables
        id: capture_android
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Télécharger uniquement l'AAB vérifié de ce run
        id: capture_aab
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: NOVATUBE-0.1.8-8-verified-${{ github.sha }}-${{ github.run_attempt }}
          path: android-app/build/novatube/capture-input/

      - name: Vérifier le binaire puis capturer les deux interfaces réelles
        id: capture_screenshots
        env:
          NOVATUBE_CAPTURE_CONFIRMATION: ${{ inputs.confirme }}
          REVIEWED_COMMIT: ${{ inputs.reviewed_commit }}
        run: |
          set -euo pipefail
          python3 ci/novatube/run_play_evidence.py \
            --verified build/novatube/capture-input \
            --output build/novatube/play-evidence \
            --diagnostics build/novatube/play-evidence-diagnostic

      - name: Conserver les captures reconnues et leur provenance, sans APK
        id: upload_play_evidence
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: NOVATUBE-Play-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: android-app/build/novatube/play-evidence/
          if-no-files-found: error
          retention-days: 30

      - name: Conserver séparément le diagnostic des captures échouées
        id: upload_play_evidence_diagnostic
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: NOVATUBE-Play-evidence-diagnostic-${{ github.sha }}-${{ github.run_attempt }}
          path: android-app/build/novatube/play-evidence-diagnostic/
          if-no-files-found: ignore
          retention-days: 7

  publish_private:
    name: Publier exclusivement l'APK privé NOVATUBE déjà vérifié
    needs: release
    if: >-
      needs.release.result == 'success' &&
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'manzilionellm-dotcom/tvking' &&
      github.ref == 'refs/heads/feature/novatube-play-aab' &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner &&
      inputs.confirme == 'PUBLIER_NOVATUBE_APK_PRIVE' &&
      inputs.reviewed_commit == github.sha
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Charger le script du commit approuvé sans identifiant persistant
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Télécharger uniquement l'APK vérifié de ce run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: NOVATUBE-PRIVATE-APK-verified-${{ github.sha }}-${{ github.run_attempt }}
          path: android-app/build/novatube/private-verified/

      - name: Publier la release dédiée puis actualiser le lien fixe NOVATUBE
        id: publish_private_apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOVATUBE_PUBLICATION_CONFIRMATION: ${{ inputs.confirme }}
          REVIEWED_COMMIT: ${{ inputs.reviewed_commit }}
        run: python3 ci/novatube/publish_private_apk.py --verified build/novatube/private-verified

  diagnose_cast_network:
    name: Diagnostiquer le réseau Cast — aucune preuve Play ni application installée
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'manzilionellm-dotcom/tvking' &&
      github.ref == 'refs/heads/feature/novatube-play-aab' &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner &&
      inputs.confirme == 'DIAGNOSTIQUER_NOVATUBE_CAST_RESEAU' &&
      inputs.reviewed_commit == github.sha
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Charger seulement le diagnostic du commit approuvé
        id: tap_checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Préparer le parseur des gardes existantes
        id: tap_python
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/novatube-tap-python"
          "$RUNNER_TEMP/novatube-tap-python/bin/python" -m pip install --disable-pip-version-check PyYAML==6.0.3
          echo "$RUNNER_TEMP/novatube-tap-python/bin" >> "$GITHUB_PATH"

      - name: Refuser toute autre intention, origine ou révision du diagnostic
        id: tap_preflight
        env:
          NOVATUBE_CAST_DIAGNOSTIC_CONFIRMATION: ${{ inputs.confirme }}
          REVIEWED_COMMIT: ${{ inputs.reviewed_commit }}
        run: |
          set -euo pipefail
          python3 -m unittest discover -s ci/novatube -p 'test_tap_*.py' -v
          python3 -m unittest discover -s ci/novatube -p test_verify_workflow.py -v
          python3 -m unittest discover -s ci/novatube -p test_datasync_evidence.py -v
          python3 ci/novatube/run_tap_diagnostic.py --preflight \
            --output build/novatube/cast-network-diagnostic

      - name: Java 17 pour l'appareil jetable, sans compilation
        id: tap_java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '17'

      - name: Préparer les outils Android sans accepter de nouvelle licence
        id: tap_android
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          cmdline-tools-version: '15859902'
          accept-android-sdk-licenses: false
          log-accepted-android-sdk-licenses: true
          packages: ''

      - name: Préparer le véritable récepteur et les outils des dépôts Ubuntu
        id: tap_linux_dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq \
            2>&1 | tee build/novatube/cast-network-diagnostic/ubuntu-update.txt
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            iproute2 util-linux dnsmasq-base tcpdump libixml11t64 libupnp17t64 \
            gstreamer1.0-tools gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-x \
            2>&1 | tee build/novatube/cast-network-diagnostic/ubuntu-install.txt
          dpkg-query -W iproute2 util-linux dnsmasq-base tcpdump libixml11t64 libupnp17t64 \
            gstreamer1.0-tools gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-x \
            > build/novatube/cast-network-diagnostic/ubuntu-versions.txt
          # Extraire le paquet officiel sans postinst : aucun service du
          # récepteur ne peut démarrer sur le réseau hôte avant le namespace.
          novatube_receiver_root="$RUNNER_TEMP/novatube-tap-receiver"
          mkdir "$novatube_receiver_root"
          curl --fail --location --silent --show-error --retry 2 \
            --output "$novatube_receiver_root/gmediarender.deb" \
            https://archive.ubuntu.com/ubuntu/pool/universe/g/gmrender-resurrect/gmediarender_0.1-1build3_amd64.deb
          printf '%s  %s\n' \
            '3560d817eaedb453a3fb2dcc69c1388994df9d1658877f4b5523e15cfb2ad395' \
            "$novatube_receiver_root/gmediarender.deb" | sha256sum --check --status
          dpkg-deb --extract "$novatube_receiver_root/gmediarender.deb" "$novatube_receiver_root/extracted"
          printf '%s  %s\n' \
            '22a18fa5d813e21ad7fdbf5fcf1f172dfdda8f4389a9aa4c15975079e16793f6' \
            "$novatube_receiver_root/extracted/usr/bin/gmediarender" | sha256sum --check --status
          dpkg-deb --field "$novatube_receiver_root/gmediarender.deb" \
            > build/novatube/cast-network-diagnostic/receiver-package.txt
          sha256sum "$novatube_receiver_root/gmediarender.deb" \
            "$novatube_receiver_root/extracted/usr/bin/gmediarender" \
            > build/novatube/cast-network-diagnostic/receiver-sha256.txt

      - name: Préparer Android 35 avant tout namespace réseau
        id: tap_sdk_dependencies
        run: |
          set -euo pipefail
          # L'entrée fermée interdit toute acceptation interactive d'une licence.
          sdkmanager 'system-images;android-35;default;x86_64' emulator platform-tools </dev/null \
            2>&1 | tee build/novatube/cast-network-diagnostic/sdk-install.txt
          "$ANDROID_HOME/emulator/emulator" -version \
            > build/novatube/cast-network-diagnostic/emulator-version-before-namespace.txt

      - name: Observer uniquement TAP, SSDP et les deux sens HTTP dans un réseau jetable
        id: tap_network
        env:
          NOVATUBE_CAST_DIAGNOSTIC_CONFIRMATION: ${{ inputs.confirme }}
          REVIEWED_COMMIT: ${{ inputs.reviewed_commit }}
        run: |
          set -euo pipefail
          python3 ci/novatube/run_tap_diagnostic.py \
            --output build/novatube/cast-network-diagnostic

      - name: Conserver le diagnostic réseau explicitement non destiné à Play
        id: tap_upload_diagnostic
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: NOVATUBE-Cast-network-DIAGNOSTIC-NOT-PLAY-${{ github.sha }}-${{ github.run_attempt }}
          path: android-app/build/novatube/cast-network-diagnostic/
          if-no-files-found: ignore
          retention-days: 7

  capture_mediaplayback:
    name: Observer le vrai relais Cast et mediaPlayback de l'AAB8 immuable
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'manzilionellm-dotcom/tvking' &&
      github.ref == 'refs/heads/feature/novatube-play-aab' &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner &&
      inputs.confirme == 'CAPTURER_NOVATUBE_MEDIAPLAYBACK' &&
      inputs.reviewed_commit == github.sha
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Charger seulement le banc du commit approuvé
        id: media_checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Charger les outils et traductions exacts de l'AAB8
        id: media_binary_checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 1610073a902acb922d1ea1bc394eebef2273efb3
          path: novatube-binary-source
          fetch-depth: 1
          persist-credentials: false

      - name: Préparer le parseur des gardes du workflow
        id: media_python
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/novatube-media-python"
          "$RUNNER_TEMP/novatube-media-python/bin/python" -m pip install --disable-pip-version-check PyYAML==6.0.3
          echo "$RUNNER_TEMP/novatube-media-python/bin" >> "$GITHUB_PATH"

      - name: Vérifier l'intention, la source immuable et les refus de qualification
        id: media_preflight
        env:
          NOVATUBE_MEDIAPLAYBACK_CONFIRMATION: ${{ inputs.confirme }}
          REVIEWED_COMMIT: ${{ inputs.reviewed_commit }}
        run: |
          set -euo pipefail
          python3 -m unittest discover -s ci/novatube -p 'test_mediaplayback*.py' -v
          python3 -m unittest discover -s ci/novatube -p test_verify_workflow.py -v
          python3 ci/novatube/run_mediaplayback_evidence.py --preflight

      - name: Télécharger uniquement l'archive AAB8 déjà vérifiée
        id: media_download_aab
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: '14120095100'
          run-id: '43608872429'
          repository: manzilionellm-dotcom/tvking
          github-token: ${{ github.token }}
          skip-decompress: true
          digest-mismatch: error
          path: android-app/build/novatube/mediaplayback-artifact/

      - name: Java 17 pour convertir le bundle existant sans compilation
        id: media_java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '17'

      - name: Outils Android sans nouvelle acceptation de licence
        id: media_android
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          cmdline-tools-version: '15859902'
          accept-android-sdk-licenses: false
          log-accepted-android-sdk-licenses: true
          packages: ''

      - name: Préparer les bibliothèques officielles et le vrai affichage X11
        id: media_linux_dependencies
        run: |
          set -euo pipefail
          command -v dbus-run-session
          sudo apt-get update -qq 2>&1 | tee build/novatube/mediaplayback-diagnostic/ubuntu-update.txt
          novatube_media_packages=(
            iproute2 util-linux dnsmasq-base tcpdump ffmpeg xvfb x11-utils xauth
            libgdk-pixbuf-2.0-0 libgee-0.8-2 libgssdp-1.6-0 libgupnp-1.6-0=1.6.6-1build3
            libgupnp-av-1.0-3 libgupnp-dlna-2.0-4 libmediaart-2.0-0 libsoup-3.0-0
            libsqlite3-0 libx11-6 libxml2
            librygel-core-2.8-0=0.42.5-1ubuntu3 librygel-db-2.8-0=0.42.5-1ubuntu3
            librygel-renderer-2.8-0=0.42.5-1ubuntu3 librygel-server-2.8-0=0.42.5-1ubuntu3
            gstreamer1.0-tools gstreamer1.0-plugins-base gstreamer1.0-plugins-good
            gstreamer1.0-plugins-bad gstreamer1.0-libav gstreamer1.0-x
          )
          sudo apt-get --simulate --no-install-recommends install "${novatube_media_packages[@]}" \
            > build/novatube/mediaplayback-diagnostic/ubuntu-plan.txt
          # Le daemon et son plugin sont extraits plus tard, sans postinst.
          python3 - <<'PY'
          from pathlib import Path
          import re
          plan = Path('build/novatube/mediaplayback-diagnostic/ubuntu-plan.txt').read_text()
          if re.search(r'^Inst rygel', plan, re.M):
              raise SystemExit('Refus de toute installation du daemon Rygel sur le réseau hôte')
          PY
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            "${novatube_media_packages[@]}" 2>&1 | tee build/novatube/mediaplayback-diagnostic/ubuntu-install.txt
          dpkg-query -W 'librygel*' libgupnp-1.6-0 'gstreamer1.0-*' xvfb \
            > build/novatube/mediaplayback-diagnostic/ubuntu-versions.txt

      - name: Préparer Android 35 avant le réseau jetable
        id: media_sdk_dependencies
        run: |
          set -euo pipefail
          sdkmanager 'system-images;android-35;default;x86_64' emulator platform-tools 'build-tools;35.0.0' </dev/null \
            2>&1 | tee build/novatube/mediaplayback-diagnostic/sdk-install.txt

      - name: Vérifier l'AAB8 et extraire les seuls octets officiels du renderer
        id: media_prepare
        env:
          NOVATUBE_MEDIAPLAYBACK_CONFIRMATION: ${{ inputs.confirme }}
          REVIEWED_COMMIT: ${{ inputs.reviewed_commit }}
        run: python3 ci/novatube/run_mediaplayback_evidence.py --prepare

      - name: Capturer la découverte, le relais réel, Home et l'arrêt utilisateur
        id: media_capture
        env:
          NOVATUBE_MEDIAPLAYBACK_CONFIRMATION: ${{ inputs.confirme }}
          REVIEWED_COMMIT: ${{ inputs.reviewed_commit }}
        run: python3 ci/novatube/run_mediaplayback_evidence.py --capture

      - name: Supprimer les seuls fichiers privés de l'émulateur et de conversion
        id: media_cleanup
        if: always()
        env:
          NOVATUBE_MEDIAPLAYBACK_CONFIRMATION: ${{ inputs.confirme }}
          REVIEWED_COMMIT: ${{ inputs.reviewed_commit }}
        run: python3 ci/novatube/run_mediaplayback_evidence.py --cleanup

      - name: Conserver seulement les deux vidéos ayant passé la qualification
        id: media_upload_evidence
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: NOVATUBE-mediaPlayback-from-43608872429-${{ github.sha }}-${{ github.run_attempt }}
          path: android-app/build/novatube/mediaplayback-evidence/
          if-no-files-found: error
          retention-days: 30

      - name: Conserver les observations brutes séparées des vidéos qualifiées
        id: media_upload_diagnostic
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: NOVATUBE-mediaPlayback-DIAGNOSTIC-NOT-PLAY-${{ github.sha }}-${{ github.run_attempt }}
          path: android-app/build/novatube/mediaplayback-diagnostic/
          if-no-files-found: ignore
          retention-days: 7

  capture_datasync:
    name: Observer dataSync depuis le seul AAB déjà approuvé
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'manzilionellm-dotcom/tvking' &&
      github.ref == 'refs/heads/feature/novatube-play-aab' &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner &&
      inputs.confirme == 'CAPTURER_NOVATUBE_DATASYNC' &&
      inputs.reviewed_commit == github.sha
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Charger uniquement le script approuvé
        id: script_checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Charger les vérificateurs et traductions du binaire existant
        id: binary_checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 1610073a902acb922d1ea1bc394eebef2273efb3
          path: novatube-binary-source
          fetch-depth: 1
          persist-credentials: false

      - name: Refuser toute autre révision, origine ou configuration de preuves
        id: preflight
        env:
          NOVATUBE_DATASYNC_CONFIRMATION: ${{ inputs.confirme }}
          REVIEWED_COMMIT: ${{ inputs.reviewed_commit }}
        run: |
          set -euo pipefail
          python3 -m unittest discover -s ci/novatube -p test_datasync_evidence.py -v
          python3 ci/novatube/run_datasync_evidence.py --preflight \
            --original-source ../novatube-binary-source/android-app

      - name: Télécharger l'unique archive immuable déjà vérifiée
        id: download_aab
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: '14120095100'
          run-id: '43608872429'
          repository: manzilionellm-dotcom/tvking
          github-token: ${{ github.token }}
          skip-decompress: true
          digest-mismatch: error
          path: android-app/build/novatube/datasync-artifact/

      - name: Java pour vérifier et convertir l'AAB, sans compilation
        id: java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK pour le téléphone jetable
        id: android
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd

      - name: Vérifier les outils de la seule mire synthétique
        id: ffmpeg
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          ffmpeg -version
          ffprobe -version

      - name: Observer REC, l'écriture en arrière-plan, l'arrêt et la relecture
        id: data_sync_video
        env:
          NOVATUBE_DATASYNC_CONFIRMATION: ${{ inputs.confirme }}
          REVIEWED_COMMIT: ${{ inputs.reviewed_commit }}
        run: |
          set -euo pipefail
          python3 ci/novatube/run_datasync_evidence.py \
            --original-source ../novatube-binary-source/android-app \
            --archive-dir build/novatube/datasync-artifact \
            --output build/novatube/datasync-evidence \
            --diagnostics build/novatube/datasync-diagnostic

      - name: Conserver uniquement la démonstration ayant passé les contrôles
        id: upload_evidence
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: NOVATUBE-dataSync-from-43608872429-${{ github.sha }}-${{ github.run_attempt }}
          path: android-app/build/novatube/datasync-evidence/
          if-no-files-found: error
          retention-days: 30

      - name: Conserver séparément les preuves non qualifiées en cas d'échec
        id: upload_diagnostic
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: NOVATUBE-dataSync-diagnostic-${{ github.sha }}-${{ github.run_attempt }}
          path: android-app/build/novatube/datasync-diagnostic/
          if-no-files-found: ignore
          retention-days: 7
