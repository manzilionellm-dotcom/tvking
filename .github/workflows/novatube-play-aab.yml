# NOUVELLE APPLICATION : aucune clé, release ou fiche Play d'une autre app.
# Ce fichier ne déclenche rien au push ni à l'ouverture d'une pull request.
# Le workflow est déjà enregistré sur main ; sélectionner la branche
# NOVATUBE et son SHA approuvé. Aucun changement de main n'est nécessaire.
name: NOVATUBE — AAB Play ou APK privé vérifié

on:
  workflow_dispatch:
    inputs:
      confirme:
        description: 'COMPILER_NOVATUBE (AAB Play) ou PUBLIER_NOVATUBE_APK_PRIVE, après accord sur le SHA'
        type: string
        required: true
      reviewed_commit:
        description: 'SHA complet (40 caractères) de la version exactement approuvée'
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: novatube-play-aab
  cancel-in-progress: false

env:
  CI: 'true'
  BOT: 'true'
  FLUTTER_SUPPRESS_ANALYTICS: 'true'

defaults:
  run:
    shell: bash
    working-directory: android-app

jobs:
  release:
    name: Tester, compiler et vérifier NOVATUBE 0.1.5 (5)
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'manzilionellm-dotcom/tvking' &&
      github.ref == 'refs/heads/feature/novatube-play-aab' &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner &&
      (inputs.confirme == 'COMPILER_NOVATUBE' || inputs.confirme == 'PUBLIER_NOVATUBE_APK_PRIVE') &&
      inputs.reviewed_commit == github.sha
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Charger uniquement le commit approuvé
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Installer le parseur des garde-fous du workflow
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/novatube-ci-python"
          "$RUNNER_TEMP/novatube-ci-python/bin/python" -m pip install --disable-pip-version-check PyYAML==6.0.3
          echo "$RUNNER_TEMP/novatube-ci-python/bin" >> "$GITHUB_PATH"

      - name: Vérifier la base, l'identité, les icônes et la politique Play
        env:
          REVIEWED_COMMIT: ${{ inputs.reviewed_commit }}
        run: |
          set -euo pipefail
          python3 ci/novatube/verify_source.py \
            --reviewed-commit "$REVIEWED_COMMIT" \
            --report build/novatube/reports/source-verification.json
          python3 -m unittest discover -s ci/novatube -p 'test_*.py' -v \
            2>&1 | tee build/novatube/reports/static-tests.txt
          node --test ci/novatube/test_download_worker.mjs \
            2>&1 | tee build/novatube/reports/download-worker-tests.txt

      - name: Refuser le build si les quatre secrets dédiés manquent
        env:
          NOVATUBE_UPLOAD_KEYSTORE_BASE64: ${{ secrets.NOVATUBE_UPLOAD_KEYSTORE_BASE64 }}
          NOVATUBE_UPLOAD_STORE_PASSWORD: ${{ secrets.NOVATUBE_UPLOAD_STORE_PASSWORD }}
          NOVATUBE_UPLOAD_KEY_PASSWORD: ${{ secrets.NOVATUBE_UPLOAD_KEY_PASSWORD }}
          NOVATUBE_UPLOAD_KEY_ALIAS: ${{ secrets.NOVATUBE_UPLOAD_KEY_ALIAS }}
        run: python3 ci/novatube/prepare_signing.py --check-only

      - name: Java 21 pour les tests JVM du lecteur existant
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Vérifier le handoff natif du Cast
        run: |
          set -euo pipefail
          python3 ci/cast_test/run_native_logic.py \
            2>&1 | tee build/novatube/reports/native-jvm-tests.txt

      - name: Vérifier les règles de qualité et de sauvegarde MP4
        id: tests_recording_native
        run: |
          set -euo pipefail
          python3 ci/novatube/run_recording_logic.py \
            2>&1 | tee build/novatube/reports/recording-native-tests.txt

      - name: Java 17 pour la compilation Android
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter identique au tag de départ
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: false
          pub-cache: false

      - name: Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Installer SQLite pour les tests du vrai import manuel
        run: |
          # Le runner fournit normalement déjà SQLite. Ne contacter un
          # miroir Ubuntu que si la bibliothèque est réellement absente.
          if ! python3 -c 'import ctypes; ctypes.CDLL("libsqlite3.so.0")'; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends libsqlite3-0
          fi

      - name: Récupérer uniquement les trois fichiers du wrapper Gradle manquants
        run: |
          set -euo pipefail
          if [[ ! -f android/gradlew || ! -f android/gradlew.bat || ! -f android/gradle/wrapper/gradle-wrapper.jar ]]; then
            # Le tag ne versionne pas les wrappers. La génération temporaire
            # n'écrase jamais le manifeste, Gradle, les icônes ou les sources.
            flutter create --platforms=android --no-pub \
              --project-name=novatube_wrapper "$RUNNER_TEMP/novatube-wrapper"
            for relative in gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar; do
              if [[ ! -f "android/$relative" ]]; then
                mkdir -p "$(dirname "android/$relative")"
                cp "$RUNNER_TEMP/novatube-wrapper/android/$relative" "android/$relative"
              fi
            done
          fi
          chmod +x android/gradlew

      - name: Résoudre les dépendances et générer les traductions
        run: |
          set -euo pipefail
          flutter pub get
          flutter gen-l10n
          flutter --version --machine > build/novatube/reports/flutter-toolchain.json

      - name: Analyser le code livré et les nouveaux tests NOVATUBE
        id: analyze
        run: |
          set -euo pipefail
          flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings \
            lib test/novatube test/features/profiles \
            test/features/tv/touch/novatube_play_ui_test.dart \
            test/features/tv/touch/novatube_private_ui_test.dart \
            test/features/tv/touch/novatube_cinema_sort_ui_test.dart \
            test/features/tv/touch/novatube_recording_export_ui_test.dart \
            2>&1 | tee build/novatube/reports/flutter-analyze.txt

      - name: Tester les exclusions Play et les fonctions conservées
        id: tests_play
        run: |
          set -euo pipefail
          # Les anciens tests d'activation par MAC/panel ne décrivent pas
          # NOVATUBE. Les comportements remplacés ont leurs tests dédiés.
          flutter test --no-pub --machine \
            test/novatube \
            test/features/tv/touch/novatube_play_ui_test.dart \
            test/features/tv/touch/novatube_private_ui_test.dart \
            test/features/tv/touch/novatube_cinema_sort_ui_test.dart \
            test/features/tv/touch/novatube_recording_export_ui_test.dart \
            test/features/cast \
            test/features/epg \
            test/features/profiles \
            test/features/player \
            test/features/cinema \
            test/features/voice \
            test/features/tv/home_engagement_test.dart \
            test/features/tv/live_shelves_test.dart \
            test/features/playlists/m3u_parser_test.dart \
            test/features/playlists/m3u_link_test.dart \
            test/features/playlists/open_source_input_test.dart \
            test/features/playlists/xtream_category_parallel_test.dart \
            packages/native_video_player/test \
            | tee build/novatube/reports/flutter-tests.jsonl

      - name: Tester le tri adulte, la biométrie et les profils de l'APK privé
        id: tests_private
        if: inputs.confirme == 'PUBLIER_NOVATUBE_APK_PRIVE'
        run: |
          set -euo pipefail
          flutter test --no-pub --machine --concurrency=2 \
            --dart-define=NOVATUBE_PRIVATE_APK=true \
            test/features/cinema \
            test/features/profiles \
            test/features/voice \
            test/features/tv/home_engagement_test.dart \
            test/features/tv/live_shelves_test.dart \
            test/features/tv/touch/novatube_private_ui_test.dart \
            test/features/tv/touch/novatube_cinema_sort_ui_test.dart \
            test/features/tv/touch/novatube_recording_export_ui_test.dart \
            test/novatube/adult_access_test.dart \
            test/novatube/channel_classifier_adult_test.dart \
            test/novatube/declared_adult_routes_test.dart \
            test/novatube/provider_adult_persistence_test.dart \
            test/novatube/provider_adult_signal_test.dart \
            test/novatube/recording_relay_test.dart \
            test/novatube/recording_handoff_test.dart \
            | tee build/novatube/reports/flutter-tests-private.jsonl

      - name: Charger la clé dédiée et vérifier son certificat public
        env:
          NOVATUBE_KEYSTORE_PATH: ${{ runner.temp }}/novatube-upload.jks
          NOVATUBE_UPLOAD_KEYSTORE_BASE64: ${{ secrets.NOVATUBE_UPLOAD_KEYSTORE_BASE64 }}
          NOVATUBE_UPLOAD_STORE_PASSWORD: ${{ secrets.NOVATUBE_UPLOAD_STORE_PASSWORD }}
          NOVATUBE_UPLOAD_KEY_PASSWORD: ${{ secrets.NOVATUBE_UPLOAD_KEY_PASSWORD }}
          NOVATUBE_UPLOAD_KEY_ALIAS: ${{ secrets.NOVATUBE_UPLOAD_KEY_ALIAS }}
        run: python3 ci/novatube/prepare_signing.py

      - name: Compiler uniquement l'AAB release NOVATUBE approuvé
        id: build_play_aab
        if: inputs.confirme == 'COMPILER_NOVATUBE'
        env:
          NOVATUBE_KEYSTORE_PATH: ${{ runner.temp }}/novatube-upload.jks
          NOVATUBE_UPLOAD_STORE_PASSWORD: ${{ secrets.NOVATUBE_UPLOAD_STORE_PASSWORD }}
          NOVATUBE_UPLOAD_KEY_PASSWORD: ${{ secrets.NOVATUBE_UPLOAD_KEY_PASSWORD }}
          NOVATUBE_UPLOAD_KEY_ALIAS: ${{ secrets.NOVATUBE_UPLOAD_KEY_ALIAS }}
        run: |
          set -euo pipefail
          flutter build appbundle --release \
            --target=lib/main_zuno_mobile.dart \
            --build-name=0.1.5 --build-number=5

      - name: Vérifier le vrai bundle et produire sa provenance
        id: verify_play_aab
        if: inputs.confirme == 'COMPILER_NOVATUBE'
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 2 \
            --output "$RUNNER_TEMP/novatube-bundletool.jar" \
            https://github.com/google/bundletool/releases/download/1.18.2/bundletool-all-1.18.2.jar
          # Le script vérifie la somme officielle du JAR avant de l'exécuter.
          bundles=(build/app/outputs/bundle/release/*.aab)
          [[ "${#bundles[@]}" == 1 && -f "${bundles[0]}" ]]
          python3 ci/novatube/verify_aab.py \
            --aab "${bundles[0]}" \
            --bundletool "$RUNNER_TEMP/novatube-bundletool.jar" \
            --reports build/novatube/reports \
            --output build/novatube/verified

      - name: Conserver seulement l'AAB vérifié et ses preuves
        id: upload_play_aab
        if: inputs.confirme == 'COMPILER_NOVATUBE'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: NOVATUBE-0.1.5-5-verified-${{ github.sha }}-${{ github.run_attempt }}
          path: android-app/build/novatube/verified/
          if-no-files-found: error
          retention-days: 30

      - name: Compiler l'APK privé release NOVATUBE approuvé
        id: build_private_apk
        if: inputs.confirme == 'PUBLIER_NOVATUBE_APK_PRIVE'
        env:
          NOVATUBE_KEYSTORE_PATH: ${{ runner.temp }}/novatube-upload.jks
          NOVATUBE_UPLOAD_STORE_PASSWORD: ${{ secrets.NOVATUBE_UPLOAD_STORE_PASSWORD }}
          NOVATUBE_UPLOAD_KEY_PASSWORD: ${{ secrets.NOVATUBE_UPLOAD_KEY_PASSWORD }}
          NOVATUBE_UPLOAD_KEY_ALIAS: ${{ secrets.NOVATUBE_UPLOAD_KEY_ALIAS }}
        run: |
          set -euo pipefail
          flutter build apk --release \
            --target=lib/main_zuno_mobile.dart \
            --build-name=0.1.5 --build-number=5 \
            --dart-define=NOVATUBE_PRIVATE_APK=true

      - name: Vérifier de vrais exports MP4 sur Android 35
        id: tests_recording_device
        if: inputs.confirme == 'PUBLIER_NOVATUBE_APK_PRIVE'
        env:
          NOVATUBE_KEYSTORE_PATH: ${{ runner.temp }}/novatube-upload.jks
          NOVATUBE_UPLOAD_STORE_PASSWORD: ${{ secrets.NOVATUBE_UPLOAD_STORE_PASSWORD }}
          NOVATUBE_UPLOAD_KEY_PASSWORD: ${{ secrets.NOVATUBE_UPLOAD_KEY_PASSWORD }}
          NOVATUBE_UPLOAD_KEY_ALIAS: ${{ secrets.NOVATUBE_UPLOAD_KEY_ALIAS }}
        run: |
          set -euo pipefail
          python3 ci/novatube/run_recording_device.py \
            --apk build/app/outputs/flutter-apk/app-release.apk \
            --reports build/novatube/reports

      - name: Vérifier l'APK privé réel et ses preuves avant toute publication
        id: verify_private_apk
        if: inputs.confirme == 'PUBLIER_NOVATUBE_APK_PRIVE'
        run: |
          set -euo pipefail
          sdkmanager 'build-tools;36.0.0'
          python3 ci/novatube/verify_private_apk.py \
            --apk build/app/outputs/flutter-apk/app-release.apk \
            --reports build/novatube/reports \
            --output build/novatube/private-verified

      - name: Conserver uniquement l'APK privé vérifié et ses preuves
        id: upload_private_apk
        if: inputs.confirme == 'PUBLIER_NOVATUBE_APK_PRIVE'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: NOVATUBE-PRIVATE-APK-verified-${{ github.sha }}-${{ github.run_attempt }}
          path: android-app/build/novatube/private-verified/
          if-no-files-found: error
          retention-days: 30

      - name: Retirer la clé temporaire du runner
        if: always()
        working-directory: .
        env:
          NOVATUBE_KEYSTORE_PATH: ${{ runner.temp }}/novatube-upload.jks
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          Path(os.environ['NOVATUBE_KEYSTORE_PATH']).unlink(missing_ok=True)
          PY

  publish_private:
    name: Publier exclusivement l'APK privé NOVATUBE déjà vérifié
    needs: release
    if: >-
      needs.release.result == 'success' &&
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'manzilionellm-dotcom/tvking' &&
      github.ref == 'refs/heads/feature/novatube-play-aab' &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner &&
      inputs.confirme == 'PUBLIER_NOVATUBE_APK_PRIVE' &&
      inputs.reviewed_commit == github.sha
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Charger le script du commit approuvé sans identifiant persistant
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Télécharger uniquement l'APK vérifié de ce run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: NOVATUBE-PRIVATE-APK-verified-${{ github.sha }}-${{ github.run_attempt }}
          path: android-app/build/novatube/private-verified/

      - name: Publier la release dédiée puis actualiser le lien fixe NOVATUBE
        id: publish_private_apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOVATUBE_PUBLICATION_CONFIRMATION: ${{ inputs.confirme }}
          REVIEWED_COMMIT: ${{ inputs.reviewed_commit }}
        run: python3 ci/novatube/publish_private_apk.py --verified build/novatube/private-verified
