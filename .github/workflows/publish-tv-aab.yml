# ============================================================================
#  publish-tv-aab.yml — Attache l'AAB Android TV d'un run build-tv à la
#  release « cinema-test » existante, pour un LIEN DIRECT sans zip :
#    https://github.com/<repo>/releases/download/cinema-test/defew-tv.aab
#
#  Équivalent TV de publish-phone-aab.yml : fichier .aab NU, téléchargeable
#  d'un clic pour la Play Console (fiche Android TV).
#
#  GARDE-FOUS : n'écrase pas l'APK de test de la release ; déclenchement
#  MANUEL uniquement ; aucun version.json.
# ============================================================================
name: Publish TV AAB (lien direct)

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'ID du run build-tv dont on publie l''AAB Google Play'
        required: true
        type: string

permissions:
  contents: write   # attacher l'asset à la release cinema-test
  actions: read     # télécharger l'artefact du run build-tv

jobs:
  publish:
    name: Attache defew-tv.aab à cinema-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Télécharger l'AAB du run build-tv
        uses: actions/download-artifact@v4
        with:
          pattern: defew-tv-playstore-aab-*
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          merge-multiple: true

      - name: Attacher l'AAB à la release cinema-test (asset écrasé si présent)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          ls -la
          test -f defew-tv.aab
          gh release upload cinema-test defew-tv.aab --clobber -R "$GITHUB_REPOSITORY"
          echo "✓ https://github.com/$GITHUB_REPOSITORY/releases/download/cinema-test/defew-tv.aab"
