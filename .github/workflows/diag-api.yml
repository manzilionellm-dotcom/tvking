# =========================================================
#  diag-api.yml — Diagnostic de l'API Worker (login/me/stats)
# =========================================================
#  Teste les endpoints depuis un runner GitHub (qui a Internet)
#  pour comprendre pourquoi le panel affiche "Erreur de chargement".
#  Aucun secret requis : ce sont des appels HTTP publics.
# =========================================================

name: Diag API

on:
  workflow_dispatch: {}
  push:
    branches:
      - 'claude/**'
    paths:
      - '.github/workflows/diag-api.yml'

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BASE: 'https://seven-motion-backend.manzilionel-lm.workers.dev'
    steps:
      - name: 1) LOGIN admin/change-me
        run: |
          echo "POST $BASE/api/v1/auth/login"
          RESP=$(curl -s -m 20 -X POST "$BASE/api/v1/auth/login" \
            -H "Content-Type: application/json" \
            -d '{"email":"admin","password":"change-me"}' -w "\n__HTTP__%{http_code}")
          echo "----- réponse login -----"
          echo "$RESP"
          echo "-------------------------"
          BODY=$(echo "$RESP" | sed 's/__HTTP__[0-9]*$//')
          TOKEN=$(echo "$BODY" | python3 -c "import sys,json;print(json.load(sys.stdin).get('token',''))" 2>/dev/null || echo "")
          echo "TOKEN_PRESENT=$([ -n "$TOKEN" ] && echo yes || echo no)"
          echo "$TOKEN" > /tmp/token.txt

      - name: 2) ME (avec token)
        run: |
          TOKEN=$(cat /tmp/token.txt)
          if [ -z "$TOKEN" ]; then echo "pas de token, skip"; exit 0; fi
          echo "GET $BASE/api/v1/auth/me"
          curl -s -m 20 "$BASE/api/v1/auth/me" \
            -H "Authorization: Bearer $TOKEN" -w "\n__HTTP__%{http_code}\n"

      - name: 3) STATS overview (avec token)
        run: |
          TOKEN=$(cat /tmp/token.txt)
          if [ -z "$TOKEN" ]; then echo "pas de token, skip"; exit 0; fi
          echo "GET $BASE/api/v1/stats/overview"
          curl -s -m 20 "$BASE/api/v1/stats/overview" \
            -H "Authorization: Bearer $TOKEN" -w "\n__HTTP__%{http_code}\n"

      - name: 4) OPTIONS preflight sur /auth/me
        run: |
          echo "OPTIONS $BASE/api/v1/auth/me"
          curl -s -m 20 -X OPTIONS "$BASE/api/v1/auth/me" \
            -H "Origin: https://tvking-admin.pages.dev" \
            -H "Access-Control-Request-Method: GET" \
            -H "Access-Control-Request-Headers: authorization" \
            -D - -o /dev/null -w "\n__HTTP__%{http_code}\n"
