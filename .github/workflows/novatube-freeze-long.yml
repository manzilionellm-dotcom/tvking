name: NovaTube — gel après 57 minutes sur Android TV
on:
  push:
    branches: ['qa/novatube-freeze-inspect-*']
permissions:
  contents: read
  actions: read
jobs:
  longue:
    runs-on: ubuntu-24.04
    timeout-minutes: 135
    strategy:
      fail-fast: false
      matrix:
        scenario: [diagnostic-naturel, tunnel-reverse, temoin-passif]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 77ce78f49b65f674e8493e8573a6dcc7b62eae6d
          path: atlas
          persist-credentials: false
          sparse-checkout: android-app/cloudflare
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - name: APK historique pour le témoin sans interrogation du tunnel
        if: matrix.scenario == 'temoin-passif'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          github-token: ${{ github.token }}
          run-id: 46002079321
          name: novatube-emulateur-apk-2e018b0ffe4bd41f53995ec5e336f9e0ed113221
          path: qa-apks
      - name: APK diagnostique inspectable
        if: matrix.scenario != 'temoin-passif'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          github-token: ${{ github.token }}
          run-id: 46030053519
          name: novatube-emulateur-apk-6b0a720180d63143ce375b8379e39c56e0e93833
          path: qa-apks
      - name: Démarrer le banc et ses témoins dans le même job
        env:
          APP: novatube
          FREEZE_SCENARIO: ${{ matrix.scenario }}
          FREEZE_DURATION: '4800'
        run: |
          nohup bash -c 'bash android-app/ci/novatube_tv/freeze_runner.sh; printf "%s" "$?" > freeze-run.exit.tmp; mv freeze-run.exit.tmp freeze-run.exit' < /dev/null > "$RUNNER_TEMP/freeze-run.log" 2>&1 &
      - name: Observer les treize premières minutes de lecture
        run: python3 android-app/ci/novatube_tv/freeze_ci_phase.py checkpoint
      - name: Publier le point intermédiaire
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: diagnostic-early-${{ matrix.scenario }}-${{ github.run_id }}
          path: freeze-checkpoint
          retention-days: 14
      - name: Attendre la fin des 80 minutes et vérifier le résultat du banc
        run: |
          python3 android-app/ci/novatube_tv/freeze_ci_phase.py wait-final || { tail -40 "$RUNNER_TEMP/freeze-run.log"; exit 1; }
          tail -8 "$RUNNER_TEMP/freeze-run.log"
      - name: Conserver les traces, y compris après incident
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: diagnostic-final-${{ matrix.scenario }}-${{ github.run_id }}
          path: pilot-results
          retention-days: 14
