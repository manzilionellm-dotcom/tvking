name: NovaTube TV · endurance du candidat fe134dd4 à 1024 Mio
on:
  push:
    branches: ['qa/novatube-fe134dd4-endurance-1024-install']
permissions:
  contents: read
  actions: read
jobs:
  longue:
    name: Lecture directe 80 minutes (${{ matrix.ram_mib }} Mio)
    runs-on: ubuntu-24.04
    timeout-minutes: 135
    strategy:
      fail-fast: false
      matrix:
        ram_mib: [1024]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 77ce78f49b65f674e8493e8573a6dcc7b62eae6d
          path: atlas
          persist-credentials: false
          sparse-checkout: android-app/cloudflare
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - name: Récupérer le binaire exact du banc de zapping
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          github-token: ${{ github.token }}
          run-id: 46052117945
          name: apk-candidat
          path: qa-apks
      - name: Démarrer le banc et ses témoins dans le même job
        env:
          APP: novatube
          FREEZE_SCENARIO: direct-${{ matrix.ram_mib }}
          RAM_MIB: ${{ matrix.ram_mib }}
          FREEZE_DURATION: '4800'
        run: |
          nohup bash -c 'bash android-app/ci/novatube_tv/freeze_runner.sh; printf "%s" "$?" > freeze-run.exit.tmp; mv freeze-run.exit.tmp freeze-run.exit' < /dev/null > "$RUNNER_TEMP/freeze-run.log" 2>&1 &
      - name: Vérifier la première minute et demie avant de poursuivre
        run: python3 android-app/ci/novatube_tv/freeze_ci_phase.py checkpoint
      - name: Publier le point intermédiaire
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: endurance-fe134dd4-early-direct-${{ matrix.ram_mib }}-${{ github.run_id }}
          path: freeze-checkpoint
          retention-days: 14
      - name: Attendre la fin des 80 minutes et vérifier le résultat du banc
        run: |
          python3 android-app/ci/novatube_tv/freeze_ci_phase.py wait-final || { tail -40 "$RUNNER_TEMP/freeze-run.log"; exit 1; }
          tail -8 "$RUNNER_TEMP/freeze-run.log"
      - name: Conserver les traces, y compris après incident
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: endurance-fe134dd4-final-direct-${{ matrix.ram_mib }}-${{ github.run_id }}
          path: pilot-results
          retention-days: 14
