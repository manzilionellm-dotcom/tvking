# =========================================================
#  build-android.yml — Build APK automatique dans le cloud
# =========================================================
#  À chaque push sur main / claude/* / feature/* (ou manuel),
#  GitHub Actions :
#    1. Récupère le code
#    2. Installe JDK 17 + Flutter stable + Android SDK
#    3. Génère les fichiers natifs Android
#    4. Compile l'APK debug
#    5. Uploade en artifact + (optionnellement) en Release
#
#  Pour récupérer l'APK :
#    • Actions → Build Android APK → dernier run → Artifacts
#    • OU Releases (si déclenché manuellement avec "Make release")
# =========================================================

name: Build Android APK

on:
  push:
    branches:
      - main
      - develop
      - 'claude/**'
      - 'feature/**'
  workflow_dispatch:
    inputs:
      make_release:
        description: 'Aussi publier en GitHub Release (true/false)'
        required: false
        default: 'false'

permissions:
  contents: write   # nécessaire pour créer/mettre à jour une release

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Show toolchain versions (diagnostic)
        run: |
          set -e
          echo "=== java ==="
          java -version
          echo "=== flutter ==="
          flutter --version
          echo "=== flutter doctor ==="
          flutter doctor -v || true

      - name: Generate native Android folder
        run: flutter create . --platforms=android --org com.manzilionellm.tvking --project-name tv_king

      - name: Get dependencies
        run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug --no-tree-shake-icons

      - name: Check APK exists
        run: |
          if [ ! -f build/app/outputs/flutter-apk/app-debug.apk ]; then
            echo "❌ APK introuvable — voir les logs ci-dessus."
            find build -name '*.apk' || true
            exit 1
          fi
          ls -lah build/app/outputs/flutter-apk/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tvking-debug-apk-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30
          if-no-files-found: error

      # Toujours mettre à jour la release "latest" pour que le lien
      # direct https://github.com/.../releases/latest/download/
      # pointe vers le dernier APK. Ainsi l'utilisateur peut
      # installer depuis son téléphone sans naviguer dans Actions.
      - name: Publish/replace "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: TV King — dernier build
          body: |
            Dernier build automatique de TV King.

            • Branche : `${{ github.ref_name }}`
            • Commit : `${{ github.sha }}`
            • Run : #${{ github.run_number }}

            **Pour installer :**
            1. Ouvre ce lien sur ton téléphone Android
            2. Télécharge `app-debug.apk`
            3. Si Android refuse → autorise "Sources inconnues" dans les Paramètres
            4. Lance l'APK pour installer

            ⚠️ Ce build est en mode debug — pour usage de test, pas pour distribution finale.
          files: build/app/outputs/flutter-apk/app-debug.apk
          prerelease: true
          make_latest: 'true'

      # Bonus : tag versionné (un par run) pour garder un historique
      - name: Publish versioned release
        if: github.event_name == 'workflow_dispatch' && inputs.make_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: TV King build ${{ github.run_number }}
          body: |
            Build #${{ github.run_number }} de la branche `${{ github.ref_name }}`.
            Commit `${{ github.sha }}`.
          files: build/app/outputs/flutter-apk/app-debug.apk
          prerelease: true
