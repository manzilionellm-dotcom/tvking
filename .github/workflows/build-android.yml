# =========================================================
#  build-android.yml — Build APK automatique dans le cloud
# =========================================================
#  À chaque push sur main/develop OU à chaque commit sur une
#  branche `claude/*`, GitHub Actions :
#    1. Récupère le code
#    2. Installe Flutter + JDK 17 (sur leurs serveurs Ubuntu)
#    3. Génère les fichiers natifs Android
#    4. Compile l'APK en debug
#    5. Uploade l'APK comme "artifact" téléchargeable
#
#  Avantage : tu peux télécharger l'APK signé directement
#  depuis GitHub sans jamais compiler en local. Indispensable
#  quand Windows + antivirus jouent à cache-cache avec Dart.
#
#  Pour récupérer ton APK :
#    1. Va sur https://github.com/manzilionellm-dotcom/tvking/actions
#    2. Clique sur le dernier run "Build Android APK"
#    3. Tout en bas, télécharge l'artifact "tvking-debug-apk"
#    4. Décompresse → tu as `app-debug.apk`
#    5. Transfère sur ton téléphone / Fire TV et installe
# =========================================================

name: Build Android APK

on:
  push:
    branches:
      - main
      - develop
      - 'claude/**'
      - 'feature/**'
  pull_request:
    branches: [main]
  # Permet de lancer le build manuellement depuis l'onglet Actions
  workflow_dispatch:

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Regenerate native Android folder
        # Le repo ne versionne PAS le dossier android/ (regénérable).
        run: flutter create . --platforms=android --org com.manzilionellm.tvking

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze (non-fatal)
        run: flutter analyze --no-fatal-warnings || true

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tvking-debug-apk-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
          if-no-files-found: error
