name: NovaTube LAB VPN · compilation et signature

on:
  push:
    branches: ['qa/novatube-lab-vpn-rapidite', 'feature/novatube-lab-copie-code']
    paths:
      - 'android-app/lib/**'
      - 'android-app/packages/**'
      - 'android-app/test/**'
      - 'android-app/ci/novatube_copy/**'
      - '.github/workflows/novatube-lab-vpn.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: novatube-lab-vpn-build-${{ github.ref_name }}
  cancel-in-progress: ${{ github.ref_name == 'feature/novatube-lab-copie-code' }}

env:
  CI: 'true'
  FLUTTER_SUPPRESS_ANALYTICS: 'true'
  SOURCE_SHA: ${{ github.sha }}
  NOVATUBE_TV_APP_ID: ${{ github.ref_name == 'feature/novatube-lab-copie-code' && 'com.sevenmotion.novatube.tv.lab.copie' || 'com.sevenmotion.novatube.tv.lab.retour.rec.vpn' }}
  NOVATUBE_TV_VERSION: ${{ github.ref_name == 'feature/novatube-lab-copie-code' && '1.0.4' || '1.0.2' }}
  NOVATUBE_LABEL: ${{ github.ref_name == 'feature/novatube-lab-copie-code' && 'NovaTube LAB Copie' || 'NovaTube LAB VPN' }}
  NOVATUBE_APK: ${{ github.ref_name == 'feature/novatube-lab-copie-code' && 'NovaTube-LAB-Copie.apk' || 'NovaTube-LAB-VPN.apk' }}

jobs:
  build:
    name: Compiler, tester et signer NovaTube TV
    if: github.repository == 'manzilionellm-dotcom/tvking'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: android-app
    outputs:
      apk-name: ${{ steps.verify.outputs.apk-name }}
      apk-sha256: ${{ steps.verify.outputs.apk-sha256 }}
      version-code: ${{ steps.build.outputs.version-code }}
      signing: ${{ steps.sign.outputs.signing }}
      cert-sha256: ${{ steps.verify.outputs.cert-sha256 }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false

      - name: Java 17 (Temurin)
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter 3.47.7 (même version que Zuno TV)
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: SDK Android
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Licences Android
        run: yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Manifeste et Gradle TV (scripts Zuno, identité NovaTube)
        run: |
          set -e
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          export ZUNO_APP_ID="$NOVATUBE_TV_APP_ID" ZUNO_APP_LABEL="$NOVATUBE_LABEL"
          echo "ZUNO_APP_ID=$NOVATUBE_TV_APP_ID" >> "$GITHUB_ENV"
          echo "ZUNO_APP_LABEL=$NOVATUBE_LABEL" >> "$GITHUB_ENV"
          python3 ci/tv/patch_manifest.py android/app/src/main/AndroidManifest.xml
          cp ci/proguard-rules.pro android/app/proguard-rules.pro
          python3 ci/tv/patch_gradle.py android/app/build.gradle.kts
          python3 ci/novatube_tv/prepare_local_recording.py
          grep -Fq "applicationId = \"$NOVATUBE_TV_APP_ID\"" android/app/build.gradle.kts
          grep -Fq "android:label=\"$NOVATUBE_LABEL\"" android/app/src/main/AndroidManifest.xml

      - name: Préférences compatibles box Android 5 (identique à Zuno TV)
        run: |
          python3 - <<'PYEOF'
          from pathlib import Path
          path = Path('pubspec.yaml')
          source = path.read_text(encoding='utf-8')
          anchor = '  shared_preferences: ^2.3.4\n'
          if source.count(anchor) != 1 or '  shared_preferences_android:' in source:
              raise SystemExit('Contrainte SharedPreferences inattendue : vérifier le pin TV.')
          source = source.replace(anchor, anchor + '  shared_preferences_android: 2.5.0\n', 1)
          path.write_text(source, encoding='utf-8')
          PYEOF

      - name: Dépendances
        run: flutter pub get

      - name: Tests NovaTube en mode Zuno (prouve que Zuno ne change pas)
        run: |
          set -e
          flutter gen-l10n
          flutter test --no-pub test/novatube_tv

      - name: Préparer l'édition NovaTube (logo, nom, bannière, lancement)
        run: |
          set -e
          python3 ci/novatube_tv/prepare_build.py
          flutter pub get
          flutter gen-l10n

      - name: Patch screen_brightness_android (identique à Zuno TV)
        run: |
          set -e
          FILE=$(find ~/.pub-cache/hosted/pub.dev -path "*/screen_brightness_android-*/android/build.gradle" 2>/dev/null | head -1)
          if [ -z "$FILE" ]; then echo "screen_brightness_android absent, rien à faire"; exit 0; fi
          export PATCH_FILE="$FILE"
          python3 - <<'PYEOF'
          import os, re
          file = os.environ['PATCH_FILE']
          lines = open(file).readlines()
          out, in_kotlin, depth, removed = [], False, 0, 0
          for line in lines:
              if not in_kotlin:
                  if re.match(r'^\s*kotlin\s*\{', line):
                      in_kotlin = True
                      depth = line.count('{') - line.count('}')
                      removed += 1
                      if depth <= 0:
                          in_kotlin = False
                      continue
                  out.append(line)
              else:
                  depth += line.count('{') - line.count('}')
                  removed += 1
                  if depth <= 0:
                      in_kotlin = False
          if removed:
              open(file, 'w').writelines(out)
          print(f'lignes kotlin{{}} retirées : {removed}')
          PYEOF

      - name: Analyse et tests de l'édition NovaTube
        run: |
          set -e
          flutter analyze --no-pub --no-fatal-infos \
            lib/main_tv.dart lib/core/app/novatube_tv_edition.dart \
            lib/features/tv/core lib/features/tv/presentation/tv_app.dart \
            lib/features/tv/presentation/tv_novatube_welcome_screen.dart \
            lib/features/tv/presentation/tv_components.dart \
            lib/features/theme test/novatube_tv
          flutter test --no-pub --dart-define=NOVATUBE_TV=true \
            --dart-define=NOVATUBE_LOCAL_RECORDINGS=true --dart-define=NOVATUBE_SEVEN_MOTION_CAST=true \
            test/novatube_tv test/features/cast test/features/tv/desktop/zuno_mobile_cast_controls_test.dart \
            test/features/player/native_cast_attach_test.dart test/features/tv/zuno_pip_player_widget_test.dart

      - name: Icône, bannière Android TV et écran de lancement NovaTube
        run: |
          set -e
          dart run flutter_launcher_icons -f flutter_launcher_icons_novatube_tv.yaml
          python3 ci/tv/apply_splash.py
          python3 ci/novatube_tv/prepare_build.py --splash-color

      - name: Signature
        id: sign
        run: |
          set -euo pipefail
          alias="novatube-lab-retour"
          store_pw="$(openssl rand -hex 24)"
          key_pw="$store_pw"
          echo "::add-mask::$store_pw"
          keytool -genkeypair -keystore android/app/release.jks -storetype PKCS12 \
            -alias "$alias" -keyalg RSA -keysize 3072 -validity 3650 \
            -storepass "$store_pw" -keypass "$key_pw" -dname "CN=NovaTube LAB Retour, O=Test" >/dev/null 2>&1
          echo "signing=cle-de-test-jetable" >> "$GITHUB_OUTPUT"
          {
            echo "storeFile=release.jks"
            echo "storePassword=$store_pw"
            echo "keyAlias=$alias"
            echo "keyPassword=$key_pw"
          } > android/key.properties

      - name: Compiler l'APK NovaTube TV (lib/main_tv.dart + NOVATUBE_TV)
        id: build
        run: |
          set -euo pipefail
          BUILD_NUMBER=$(date +%s)
          echo "version-code=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          flutter build apk --release --no-tree-shake-icons \
            --android-skip-build-dependency-validation \
            --target-platform android-arm,android-arm64,android-x64 \
            --build-number="$BUILD_NUMBER" \
            --build-name="$NOVATUBE_TV_VERSION" \
            --obfuscate --split-debug-info=build/symbols \
            --dart-define=NOVATUBE_TV=true \
            --dart-define=NOVATUBE_LOCAL_RECORDINGS=true \
            --dart-define=NOVATUBE_SEVEN_MOTION_CAST=true \
            --dart-define=APP_BUILD_TS="$BUILD_NUMBER" \
            --dart-define=GIT_SHA="$SOURCE_SHA" \
            --target=lib/main_tv.dart

      - name: Vérifier l'APK (identité, Leanback, signature, empreinte)
        id: verify
        run: |
          set -euo pipefail
          name="$NOVATUBE_APK"
          mkdir -p build/novatube_tv
          cp build/app/outputs/flutter-apk/app-release.apk "build/novatube_tv/$name"
          apk="build/novatube_tv/$name"
          bt="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          # aapt (v1) n'existe plus dans certains build-tools : aapt2 sinon.
          if [ -x "$bt/aapt" ]; then aapt="$bt/aapt"; else aapt="$bt/aapt2"; fi
          "$aapt" dump badging "$apk" > build/novatube_tv/badging.txt
          grep -E "^package:|^application-label:|leanback" build/novatube_tv/badging.txt
          grep -q "^package: name='${NOVATUBE_TV_APP_ID}'" build/novatube_tv/badging.txt
          grep -Fxq "application-label:'$NOVATUBE_LABEL'" build/novatube_tv/badging.txt
          grep -q "^launchable-activity:" build/novatube_tv/badging.txt
          grep -q "^leanback-launchable-activity:" build/novatube_tv/badging.txt
          "$bt/apksigner" verify --verbose --print-certs "$apk" > build/novatube_tv/signature.txt
          cert="$(grep -m1 'certificate SHA-256 digest' build/novatube_tv/signature.txt | awk '{print $NF}')"
          sha="$(sha256sum "$apk" | awk '{print $1}')"
          (cd build/novatube_tv && sha256sum "$name" > SHA256SUMS.txt)
          echo "apk-name=$name" >> "$GITHUB_OUTPUT"
          echo "apk-sha256=$sha" >> "$GITHUB_OUTPUT"
          echo "cert-sha256=$cert" >> "$GITHUB_OUTPUT"
          echo "APK $name · $(stat -c %s "$apk") octets · SHA-256 $sha · certificat $cert"

      - name: Conserver l'APK vérifié
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: novatube-tv-apk-${{ github.sha }}
          path: |
            android-app/build/novatube_tv/*.apk
            android-app/build/novatube_tv/SHA256SUMS.txt
            android-app/build/novatube_tv/badging.txt
            android-app/build/novatube_tv/signature.txt
          if-no-files-found: error
          retention-days: 14

  telephone:
    name: Tester la copie du MK et la saisie au clavier sur téléphone Android
    needs: build
    if: github.ref_name == 'feature/novatube-lab-copie-code'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
      - name: Installer le binaire signé et comparer le collage avec le code visible
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ needs.build.outputs.apk-sha256 }}
        run: |
          set -euo pipefail
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "novatube-tv-apk-$GITHUB_SHA" --dir apk
          echo "$EXPECTED_SHA  apk/$NOVATUBE_APK" | sha256sum -c -
          sudo chmod a+rw /dev/kvm
          if ! ldconfig -p | grep -F libpulse.so.0 >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq libpulse0
          fi
          bash android-app/ci/novatube_copy/verify_phone.sh "apk/$NOVATUBE_APK" preuve "$NOVATUBE_TV_APP_ID"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: controle-copie-telephone-${{ github.sha }}
          path: |
            preuve/proof.json
            preuve/last-controls.json
            preuve/emulator.txt
          if-no-files-found: warn

  publier:
    name: Publier et vérifier l’APK LAB Copie
    if: github.ref_name == 'feature/novatube-lab-copie-code'
    needs: [build, telephone]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_SHA: ${{ needs.build.outputs.apk-sha256 }}
    steps:
      - name: Comparer le téléchargement public au binaire testé
        run: |
          set -euo pipefail
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "novatube-tv-apk-$GITHUB_SHA" --dir apk
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "controle-copie-telephone-$GITHUB_SHA" --dir preuve
          jq -e --arg sha "$EXPECTED_SHA" --arg pkg "$NOVATUBE_TV_APP_ID" '
            .verified and .apk_sha256 == $sha and .package == $pkg
            and .pasted_text_equals_displayed_code
            and (.source_keyboard | .rotation_preserved_text and .welcome_restored_landscape
                 and all(.landscape, .portrait; .ime_visible and .field_clear_of_ime and .text_preserved_after_back))
          ' preuve/proof.json >/dev/null
          echo "$EXPECTED_SHA  apk/$NOVATUBE_APK" | sha256sum -c -
          tag="novatube-lab-copie-${GITHUB_SHA:0:8}"
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" "apk/$NOVATUBE_APK" apk/SHA256SUMS.txt preuve/proof.json \
              --target "$GITHUB_SHA" --repo "$GITHUB_REPOSITORY" --prerelease --latest=false \
              --title "NovaTube LAB $NOVATUBE_TV_VERSION – Clavier et copie du code" \
              --notes "Sur téléphone, le bouton copie le code MK complet affiché sur l’accueil. Le formulaire d’ajout de source adapte la saisie M3U et Xtream au clavier du téléphone. Test sur Android : $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. Cette préversion s’installe séparément de la LAB VPN 1.0.2."
          fi
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$tag/$NOVATUBE_APK"
          curl -fsSL --retry 5 --retry-all-errors "$url" -o public.apk
          cmp "apk/$NOVATUBE_APK" public.apk
          echo "[$NOVATUBE_APK]($url)" >> "$GITHUB_STEP_SUMMARY"
