name: ZUNO LAB — apparier Televizo et ZUNO sur la même sortie Android et les mêmes touches
on:
  push:
    branches: ['lab/zuno-119-qualification-20261128']
    paths: ['.github/workflows/zuno-lab-duel-lecteurs.yml', 'android-app/ci/zuno_lab/duel_lecteurs/**']
permissions:
  contents: read
  actions: read
jobs:
  comparer:
    name: Ordre ${{ matrix.order }}
    runs-on: ubuntu-24.04
    timeout-minutes: 105
    strategy:
      fail-fast: false
      matrix:
        order: [ZT,TZ]
    env:
      ORDER: ${{ matrix.order }}
      BENCH_PACKAGE: com.sevenmotion.tv.seven_tv.lab
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 43b00811fb03ef4b7ec482c53a46269008dd214a
          path: origine
          sparse-checkout: android-app/ci/novatube_tv
          persist-credentials: false
      - name: Attendre le constructeur du nouveau candidat
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in {1..90}; do
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/46095717223" > "$RUNNER_TEMP/constructeur.json"
            if [[ "$(jq -r .status "$RUNNER_TEMP/constructeur.json")" == completed ]]; then break; fi
            sleep 15
          done
          jq -e '.conclusion=="success" and .head_sha=="daba06b196754e4fff9dbfd8a454bd804b752be6"' "$RUNNER_TEMP/constructeur.json"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          github-token: ${{ github.token }}
          run-id: 46095717223
          name: zuno-lab-daba06b196754e4fff9dbfd8a454bd804b752be6
          path: AppliB
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
      - name: Installer le Worker local de la campagne
        run: npm ci --no-audit --no-fund --prefix android-app/cloudflare
      - name: Rejouer la même série 100 + 100 et le même mode de capture
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg tesseract-ocr python3-pil python3-av python3-numpy
          bash android-app/ci/zuno_lab/duel_lecteurs/essai.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: duel-lecteurs-${{ matrix.order }}
          path: resultats/
          retention-days: 14
