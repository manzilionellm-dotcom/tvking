# =========================================================
#  deploy-worker.yml — Déploiement auto du Worker Cloudflare
# =========================================================
#  Problème historique : le code du Worker (`cloudflare/worker.js`)
#  vivait dans le repo, mais aucun pipeline ne le poussait
#  sur Cloudflare. Du coup, modifier ce fichier en local ne
#  changeait STRICTEMENT RIEN en production — il fallait
#  ouvrir le dashboard Cloudflare, coller le nouveau code,
#  cliquer "Save and Deploy". Source d'oublis silencieux
#  (notre route /redroom était dans le code source mais
#  jamais en ligne pendant 24h).
#
#  Solution : ce workflow déploie automatiquement le Worker
#  dès qu'on push une modif de `cloudflare/worker.js` (ou
#  de `cloudflare/wrangler.toml`). Plus jamais de drift entre
#  ce qui est dans Git et ce qui répond en production.
#
#  PRÉREQUIS — secrets à configurer sur le repo GitHub
#  ───────────────────────────────────────────────────
#    Settings → Secrets and variables → Actions → New secret
#
#    CLOUDFLARE_API_TOKEN : token créé sur
#      dash.cloudflare.com → My Profile → API Tokens →
#      Create Token → modèle "Edit Cloudflare Workers".
#
#    CLOUDFLARE_ACCOUNT_ID : visible sur la page d'accueil
#      du dashboard Cloudflare (sidebar de droite), ou via
#      dash.cloudflare.com/profile/api-tokens (en bas).
#
#  Le déploiement utilise `cloudflare/wrangler-action@v3`,
#  l'action officielle maintenue par Cloudflare. Elle fait
#  `wrangler deploy` avec le bon `wrangler.toml` et le
#  `worker.js` du repo.
# =========================================================

name: Deploy Cloudflare Worker

on:
  push:
    branches:
      - main
      - 'claude/**'
      - 'feature/**'
    paths:
      - 'cloudflare/worker.js'
      - 'cloudflare/api_v1.js'
      # cast_receiver.js est IMPORTÉ par worker.js (bundlé par wrangler) :
      # il faut redéployer le worker quand il change, sinon le nouveau
      # receiver Cast (mpegts.js) ne part jamais en production.
      - 'cloudflare/cast_receiver.js'
      # screen_receiver.js est IMPORTÉ par worker.js (récepteur « Caster
      # sur un écran ») → redéployer le worker quand il change.
      - 'cloudflare/screen_receiver.js'
      # landing.js est IMPORTÉ par worker.js (page d'accueil sur /) → redéployer
      # le worker quand le site change.
      - 'cloudflare/landing.js'
      # pwa_assets.js (manifeste + service worker + icônes) IMPORTÉ par worker.js.
      - 'cloudflare/pwa_assets.js'
      # portal.js (« Mon espace » : le client gère sa playlist) IMPORTÉ par worker.js.
      - 'cloudflare/portal.js'
      # realtime.js (hub temps réel Durable Object) IMPORTÉ par worker.js →
      # redéployer le worker quand le hub change.
      - 'cloudflare/realtime.js'
      # LES AUTRES MODULES IMPORTÉS (07/09/2026). Ils manquaient à cette
      # liste : modifier l'un d'eux SEUL ne redéployait rien, et le code
      # restait dans Git sans jamais répondre en production — exactement
      # le « drift silencieux » que ce workflow existe pour empêcher (cf.
      # l'en-tête). On les ajoute tous, une bonne fois.
      #   device_profiles.js    : profils famille (PIN partagé app/panel)
      #   sports_predictions.js : pronostics 1/N/2
      #   sports_event.js       : fiche d'un match
      #   app_versions.js       : « cette box est-elle à jour ? »
      #   migrate_kv_to_d1.js   : migration KV → D1
      - 'cloudflare/device_profiles.js'
      - 'cloudflare/license_pick.js'
      - 'cloudflare/mac_identity.js'
      - 'cloudflare/sports_predictions.js'
      - 'cloudflare/sports_event.js'
      - 'cloudflare/app_versions.js'
      - 'cloudflare/migrate_kv_to_d1.js'
      - 'cloudflare/wrangler.toml'
      # Smoke tests : un fix smoke-only (ex. #26 lab_sources) doit
      # redéployer, sinon le Worker live reste sur l'ancienne version.
      - 'cloudflare/*.smoke.mjs'
      - 'cloudflare/**/*.smoke.mjs'
      - '.github/workflows/deploy-worker.yml'

  # Permet aussi le déploiement manuel depuis l'onglet Actions
  # (utile pour redéployer la même version sans toucher au code,
  # ex: si Cloudflare a fait une rotation interne).
  workflow_dispatch: {}

# `contents: write` : le garde-fou grave un tag `deployed/<canal>`
# après chaque publication réussie (cf. ci/guard_no_rollback.sh).
permissions:
  contents: write

jobs:
  deploy:
    name: Deploy worker.js → Cloudflare
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Le garde-fou compare des ancêtres : il lui faut l'historique
          # complet, pas le clone superficiel par défaut.
          fetch-depth: 0

      # ---------------------------------------------------------
      #  NE JAMAIS FAIRE RECULER LA PRODUCTION (16/09/2026)
      # ---------------------------------------------------------
      #  Ce workflow part sur TOUTE branche `claude/**`. Deux branches
      #  vivantes = la dernière poussée écrase l'autre, en silence et
      #  avec un ✅ vert. C'est arrivé : 7 commits déjà en ligne ont
      #  disparu sans que rien ne s'allume. Le garde-fou refuse de
      #  publier un commit qui n'a pas la production pour ancêtre.
      #  Explication complète : ci/guard_no_rollback.sh
      # ---------------------------------------------------------
      - name: Refuser un déploiement qui ferait reculer la production
        run: ci/guard_no_rollback.sh check worker "$GITHUB_SHA"


      # Sanity check : on échoue tôt et fort si les secrets manquent,
      # plutôt que de laisser wrangler renvoyer une erreur cryptique.
      - name: Verify secrets are configured
        env:
          API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$API_TOKEN" ]; then
            echo "❌ Secret CLOUDFLARE_API_TOKEN absent."
            echo "   Voir l'en-tête de ce workflow pour la procédure."
            exit 1
          fi
          if [ -z "$ACCOUNT_ID" ]; then
            echo "❌ Secret CLOUDFLARE_ACCOUNT_ID absent."
            exit 1
          fi
          echo "✓ Secrets présents."

      # Validation AVANT déploiement : syntaxe des modules Worker + smoke tests
      # (dont les règles anti-abus « argent » du Pass Partage). On échoue tôt
      # plutôt que de déployer un worker cassé en prod.
      - name: Validate worker (node --check + smoke tests)
        run: |
          set -e
          node --check cloudflare/worker.js
          node --check cloudflare/api_v1.js
          for f in cloudflare/*.smoke.mjs; do
            echo "→ $f"
            node "$f"
          done
          echo "✓ Worker validé (syntaxe + smoke tests)."

      - name: Deploy worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Le wrangler.toml est dans cloudflare/, donc on
          # passe workingDirectory pour que wrangler trouve la
          # config + le worker.js référencé en `main = "worker.js"`.
          workingDirectory: 'cloudflare'
          command: deploy

      # Le registre ne bouge QU'APRÈS un déploiement réussi : un build
      # qui échoue ne doit pas laisser croire qu'il est en ligne.
      - name: Graver ce qui est désormais en ligne
        run: ci/guard_no_rollback.sh mark worker "$GITHUB_SHA"
