name: Zuno 117 - prepare lifecycle patch
on:
  push:
    branches: [fix/zuno-117-ci-gates-api29-218]
    paths: [.github/workflows/zuno-117-lifecycle-patch.yml]
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'manzilionellm-dotcom/tvking' && github.ref == 'refs/heads/fix/zuno-117-ci-gates-api29-218'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prepare verified native-only commit without moving any branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, difflib, json, os, urllib.request
          repo = os.environ['REPO']
          parent_sha = os.environ['SOURCE_SHA']
          assert repo == 'manzilionellm-dotcom/tvking'
          root = 'https://api.github.com/repos/' + repo
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'}
          def api(path, data=None):
              request = urllib.request.Request(root + path, headers=headers, data=None if data is None else json.dumps(data).encode(), method='GET' if data is None else 'POST')
              with urllib.request.urlopen(request, timeout=60) as response:
                  return json.load(response)
          path = 'android-app/packages/native_video_player/android/src/main/kotlin/com/manzilionellm/native_video_player/NativeVideoView.kt'
          workflow = '.github/workflows/zuno-117-lifecycle-patch.yml'
          original = api('/contents/' + path + '?ref=' + parent_sha)
          assert original['sha'] == 'd98772b36d46165a0f948e7ab728b155023e8e50', 'Source changed; abort instead of overwriting concurrent work'
          before = base64.b64decode(original['content']).decode('utf-8')
          prepared = api('/contents/' + path + '?ref=6a3d62b01bbbb26683f7b19acf7d6b9fd3fe58e0')
          after = base64.b64decode(prepared['content']).decode('utf-8')
          marker = '    // ---- cycle de vie '
          tail = '    /**\n     * Branche le lecteur sur la surface'
          start, end = after.index(marker), after.index(tail)
          section = after[start:end]
          fixed = []
          for line in section.splitlines(keepends=True):
              count = len(line) - len(line.lstrip(' '))
              fixed.append(' ' * 10 + line if count % 4 == 2 else line)
          section = ''.join(fixed)
          anchor = '        discardHeldFrame()\n'
          assert section.count(anchor) == 1
          section = section.replace(anchor, anchor + '''        try {
                      player.volume = AudioHandoff.VOLUME_SILENT
                      player.playWhenReady = false
                  } catch (_: RuntimeException) {
                      // Stop/release must still run when muting fails.
                  }
          ''')
          # YAML already removed its own indentation. The literal above is Kotlin.
          after = after[:start] + section + after[end:]
          assert after[:start] == before[:before.index(marker)]
          assert after[after.index(tail):] == before[before.index(tail):]
          assert section.count('target.release()') == 1
          assert section.index('cancelRetry()') < section.index('finishDispose()\n')
          assert section.index('target.clearVideoSurface()') < section.index('target.stop()') < section.index('target.release()')
          assert section.index('target.release()') < section.index('Handler(applicationLooper).post {')
          assert 'surface.release(' not in section and 'surfaceTexture.release(' not in section
          print(''.join(difflib.unified_diff(before.splitlines(True), after.splitlines(True), fromfile='a/'+path, tofile='b/'+path)))
          blob = api('/git/blobs', {'content': after, 'encoding': 'utf-8'})
          parent = api('/git/commits/' + parent_sha)
          tree = api('/git/trees', {'base_tree': parent['tree']['sha'], 'tree': [
              {'path': path, 'mode': '100644', 'type': 'blob', 'sha': blob['sha']},
              {'path': workflow, 'mode': '100644', 'type': 'blob', 'sha': None},
          ]})
          commit = api('/git/commits', {'message': 'fix(player): serialize disposal and detach surface before Media3 release', 'tree': tree['sha'], 'parents': [parent_sha]})
          print('PREPARED_COMMIT=' + commit['sha'])
          print('EXPECTED_PARENT=' + parent_sha)
          print('No branch moved; review candidate before updating PR 219.')
          PY
