// =========================================================
//  build.gradle — plugin zuno_mail
// =========================================================
//  androidx.core sert uniquement à FileProvider (partager un
//  .txt déjà écrit par l'application). Pas de bibliothèque de
//  courrier, pas de identifiant de compte.
// =========================================================
group = "com.manzilionellm.zuno_mail"
version = "1.0"

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

android {
    namespace = "com.manzilionellm.zuno_mail"
    compileSdk = 35

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        minSdk = 21
    }
}

dependencies {
    implementation "androidx.core:core:1.13.1"
}
