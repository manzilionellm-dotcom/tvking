// =========================================================
//  build.gradle — module Android du plugin native_video_player
// =========================================================
//  On NE pin PAS AGP ni Kotlin ici : ils sont fournis par le projet app
//  (settings.gradle pluginManagement, régénéré par `flutter create`).
//  Pinner une version créerait le classique conflit « plugin chargé depuis
//  deux classloaders ». On se contente d'appliquer les plugins déjà résolus.
// =========================================================
group = "com.manzilionellm.native_video_player"
version = "1.0"

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

android {
    namespace = "com.manzilionellm.native_video_player"
    compileSdk = 35

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        minSdk = 21
    }
}

dependencies {
    // Media3 (le successeur d'ExoPlayer). exoplayer = cœur + extracteurs
    // (dont le TsExtractor MPEG-TS utilisé par l'IPTV en .ts) ; -hls ajoute
    // le support des playlists .m3u8. Le décodage HEVC passe par MediaCodec
    // (matériel) et rend directement sur la Surface de la SurfaceView.
    // Version récente (1.5.x) : meilleure latence de démarrage + corrections
    // de robustesse réseau.
    implementation "androidx.media3:media3-exoplayer:1.5.1"
    implementation "androidx.media3:media3-exoplayer-hls:1.5.1"

    // SON (30/09/2026) — décodeur audio FFmpeg pour Media3.
    // QUOI : l'extension officielle media3-decoder-ffmpeg, compilée et publiée
    // sur Maven Central par le projet Jellyfin (Google ne publie pas de binaire).
    // Décodeurs audio seulement (AAC, HE-AAC, AC-3, E-AC-3, DTS, MP2, MP3,
    // TrueHD, FLAC, Opus…), ~1,4 Mo par architecture.
    // POURQUOI : sur les box bon marché, le décodeur AAC du constructeur ignore
    // souvent la partie « haute fréquence » (SBR) et la stéréo paramétrique (PS)
    // du HE-AAC, très utilisé par les chaînes IPTV → son étouffé, mono, « vieille
    // radio ». FFmpeg décode le HE-AAC complet. Il décode aussi AC-3 / DTS / MP2
    // quand la box n'a pas ces décodeurs (sinon piste muette ou piste de repli).
    // Version 1.5.0 = même branche que Media3 1.5.1 (Gradle aligne sur 1.5.1).
    // SÉCURITÉ : si FFmpeg bloque une chaîne, NativeVideoView.kt revient au
    // décodeur de la box pour le reste de la session (le son « radio » vaut
    // mieux qu'une roue de chargement infinie, comme en v99–v101).
    implementation "org.jellyfin.media3:media3-ffmpeg-decoder:1.5.0+1"
}
