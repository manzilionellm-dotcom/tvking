// =========================================================
//  build.gradle — plugin zuno_voice
// =========================================================
//  Aucune dépendance externe : RecognizerIntent et SpeechRecognizer
//  sont dans le SDK Android. On ne tire pas de bibliothèque de
//  reconnaissance (pas de clé, pas de service payant).
// =========================================================
group = "com.manzilionellm.zuno_voice"
version = "1.0"

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

android {
    namespace = "com.manzilionellm.zuno_voice"
    compileSdk = 35

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        minSdk = 21
    }
}
