# Worker restauré depuis gold-export.zip, version a3f55171-173c-4a91-bfa9-1a347db085a4.
# Ne pas déployer avant la recette staging et la vérification du Durable Object.
# Voir docs/gold-export-integration.md. Aucune valeur secrète dans ce fichier.
name = "seven-motion-backend"
main = "gold.js"
compatibility_date = "2025-05-01"
workers_dev = true
routes = [{ pattern = "api.zuno8k.com", custom_domain = true }]

[build]
command = "node prepare_gold_runtime.mjs"

[vars]
DEFAULT_SERVERS = '[]'

[[d1_databases]]
binding = "DB"
database_name = "tvking_licensing"
database_id = "67303737-a50b-4258-86de-662fb9aba6e7"

[[durable_objects.bindings]]
name = "RT_HUB"
class_name = "RealtimeHub"

# Le DO existe déjà (tag v1-rt-hub). Son type de migration n'est pas prouvé
# par l'export : aucun new_classes/new_sqlite_classes n'est inventé ici.
# Ne pas créer un deuxième DO ni appliquer d'anciennes migrations à l'aveugle.
# Secrets existants : ADMIN_SECRET, CAST_PROXY_SECRET, GOLD_PANEL_API_KEY,
# MISTRAL_API_KEY, SPORTSDB_KEY, TMDB_API_KEY. Les valeurs restent sur Cloudflare.
# Aucun cron, aucune migration D1 automatique, aucune activation de l'offre.
