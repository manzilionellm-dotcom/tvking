# Config d'icône SPÉCIFIQUE à « Privé » (édition 18+, logo or sur noir).
# Utilisée par le workflow build-prive via `flutter_launcher_icons -f`.
# Le mobile « The Few » garde sa propre config (dans pubspec.yaml) — non
# impacté.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/branding/prive_icon.png"
  adaptive_icon_background: "#201E1C"
  adaptive_icon_foreground: "assets/branding/prive_icon_fg.png"
  min_sdk_android: 21
