# =========================================================
#  diag-api.yml — Le Worker répond-il ?
# =========================================================
#  Vérifie que l'API est joignable, SANS mot de passe et SANS
#  secret. On ne tente plus une connexion avec un compte de
#  secours (ce mot de passe était écrit dans le dépôt).
#
#  Ce fichier est sous android-app/.github : GitHub ne le lance
#  pas tout seul. Lancement manuel seulement, si on le copie.
# =========================================================

name: Diag API

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BASE: 'https://seven-motion-backend.manzilionel-lm.workers.dev'
    steps:
      - name: 1) Le Worker répond (liste de serveurs, sans identifiant)
        run: |
          echo "GET $BASE/api/servers"
          curl -sS -m 20 "$BASE/api/servers" -w "\nHTTP:%{http_code}\n" || true

      - name: 2) Login sans identifiants est refusé
        run: |
          echo "POST $BASE/api/v1/auth/login (corps vide)"
          curl -sS -m 20 -X POST "$BASE/api/v1/auth/login" \
            -H "Content-Type: application/json" \
            -d '{}' -w "\nHTTP:%{http_code}\n" || true

      - name: 3) OPTIONS preflight sur /auth/me
        run: |
          echo "OPTIONS $BASE/api/v1/auth/me"
          curl -sS -m 20 -X OPTIONS "$BASE/api/v1/auth/me" \
            -H "Origin: https://tvking-admin.pages.dev" \
            -H "Access-Control-Request-Method: GET" \
            -H "Access-Control-Request-Headers: authorization" \
            -D - -o /dev/null -w "\nHTTP:%{http_code}\n" || true
