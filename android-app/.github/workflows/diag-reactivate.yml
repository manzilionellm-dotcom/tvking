# =========================================================
#  diag-reactivate.yml — diagnostic retiré
# =========================================================
#  L'ancienne version se connectait au Worker de production avec
#  un mot de passe écrit dans le dépôt, puis modifiait le premier
#  appareil (gel / réactivation). Ce mot de passe n'est plus dans
#  le dépôt, et ce fichier ne touche plus à la production.
#
#  GitHub ne lance pas les workflows qui sont sous android-app/.github.
# =========================================================

name: Diag reactivate

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Rien à exécuter
        run: |
          echo "Diagnostic désactivé : pas de mot de passe, pas de modification d'appareil."
          echo "Pour réactiver une box, utilise le panneau (compte revendeur ou propriétaire)."
