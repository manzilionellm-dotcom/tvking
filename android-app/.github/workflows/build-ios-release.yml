# =========================================================
#  build-ios-release.yml — Build iOS SIGNÉ → TestFlight
# =========================================================
#  Produit un .ipa SIGNÉ et l'envoie sur TestFlight / App Store
#  Connect. CONTRAIREMENT à build-ios.yml (simple check de compil),
#  celui-ci a besoin d'un COMPTE APPLE DEVELOPER (99 $/an) et de
#  plusieurs secrets. Tant que ces secrets ne sont PAS configurés, le
#  workflow s'ARRÊTE proprement au 1ᵉʳ step (vert, aucune action) — il
#  est donc DORMANT et ne casse jamais rien.
#
#  Déclenchement : MANUEL uniquement (Actions → Run workflow). Jamais
#  sur push → zéro risque sur les builds existants.
#
#  ───────────────────────────────────────────────────────
#  SECRETS À CONFIGURER (une fois ton compte Apple créé)
#  Settings → Secrets and variables → Actions → New secret
#  Détail + comment les obtenir : docs/ios-app-store-playbook.md §CI
#  ───────────────────────────────────────────────────────
#    APPLE_TEAM_ID              Team ID Apple (10 caractères)
#    APPLE_BUNDLE_ID            ex. com.manzilionellm.tvking.tvKing
#    APPLE_PROFILE_NAME         nom EXACT du provisioning profile App Store
#    APPLE_CERT_P12_BASE64      certificat « Apple Distribution » (.p12) en base64
#    APPLE_CERT_P12_PASSWORD    mot de passe du .p12
#    APPLE_PROFILE_BASE64       provisioning profile App Store (.mobileprovision) en base64
#    APPLE_KEYCHAIN_PASSWORD    mot de passe (au choix) pour le trousseau temporaire du CI
#    ASC_KEY_ID                 App Store Connect API — Key ID
#    ASC_ISSUER_ID              App Store Connect API — Issuer ID
#    ASC_API_KEY_P8_BASE64      la clé .p8 (téléchargeable UNE seule fois) en base64
#  ───────────────────────────────────────────────────────
# =========================================================

name: iOS release (signed → TestFlight)

concurrency:
  group: build-ios-release-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      submit_to_testflight:
        description: 'Envoyer le build sur TestFlight après le build ? (true/false)'
        required: false
        default: 'true'

permissions:
  contents: read

jobs:
  ios-release:
    name: Build signé + upload TestFlight
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      # `secrets` est autorisé dans `env` (pas dans un `if:` de job). On
      # s'en sert pour rendre le workflow DORMANT si rien n'est configuré.
      HAS_SECRETS: ${{ secrets.ASC_KEY_ID != '' && secrets.APPLE_CERT_P12_BASE64 != '' && secrets.APPLE_TEAM_ID != '' }}

    steps:
      - name: Garde — secrets Apple présents ?
        run: |
          if [ "${HAS_SECRETS}" != "true" ]; then
            echo "::notice::Secrets Apple non configurés → workflow DORMANT (rien à faire)."
            echo "Configure les secrets listés dans l'en-tête + docs/ios-app-store-playbook.md, puis relance."
          else
            echo "✓ Secrets présents — on lance le build signé."
          fi

      - name: Checkout
        if: env.HAS_SECRETS == 'true'
        uses: actions/checkout@v4

      - name: Setup Flutter
        if: env.HAS_SECRETS == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # iOS généré à la volée (jamais commité), comme build-ios.yml.
      # ⚠️ On utilise lib/main.dart (édition LECTEUR propre) — la version
      # « Privé » 18+ (main_prive.dart) n'est JAMAIS construite pour iOS
      # (interdite par la règle Apple 1.1.4 — cf. playbook).
      - name: Generate native iOS folder
        if: env.HAS_SECRETS == 'true'
        run: flutter create . --platforms=ios --org com.manzilionellm.tvking --project-name tv_king

      - name: Add iOS video libs (runner-only)
        if: env.HAS_SECRETS == 'true'
        run: flutter pub add media_kit_libs_ios_video || true

      - name: Get dependencies
        if: env.HAS_SECRETS == 'true'
        run: flutter pub get

      - name: Generate AppLocalizations
        if: env.HAS_SECRETS == 'true'
        run: flutter gen-l10n || true

      - name: Bump iOS deployment target to 13.0
        if: env.HAS_SECRETS == 'true'
        run: |
          if [ -f ios/Podfile ]; then
            sed -i '' "s/# *platform :ios, '[0-9.]*'/platform :ios, '13.0'/" ios/Podfile || true
            grep -n "platform :ios" ios/Podfile || true
          fi

      - name: Patch Info.plist (ATS + audio fond + cast)
        if: env.HAS_SECRETS == 'true'
        run: bash ci/ios/patch_info_plist.sh ios/Runner/Info.plist

      # Bundle id explicite (doit matcher le profil + ce que tu as
      # enregistré dans le portail Apple).
      - name: Set bundle identifier
        if: env.HAS_SECRETS == 'true'
        run: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier \$(PRODUCT_BUNDLE_IDENTIFIER)" ios/Runner/Info.plist 2>/dev/null || true
          (cd ios && /usr/bin/sed -i '' "s/PRODUCT_BUNDLE_IDENTIFIER = [^;]*;/PRODUCT_BUNDLE_IDENTIFIER = ${{ secrets.APPLE_BUNDLE_ID }};/g" Runner.xcodeproj/project.pbxproj) || true

      - name: Import signing certificate + provisioning profile
        if: env.HAS_SECRETS == 'true'
        env:
          CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          CERT_P12_PASSWORD: ${{ secrets.APPLE_CERT_P12_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.APPLE_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          CERT=$RUNNER_TEMP/cert.p12
          PROFILE=$RUNNER_TEMP/profile.mobileprovision
          KEYCHAIN=$RUNNER_TEMP/build.keychain-db
          echo "$CERT_P12_BASE64" | base64 --decode > "$CERT"
          echo "$PROFILE_BASE64"  | base64 --decode > "$PROFILE"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT" -k "$KEYCHAIN" -P "$CERT_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | sed s/\"//g)
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE" "$HOME/Library/MobileDevice/Provisioning Profiles/profile.mobileprovision"
          echo "✓ Certificat + profil importés."

      - name: Generate ExportOptions.plist (depuis les secrets)
        if: env.HAS_SECRETS == 'true'
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>${{ secrets.APPLE_TEAM_ID }}</string>
            <key>uploadSymbols</key><true/>
            <key>uploadBitcode</key><false/>
            <key>stripSwiftSymbols</key><true/>
            <key>provisioningProfiles</key>
            <dict>
              <key>${{ secrets.APPLE_BUNDLE_ID }}</key>
              <string>${{ secrets.APPLE_PROFILE_NAME }}</string>
            </dict>
          </dict>
          </plist>
          PLIST
          echo "ExportOptions.plist généré."

      - name: Build signed IPA
        if: env.HAS_SECRETS == 'true'
        run: |
          flutter build ipa --release \
            --export-options-plist="$RUNNER_TEMP/ExportOptions.plist"
          echo "--- .ipa produit ---"
          ls -lah build/ios/ipa/*.ipa || true

      - name: Upload to TestFlight (App Store Connect API key)
        if: env.HAS_SECRETS == 'true' && github.event.inputs.submit_to_testflight != 'false'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          # Clé .p8 décodée + fichier JSON attendu par fastlane pilot.
          P8="$RUNNER_TEMP/asc_key.p8"
          echo "$ASC_API_KEY_P8_BASE64" | base64 --decode > "$P8"
          KEYJSON="$RUNNER_TEMP/asc_key.json"
          python3 - "$P8" > "$KEYJSON" <<'PY'
          import json, sys
          key = open(sys.argv[1]).read()
          import os
          print(json.dumps({
            "key_id": os.environ["ASC_KEY_ID"],
            "issuer_id": os.environ["ASC_ISSUER_ID"],
            "key": key,
            "in_house": False,
            "duration": 1200,
          }))
          PY
          IPA=$(ls build/ios/ipa/*.ipa | head -1)
          echo "Upload de $IPA vers TestFlight…"
          # fastlane est préinstallé sur les runners macOS.
          fastlane pilot upload \
            --api_key_path "$KEYJSON" \
            --ipa "$IPA" \
            --skip_waiting_for_build_processing true \
            --skip_submission true

      - name: Cleanup keychain
        if: always() && env.HAS_SECRETS == 'true'
        run: |
          security delete-keychain "$RUNNER_TEMP/build.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/asc_key.p8" "$RUNNER_TEMP/asc_key.json" 2>/dev/null || true
