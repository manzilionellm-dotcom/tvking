# =========================================================
#  flutter_launcher_icons_zuno_tv.yaml — Icône du build Zuno TV
# =========================================================
#  Utilisée UNIQUEMENT par le workflow racine build-zuno-tv.yml :
#      dart run flutter_launcher_icons -f flutter_launcher_icons_zuno_tv.yaml
#  Le téléphone garde sa propre config (dans pubspec.yaml) — non impacté.
#
#  Source : le logo Zuno (calligraphie or) sur noir #050505 :
#    - zuno_tv_icon.png    → icône « classique » (mipmap-*), logo à 82 %
#    - zuno_tv_icon_fg.png → premier plan ADAPTATIF, logo à 58 % pour
#      rester dans la zone sûre (66 % centraux) du masque rond/squircle
#      d'Android — sinon le « Z » est tronqué sur la home de certaines box.
# =========================================================
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/branding/zuno_tv_icon.png"
  adaptive_icon_background: "#050505"
  adaptive_icon_foreground: "assets/branding/zuno_tv_icon_fg.png"
  min_sdk_android: 21
