# =========================================================
#  pubspec.yaml — Manifeste du projet Flutter
# =========================================================
#  Phase 1.1 + 1.2 : on ajoute les briques pour charger les
#  playlists M3U et causer avec l'API Xtream Codes, ainsi
#  que du stockage local SQLite.
# =========================================================

name: tv_king
description: "The Few — lecteur multimédia premium (Not For Everyone)."
publish_to: 'none'
version: 1.0.0+14

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

  # ----- Internationalisation -----
  # `flutter_localizations` fournit les délégués Material / Cupertino
  # pour les ~80 langues officielles supportées par Flutter (dates,
  # nombres, RTL, etc.). `intl` est la lib bas-niveau utilisée par
  # le générateur gen-l10n pour produire AppLocalizations.
  #
  # IMPORTANT : `flutter_localizations` du SDK Flutter stable courant
  # pin `intl` à 0.20.2 exactement. Toute contrainte qui ne contient
  # pas 0.20.2 fait planter `flutter pub get` avec un version solve
  # error. Donc on aligne sur ^0.20.2.
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  # Icônes style iOS (incluses par défaut dans Flutter)
  cupertino_icons: ^1.0.8

  # Police "Inter" via google_fonts (téléchargement + cache automatique)
  google_fonts: ^6.2.1

  # --- Phase 1.1 / 1.2 ---

  # Client HTTP officiel Flutter. Sert à :
  #   - télécharger les fichiers .m3u depuis une URL
  #   - causer avec l'API Xtream Codes (player_api.php)
  http: ^1.2.2

  # SQLite pour Flutter. Permet de stocker localement :
  #   - la liste des playlists ajoutées
  #   - toutes les chaînes parsées, par playlist
  #   - les métadonnées (catégories, logos, dates de sync)
  # Indispensable pour ne pas re-télécharger le .m3u à chaque
  # lancement de l'app — gain de perf énorme sur grosses listes.
  sqflite: ^2.4.1

  # Manipulation de chemins de fichiers portable Android/iOS.
  path: ^1.9.0

  # SQLite pour le BUREAU (Windows / Linux / macOS). `sqflite` seul ne
  # fonctionne QUE sur mobile (il s'appuie sur le SQLite embarqué d'Android/
  # iOS). Sur Windows il n'existe pas de SQLite système → `sqflite_common_ffi`
  # fournit le moteur SQLite via FFI (la lib `sqlite3` est embarquée par le
  # package). Au démarrage Windows (lib/main_windows.dart) on appelle
  # `sqfliteFfiInit()` puis on pointe `databaseFactory = databaseFactoryFfi`
  # → TOUT le code existant (PlaylistDatabase, etc.) marche SANS modification,
  # le mobile n'est PAS impacté (il n'importe jamais ce package).
  # Fournit sqfliteFfiInit + databaseFactoryFfi + le setter databaseFactory
  # (import : package:sqflite_common_ffi/sqflite_ffi.dart). On NE l'épingle PAS :
  # pub doit résoudre un couple COHÉRENT sqflite_common_ffi + sqlite3 (épingler
  # une vieille version forçait un sqlite3 incompatible → open.dart introuvable).
  sqflite_common_ffi: ^2.3.0

  # Donne accès au dossier de données de l'app, où sqflite
  # range son fichier .db (chez Android : /data/data/com.x/...).
  path_provider: ^2.1.5

  # --- Phase 1.3 : Lecteur vidéo ---
  # media_kit est basé sur libmpv (le même moteur que VLC,
  # TiviMate, Stremio). C'est LA référence pour lire :
  #   - HLS (.m3u8)
  #   - MPEG-TS (.ts) ← format IPTV principal
  #   - MP4, MKV, AVI...
  #   - audio multi-pistes, sous-titres
  # Avantages : décodage natif via libmpv, performance top,
  # surcouche Dart propre. Inconvénient : ajoute ~25 Mo
  # à l'APK (les binaires libmpv pour ARM/x86).
  media_kit: ^1.1.11
  # Bump 1.2.5 → 1.3.0+ (suggestion de l'erreur pub get du 2026-05-31)
  # parce que media_kit_video 1.2.x utilisait
  # screen_brightness_platform_interface ^0.2.2 (ancienne version)
  # qui pullait screen_brightness 2.x → screen_brightness_android 2.1.5
  # qui a un build.gradle avec un bloc kotlin{} cassant le build CI.
  # media_kit_video 1.3.0+ utilise platform_interface 2.x avec un
  # screen_brightness compatible et un build.gradle sans bloc kotlin{}.
  media_kit_video: ^1.3.0
  media_kit_libs_android_video: ^1.3.6
  # Binaires libmpv pour WINDOWS (équivalent desktop de _android_video). Sans
  # ce package, `flutter build windows` ne sait pas lier le moteur de lecture
  # (libmpv) → pas de vidéo sur PC. Il n'embarque QUE les .dll Windows, donc
  # AUCUN impact sur l'APK Android (le build TV strippe d'ailleurs media_kit).
  # C'est le moteur de lecture de la cible Windows (le lecteur natif Media3/
  # ExoPlayer est Android-uniquement). Activé en lecture côté Windows (étape 2).
  media_kit_libs_windows_video: ^1.0.10

  # ffmpeg_kit_flutter_new_min — CONVERSION des enregistrements en MP4 lisible
  # par la galerie du téléphone. Pourquoi : le MediaExtractor/MediaMuxer natif
  # d'Android n'arrive PAS à relire nos captures .ts (flux live / segments HLS
  # concaténés) → l'export « galerie » échouait sur toutes les chaînes. FFmpeg,
  # lui, lit ces flux : on COPIE la vidéo (`-c:v copy`, qualité INTACTE) et on
  # convertit seulement l'audio en AAC → MP4 lu partout. Fork MAINTENU (binaires
  # Android 2026). minSdk 24 côté TÉLÉPHONE (ok) ; le build TV RETIRE ce paquet
  # (comme media_kit) et garde minSdk 21 pour les vieilles box. Appelé UNIQUEMENT
  # via un hook posé par l'entrée mobile (main.dart) → jamais compilé côté TV.
  ffmpeg_kit_flutter_new_min: ^3.5.3

  # Garde l'écran allumé pendant la lecture (sinon Android
  # éteint l'écran après 30s d'inactivité, même en pleine
  # lecture vidéo).
  wakelock_plus: ^1.2.10

  # SharedPreferences pour persister les réglages utilisateur
  # (taille du buffer, ratio préféré, etc.) entre les sessions.
  shared_preferences: ^2.3.4

  # Picture-in-Picture sera ajouté en Phase 4 (avec le Cast),
  # car il demande aussi une config dans AndroidManifest.xml.

  # --- Phase 1.4 : Refonte UI premium ---
  # Cache + chargement asynchrone des logos de chaînes.
  cached_network_image: ^3.4.1

  # Extraction de la COULEUR DOMINANTE d'un logo (gradient ambiant du hero TV,
  # §6). Package officiel Flutter. Utilisé UNIQUEMENT pour le hero (1 image à la
  # fois), résultat MIS EN CACHE par chaîne → conforme à la cible 60 fps.
  palette_generator: ^0.3.3+5

  # --- Phase 1.5 : Finitions / About / Updater ---
  package_info_plus: ^8.1.4
  url_launcher: ^6.3.1

  # Détection du type de réseau (Wi-Fi / cellulaire) pour la garde
  # "données cellulaires" avant lecture (cf. core/network/cellular_guard.dart).
  connectivity_plus: ^6.1.0

  # --- Phase 2 : EPG XMLTV ---
  # Parser XML en streaming (XmlEventReader) — indispensable pour
  # ingérer les fichiers EPG qui font souvent 100-500 Mo sans
  # exploser la RAM du téléphone.
  xml: ^6.5.0

  # Décompression gzip — beaucoup d'EPG sont servis en .xml.gz pour
  # diviser la bande passante par 10.
  archive: ^3.6.1

  # --- Cast universel via QR code ---
  # Génère le QR code qui pointe vers le mini-serveur HTTP local
  # de l'app. La TV scanne le QR avec son navigateur (ou tape l'URL
  # à la main) et joue le flux dans une page HTML5.
  qr_flutter: ^4.1.0

  # --- Lecteur TV : SurfaceView natif (Media3 / ExoPlayer) ---
  # POURQUOI : sur Android TV / Fire TV, media_kit (libmpv) ET flutter_vlc_player
  # (libVLC) donnaient « son OK / image NOIRE » → les trames HEVC décodées par
  # MediaCodec n'arrivaient jamais jusqu'à la TEXTURE Flutter. Les vrais lecteurs
  # IPTV (Smarters, etc.) rendent sur une SurfaceView native via ExoPlayer.
  # `native_video_player` est un plugin local qui fait exactement ça :
  # SurfaceView + Media3, en Hybrid Composition (jamais de texture dans le
  # chemin vidéo). C'est le moteur du lecteur TV (tv_player_screen). Le mobile
  # garde media_kit. Plugin sous packages/ car le CI régénère android/ à chaque
  # build (du natif dans android/app serait écrasé).
  native_video_player:
    path: packages/native_video_player

  # --- Identité STABLE de l'appareil (cœur business / activation) ---
  # Enregistre le channel natif `com.manzilionellm.tvking/device` (ANDROID_ID)
  # qui rend la « MAC » virtuelle DÉTERMINISTE et stable entre réinstallations.
  # Indispensable sur le build TV : son workflow n'applique PAS apply_cast_patch
  # (qui pose la MainActivity native sur mobile) → sans ce plugin, la MAC était
  # aléatoire et l'activation se perdait. Plugin = toujours présent, quel que
  # soit le workflow (survit au `flutter create` du CI).
  tvking_device:
    path: packages/tvking_device

  # Récupère l'IP locale du téléphone sur le WiFi (sinon impossible
  # de construire l'URL "http://<mon-ip>:8090/" que la TV doit ouvrir).
  network_info_plus: ^6.1.1

  # Découverte mDNS / Bonjour — sert à trouver les Chromecasts et
  # Google TV sur le LAN (service `_googlecast._tcp`). Package
  # officiel Flutter, fonctionne sur Android et iOS.
  multicast_dns: ^0.3.2+8

  # Authentification biométrique — empreinte digitale, Face Unlock,
  # ou code PIN/mot de passe système Android en fallback. Plugin
  # officiel Flutter. Sert au "Verrouillage à l'ouverture" de l'app.
  # En cas d'absence de biométrie configurée sur le device, fallback
  # automatique sur le PIN/pattern/mot-de-passe de l'écran de
  # verrouillage Android — pas besoin de gérer notre propre PIN.
  local_auth: ^2.3.0

  # Notifications locales — rappels EPG ("ton programme commence bientôt").
  # C'est le levier de rétention n°1 (déclencheur de retour). On planifie
  # via zonedSchedule en mode INEXACT (pas besoin de la permission d'alarme
  # exacte). Le plugin utilise java.time → le workflow CI active le
  # "core library desugaring" Android (sinon le build casse).
  flutter_local_notifications: ^18.0.1

  # Fuseaux horaires : zonedSchedule attend une TZDateTime. On programme le
  # rappel à l'instant ABSOLU (UTC) du programme − quelques minutes, donc
  # pas besoin de détecter le fuseau de l'appareil.
  timezone: ^0.9.4

  # --- Enregistrements : Ouvrir / Partager ---
  # open_filex : ouvre un fichier local avec l'app externe choisie par
  # l'utilisateur (VLC, MX Player…). Sert à LIRE un enregistrement .ts
  # de façon fiable — on délègue le décodage MPEG-TS au lecteur système
  # au lieu de dépendre d'un export ou du player interne. Le plugin
  # enregistre tout seul son FileProvider Android (partage sécurisé du
  # fichier privé de l'app), donc rien à configurer côté manifeste.
  open_filex: ^4.5.0

  # share_plus : feuille de partage native Android (« Partager via… »).
  # Permet d'envoyer le fichier d'enregistrement vers une autre app
  # (Drive, WhatsApp, Gmail…). Fournit aussi le type XFile pour joindre
  # le fichier. Plugin officiel de l'écosystème Flutter Community.
  share_plus: ^10.1.4

  # ----- Rapport de crash (OPTIONNEL, fail-open) -----
  # firebase_core : socle Firebase (initialise l'« app » Firebase à partir
  #   de google-services.json). firebase_crashlytics : remonte les crashes
  #   Dart ET natifs (JNI/NDK, UnsatisfiedLinkError…). Le SDK natif collecte
  #   AUTOMATIQUEMENT modèle, fabricant, version Android, ABI, RAM, etc.
  #
  #   POURQUOI « fail-open » : SANS google-services.json (cas par défaut, dev
  #   et forks), `Firebase.initializeApp()` lève une exception qu'on capte →
  #   Crashlytics reste désactivé et l'app/le build continuent normalement.
  #   Le rapport ne s'active QUE si le secret CI GOOGLE_SERVICES_JSON est posé
  #   (cf. build-android.yml + lib/core/crash/crash_reporting_firebase.dart).
  firebase_core: ^3.8.0
  firebase_crashlytics: ^4.1.5

  # ----- Chiffrement des identifiants au repos (sécurité) -----
  # `encrypt` : surcouche PUR DART (pointycastle) qui expose AES-GCM avec une
  #   API simple. Sert à chiffrer le mot de passe Xtream AVANT son écriture en
  #   base SQLite (cf. core/security/secret_cipher.dart). Pur Dart → aucun code
  #   natif ajouté, donc aucun risque sur le build Android.
  # `crypto` : fonctions de hachage officielles (SHA-256) du Dart team. Sert à
  #   DÉRIVER la clé de chiffrement depuis l'ANDROID_ID de l'appareil (jamais
  #   stocké sur disque) → la clé n'est nulle part dans les fichiers de l'app.
  encrypt: ^5.0.3
  crypto: ^3.0.6
  flutter_blurhash: ^0.9.1

# Pin de screen_brightness_android pour eviter la 2.1.5 qui a un
# build.gradle cassé (bloc kotlin{} top-level inutilisable par notre
# config Flutter CI). 2.1.4 (juste avant la cassée) est compatible
# avec media_kit_video ^1.3.0+. Le CI a aussi un patch sed/python
# en filet de sécurité au cas où.
dependency_overrides:
  screen_brightness_android: 2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Règles de lint officielles Flutter
  flutter_lints: ^4.0.0

  # ----- Génération des icônes de lancement -----
  # Sans ce package, `flutter create` met l'icône Flutter par défaut
  # (le F bleu). Avec, on génère toutes les tailles mipmap-* depuis
  # notre logo 7 MOTION. CI lance `dart run flutter_launcher_icons`
  # juste après `flutter create` pour que l'icône finale soit ember.
  flutter_launcher_icons: ^0.14.1

# ============================================================
#  Configuration du generateur d'icones (utilisée par
#  flutter_launcher_icons). L'icône source est notre logo
#  7 MOTION en JPG (1011×965). Adaptive icon : on utilise la
#  même image en foreground et un fond noir profond (voidSurface
#  de LUMIERE) pour respecter l'identité Maison Noir même sous
#  le mask circulaire Android.
# ============================================================
flutter_launcher_icons:
  android: true
  ios: false
  remove_alpha_ios: false
  # Logo source 7 MOTION (PAS de badge ✓ incrusté — l'user a
  # finalement demandé que le badge "vérifié" reste UNIQUEMENT
  # dans l'interface après le texte "MOTION", pas sur l'image
  # de l'icône launcher Android).
  image_path: "assets/branding/logo_black7royal.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0E0E0E"
  adaptive_icon_foreground: "assets/branding/logo_black7royal.png"

flutter:
  uses-material-design: true

  # Active le générateur officiel `flutter gen-l10n` qui transforme
  # les fichiers `.arb` de `lib/l10n/` en classe `AppLocalizations`.
  # La génération est automatique à chaque `flutter pub get`.
  generate: true

  # ----- Branding -----
  # Logo officiel 7 MOTION, utilisé dans le splash, l'AppBar de
  # l'accueil et l'écran "À propos".
  assets:
    - assets/branding/logo_black7royal.png
    - assets/branding/logo_7motion.jpg
    - assets/branding/thefew_tv_icon.png
    - assets/branding/thefew_logo.png
    - assets/branding/prive_icon.png

