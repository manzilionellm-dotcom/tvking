# =========================================================
#  gradle.properties — Config Gradle globale
# =========================================================
#  Memoire JVM augmentee a 4 Go pour eviter les OOM sur les
#  builds avec AGP 8+ (qui consomme plus que les versions 7.x).
#
#  AndroidX active obligatoirement (les libs androidx.appcompat
#  + androidx.webkit qu'on utilise dans le wrapper).
# =========================================================

org.gradle.jvmargs=-Xmx4096m -XX:+UseParallelGC -Dfile.encoding=UTF-8

# AndroidX (passe a true depuis AGP 4.1+ — sinon les libs androidx
# refusent de se lier).
android.useAndroidX=true
android.nonTransitiveRClass=true

# Build cache pour accelerer les builds incrementaux locaux.
org.gradle.caching=true
org.gradle.parallel=true

# Kotlin code style — compatible IDEA / Android Studio.
kotlin.code.style=official
