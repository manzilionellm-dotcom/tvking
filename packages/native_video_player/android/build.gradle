// =========================================================
//  build.gradle — module Android du plugin native_video_player
// =========================================================
//  On NE pin PAS AGP ni Kotlin ici : ils sont fournis par le projet app
//  (settings.gradle pluginManagement, régénéré par `flutter create`).
//  Pinner une version créerait le classique conflit « plugin chargé depuis
//  deux classloaders ». On se contente d'appliquer les plugins déjà résolus.
// =========================================================
group = "com.manzilionellm.native_video_player"
version = "1.0"

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

android {
    namespace = "com.manzilionellm.native_video_player"
    compileSdk = 35

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        minSdk = 21
    }
}

dependencies {
    // Media3 (le successeur d'ExoPlayer). exoplayer = cœur + extracteurs
    // (dont le TsExtractor MPEG-TS utilisé par l'IPTV en .ts) ; -hls ajoute
    // le support des playlists .m3u8. Le décodage HEVC passe par MediaCodec
    // (matériel) et rend directement sur la Surface de la SurfaceView.
    //
    // 1.8.0 = la DERNIÈRE version qui supporte encore minSdk 21 (nos vieux
    // Fire Stick / Fire OS 5 = Android 5.1). Les 1.9+/1.10+ exigent minSdk 23
    // et casseraient la promesse « APK universel, tous les Fire Stick ».
    // Gains 1.5 → 1.8 : robustesse réseau/HLS live, corrections de gel,
    // meilleure reprise après erreur de chargement.
    implementation "androidx.media3:media3-exoplayer:1.8.0"
    implementation "androidx.media3:media3-exoplayer-hls:1.8.0"
}
