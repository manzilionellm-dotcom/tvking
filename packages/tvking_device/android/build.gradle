// =========================================================
//  build.gradle — module Android du plugin tvking_device
// =========================================================
//  On n'ajoute aucune dépendance externe : on lit juste ANDROID_ID
//  (Settings.Secure) et les champs Build de l'OS. AGP/Kotlin viennent du
//  projet app (régénéré par flutter create) → on ne pin rien ici.
// =========================================================
group = "com.manzilionellm.tvking_device"
version = "1.0"

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

android {
    namespace = "com.manzilionellm.tvking_device"
    compileSdk = 35

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        minSdk = 21
    }
}

// ENREGISTREMENT PROGRAMMÉ : le service au premier plan et le receiver
// d'alarmes utilisent NotificationCompat / ContextCompat (androidx.core).
// L'embedding Flutter ne garantit pas cette dépendance transitive à tous
// les projets générés par `flutter create` → on la déclare explicitement.
// Version volontairement modeste (compatible AGP/Kotlin des builds CI).
dependencies {
    implementation("androidx.core:core:1.13.1")
}
